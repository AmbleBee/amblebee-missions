# Checks every mission, builds catalog.json, and publishes the website to GitHub Pages.
name: Missions website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# each branch builds on its own, so a pull request can never replace a waiting deploy from main
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # checks and building take a couple of minutes: anything longer is stuck, so fail fast
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the full history, so the footer can show when the missions last changed
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml==6.0.1
      - name: Check missions
        run: python tools/check_missions.py
      - name: Test the mission checker
        run: python tools/test_checker.py
      - name: Check roadmap
        run: python tools/build_roadmap.py
      - name: Check packs
        run: python tools/check_packs.py --strict
      - name: Check map pins
        run: python tools/check_pins.py   # a live pin outside its state stops the deploy
      - name: Report mission numbers
        run: python tools/check_numbers.py   # gaps can be on purpose, so this one only reports
      - name: Check icons
        run: python tools/build_icons.py
      - name: Check color contrast
        run: python tools/check_contrast.py
      - name: Check Mission Management's copies
        run: python tools/check_copies.py   # its SCHEMA.md and fonts must match the site's (it ships on its own later)
      - name: Build site
        run: |
          rm -rf _site
          cp -r site _site
          python tools/build_catalog.py --out _site/catalog.json
          python tools/build_roadmap.py --out _site/roadmap.json
          python tools/build_icons.py --out _site/icons.json
          python tools/build_pages.py --out _site
          cp data/zips.json data/cities.json _site/
      - name: Hand the built site to the browser job
        uses: actions/upload-artifact@v6
        with:
          name: built-site
          path: _site
          retention-days: 1

  # The share cards and the browser tests run inside Microsoft's Playwright image, which already has the three browsers
  # and everything they need. That skips "playwright install --with-deps", which downloads ~100 Ubuntu packages and
  # can crawl for half an hour when the Ubuntu mirror is slow. Keep the image's version the same as the pip install.
  browsers:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
    env:
      HOME: /root   # Firefox won't start as root when HOME belongs to another user (Playwright's CI docs)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          name: built-site
          path: _site
      - name: Install Playwright for Python (the browsers are already in the image)
        run: python3 -m pip install playwright==1.64.1 pyyaml==6.0.1
      - name: Draw the share cards
        run: python3 tools/build_cards.py --out _site   # the picture shown when someone shares a mission, pack or idea page
      - name: Test the site in Chromium
        run: python3 tools/smoke_test.py
      - name: Test the site in Firefox
        run: python3 tools/smoke_test.py
        env:
          SMOKE_ENGINE: firefox
      - name: Test the site in WebKit (Safari's engine)
        run: python3 tools/smoke_test.py
        env:
          SMOKE_ENGINE: webkit
      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: browsers
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
