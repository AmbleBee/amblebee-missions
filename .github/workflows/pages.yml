# Checks every mission, builds catalog.json, and publishes the website to GitHub Pages.
name: Missions website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Check missions
        run: python tools/check_missions.py
      - name: Check roadmap
        run: python tools/build_roadmap.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch fonts
        continue-on-error: true   # site still works with system fonts
        run: bash tools/fetch_fonts.sh
      - name: Build site
        run: |
          rm -rf _site
          cp -r site _site
          python tools/build_catalog.py --out _site/catalog.json
          python tools/build_roadmap.py --out _site/roadmap.json
      - name: Build ZIP lookup
        continue-on-error: true   # without it, only the ZIP box stops working
        run: python tools/build_zips.py --out _site/zips.json
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
