# Checks every mission, builds catalog.json, and publishes the website to GitHub Pages.
name: Missions website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# each branch builds on its own, so a pull request can never replace a waiting deploy from main
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the full history, so the footer can show when the missions last changed
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Check missions
        run: python tools/check_missions.py
      - name: Check roadmap
        run: python tools/build_roadmap.py
      - name: Check packs
        run: python tools/check_packs.py --strict
      - name: Report mission numbers
        run: python tools/check_numbers.py   # gaps can be on purpose, so this one only reports
      - name: Check icons
        run: python tools/build_icons.py
      - name: Check color contrast
        run: python tools/check_contrast.py
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Fetch fonts
        continue-on-error: true   # site still works with system fonts
        run: bash tools/fetch_fonts.sh
      - name: Build site
        run: |
          rm -rf _site
          cp -r site _site
          python tools/build_catalog.py --out _site/catalog.json
          python tools/build_roadmap.py --out _site/roadmap.json
          python tools/build_icons.py --out _site/icons.json
          python tools/build_pages.py --out _site
          cp data/zips.json data/cities.json _site/
      - name: Install the test browser
        run: |
          pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Test the site in a browser
        run: python tools/smoke_test.py
      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
