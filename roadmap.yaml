- title: Smoother Mission Editing
  status: done
  date: 2026-11-09
  tag: missions
  summary: The mission manager keeps track of what you've touched, across sessions, and is easier to run on a tablet.
  items:
    - Any field you change turns green with a "changed" tag, and goes back to normal if you change it back
    - Edits made in the YAML view show up green too when you switch back to the form, so you can hop between the two freely
    - Drafts stay green across sessions until they go live, so you can do all the pins one day, the addresses the next and the descriptions after that
    - Light green is this session's changes and a deeper green tagged "earlier" is from a past session
    - Text pasted in from a web page or a document comes in clean, with no stray line breaks or hidden characters
    - A mission whose pin or address still has a "check this" note can't go live until the note is gone, and the "Pin to verify" badge uses the same rule
    - No more key in the link; the terminal prints three plain links (this computer, same Wi-Fi, Tailscale)
    - A Lock button sets a temporary key mid-session so nobody else on the network can make changes; it's forgotten when the manager stops
    - A Stop button shuts the manager down from the page, no terminal needed
    - The editor has a full-width button, and the page behind it no longer scrolls
    - The page header scrolls away so the tablet gets more room, while table headers stay in view as you scroll through a table
    - Links you mark as good by hand stay on your computer instead of going to GitHub
    - If the tablet closes the tab before you save, your edits are kept on that device and the editor offers to bring them back, new missions included
    - Pick a filter like "Draft with no address" and tap Work through these to step through the whole list with the editor's arrows
    - A "not committed" button shows how many files are saved but not committed yet, with a list you can open missions from, and the mission table's old "unsaved" tag now says "not committed"

- title: Mission Management
  status: done
  date: 2026-11-05
  tag: missions
  summary: A behind-the-scenes workshop for keeping every state's missions well-rounded, so no state ends up all hikes, all pricey, or all one kind of day out.
  items:
    - A balance check for every state, with indoor vs outdoor, cheap vs pricier, date vs adventure, and which themes each state covers
    - A gap finder that points out the states furthest off balance, and roughly how many new missions would even them out
    - Every mission in one list, with when it was added, last changed and last checked, so the oldest ones get a fresh look first
    - Edit any mission from the browser, from its name and description down to its themes, map pin and photo prompts
    - Every change runs through the same checks as the website before it's saved, and new missions start as drafts until they're checked
    - A YAML view for editing a mission's file directly, notes and all, that points to the exact line if something's off
    - Every save shows exactly which lines will change before anything is written
    - '"Checked today, publish" takes a checked draft live in one step'
    - A "Needs attention" list for pins still to verify, missions not checked in six months, expired cautions and anything failing a check, plus quick filters by status, attention and theme
    - Saves take a couple of seconds instead of ten or more

- title: Fresher Picks and Fact-Checked Places
  status: done
  date: 2026-11-05
  tag: website
  summary: Opening missions feels fresh every time, returning visitors skip the intro, and the story behind each place got a careful second look.
  items:
    - '"Open a mission" now deals missions like a shuffled deck: nothing comes up twice until every match has had its turn, and changing your filters starts a fresh deck'
    - With a ZIP code set, the places near you still come up first
    - The "New to AmbleBee?" box steps aside once you've been here before, remembered only in your own browser
    - Every mission waiting in drafts now has its "About this place" story ready for the day it goes live
    - We checked the trickiest facts in those stories against real sources and fixed the ones that had changed, like a museum's name, a park's reservation rules and a farm that's open all year
    - Find AmbleBee on Pinterest, Bluesky and X, linked at the bottom of every page
    - Five missions went back to drafts until their map pins are double-checked, and a new check makes sure no mission goes live with an unchecked pin

- title: The Big Website Tune-Up, Part 3
  status: done
  date: 2026-11-02
  tag: website
  summary: A day about making each mission page worth landing on, easier to share, and honest about how fresh it is.
  items:
    - Mission pages have a new "About this place" card with the history, numbers and tips that make a place interesting, like why Crater Lake is so blue or how the Oaks Park rink floats
    - Missions you can do the same day now link to each other, like the Astoria Column and the Peter Iredale shipwreck, or Smith Rock and Petersen Rock Garden
    - Every mission popup has a "See the full page" button, and every mission page has a short "New to AmbleBee?" box for first-time visitors
    - Every mission now says when it was last checked, like "Checked November 2026", and nothing goes live until it has been
    - Share a mission and the link shows a preview card with its name, state, cost and how long it takes. Every state, idea and site page has its own card too, and the home page shows the AmbleBee name
    - '"Share without a note" now gives the mission''s own page, already copied, so the preview shows where you''re headed. Writing a card is still the first choice, and sealed cards keep the surprise'
    - On a mission's own page, Share opens the card writer and Save as image saves in one tap, no second trip
    - The site is simply AmbleBee now, with a crisp beehive icon next to it in Google results
    - About 40 Oregon missions were rewritten, each with a little challenge and a specific photo to take
    - While checking them, we caught a few places that closed or changed, and fixed or paused those missions until they reopen
    - Behind the scenes, new checks catch dates with typos, broken mission links and descriptions that run too long

- title: The Big Website Tune-Up, Part 2
  status: done
  date: 2026-11-01
  tag: website
  summary: A big day on the website, all about helping people find AmbleBee, and helping us learn which missions are worth making more of.
  items:
    - Every state now has its own page, with its icon, a short intro and a longer guide to what you'll find there
    - The home page shows the first four missions from each state, with an "X more · Show all" link to the rest. On phones each state swipes sideways
    - 'New idea pages: [Rainy Day Date Ideas](/rainy-day-date-ideas/), [At-Home Date Night Ideas](/at-home-date-ideas/), [Free Date Ideas](/free-date-ideas/) and [Kid-Friendly Adventures](/kid-friendly-adventures/)'
    - A "Browse by idea" row on the home page and Every mission, and each mission page lists the idea pages it's in
    - Mission pages suggest a few other missions nearby
    - Every mission, state and idea page has its own search title and description, so each one can turn up on Google
    - A sitemap that tells Google when each page last changed, and the site is now set up in Google Search Console
    - A new [About](/about/) page with the story of how AmbleBee started and where it's headed
    - A plain note that distances are as the bee flies and driving is often farther, next to the location box and on the [Safety](/safety/) page
    - The Suggest a mission and Report a problem forms have every theme, tag and question they need
    - '**Opt-in** visitor stats with Google Analytics. Nothing loads unless you say yes, and the [Privacy](/privacy/) page explains what we count and why'
