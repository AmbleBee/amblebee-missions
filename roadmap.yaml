# AmbleBee roadmap + changelog  ->  amblebee.com/roadmap.html
#
# Edit this file, push, done. The website rebuilds itself; no code changes needed.
# The build checks this file first and stops with a plain-English message if something is off.
#
# Each entry:
#   title:   short name                                  (required)
#   status:  done | doing | next | later                 (required)
#   date:    2026-10-19                                  (required for done; optional otherwise)
#   when:    "This winter"                               (optional free text for future items, shown instead of a date)
#   tag:     website | missions | camera | hive | ...    (optional, any word; these four get their own colour)
#   summary: one or two sentences                        (optional)
#   items:   a list of bullet points                     (optional)
#   progress: 140/415                                    (optional, not for done: shows a bar with "140 / 415" and 33%;
#             add a label after it if you like: 140/415 places pinned. Bump the first number as you go.
#             Or write  progress: live  to count live missions out of all missions, updated on every build.)
#
# Order doesn't matter much. The page reads like time flowing downward:
#   later (top) -> next -> doing -> "You are here" -> done, newest to oldest (bottom).
# "later" entries share one compact "Someday, maybe" block at the top; next and doing always get cards.
# The newest 20 done entries get cards; older ones fold into "Earlier on the trail" at the bottom
# (change the 20 with TRAIL_DONE at the top of site/roadmap.js).
# Done entries sort themselves by date; within later / next / doing, file order is kept.
# Text can use **bold**, `code` and [links](https://example.com).
# Tip: if a line starts with a quote mark, or has a ': ' in the middle, wrap the whole line in
# single quotes:  - 'She said: "go"'   The build will tell you if you forget.

# ---------- Coming up ----------
# (shown top to bottom as: later, then next, then doing)

- title: Our Gear
  status: later
  tag: hive
