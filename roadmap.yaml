- title: Our Own Plans
  status: later
  tag: hive
  summary: Birthdays, anniversaries and trips get their own photo logs on the Hive, right next to the missions.
 
- title: Kids' Scavenger Hunts
  status: later
  tag: missions
  summary: Photo hunts for little ones, like "find something blue" or "find an animal", one step at a time.
 
- title: State Icons on the Hive
  status: later
  tag: hive
  summary: The same icon pack the website uses, turned into crisp pictures for the Hive's screen.
 
- title: The AmbleCam
  status: later
  tag: camera
  when: After the Hive
  summary: For anyone who'd like to build one, a little camera made for missions. Its e-ink screen shows your mission, and it drops your photos off at the Hive when it docks. Totally optional; your phone works great.
 
- title: The AmbleBee Hive, Version 1
  status: next
  tag: hive
  when: A little each month
  summary: A photo frame for your wall that keeps your missions and your memories together. Pick a mission on the frame, go do it, then scan the QR code with your phone to send it your photos.
  items:
    - Missions on the frame, from the same list as the website
    - Upload photos from your phone with a QR code, no app needed
    - Flip through the photos and keep the good ones. The Hive gently flags dark, blurry and duplicate shots, but never removes anything on its own
    - Every finished mission becomes a memory, with its photos and a note
 
- title: Exact Map Pins for Every Place
  status: doing
  progress: live
  tag: missions
  summary: Replace the approximate coordinates with real entrance, trailhead and parking pins.

# ---------- Done ----------
- title: The Big Website Tune-Up, Part 3
  status: done
  date: 2026-11-02
  tag: website
  summary: A day about making each mission page worth landing on, easier to share, and honest about how fresh it is.
  items:
    - Mission pages have a new "About this place" card with the history, numbers and tips that make a place interesting, like why Crater Lake is so blue or how the Oaks Park rink floats
    - Missions you can do the same day now link to each other, like the Astoria Column and the Peter Iredale shipwreck, or Smith Rock and Petersen Rock Garden
    - Every mission popup has a "See the full page" button, and every mission page has a short "New to AmbleBee?" box for first-time visitors
    - Every mission now says when it was last checked, like "Checked November 2026", and nothing goes live until it has been
    - Share a mission and the link shows a preview card with its name, state, cost and how long it takes. Every state, idea and site page has its own card too, and the home page shows the AmbleBee name
    - '"Share without a note" now gives the mission''s own page, already copied, so the preview shows where you''re headed. Writing a card is still the first choice, and sealed cards keep the surprise'
    - On a mission's own page, Share opens the card writer and Save as image saves in one tap, no second trip
    - The site is simply AmbleBee now, with a crisp beehive icon next to it in Google results
    - About 40 Oregon missions were rewritten, each with a little challenge and a specific photo to take
    - While checking them, we caught a few places that closed or changed, and fixed or paused those missions until they reopen
    - Behind the scenes, new checks catch dates with typos, broken mission links and descriptions that run too long

- title: The Big Website Tune-Up, Part 2
  status: done
  date: 2026-11-01
  tag: website
  summary: A big day on the website, all about helping people find AmbleBee, and helping us learn which missions are worth making more of.
  items:
    - Every state now has its own page, with its icon, a short intro and a longer guide to what you'll find there
    - The home page shows the first four missions from each state, with an "X more · Show all" link to the rest. On phones each state swipes sideways
    - 'New idea pages: [Rainy Day Date Ideas](/rainy-day-date-ideas/), [At-Home Date Night Ideas](/at-home-date-ideas/), [Free Date Ideas](/free-date-ideas/) and [Kid-Friendly Adventures](/kid-friendly-adventures/)'
    - A "Browse by idea" row on the home page and Every mission, and each mission page lists the idea pages it's in
    - Mission pages suggest a few other missions nearby
    - Every mission, state and idea page has its own search title and description, so each one can turn up on Google
    - A sitemap that tells Google when each page last changed, and the site is now set up in Google Search Console
    - A new [About](/about/) page with the story of how AmbleBee started and where it's headed
    - A plain note that distances are as the bee flies and driving is often farther, next to the location box and on the [Safety](/safety/) page
    - The Suggest a mission and Report a problem forms have every theme, tag and question they need
    - '**Opt-in** visitor stats with Google Analytics. Nothing loads unless you say yes, and the [Privacy](/privacy/) page explains what we count and why'
    - The stats count things like which packs get opened and whether dates or adventures get picked more, never who you are or where exactly you live
    - Behind the scenes, a new check catches map pins that land in the wrong state before they ever go live

- title: The Big Website Tune-Up
  status: done
  date: 2026-10-30
  tag: website
  summary: A full day of fixes and new features, with better ways to find a mission, a cleaner layout on every screen, and a sturdier site behind it all.
  items:
    - Search by city as well as ZIP, or press Use my location. Where you are stays in your browser
    - With a place set, most picks are real places nearby, with a few do-anywhere ideas mixed in
    - Your ZIP or city can stay on this device if you'd like, and switching miles and kilometers keeps your distance
    - Every mission now starts with all live missions showing, and your filters narrow that list too
    - New Time of day filter, and sort Every mission by distance, cost or how long it takes
    - Search matches whole words, forgives small typos, and understands that food means dinner and "kids" means kid-friendly missions
    - '"Who''s coming" shows missions that suit anyone you pick, and leaves romantic dates out'
    - '"Go right now" checks the time of day and the season, so a night mission won''t turn up at breakfast'
    - No matches? The site says which change would bring missions back, with one Clear all button
    - Copy a link to any list of missions. Your filters and search come along, but your location never does
    - Each live mission and pack has its own page and address, so you can copy, refresh or open one in a new tab
    - A Menu button on phones, a More menu on computers, and a dark footer, the same on every page
    - '"Where to next?" comes first on every screen, and on phones the Open a mission button sits right under "Who''s it for?"'
    - Cards you're writing save as you type, and the note card says plainly that notes are hidden, not encrypted
    - Refreshing your own mission keeps it yours, and missing or broken links get a clear "lost in the mail" letter
    - New Safety, Privacy and Contact pages, plus a friendly page for addresses that don't exist
    - The site and this trail now show how many missions are live and how many are still being checked
    - Easier-to-read colors, better screen reader support, and pop-ups that fit phones and keep the page behind them still
    - Behind the scenes, the site gets tested in a real browser before every update

