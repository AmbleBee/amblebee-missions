# ---------- Done ----------
- title: Closer to Home
  status: done
  date: 2026-10-30
  tag: website
  summary: Set your ZIP and most picks are now real places nearby, and the picker comes first on every screen.
  items:
    - With a ZIP set, most picks are places near you, with a few do-anywhere ideas mixed in
    - '"Where to next?" now comes first on computers too, with the AmbleBee story further down'
    - Pop-ups keep the page behind them still and fit better on phones
    - The note card now says plainly that notes are hidden, not encrypted
    - Behind the scenes, the site gets tested in a real browser before every update

- title: Easier Finding, Clearer Phones
  status: done
  date: 2026-10-30
  tag: website
  summary: Filters and search now work the way you'd expect, phones get to the good part faster, and the site has real Safety, Privacy and Contact pages.
  items:
    - Every mission now starts with all live missions showing, and your filters narrow that list too, with one Clear filters button
    - Search matches whole words, forgives small typos, and understands that food means dinner and "kids" means kid-friendly missions
    - On phones, the Open a mission button sits right under "Who's it for?", and there's only one of it
    - '"Go right now" now checks the time of day and the season, so a night mission won''t turn up at breakfast'
    - Mission tickets no longer count hidden drafts in their numbers
    - Easier-to-read colors in light and dark mode, and a skip link that keeps your mission open
    - New Safety, Privacy and Contact pages, and the mission license is now in the repo

- title: Sturdier Links and Pages for Every Mission
  status: done
  date: 2026-10-30
  tag: website
  summary: Every live mission now has its own page, shared links fail gracefully, and the cards you write are much harder to lose.
  items:
    - Each live mission and pack gets a real page that search engines can find, listed in a sitemap and on a new page of every pack
    - Refreshing your own mission keeps it yours, instead of saying someone sent it to you
    - Cards you're writing save as you type, have a close button, and won't close if you tap outside them with writing on the card
    - Links to a missing mission, or links cut off when copied, now get a clear "lost in the mail" letter
    - The site and this trail now show how many missions are live and how many are still being checked, and two old claims about mission and state counts got corrected
    - Envelopes keep their shape on narrower screens

- title: Filter Themes
  status: done
  date: 2026-10-29
  tag: missions
  summary: Every mission now has themes, live or still in draft, so the "What kind of mission" filter covers everything on the site.
  items:
  - Tap Waterfalls, Food or Romantic and get every mission that fits, not just the first few
  - Each mission has a few themes picked from its old tags, and they'll get a closer look as missions are verified
  - Romantic only shows up on date missions, so it'll never hand you a family zoo trip

- title: Filter Themes, Groundwork
  status: done
  date: 2026-10-29
  tag: missions
  summary: The 800-odd one-off tags are now sorted into 42 themes you'll be able to filter by, like views, waterfalls, food, history and playful.
  items:
    - A "What kind of mission" filter on the website, with live counts that follow your other picks
    - Pick a few themes and you'll see missions that fit any of them
    - Free-form tags stay for search, so nothing you could find before goes missing
    - The filter turns on as missions get their themes, which happens as each one is verified

