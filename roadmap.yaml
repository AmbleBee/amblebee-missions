# AmbleBee roadmap + changelog  ->  amblebee.com/roadmap.html
#
# Edit this file, push, done. The website rebuilds itself; no code changes needed.
# The build checks this file first and stops with a plain-English message if something is off.
#
# Each entry:
#   title:   short name                                  (required)
#   status:  done | doing | next | later                 (required)
#   date:    2026-10-19                                  (required for done; optional otherwise)
#   when:    "This winter"                               (optional free text for future items, shown instead of a date)
#   tag:     website | missions | camera | hive | ...    (optional, any word; these four get their own colour)
#   summary: one or two sentences                        (optional)
#   items:   a list of bullet points                     (optional)
#
# Order doesn't matter: done entries are sorted newest first by date, and the
# doing / next / later ones keep the order you write them in.
# Text can use **bold**, `code` and [links](https://example.com).
# Tip: if a line starts with a quote mark, or has a ': ' in the middle, wrap the whole line in
# single quotes:  - 'She said: "go"'   The build will tell you if you forget.

# ---------- Coming up ----------

- title: Report a problem button
  status: doing
  tag: website
  summary: A button on every mission that opens a short form with the mission already filled in, so closed places and broken links get fixed fast.

- title: Filter tags
  status: next
  tag: missions
  summary: Swap 231 one-off tags for a fixed set of about 20 you can filter by, like views, food, rainy-day and animals.

- title: Exact map pins for every place
  status: next
  tag: missions
  summary: Replace the approximate coordinates with real entrance, trailhead and parking pins.

- title: The Hive's "Our gear" page
  status: later
  tag: hive
  summary: Tell the Hive what gear you have, borrow or can rent, and it only hands you missions you can actually do.

- title: First real AmbleBee camera
  status: later
  tag: camera
  when: After the breadboards
  summary: Breadboards today, one custom circuit board tomorrow.

# ---------- Done ----------

- title: Share with a note
  status: done
  date: 2026-10-19
  tag: website
  summary: Send a mission to someone as a sealed letter.
  items:
    - Letters now get a wax stamp, and a little pause while they "send"
    - Write a note to go with it, or skip it at the bottom of the form
    - The person you send it to can reply, and download the mission as an image
    - Shared links open faster

- title: Envelope reveal
  status: done
  date: 2026-10-16
  tag: website
  summary: Missions now arrive in an envelope you open, instead of a dice roll.
  items:
    - New missions added, with credit to the people who shared them

- title: Search and the master mission pack
  status: done
  date: 2026-10-15
  tag: missions
  summary: 194 missions across 7 Amble packs, and a search box to find them.
  items:
    - New York, Oregon, Washington and Anywhere missions
    - Missions can credit where the idea came from
    - The Know a great spot? form is live

- title: amblebee.com goes live
  status: done
  date: 2026-10-14
  tag: website
  summary: The missions website, published straight from GitHub.
  items:
    - Open a mission, filter it, share it
    - ZIP code lookup for "within N miles" (never leaves your browser)
    - Self-hosted fonts, no trackers
