# AmbleBee roadmap + changelog  ->  amblebee.com/roadmap.html
#
# Edit this file, push, done. The website rebuilds itself; no code changes needed.
# The build checks this file first and stops with a plain-English message if something is off.
#
# Each entry:
#   title:   short name                                  (required)
#   status:  done | doing | next | later                 (required)
#   date:    2026-10-19                                  (required for done; optional otherwise)
#   when:    "This winter"                               (optional free text for future items, shown instead of a date)
#   tag:     website | missions | camera | hive | ...    (optional, any word; these four get their own colour)
#   summary: one or two sentences                        (optional)
#   items:   a list of bullet points                     (optional)
#
# Order doesn't matter much. The page reads like time flowing downward:
#   later (top) -> next -> doing -> "You are here" -> done, newest to oldest (bottom).
# Done entries sort themselves by date; within later / next / doing, file order is kept.
# Text can use **bold**, `code` and [links](https://example.com).
# Tip: if a line starts with a quote mark, or has a ': ' in the middle, wrap the whole line in
# single quotes:  - 'She said: "go"'   The build will tell you if you forget.

# ---------- Coming up ----------
# (shown top to bottom as: later, then next, then doing)

- title: Our gear
  status: later
  tag: hive
  summary: Tell the Hive what gear you have, can borrow or can rent, and it only hands you missions you can actually do.

- title: Our own plans
  status: later
  tag: hive
  summary: Birthdays, anniversaries and trips get their own photo logs on the Hive, right next to the missions.

- title: Kids' scavenger hunts
  status: later
  tag: missions
  summary: Photo hunts for little ones, like "find something blue" or "find an animal", one step at a time.

- title: The first real AmbleBee
  status: later
  tag: camera
  when: After the breadboards
  summary: Everything on one custom circuit board, in a 3D-printed body with an e-ink screen that shows your mission.

- title: State icons on the Hive and AmbleBee
  status: later
  tag: hive
  summary: The same icon pack the website uses, turned into crisp pictures for the Hive's screen and the AmbleBee's black-and-white e-ink.

- title: Simulated photo review on the Hive
  status: next
  tag: hive
  summary: Dock the camera, flip through the photos, and keep the good ones. The Hive gently flags dark, blurry and duplicate shots, but never removes anything on its own.

- title: Filter tags
  status: next
  tag: missions
  summary: Swap 231 one-off tags for a fixed set of about 20 you can filter by, like views, food, rainy-day and animals.

- title: Exact map pins for every place
  status: next
  tag: missions
  summary: Replace the approximate coordinates with real entrance, trailhead and parking pins.

- title: Community polls
  status: doing
  tag: website
  summary: Help decide what comes next, like which state gets a pack after this and which features land first.

