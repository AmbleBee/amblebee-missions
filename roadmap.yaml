- title: Missions Moved to Draft Pending Verification
  status: done
  date: 2026-10-26
  tag: missions
  summary: 346 missions moved to draft pending verification. They'll come back one at a time as their map pins and addresses get checked, so every place on the site is one we trust.
  items:
    - The 133 missions that are already verified stay live, including every Amble Anywhere idea
    - New missions now start as drafts until they're checked

- title: Heads-Ups, Badges and a Tidier Trail
  status: done
  date: 2026-10-26
  tag: website
  summary: Missions now warn you about things worth knowing before you go, and the trail got easier to read.
  items:
    - A yellow heads-up box on missions for things like no cell service or a trail closed for repairs, also on saved mission images
    - Kid and -% badges on mission cards, so kids' versions and discounts stand out at a glance
    - Progress bars on the bee trail for big jobs, like pinning every place
    - Someday ideas share one compact block, and older finished work folds into "Earlier on the trail"
    - Spot something we should warn people about? Use "Report a problem" on any mission

