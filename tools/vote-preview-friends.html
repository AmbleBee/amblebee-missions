<!-- Source for site/vote-preview-friends.png (the 1200x630 link-preview picture for friends votes, /vote/). The playful
     twin of tools/vote-preview.html (AmbleBee polls, /poll/). The same for every vote, so it's made once.
     Regenerate with: python3 tools/draw_vote_previews.py (fonts and logo load from site/). -->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: F; src: url("../site/fonts/fraunces.woff2"); font-weight: 100 900; }
@font-face { font-family: N; src: url("../site/fonts/nunito.woff2"); font-weight: 200 1000; }
@font-face { font-family: C; src: url("../site/fonts/caveat-700.woff2"); font-weight: 700; }
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#EFE7D8;position:relative}
.words{position:absolute;left:78px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center;z-index:2}
.name{display:block;width:380px;height:auto;margin:0 0 0 -10px}
.big{font:700 86px/.95 C;color:#4A3323;margin:22px 0 0;transform:rotate(-3deg);transform-origin:left}
.line{font:700 34px/1.3 N;color:#5A3E2B;margin:20px 0 0}
.tag{display:inline-block;margin:22px 0 0;padding:10px 22px;border:3px dashed #A3B18A;border-radius:16px;background:#FFFDF8;font:700 40px C;color:#3F5235;transform:rotate(-2deg);align-self:flex-start}
</style></head><body>
<div class="words"><img class="name" src="../site/logo-full.webp" alt="AmbleBee"><p class="big">You're invited to vote!</p><p class="line">Help your crew pick the plan.</p><span class="tag">Cast your vote!</span></div>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#5A3E2B" flood-opacity=".18"/></filter>
  </defs>
  <!-- confetti -->
  <g>
    <rect x="690" y="60" width="18" height="8" rx="3" fill="#D8A65A" transform="rotate(30 699 64)"/>
    <rect x="1120" y="90" width="20" height="8" rx="3" fill="#566B48" transform="rotate(-25 1130 94)"/>
    <rect x="720" y="520" width="16" height="8" rx="3" fill="#B5853F" transform="rotate(-40 728 524)"/>
    <rect x="1140" y="470" width="18" height="8" rx="3" fill="#D8A65A" transform="rotate(55 1149 474)"/>
    <rect x="980" y="40" width="16" height="8" rx="3" fill="#A3B18A" transform="rotate(10 988 44)"/>
    <circle cx="660" cy="300" r="6" fill="#D8A65A"/><circle cx="1160" cy="300" r="6" fill="#566B48"/><circle cx="1030" cy="580" r="5" fill="#B5853F"/>
    <path d="M820 40 l10 -6 l10 6 v12 l-10 6 l-10 -6z" fill="#F6E6C6" stroke="#D8A65A" stroke-width="2.5"/>
    <path d="M1100 560 l10 -6 l10 6 v12 l-10 6 l-10 -6z" fill="#E3EAD6" stroke="#A3B18A" stroke-width="2.5"/>
  </g>
  <!-- three tilted mission cards with honeycomb rank badges -->
  <g filter="url(#sh)">
    <g transform="translate(905 170) rotate(-6)">
      <rect x="-200" y="-62" width="400" height="124" rx="18" fill="#FFFDF8" stroke="#D8A65A" stroke-width="5"/>
      <rect x="110" y="-74" width="74" height="22" fill="rgba(163,177,138,.75)" transform="rotate(6 147 -63)"/>
      <path d="M-150 -40 L-114 -20 V20 L-150 40 L-186 20 V-20 Z" fill="#D8A65A" stroke="#B5853F" stroke-width="4"/>
      <text x="-150" y="10" text-anchor="middle" font-family="N" font-weight="800" font-size="26" fill="#3A2716">1st</text>
      <rect x="-90" y="-22" width="230" height="16" rx="8" fill="#5A3E2B" opacity=".8"/>
      <rect x="-90" y="6" width="150" height="12" rx="6" fill="#D9CDB6"/>
    </g>
    <g transform="translate(925 330) rotate(3)">
      <rect x="-200" y="-62" width="400" height="124" rx="18" fill="#FFFDF8" stroke="#A3B18A" stroke-width="5"/>
      <path d="M-150 -40 L-114 -20 V20 L-150 40 L-186 20 V-20 Z" fill="#566B48" stroke="#445638" stroke-width="4"/>
      <text x="-150" y="10" text-anchor="middle" font-family="N" font-weight="800" font-size="26" fill="#FFFDF8">2nd</text>
      <rect x="-90" y="-22" width="200" height="16" rx="8" fill="#5A3E2B" opacity=".55"/>
      <rect x="-90" y="6" width="130" height="12" rx="6" fill="#E4D9C6"/>
    </g>
    <g transform="translate(895 488) rotate(-2)">
      <rect x="-200" y="-62" width="400" height="124" rx="18" fill="#FFFDF8" stroke="#E4D9C6" stroke-width="4"/>
      <path d="M-150 -40 L-114 -20 V20 L-150 40 L-186 20 V-20 Z" fill="none" stroke="#B9A88F" stroke-width="4" stroke-dasharray="8 6"/>
      <text x="-150" y="10" text-anchor="middle" font-family="N" font-weight="800" font-size="20" fill="#7A5A42">tap</text>
      <rect x="-90" y="-22" width="215" height="16" rx="8" fill="#D9CDB6"/>
      <rect x="-90" y="6" width="120" height="12" rx="6" fill="#E4D9C6"/>
    </g>
  </g>
  <!-- the bee, with its dotted trail -->
  <path d="M1080 250 C 1150 220, 1150 160, 1110 130 S 1090 90, 1105 70" fill="none" stroke="#B8A58B" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round" opacity=".85"/>
  <image href="../site/favicon.svg" x="1050" y="8" width="100" height="100" transform="rotate(-10 1100 58)"/>
</svg></body></html>
