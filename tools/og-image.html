    <rect x="-285" y="-175" width="570" height="350" rx="20" fill="#E9D3A6"/>

    <g transform="translate(0 28)">
      <circle r="52" fill="#B9853A" opacity=".35" transform="translate(2 5)"/>
      <circle r="50" fill="url(#wax)"/>
      <circle r="44" fill="none" stroke="#A87531" stroke-width="5" opacity=".55"/>
      <circle r="39" fill="none" stroke="#FFE2A0" stroke-width="2" opacity=".35"/>

        <path d="M4 19.4 h16" stroke="#7E5520" stroke-width="1.3"/>

    </g>
  </g>

  <path d="M905 470 C 1010 455, 1030 360, 980 300 S 960 250, 985 228" fill="none" stroke="#B8A58B" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round" opacity=".85"/>

  <g transform="translate(985 200) scale(4.2) rotate(-8)">
    <ellipse cx="0" cy="-4" rx="5" ry="3.4" fill="#FFFDF8" stroke="#7A5A42" stroke-width="1.1" transform="rotate(-25 0 -4)"/>

  </g>

  <g fill="none" stroke="#D8A65A" stroke-width="3" opacity=".45">
    <path d="M1060 470 l17 -10 l17 10 v20 l-17 10 l-17 -10z"/><path d="M1094 490 l17 -10 l17 10 v20 l-17 10 l-17 -10z"/><path d="M1060 510 l17 -10 l17 10 v20 l-17 10 l-17 -10z" opacity=".6"/>
