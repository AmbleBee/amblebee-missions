<div id="fn-page">
<section class="pg-hero fn-hero">
  <p class="eyebrow">The AmbleBee blog</p>
  <h1>Field notes</h1>
  <p class="hand">Stories from the trail and the workbench</p>
  <p class="pg-lede">Mission round-ups, how the missions get made, and progress on the camera and the Hive.</p>
  <form class="fn-search-row" id="fn-search-form" role="search">
    <label class="sr" for="fn-search">Search field notes</label>
    <input class="pf-search fn-search" id="fn-search" type="search" maxlength="80" placeholder="Search posts: waterfalls, camera, Portland…" autocomplete="off">
  </form>
  <div class="fn-chips" id="fn-topics" role="group" aria-label="Topics" hidden></div>
</section>

<section class="pg-band fn-band">
  <div id="fn-feature" hidden></div>
  <div class="fn-sec"><h2 id="fn-latest">Latest posts</h2><span class="fn-count" id="fn-count" aria-live="polite"></span></div>
  <div class="fn-grid" id="fn-list" aria-busy="true" aria-labelledby="fn-latest"></div>
  <p class="fn-more-row"><button type="button" class="btn" id="fn-more" hidden>Show older posts</button></p>
</section>
</div>
<script src="/js/fieldnotes.js" defer></script>
