short: Scramble the white-blazed rocks of the Fells up to a stone tower. Find the Boston skyline.
description: >
  From little Bellevue Pond, climb Pine Hill to Wright's Tower, a 1930s stone
  lookout with a view of the Boston skyline across the treetops. Then pick up the
  white blazes of the Skyline Trail, which passes the tower, and follow it over
  ledges and rocky knobs, up and down short steep pitches the whole way (the
  full loop is about 7 miles). The blazes are easy to lose, so bring a map or
  offline trail app and do as much of the loop as you like. Take a photo of the skyline framed by the tower's stone window. Skip it
  right after rain, when the rocks get slick.
steps:
