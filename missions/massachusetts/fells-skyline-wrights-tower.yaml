short: Middlesex Fells near Boston. Scramble the Skyline Trail up to Wright's Tower and the city view.
description: >
  From little Bellevue Pond, climb Pine Hill to Wright's Tower, a stone
  lookout with a view of the Boston skyline across the treetops. Then follow
  the white blazes of the Skyline Trail over ledges and rocky knobs, and see
  who spots the next blaze first. The photo to get: the skyline framed by the
  tower's stone window.
about: >
  The tower was built in the 1930s and named for Elizur Wright, a 1800s
  reformer known as the father of life insurance, who also fought to protect
  the Fells as a public park. "Fells" is an old word for rocky, hilly land.

  The full Skyline loop is about 7 miles of short, steep pitches. The blazes
  are easy to lose, so bring a map or offline trail app, and skip it right
  after rain, when the rocks get slick.
steps:
  - The skyline from Wright's Tower
  - A white blaze on bare rock
  - The best ledge view on the loop
