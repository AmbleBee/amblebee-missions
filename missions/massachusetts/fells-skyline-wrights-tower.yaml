short: Middlesex Fells near Boston. Climb to Wright's Tower for a view of the Boston skyline.
description: >
  From little Bellevue Pond, climb Pine Hill to Wright's Tower, a stone
  lookout with a view of the Boston skyline across the treetops. Then follow
  the white blazes of the Skyline Trail over a few ledges and rocky knobs for
  as long as your legs want, and see who spots the next blaze first. The
  photo to get: the Boston skyline from the top of the tower.
about: >
  Wright's Tower was built in 1937 by the Works Progress Administration and
  named for Elizur Wright, the 1800s reformer known as the father of life
  insurance. In 1869 he proposed turning the rocky woods north of Boston,
  then called the Five-Mile Wood, into a public park, and his push helped
  create the Middlesex Fells Reservation. "Fells" is an old word for rocky,
  hilly land.

  The Skyline Trail is a white-blazed loop of about 7 miles around the
  western Fells, just north of Boston, with steep climbs to rocky outcrops
  and views of the city along the way. It's hikers only, no bikes, and most
  people take around 5 hours. The blazes are easy to lose at trail crossings,
  so bring a map or offline trail app, and skip it right after rain, when the
  rocks get slick.
steps:
  - The skyline from Wright's Tower
  - A white blaze on bare rock
  - The best ledge view on the loop
