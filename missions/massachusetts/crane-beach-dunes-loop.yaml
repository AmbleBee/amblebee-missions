short: Trek the sand dunes behind Crane Beach, then walk the shoreline back. Group shot up top.
description: >
  Skip the beach towel crowd and head for the trail kiosk at the east end of
  the parking lot. The marked trails wind through pitch pine and up over
  big open dunes that feel more like a desert than Massachusetts, then drop
  you onto the beach for the walk back along the water. A loop of a few miles is
  plenty, and soft sand makes it a real workout. Get a group photo on the
  highest dune with the ocean behind you. Pack water and a picnic, and do a
  tick check afterward. Reserve a parking pass ahead on weekends, stay out of
  fenced dune areas, and leave dogs home from April through September.
steps:
  - The first big dune
  - Your crew on the highest dune, ocean behind you
  - Footprints in the sand on the walk back
