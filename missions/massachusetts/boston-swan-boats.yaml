short: Swan Boats in Boston's Public Garden. Ride the lagoon, then find the Make Way for Ducklings.
description: >
  Take the short ride around the Public Garden lagoon on a pedal-powered
  swan boat. You'll share the boat with other riders, so grab seats together
  near the front. Then walk the little suspension bridge over the lagoon and
  find the Make Way for Ducklings statues. The photo to get: the two of you
  sitting with the duckling parade.
about: >
  The swan boats started in 1877. Robert Paget got the idea from Wagner's
  opera Lohengrin, where a knight crosses a river in a boat pulled by a
  swan, and his family still runs them today.

  The Public Garden was the first public botanical garden in the country.
  The duckling statues, put up in 1987, are based on Robert McCloskey's 1941
  picture book Make Way for Ducklings, which is set right here. The boats run
  from spring through late summer.
