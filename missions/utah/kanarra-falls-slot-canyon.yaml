short: Wade up a red-rock creek into a slot canyon with your crew. Group photo under the falls.
description: >
  Grab permits and hike up Kanarra Creek from the little town of Kanarraville,
  south of Cedar City. Most of the way you're splashing through ankle- to
  knee-deep water between red canyon walls that pinch into a narrow slot, then
  climb the ladder beside the first waterfall to keep going, turning back by
  the second falls. Wear shoes you don't mind
  soaking; the water stays cold even in summer. Get a group photo with the
  falls pouring down behind you inside the slot. Everyone needs a permit, daily
  permits are capped and sell out on busy days, so buy ahead; no dogs are
  allowed (the creek is the town's water supply), and don't go when rain is
  in the forecast: the canyon can flash flood.
steps:
