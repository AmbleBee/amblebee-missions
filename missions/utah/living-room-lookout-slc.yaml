short: The Living Room hike in Salt Lake City. Climb to stone armchairs over the whole valley.
description: >
  Climb the foothills above the Natural History Museum of Utah to the Living
  Room, a set of flat rocks arranged into chairs and couches with the whole
  Salt Lake Valley spread out below. Grab a stone armchair, catch your
  breath, and each point out three landmarks you can name from up there. The
  photo to get: the view from your seat, with your feet up on the rocks.
about: >
  The stone furniture was built over the years by hikers rearranging the
  rocks, and the view is why it became one of the city's favorite short
  hikes. The Bonneville Shoreline Trail, which crosses the route, follows an
  old beach line of Lake Bonneville, a huge Ice Age lake that once covered
  much of Utah. The Great Salt Lake is what's left of it.

  It's only about 2.5 miles round trip, but you gain almost 1,000 feet. Lots
  of side trails branch off, so stay on the big, well-used path. If you go up
  for sunset, bring a headlamp for the walk down, and traction spikes in
  winter.
