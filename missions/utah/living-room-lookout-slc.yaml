short: Climb the foothills to the stone armchairs and kick back over the whole Salt Lake Valley.
description: >
  Start on Colorow Road near the Natural History Museum of Utah and climb the
  foothills to the Living Room, a set of flat rocks arranged into chairs and couches
  with the entire Salt Lake Valley spread out below. It's only about 2.5 miles round
  trip, but you gain almost 1,000 feet, much of it in a steep draw. Lots of side
  trails branch off near the Bonneville Shoreline Trail, so stay on the big,
  well-used path and ask other hikers if you're unsure. Grab a stone armchair and
  take a photo of the view from your seat. If you go up for sunset, bring a headlamp
  for the walk down, and traction spikes in winter.
