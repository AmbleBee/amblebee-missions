short: Hike up the slickrock to Delicate Arch for sunset. Bring headlamps for the walk back.
description: >
  Hike about three miles round trip up open slickrock to Utah's most famous
  arch and watch it glow orange at sunset. There's no shade and it climbs
  steadily, so bring water. Pack headlamps for the walk back in the dark.
  Check before you go whether the park needs a timed-entry reservation that
  season. The photo to get: the two of you with the arch glowing behind you.
about: >
  Delicate Arch stands about 52 feet tall, and it's on Utah's license
  plates. Arches National Park has more than 2,000 known arches, more than
  anywhere else in the world.

  The trail starts at Wolfe Ranch, where John Wesley Wolfe homesteaded in
  1898; his cabin still stands. A short side trail near the start leads to a
  Ute rock art panel showing bighorn sheep and riders on horseback.
