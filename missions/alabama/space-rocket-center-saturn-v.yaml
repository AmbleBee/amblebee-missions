short: U.S. Space & Rocket Center in Huntsville. Walk under a real Saturn V, then ride G-Force together.
description: >
  Walk the full length of a real Saturn V moon rocket hanging over your
  heads, from the giant engines all the way to the tiny capsule at the tip.
  Get a photo of the two of you under the F-1 engines for scale, then brave
  the G-Force Accelerator together and snap your faces right after. Finish
  in Rocket Park and count down your own liftoff in front of the shuttle
  stack.
about: >
  Huntsville is "Rocket City": Wernher von Braun's team designed the Saturn
  V at nearby Marshall Space Flight Center, and this museum is NASA
  Marshall's official visitor center. The Saturn V in the Davidson Center is
  one of only three left, and it's a National Historic Landmark. It's over
  360 feet long.

  Outside, Rocket Park has rockets standing against the sky and Pathfinder,
  a full-size space shuttle stack. Space Camp is based here too, so you'll
  often see trainees in flight suits.

  Add a planetarium show if you want to sit in the dark for a while. It's a
  big campus with lots of walking, so wear comfortable shoes.
