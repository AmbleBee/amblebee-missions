short: Walk the length of a real Saturn V, then ride the G-Force simulator together. Hold hands at liftoff.
description: >
  Spend an afternoon at Huntsville's space museum, where a real Saturn V moon
  rocket hangs over your heads for the full length of its hall. Walk from the
  engines to the capsule end, then head out to Rocket Park and the shuttle
  stack. Brave the G-Force Accelerator and Moon Shot rides together, and add a
  planetarium show to sit back in the dark for a while. Get a photo of the two
  of you beneath the huge F-1 engines. It's a big campus with a lot of
  walking, so wear comfortable shoes.
