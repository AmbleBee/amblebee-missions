short: Catch an indie film at a 1941 neighborhood movie house. Photo under the marquee.
description: >
  The Capri is a little single-screen theater in Cloverdale that opened in 1941 and is
  still run by a nonprofit film society. It shows independent, foreign and classic films,
  sometimes on real 35mm. Pick whatever is playing, even if neither of you has heard of it,
  grab popcorn (they also pour beer and wine for grown-ups with ID), and settle in. Before
  you go in, get a photo of the two of you under the glowing marquee. Afterward, each give
  the film a star rating before you compare notes.
