short: Capri Theatre in Montgomery's Cloverdale. A 1941 movie house, an indie film, a marquee photo.
description: >
  Pick whatever is playing at the Capri, even if neither of you has heard of
  it, grab popcorn and settle into this little single-screen theater. Before
  you go in, get a photo of the two of you under the glowing marquee.
  Afterward, each give the film a star rating in secret, then reveal them
  at the same time and compare notes.
about: >
  The Capri opened in July 1941 as the Clover Theatre and took the Capri name
  in 1962. It's now the longest continually operating movie theater in
  Alabama, a 200-seat single screen in the middle of Montgomery's Cloverdale
  neighborhood.

  In 1982, after the theater was shut down, neighbors formed the Capri
  Community Film Society to save it. The nonprofit still runs it, showing
  independent, foreign and classic films, sometimes on real 35mm prints, and
  members and donors helped it buy the building outright. A new marquee lit up
  in 2025.

  The concession stand pours beer and wine for grown-ups with ID, along with
  the popcorn.
