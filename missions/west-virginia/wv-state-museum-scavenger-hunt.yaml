short: Walk through West Virginia history from the ancient coal forest to today. Hunt down every clue!
description: >
  Head to the lower level of the Culture Center at the State Capitol in Charleston
  for the free West Virginia State Museum. One long show path takes you from the
  ancient coal forest of prehistory to the present day, with 26 little Discovery
  Rooms branching off it, plus lights, sounds and interactive spots along the way.
  Ask at the front desk for the QR code to the digital scavenger hunt, and let the
  kids lead the way from room to room. Get a photo of the family in the room the
  kids liked best. It's lightly lit and kept cool to protect the artifacts, so
  bring a sweater.
for_kids:
  short: Time-travel through West Virginia!
  steps:
    - The ancient coal forest
    - The oldest thing you can find
    - A room with a sound or light surprise
    - Your favorite room
    - A selfie with your grown-up!
