place:
  name: West Virginia State Museum (Culture Center)
  area: State Capitol Complex, Charleston
  address: 1900 Kanawha Blvd E, Charleston, WV 25305
  coords: [38.33650, -81.61270]  # APPROX: set at the entrance before publishing
