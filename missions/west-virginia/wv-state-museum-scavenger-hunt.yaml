short: West Virginia State Museum in Charleston. Time-travel from the coal forest to today on a hunt!
description: >
  Head to the lower level of the Culture Center at the State Capitol in Charleston
  for the free West Virginia State Museum. One long show path takes you from the
  ancient coal forest of prehistory to the present day, and the floor under your
  feet changes with the times, from stone to dirt to brick to highway. Twenty-six
  little Discovery Rooms branch off it, with lights, sounds and interactive spots
  along the way. Ask at the front desk whether they have a scavenger-hunt guide,
  and let the kids lead the way from room to room. Get a photo of the family in
  the room the kids liked best. It's lightly lit and kept cool to protect the
  artifacts, so bring a sweater.
about: >
  The West Virginia State Museum sits in the Culture Center, which opened in
  1976 next to the Capitol. The museum was rebuilt and reopened in 2009 with
  its long show path and 26 Discovery Rooms, holding more than 6,000
  artifacts. It's free, and the museum says reading every sign and watching
  every film would take more than 26 hours.

  The Capitol next door was designed by Cass Gilbert and finished in 1932.
  Its gold dome is covered in real gold leaf and stands a little taller than
  the US Capitol's.
