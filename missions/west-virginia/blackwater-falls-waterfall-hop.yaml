short: Hop between amber waterfalls and canyon overlooks. Count the stairs down to the big falls!
description: >
  Spend a few easy hours bouncing between short walks at Blackwater Falls
  State Park, just outside the small town of Davis. Start with the boardwalk
  and 200-plus stairs down to the main falls, where the creek runs amber-colored from
  tannins in the hemlock and spruce forest; the Gentle Trail on the other side
  gives an easier view. Then walk the short trail from the lodge to Elakala
  Falls and drive to the Lindy Point trail, a short but rockier walk out to
  an overlook above the canyon. Get a family photo at the
  big falls with the spray behind you. Hold little hands near the overlook
  edges, and expect slick steps after rain or in winter.
for_kids:
  short: Find the waterfalls!
  steps:
    - The big waterfall
    - Water that looks like root beer
    - A giant rock
    - The view from the top of the canyon
    - A selfie with your grown-up!
