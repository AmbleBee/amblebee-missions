short: Blackwater Falls in West Virginia. Hop between amber waterfalls; count the stairs to the big one!
description: >
  Spend a few easy hours bouncing between short walks at Blackwater Falls
  State Park, just outside the small town of Davis. Start with the boardwalk
  and 200-plus stairs down to the main falls, where the creek runs amber-colored
  from tannins in the hemlock and spruce forest; the paved Gentle Trail on the
  other side gives an easier, stroller-friendly view. Then walk the short trail
  from the lodge to Elakala Falls and drive to the Lindy Point trail, a short
  but rockier walk out to an overlook above the canyon. Get a family photo at
  the big falls with the spray behind you. Hold little hands near the overlook
  edges, and expect slick steps after rain or in winter.
about: >
  Blackwater Falls drops about 60 feet into an eight-mile canyon. The water
  is stained amber by tannins from the hemlock and red spruce needles that
  fall into the river upstream. The falls face east, so early risers get
  sunrise light right on the water.

  The state park opened in 1937. In winter it has the longest sled run on the
  East Coast, a quarter mile with a moving carpet to ride back up, and nearby
  Canaan Valley is known for skiing and wildlife. Lindy Point is one of the
  most photographed views in the state.
