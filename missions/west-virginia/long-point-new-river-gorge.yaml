short: Long Point Trail in Fayetteville, WV. Hike to the best view of the New River Gorge Bridge.
description: >
  Walk the easy trail through the woods to a rock point with a huge view of
  the New River Gorge Bridge spanning the canyon. Spread out a picnic and
  stay for the late afternoon light. Each guess how high the bridge is above
  the river before you look it up. The photo to get: the two of you on the
  point with the bridge behind you.
about: >
  The New River Gorge Bridge opened in 1977 as the longest single-span steel
  arch bridge in the world, and it's still one of the longest. The road
  deck is nearly 900 feet above the river. Before it opened, crossing the
  gorge took about 40 minutes on winding roads; now it takes less than one.

  On Bridge Day each October, the bridge closes to cars and BASE jumpers
  leap off it. The gorge became a national park in 2020. The trail is about
  three miles round trip, and the point's edges are unfenced, so keep back
  from the drop.
