short: Yale Peabody Museum in New Haven. A free dinosaur hall with a giant Brontosaurus.
description: >
  Head straight for the dinosaur hall, with its giant Brontosaurus, a
  Stegosaurus and a huge Triceratops skull, then let the kids pick the next
  gallery: minerals and gems, animals or whatever catches their eye. Make it
  a scavenger hunt and see who finds the smallest thing on display. The
  photo to get: the family doing its best dinosaur roar in front of the
  biggest skeleton.
about: >
  The Peabody was founded in 1866, and its Brontosaurus has stood here since
  1931. Yale scientist Othniel Marsh named Brontosaurus in the 1870s. Look
  up at The Age of Reptiles, a huge mural along the wall of the dinosaur
  hall, painted in the 1940s.

  The museum reopened in 2024 after a big renovation, and admission is now
  free. Check the hours before you go, since it's closed some days.
