short: Meet a Brontosaurus and a Triceratops at a free natural history museum. Roar for the photo!
description: >
  The Yale Peabody Museum reopened after a big renovation and admission is now always free.
  Head straight for the dinosaur fossils, including the giant Brontosaurus, a Stegosaurus and a huge Triceratops
  skull, then let the kids pick the next gallery: minerals and gems, animals or whatever
  catches their eye. Make it a scavenger hunt and see who can find the smallest thing on display.
  Get a family photo doing your best dinosaur roar in front of the biggest skeleton. No tickets
  are needed for regular visits; it's closed Mondays.
