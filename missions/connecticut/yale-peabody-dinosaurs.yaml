short: Yale Peabody Museum in New Haven. A free dinosaur hall with a giant Brontosaurus.
description: >
  Head straight for the dinosaur hall, where the very first Brontosaurus,
  Stegosaurus and Triceratops ever found stand under a mural as long as a
  city block. Then let the kids pick the next gallery: minerals and gems,
  animals or whatever catches their eye. Make it a scavenger hunt and see who
  finds the smallest thing on display. The photo to get: the family doing its
  best dinosaur roar in front of the biggest skeleton, plus one with the
  life-size Torosaurus out front on Whitney Avenue.
about: >
  The Peabody was founded in 1866, and its Brontosaurus has stood here since
  1931. Yale scientist Othniel Marsh named Brontosaurus in the 1870s, and the
  hall holds the first Brontosaurus, Stegosaurus and Triceratops specimens
  ever discovered. Look up at The Age of Reptiles, a 110-foot mural along the
  wall of the dinosaur hall, finished in 1947.

  The museum reopened in 2024 after a four-year renovation that more than
  doubled its exhibit space, and the Brontosaurus now holds its tail up the way
  scientists think it really did. Admission is now free for good. Check the
  hours before you go, since it's closed some days.
