short: Gillette Castle in East Haddam. Ride the tiny river ferry to a stone castle and a dark tunnel.
description: >
  Drive onto the tiny Chester-Hadlyme car ferry for a short ride across the
  Connecticut River, with the stone castle watching from the cliff above.
  Explore the grounds of the actor who played Sherlock Holmes, peek over the
  stone walls at the river, and add a self-guided tour of the castle's quirky
  rooms if it's open (late May through Columbus Day, plus a holiday program). Then walk the Train Trail along the old route
  of his toy-sized railroad and through a 75-foot tunnel that gets very dark
  in the middle, so bring a flashlight. Get a photo of the family at the
  tunnel mouth. Castle tours are limited and seasonal,
  so book ahead, and check that the ferry is running (it runs April through
  November and sometimes stops for repairs).
about: >
  The castle belonged to actor William Gillette, who played Sherlock Holmes
  on stage more than a thousand times and gave Holmes his famous curved
  pipe. He built the castle from 1914 to 1919, with hand-carved wooden
  door latches, hidden mirrors to spy on his guests, and a small railroad he
  drove around the grounds.

  The Chester-Hadlyme Ferry has crossed the river since the 1700s, making it
  one of the oldest ferry crossings in the country. It runs from spring
  through fall and sometimes pauses for repairs. Castle tours are seasonal.
