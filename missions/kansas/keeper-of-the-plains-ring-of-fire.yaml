short: Keeper of the Plains in Wichita. Walk the river at dusk and watch the Ring of Fire light up.
description: >
  Walk the river bridges to the giant steel Keeper of the Plains, standing
  on a rock point where two rivers meet. Find a spot by the water before
  dusk and watch the fire pots around its base come up in flames. The photo
  to get: the two of you with the Keeper and the flames glowing behind you.
about: >
  The Keeper of the Plains is a 44-foot steel sculpture by Kiowa-Comanche
  artist Blackbear Bosin, put up in 1974. In 2007 it was raised onto a
  30-foot rock at the point where the Big and Little Arkansas rivers meet,
  with walking bridges and a plaza around it.

  The "Ring of Fire" fire pots are lit for about 15 minutes most evenings,
  weather permitting. Check the city's schedule for the time, since it
  shifts with the seasons. It's free.
