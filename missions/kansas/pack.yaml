name: Amble Kansas
region: Kansas
description: Real places all over Kansas, starting where the Arkansas rivers meet in Wichita.
icon: sunflower
# A longer description for this pack's own page on the website (not sent to the Hive).
about: >
  Searching for things to do in Kansas? Think big skies, prairie and towns built where rivers meet, from Wichita
  to Lawrence and out west to Garden City. In Wichita, the Keeper of the Plains stands where two rivers come
  together, with fire pots lit at dusk on many nights, and Garden City has a free zoo worth a slow walk.
