short: Lee Richardson Zoo in Garden City, KS. Walk a free High Plains zoo and find the tallest animal.
description: >
  Grab a map at the gate and let the kids pick the route through dozens of
  acres of animals, from giraffes and big cats to bears and prairie
  critters. Each family member picks the animal they'd take home, and has to
  defend it. The photo to get: the family with the tallest animal you can
  find. Picnic in Finnup Park next door when legs get tired.
about: >
  Lee Richardson Zoo started in 1927 with two skunks, brought in by Garden
  City's police and parks chief, Lee Richardson. It was named for him in 1950,
  and today it covers 47 acres in Finnup Park with more than 80 species,
  accredited by the Association of Zoos and Aquariums.

  Walking in is free, and cars can pay to drive the loop road. Look for
  giraffes and lions on the African Plains, snow leopards and red pandas in
  Wild Asia, and cougars and jaguars in Cat Canyon.

  Summer afternoons get hot, so go in the morning when the animals are more
  active, and bring water.
