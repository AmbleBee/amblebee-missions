short: Walk a big prairie-town zoo for free. Spot the giraffes, cats and bears.
description: >
  Garden City's zoo is a real surprise out on the High Plains: dozens of acres of
  animals from giraffes and big cats to bears and prairie critters, and walking
  in is free. Park, grab a map at the gate, and let the kids pick the route,
  with a picnic in Finnup Park next door when legs get tired. Get a photo of the
  family with the tallest animal you can find. You can also pay to drive the
  loop road instead, but on foot is the way to see everything up close.
