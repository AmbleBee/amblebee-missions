short: Million Dollar Cowboy Bar in Jackson, WY. Grab a saddle at the bar and get a crew photo.
description: >
  Head to the Million Dollar Cowboy Bar on Jackson's Town Square, where the
  bar stools are real horse saddles. Claim a row of saddles for your crew,
  order a round, and get out on the floor if the live band gets the dancing
  started. Everyone has to try at least one two-step. The photo to get:
  your whole crew lined up in the saddles at the bar.
about: >
  The Cowboy Bar has been a Jackson landmark since the 1930s, when it got
  one of the first liquor licenses in town after Prohibition. Look closely
  at the bar top: it's inlaid with silver dollars, and the knotty pine
  inside is full of old-West details.

  Before or after, walk across to the Town Square, where four big arches are
  made entirely of elk antlers. It's a bar first, so plan on everyone being
  21 or older with ID at night. Summer evenings get packed.
