short: Grab a saddle at the bar on Jackson's Town Square. Line up for a crew photo in the saddles.
description: >
  Head to the Million Dollar Cowboy Bar on Jackson's Town Square, a Western
  landmark where the bar stools are real horse saddles. Claim a row of
  saddles for your crew, order a round, and take in the knotty pine, the
  old-west décor and the live country band most nights, and get out on the
  floor if the dancing starts. Get a group photo of everyone sitting in the
  saddles at the bar. It's a bar first: plan on everyone being 21 or
  older with ID at night, and summer evenings get packed.
