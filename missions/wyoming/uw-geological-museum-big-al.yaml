short: UW Geological Museum in Laramie. Toss a pinecone at the copper T. rex, then meet Big Al.
description: >
  Start out front at the life-size copper T. rex. Campus legend says landing
  a pinecone in its mouth brings an A on your next final, so give it a few
  tries. Inside, find Big Al, then stand under the 75-foot Apatosaurus and
  wander the rocks and fossils from Wyoming's deep past. The photo to get:
  you next to the copper T. rex, pinecone in hand.
about: >
  Big Al is one of the most complete Allosaurus skeletons ever found. It was
  dug up in Wyoming in 1991, and it showed injuries and infections the
  dinosaur lived with, which made it famous among scientists.

  Wyoming is one of the richest places in the world for dinosaur fossils,
  and the museum is free. Check the museum's page for parking on campus
  before you go.
