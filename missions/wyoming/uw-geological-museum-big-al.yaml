short: Toss a pinecone at the copper T. rex, then go inside to meet Big Al and a 75-foot giant.
description: >
  Spend a slow hour or two at the free University of Wyoming Geological Museum.
  Out front, the life-size copper T. rex greets you, and campus legend says
  landing a pinecone in its mouth brings an A on your next final, so give it a
  try. Inside, find Big Al, the most complete Allosaurus ever found and a
  Wyoming-born fan favorite, then stand under the 75-foot Apatosaurus and
  wander the rocks and fossils from across the state's deep past. Get a photo of
  yourself next to the copper T. rex on the way out. Check the museum's page for
  parking on campus before you go.
