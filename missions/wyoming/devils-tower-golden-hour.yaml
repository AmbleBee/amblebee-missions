short: Walk the loop around Devils Tower at golden hour, then stay for the stars.
description: >
  Walk the paved 1.3-mile Tower Trail around the base of Devils Tower as the evening
  light turns the columns gold. The start is short and steep, then it's an easy loop
  through the pines. The Tower is a sacred place for many tribes, so if you see prayer
  cloths tied to the trees, leave them be. Stay after dark: it's a long way from city
  lights.
