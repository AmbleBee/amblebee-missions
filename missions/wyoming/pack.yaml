name: Amble Wyoming
region: Wyoming
description: Real places all over Wyoming, starting at the foot of Devils Tower in the Black Hills.
icon: devils-tower
# A longer description for this pack's own page on the website (not sent to the Hive).
about: >
  Wyoming is mountains, cowboys and wide-open country, home to Yellowstone and the Tetons. Among the best things
  to do here: see Devils Tower at golden hour, grab a saddle seat at Jackson's Cowboy Bar, or meet a famous
  dinosaur in Laramie.
