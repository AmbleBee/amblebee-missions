short: Grind up Old Speck on the Appalachian Trail and climb the fire tower. Spot Katahdin.
description: >
  Start at the Grafton Notch trailhead and climb Old Speck, one of Maine's
  highest peaks, about seven and a half miles round trip and roughly 2,700 feet
  of climbing on the Appalachian Trail; plan on four to seven hours. The bottom follows a brook through birch woods, then
  the trail turns steep, rocky and rooty for the long push to the summit. Climb
  the old fire tower, now an open observation tower, for a huge view over the Mahoosucs and western
  mountains; on a clear day you can pick out the Presidentials and maybe
  Katahdin. Get a photo at the top of the tower with the mountains all around.
  Bold hikers can start up the Eyebrow Trail's iron rungs and ladders instead;
  start early, pack plenty of water, and pay the small park day-use fee (cash or
  check).
steps:
