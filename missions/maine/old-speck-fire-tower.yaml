short: Old Speck in Grafton Notch, Maine. Climb the Appalachian Trail to the fire tower and spot Katahdin.
description: >
  Climb Old Speck on the Appalachian Trail, following a brook through birch
  woods before the long, steep, rocky push to the summit. Climb the old fire
  tower for a huge view over the western mountains, and each try to spot
  the Presidentials and maybe Katahdin far away. The photo to get: you at
  the top of the tower with the mountains all around.
about: >
  Old Speck is one of the highest peaks in Maine, about 4,200 feet. The hike
  is about seven and a half miles round trip with roughly 2,700 feet of
  climbing; plan on four to seven hours.

  Just south on the Appalachian Trail is Mahoosuc Notch, a boulder-filled
  ravine famous as one of the hardest miles of the whole trail. Bold hikers
  can start up the Eyebrow Trail's iron rungs and ladders. Start early and
  pack plenty of water. The park day-use fee has been cash or check only.
steps:
  - The brook near the bottom
  - The steepest part of the climb
  - Everyone on top of the fire tower
