short: Ferry out to a tiny island 10 miles at sea. Hike the cliffs and catch the last boat home.
description: >
  Take the morning ferry from Port Clyde out to Monhegan, a car-free fishing
  island about an hour offshore with no paved roads and a village of
  artists' studios. Climb up to the lighthouse for the view over the harbor,
  walk through the mossy Cathedral Woods, and follow the cliff trails along
  the back of the island to the high headlands at White Head and Burnt Head.
  Pack a picnic or grab lunch in the village, then keep an eye on the clock
  for the afternoon boat back. Get a photo of the two of you on the cliffs
  with nothing but ocean behind you. The trails are rocky and steep in spots,
  and same-day round trips only work when the boat runs more than once a day
  (roughly mid-May to mid-October).
steps:
  - The harbor from the ferry deck
  - The lighthouse
  - The two of you on the cliffs with only ocean behind you
