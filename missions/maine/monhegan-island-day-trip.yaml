short: Monhegan Island day trip from Port Clyde, Maine. Ferry out, hike the cliffs, catch the last boat.
description: >
  Take the morning ferry from Port Clyde out to Monhegan, a car-free fishing
  island about an hour offshore. Climb up to the lighthouse for the view over
  the harbor, walk the mossy Cathedral Woods, and follow the cliff trails to
  the high headlands at White Head and Burnt Head. Each pick your favorite
  painting in the village studios. The photo to get: the two of you on the
  cliffs with nothing but ocean behind you.
about: >
  Monhegan has drawn painters for more than a century, including Rockwell
  Kent and three generations of the Wyeth family, and only a small number
  of people live there year-round. The lighthouse dates to the 1850s.

  Look for the rusting wreck of a tugboat on the rocks at Lobster Cove, which
  ran aground in the 1940s. The trails are rocky and steep in spots, and
  same-day round trips only work when the boat runs more than once a day,
  roughly mid-May to mid-October.
