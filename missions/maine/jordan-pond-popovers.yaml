short: Jordan Pond House in Acadia. Walk the pond shore, then split warm popovers on the lawn.
description: >
  Walk the path along Jordan Pond with the two rounded Bubbles mountains at
  the far end, then sit on the lawn for warm popovers with butter and
  strawberry jam. Each rate your popover's puffiness out of ten. The photo
  to get: the two of you on the lawn with the pond and the Bubbles behind
  you.
about: >
  Popovers have been served at Jordan Pond House since the 1890s, and tea
  on the lawn is one of Acadia's oldest traditions. The full loop around the
  pond is about three miles and mostly flat, partly on boardwalk.

  The pond is so clear because it's a public water supply, which also means
  no swimming. The nearby carriage roads, built by John D. Rockefeller Jr.,
  are great for a walk or bike ride after. The restaurant is open spring
  through mid-fall, and Acadia charges a park entrance fee.
