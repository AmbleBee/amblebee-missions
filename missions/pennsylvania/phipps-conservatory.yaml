short: Wander a Victorian glasshouse full of flowers. Find the glass art hidden among the plants.
description: >
  Walk through the rooms of a big Victorian glass conservatory: a palm court, a
  fern room, orchids, a desert room and a tropical forest, with Chihuly glass
  sculptures tucked among the plants. The seasonal flower shows change every few
  months, and in winter there's a model garden railroad. A warm escape on a cold
  Pittsburgh day.
