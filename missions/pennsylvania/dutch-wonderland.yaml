description: >
  A classic family amusement park behind a storybook castle, built for younger
  kids: gentle coasters, a log flume, a monorail and a summer water park. Pick a
  ride each and take turns choosing. It's seasonal, from spring through the
  winter light show in December, with Halloween events in the fall. Buy tickets
  online ahead.
