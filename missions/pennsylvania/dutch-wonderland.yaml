short: Ride everything you can at Dutch Wonderland, the castle park made for little kids.
description: >
  A classic family amusement park behind a storybook castle, built for younger
  kids: gentle coasters, a log flume, a monorail and a summer water park. Pick
  a ride each and take turns choosing. It's seasonal, from spring through the
  winter light show in December, with Halloween events in the fall. Buy
  tickets online ahead. The photo to get: the family in front of the storybook
  castle.
about: >
  Dutch Wonderland opened in 1963, built by Earl Clark, a local potato farmer,
  behind the stone castle he had already put up by the road. It calls itself
  "A Kingdom for Kids," and its mascot is Duke, a friendly purple dragon.

  Look for the wooden Kingdom Coaster and more than 20 animatronic dinosaurs
  on Exploration Island. Lancaster's Amish farmland and markets are a short
  drive away for the rest of the day.
