short: Get lost together in Longwood's gardens and glasshouses. Find the fountains.
description: >
  Longwood is one of the grandest gardens in the country: acres of flower
  gardens and woodland walks, a huge glass conservatory, treehouses, and
  fountain gardens that put on shows on some evenings. Each pick a favorite
  spot and take the other there. At the holidays the whole place is lit up for
  A Longwood Christmas. Buy timed tickets ahead; it's closed some days of the
  week. The photo to get: you in the spot you picked.
about: >
  Pierre S. du Pont bought the land in 1906 to save its old trees from being
  cut for lumber, then spent decades building gardens, fountains and the
  huge conservatory, which opened in 1921.

  Longwood now covers about 1,100 acres. Its Main Fountain Garden was
  rebuilt and reopened in 2017, and a big new glass conservatory opened in
  2024. Each season brings a different display, so it's worth coming back.
