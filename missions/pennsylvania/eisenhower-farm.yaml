short: Tour President Eisenhower's farmhouse, then walk the fields where he hosted world leaders.
description: >
  Just past the Gettysburg battlefield is the farm where Dwight and Mamie
  Eisenhower retired, and where Ike welcomed world leaders onto the back porch.
  Drive straight to the site and check in for a ranger-led tour of the house,
  still furnished the way they left it, then wander the barns and fields. Home
  tours run from late spring through fall, plus a few weekends in December;
  the grounds are open year-round.
