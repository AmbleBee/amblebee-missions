short: Tour President Eisenhower's farmhouse, then walk the fields where he hosted world leaders.
description: >
  Just past the Gettysburg battlefield is the farm where Dwight and Mamie
  Eisenhower retired, and where Ike welcomed world leaders onto the back
  porch. Drive straight to the site and check in for a ranger-led tour of the
  house, still furnished the way they left it, then wander the barns and
  fields. Home tours run from late spring through fall, plus a few weekends in
  December; the grounds are open year-round. The photo to get: you in front of
  the Eisenhowers' farmhouse.
about: >
  Dwight and Mamie Eisenhower bought the farm in 1950, the only home they
  ever owned. Ike used it as a weekend retreat while he was president,
  bringing world leaders here, including Soviet leader Nikita Khrushchev in
  1959.

  The Eisenhowers gave the farm to the National Park Service in 1967. Ike
  also raised Angus cattle here, and the barns and show cattle still tell
  that story.
