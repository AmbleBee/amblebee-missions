short: Ike's farm in Gettysburg. Tour his house, then walk the fields where he hosted world leaders.
description: >
  Just past the Gettysburg battlefield is the farm where Dwight and Mamie
  Eisenhower retired, and where Ike welcomed world leaders onto his porch.
  Drive straight to the site and check in for a free ranger-led tour of the
  house, still furnished the way they left it, then wander the barns and
  fields. Home tours run from late spring through fall, plus a few weekends in
  December; the grounds are open year-round. The photo to get: you in front of
  the Eisenhowers' farmhouse.
about: >
  Dwight and Mamie Eisenhower bought the farm in 1950, and it was the only
  home they ever owned. "We had only one home, our farm," Mamie said. Ike used
  it as a weekend retreat while he was president and brought world leaders
  here. When Soviet leader Nikita Khrushchev visited in 1959, he admired the
  Angus cattle so much that Ike offered to send him one.

  Ike raised prize-winning Angus show cattle on the farm, and the show barn
  still holds their ribbons. The Eisenhowers gave the farm to the National
  Park Service in 1967.
