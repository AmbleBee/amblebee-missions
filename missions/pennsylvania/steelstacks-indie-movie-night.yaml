short: Catch an indie film in the shadow of Bethlehem's old blast furnaces. Pick it blind.
description: >
  The two-screen indie cinema inside the ArtsQuest Center sits right under the
  rusted blast furnaces of the old Bethlehem Steel plant. Pick a film neither
  of you has heard of from the lineup of indie, foreign and documentary picks,
  grab a drink from the bar a short walk away, and settle in. Afterward, step outside
  to see the furnaces towering over the plaza after dark while you each rate the
  film out of ten. Get a photo of the two of you with the stacks behind you on your way
  out. ArtsQuest is cashless, so bring a card.
