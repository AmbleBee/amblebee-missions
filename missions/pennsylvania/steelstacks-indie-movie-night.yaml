short: SteelStacks in Bethlehem, PA. Catch an indie film under the old blast furnaces. Pick it blind.
description: >
  The two-screen indie cinema inside the ArtsQuest Center sits right under the
  rusted blast furnaces of the old Bethlehem Steel plant. Pick a film neither
  of you has heard of from the lineup of indie, foreign and documentary picks,
  grab a beer or a glass of wine to bring to your seats, and settle in.
  Afterward, walk out on the Hoover-Mason Trestle to see the furnaces
  towering overhead after dark while you each rate the film out of ten. Get a
  photo of the two of you with the stacks behind you on your way out.
about: >
  Bethlehem Steel made steel here for more than a century, for bridges,
  skyscrapers and warships, including the Golden Gate Bridge, and the
  ArtsQuest Center is painted the bridge's same International Orange. The
  last steel was poured here in 1995, and the blast furnaces were saved as
  the centerpiece of the SteelStacks arts campus.

  The Hoover-Mason Trestle, an old ore railway, is now a 1,650-foot elevated
  walkway four stories up alongside the stacks, and the furnaces are often
  lit at night. Musikfest, the nation's largest free music festival, takes
  over the area in August. The cinema is cashless, so bring a card.
steps:
