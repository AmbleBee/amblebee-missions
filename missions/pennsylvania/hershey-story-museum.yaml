short: Learn how Hershey made chocolate for everyone, then taste chocolate from around the world.
description: >
  Walk through Milton Hershey's story, from failed candy shops to the
  chocolate town he built, then head to the tasting bar for warm drinking
  chocolate from around the world. Book a hands-on Chocolate Lab class if you
  want to make your own. Afterward, walk Chocolate Avenue and find the
  Kiss-shaped streetlights.
about: >
  Milton Hershey failed at candy-making more than once before his Lancaster
  caramel company took off. He sold it in 1900 for $1 million and put the
  money into milk chocolate and a whole town built around his factory.

  He also founded a school for orphaned boys in 1909, now the Milton Hershey
  School, and left most of his fortune to it. The Kiss-shaped streetlights
  on Chocolate Avenue have lit the street since the 1960s.
