short: Eat your way through Lancaster, starting at the oldest farmers' market in the country.
description: >
  Start at Central Market, America's oldest farmers' market building, where
  farmers have sold food since the 1730s. Each buy one thing the other has never
  tried (whoopie pies, soft pretzels, chow-chow, shoofly pie) and share it all,
  then keep tasting your way through downtown. The market is only open a few
  mornings a week. Want a guide? Walking food tours run from downtown too.
