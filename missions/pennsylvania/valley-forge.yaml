short: Walk where Washington's army spent the winter. Find the log huts and the arch.
description: >
  Valley Forge is where the Continental Army camped through the hard winter of
  1777-78. Start with the free film at the visitor center, then walk or bike the
  loop trail past rebuilt log huts, cannons, the National Memorial Arch and
  Washington's stone headquarters. The park is free and open every day, and the
  rolling fields are beautiful for a long walk in any season.
for_kids:
  short: Soldier camp hunt! Find each thing.
  steps:
    - A little log cabin
    - A cannon
    - A big stone arch
    - A selfie like a soldier!
