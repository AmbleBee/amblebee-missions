about: >
  Looking for date ideas in Pittsburgh, Philadelphia or around Pennsylvania? The state mixes American history,
  farm country and cities with deep character, from Gettysburg and Lancaster to Hershey. In Pittsburgh, ride the
  Duquesne Incline up Mount Washington at night for one of the best city views in the country.
