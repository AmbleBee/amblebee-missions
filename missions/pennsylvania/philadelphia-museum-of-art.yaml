short: Run up the Rocky steps, then find a painting each that you'd hang at home.
description: >
  Race (or stroll) up the famous steps, throw your arms up at the top, and
  look back at the city skyline. Inside, wander one of the biggest art museums
  in the country, from armor and a whole Japanese teahouse to Van Gogh's
  sunflowers. Each pick one piece you'd hang at home and show it to the other.
  Check the museum's site for discounted evening hours. The photo to get: you
  at the top of the steps, arms up, with the skyline behind you.
about: >
  The museum's building opened in 1928 on top of Fairmount, and it holds
  roughly 240,000 objects. The steps became famous in the 1976 movie Rocky,
  and the Rocky statue now stands near the bottom, to the right. There are 72
  steps to the top.

  The museum briefly rebranded as the Philadelphia Art Museum in 2025, then
  went back to its old name in early 2026. The Rodin Museum and the Barnes
  Foundation are a short walk down the Parkway.
