short: Drive the Gettysburg battlefield. Stop wherever the view or a story pulls you in.
description: >
  Start at the visitor center, where the museum, film and the huge 360-degree
  Cyclorama painting set the scene, then follow the self-guided auto tour
  across the battlefield. The fields, monuments and overlooks are free to
  visit; the museum takes a ticket. Take turns picking where to pull over, and
  read each other one plaque out loud. The photo to get: you at an overlook
  with the battlefield spread out behind you.
about: >
  The battle was fought July 1 to 3, 1863, and with about 51,000 soldiers
  killed, wounded, captured or missing, it was the bloodiest battle of the
  Civil War. Four months later Abraham Lincoln gave the Gettysburg Address
  at the cemetery dedication.

  The Cyclorama painting, by Paul Philippoteaux, was finished in 1884 and is
  about 377 feet around. Licensed battlefield guides can ride along in your
  car for a personal tour if you book ahead.
