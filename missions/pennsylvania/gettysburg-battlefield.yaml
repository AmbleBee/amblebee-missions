short: Drive the Gettysburg battlefield. Stop wherever the view or a story pulls you in.
description: >
  Start at the visitor center, where the museum, film and the huge 360-degree
  Cyclorama painting set the scene, then follow the self-guided auto tour across
  the battlefield. The fields, monuments and overlooks are free to visit; the
  museum takes a ticket. Take turns picking where to pull over, and read each
  other one plaque out loud.
