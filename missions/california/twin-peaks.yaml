place:
  name: Twin Peaks (Christmas Tree Point)
  area: Twin Peaks, San Francisco
  coords: [37.75440, -122.44770]  # APPROX: set at the Christmas Tree Point lot before publishing
short: Twin Peaks in San Francisco. Take in the 360-degree view and name three landmarks.
description: >
  Drive or walk up to Twin Peaks, near the center of San Francisco, for a
  360-degree view over the whole city and the bay. Each spot three landmarks
  you can name, like the Bay Bridge, Salesforce Tower and Alcatraz, and
  whoever names the most wins. The photo to get: you with downtown behind
  you. Climb one of the peaks if you're up for it.
about: >
  The two peaks rise about 900 feet, among the highest points in the city.
  The giant red-and-white tower nearby is Sutro Tower, which has sent TV and
  radio signals across the Bay Area since 1973.

  It's always windy and often foggy, so bring a jacket and check that the
  fog has cleared before you go. Sunset and night views over the city lights
  are both great.
for_kids:
  short: City lookout! Find each thing.
  steps:
    - A big bridge
    - The tallest building
    - A boat on the water
    - A selfie at the top!
