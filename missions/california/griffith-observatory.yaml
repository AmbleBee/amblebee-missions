short: Griffith Observatory in LA. Watch the sunset over the city, then look through a real telescope.
description: >
  Get to the observatory in the late afternoon and explore the free
  exhibits. Find a spot on the terrace for sunset over the city with the
  Hollywood sign in view, then stay as the lights come on. The photo to
  get: you at the railing with the glowing city behind you. On clear
  evenings, each take a turn at the public telescope and describe what you
  saw.
about: >
  The observatory opened in 1934 on land given to the city by Griffith J.
  Griffith, who wanted everyone to be able to look through a telescope for
  free. Its Zeiss telescope has been looked through by more people than any
  other in the world.

  Movie fans know it from Rebel Without a Cause (look for the James Dean
  bust on the lawn) and La La Land. Parking at the top fills fast, so take
  the DASH bus or park lower and walk up. Check the website for hours, since
  it's closed one day a week.
for_kids:
