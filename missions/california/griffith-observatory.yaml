short: Watch the sunset over LA from Griffith Observatory. Look through a real telescope after dark.
description: >
  Get to the observatory in the late afternoon and explore the exhibits (it's
  free). Find a spot on the terrace for sunset over the city with the Hollywood
  sign behind you, then stay as the lights come on. On clear evenings the
  public telescopes are free to look through. Parking at the top fills fast,
  so take the DASH bus or park lower down and walk up. Closed Mondays.
