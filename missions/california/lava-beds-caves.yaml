place:
  name: Lava Beds National Monument Visitor Center
  area: Near Tulelake, Siskiyou County
  coords: [41.71400, -121.50900]  # APPROX: set at the visitor center before publishing
  website: https://www.nps.gov/labe/planyourvisit/caving.htm
short: Explore lava tube caves on your own at Lava Beds. Start with lit Mushpot, then go darker.
description: >
  Pick up a free caving permit at the visitor center, then explore lava tubes,
  tunnels left behind by flowing lava, on your own. Start in Mushpot Cave
  right next door, the only one with lights, then try Valentine Cave or the
  huge boulder-filled Skull Cave. Turn off your lights for a minute and sit in
  total darkness together. Bring at least two real lights each (not your
  phone); the visitor center often lends flashlights. Wear sturdy shoes and
  bring a jacket. Some caves close seasonally to protect bats.
for_kids:
  short: Cave hunt! Find each thing.
  steps:
    - A cave with lights
    - A really dark tunnel
    - A lumpy lava wall
    - Your flashlight
    - A selfie in a cave!
