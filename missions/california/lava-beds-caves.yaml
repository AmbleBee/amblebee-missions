short: Lava Beds National Monument near Tulelake. Explore lava tube caves on your own, lights off.
description: >
  Get a free caving permit at the visitor center, then explore lava tubes,
  tunnels left behind by flowing lava, on your own. Start in Mushpot Cave,
  the only one with lights, then try Valentine Cave or huge, boulder-filled
  Skull Cave. Deep inside, turn off your lights for one full minute and sit
  in total darkness together. The photo to get: you in the cave mouth,
  looking back out at daylight.
about: >
  The monument has more than 800 lava tube caves, the most of anywhere in
  the lower 48. The permit includes a quick check for white-nose syndrome,
  a disease that kills bats, which is why some caves close in certain
  seasons.

  It's also an important historic place. In 1872 and 1873, during the Modoc
  War, a small band of Modoc people led by Captain Jack held off the U.S.
  Army for months from a natural fortress in the lava. You can walk the
  trail at Captain Jack's Stronghold.

  Bring at least two real lights each (not your phone); the visitor center
  often lends flashlights. Wear sturdy shoes and bring a jacket.
