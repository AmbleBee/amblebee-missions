short: Napa Valley wine tasting. Taste your way through Napa and bring one bottle home.
description: >
  Start with the tasting rooms you can walk between in downtown Napa, then
  head out among the vineyards for a winery or two. Each pick your favorite
  pour of the day, then buy one bottle together and write today's date on
  it, to open on a special occasion. The photo to get: the two of you
  between the vine rows with your glasses raised.
about: >
  Napa became world famous in 1976 at the "Judgment of Paris," a blind
  tasting where French judges picked California wines over famous French
  ones. Both winners came from Napa.

  Most wineries want reservations, and tasting fees add up fast, so plan two
  or three stops, not six. Downtown tasting rooms are walkable, which makes
  an easy start. Pick a designated driver or book a tour.
