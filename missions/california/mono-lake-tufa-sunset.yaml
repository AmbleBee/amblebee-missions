short: Mono Lake South Tufa near Lee Vining. Walk the strange tufa towers as they glow at sunset.
description: >
  Walk the short trail at South Tufa, where knobby limestone towers rise out
  of an ancient, salty lake. Come for sunset, when the towers glow orange and
  pink and their reflections fill the still water. Each find the
  strangest-shaped tower and give it a name, and look for tiny brine shrimp
  near the shore. The photo to get: you between the towers in the last
  light.
about: >
  Mono Lake is hundreds of thousands of years old, one of the oldest lakes in
  North America. The tufa towers formed underwater, where spring water met
  the salty lake. They were uncovered after Los Angeles began diverting the
  streams that feed the lake in 1941. A long fight to save it, started in the
  1970s, helped the water start rising again.

  The lake is saltier than the ocean and very alkaline; dip a finger and feel
  how slippery it is. Mark Twain wrote about the swarms of alkali flies in
  Roughing It. There's a small day-use fee at South Tufa.
