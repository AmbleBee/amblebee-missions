short: Explore the Crocker in Sacramento. Each pick the painting you'd hang above your couch.
description: >
  Wander one of the oldest art museums in the West, where a grand 1870s
  Victorian mansion and gallery connect to a bright modern wing. See
  California landscapes and Gold Rush-era paintings, wild contemporary art
  and ceramics, and the ornate ballroom of the original house. Each pick the
  piece you'd hang above your couch and explain why, and get a photo of
  you on the historic staircase. Go on a Thursday, when it stays open
  until 9, and walk over to Old Sacramento for dinner after. Closed Mondays and
  Tuesdays.
