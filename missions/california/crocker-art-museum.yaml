short: Crocker Art Museum in Sacramento. Each pick the painting you'd hang above your couch.
description: >
  Wander from a grand 1870s Victorian mansion and gallery into a bright
  modern wing. See California landscapes and Gold Rush-era paintings, wild
  contemporary art and ceramics, and the ornate ballroom of the original
  house. Each pick the piece you'd hang above your couch and explain why.
  The photo to get: you on the historic staircase. Afterward, walk over to
  Old Sacramento for dinner.
about: >
  The Crocker opened to the public in 1885 and is the oldest public art
  museum in the West. Judge Edwin B. Crocker and his wife Margaret built the
  gallery next to their home to hold the art they collected in Europe.
  Edwin's brother Charles was one of the "Big Four" who built the Central
  Pacific Railroad.

  The modern wing opened in 2010 and more than doubled the museum's size.
  The museum stays open late one evening a week, a good time for a date.
  Check the website for hours, since it's closed on some weekdays.
