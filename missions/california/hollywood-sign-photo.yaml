place:
  name: Lake Hollywood Park
  area: Hollywood Hills, Los Angeles
  address: 3160 Canyon Lake Dr, Los Angeles, CA 90068
  coords: [34.12725, -118.32600]
short: Hollywood Sign photo from Lake Hollywood Park in LA. Compete for the best shot with the letters.
description: >
  Head to Lake Hollywood Park, a grassy park right below the sign with one
  of the closest legal views. Bring a blanket and a snack, then hold a
  photo contest: everyone gets five tries for the best shot of you with the
  sign behind you, and the group votes on the winner. Bonus points for a
  pose that makes it look like you're holding up a letter.
about: >
  The sign went up in 1923 as an ad for a housing development called
  "Hollywoodland." The "LAND" came down in 1949, and the rest became the
  symbol of the movie business. Each letter is about 45 feet tall.

  The sign itself is fenced off and watched, so don't try to reach it. The
  park is in a quiet neighborhood with tight parking, so be respectful. A
  clear day after rain gives the sharpest view.
for_kids:
  short: Famous sign! Find each thing.
  steps:
    - The big white letters
    - A dog in the park
    - The hills
    - A selfie with the sign!
