short: Explore a real aircraft carrier. Sit in a cockpit up on the flight deck.
description: >
  Climb aboard the USS Midway and explore an aircraft carrier from the hangar
  deck to the flight deck, where dozens of planes and helicopters are parked.
  Climb into a cockpit, take the tour up into the ship's island, and each pick
  the plane you'd fly. Wear good shoes; you'll be climbing steep ship ladders.
  Afterward, walk the waterfront toward Seaport Village.
