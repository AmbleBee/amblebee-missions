short: Pick apples and split a warm apple pastry at Apple Hill's farms in the fall.
description: >
  Spend a fall morning driving between the family farms of Apple Hill in the
  Sierra foothills. Pick your own apples, watch cider being pressed, and split
  a warm apple fritter, cider donut or slice of apple pie. Each pick the farm
  stand treat you'd come back for, and get a photo of the two of you in the
  orchard rows. Go early on a weekday, since fall weekends bring big traffic.
  Most farms are busiest from September through November.
for_kids:
