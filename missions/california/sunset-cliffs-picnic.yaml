short: Bring a picnic to Sunset Cliffs. Watch the sun drop into the waves, well back from the edge.
description: >
  Pack a homemade picnic, or on a Wednesday grab treats from the Ocean Beach
  farmers market on Newport Avenue just up the road. Get to the cliffs about an
  hour before sunset, since parking fills up. Find a spot well back from the edge
  (the bluffs crumble and some sections are fenced off), spread out a blanket and
  watch the sun sink into the Pacific. Bring a jacket for when the wind picks up,
  and get one photo of the two of you in silhouette against the glow.
