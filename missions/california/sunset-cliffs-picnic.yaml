short: Sunset Cliffs in San Diego. Picnic on the bluffs and watch the sun drop into the Pacific.
description: >
  Pack a picnic and get to the cliffs about an hour before sunset, since
  parking fills up. Find a spot well back from the edge, spread out a
  blanket, and watch the waves crash into the sea caves below. Each guess
  the exact minute the sun will touch the water. The photo to get: you in
  silhouette against the glow.
about: >
  The cliffs are soft sandstone, carved by the waves into caves, arches and
  coves, and they crumble easily. Every year people get hurt near the edge,
  so stay well back and respect the fenced sections.

  On Wednesdays, the Ocean Beach farmers market on Newport Avenue, just up
  the road, is a great place to grab picnic food. Bring a jacket for when
  the wind picks up.
