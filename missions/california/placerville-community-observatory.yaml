short: Look through big telescopes at a free public night at the Placerville Community Observatory.
description: >
  Catch one of the free public viewing nights at a hilltop observatory in the
  Sierra foothills, where volunteer astronomers point big telescopes at
  whatever's up that night: the rings of Saturn, craters on the Moon, star
  clusters and distant galaxies. Take turns at each eyepiece, ask the
  volunteers anything, and each pick the most amazing thing you saw. Dress
  warm, since it gets cold after dark, and check the schedule, as viewing
  nights depend on the calendar and clear skies. Entry is free; the college
  charges a small parking fee.
for_kids:
