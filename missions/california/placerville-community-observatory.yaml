short: Community Observatory in Placerville. Look through big telescopes on a free public night.
description: >
  Catch a free public viewing night at a hilltop observatory in the Sierra
  foothills, where volunteer astronomers point big telescopes at whatever's
  up: the rings of Saturn, craters on the Moon, star clusters and distant
  galaxies. Take turns at each eyepiece, ask the volunteers anything, and
  each pick the best thing you saw. The photo to get: you beside the
  biggest telescope, with the dome open to the sky.
about: >
  The observatory sits on the Folsom Lake College campus in the foothills,
  above much of the valley's haze and city light. It's run by volunteers
  who love showing people the sky, so don't be shy about asking questions.

  Viewing nights depend on the calendar and clear skies, so check the
  schedule the day of. Dress warm, since it gets cold after dark even in
  summer. Entry is free; the college charges a small parking fee.
