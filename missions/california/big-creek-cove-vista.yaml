place:
  name: Big Creek Cove Vista Point, Highway 1
  area: Southern Big Sur, between Esalen and Lucia
  address: 59601-59627 Cabrillo Hwy, Big Sur, CA 93920
  coords: [36.06157, -121.59145]
short: Big Creek Cove on Highway 1 in Big Sur. Frame the arched bridge and watch for otters and whales.
description: >
  Pull over where the graceful concrete arch of Big Creek Bridge spans a
  cove of turquoise water and the mountains drop straight into the sea. Find
  the spot where the bridge, the cove and the coastline all fit in one frame
  and get your photo with it behind you. Then each scan the water and see
  who spots a sea otter in the kelp first. In winter and spring, watch for
  gray whale spouts too.
about: >
  Big Creek Bridge opened in 1938, just after this stretch of Highway 1 was
  finished. Building the road along these cliffs took about 18 years. The
  land in the canyon below is a protected research reserve, so it's a
  look-from-above kind of stop.

  Bring a jacket, since it's often windy. Only stop in the paved pullout and
  never walk along the highway. This part of Highway 1 sometimes closes after
  storms and landslides, so check Caltrans QuickMap before you drive.
for_kids:
  short: Ocean lookout! Find each thing.
  steps:
    - The big arch bridge
    - Blue-green water
    - A sea otter or seal
    - A whale spout
    - A selfie by the ocean!
