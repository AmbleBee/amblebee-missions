place:
  name: Big Creek Cove Vista Point, Highway 1
  area: Southern Big Sur, between Esalen and Lucia
  address: 59601-59627 Cabrillo Hwy, Big Sur, CA 93920
  coords: [36.06157, -121.59145]
short: Stop at Big Creek Cove on Highway 1. Frame the arched bridge and watch for whales.
description: >
  Pull over at one of Big Sur's best viewpoints, where the graceful concrete
  arch of Big Creek Bridge spans a cove of turquoise water and the mountains
  drop straight into the sea. Find the spot where the bridge, the cove and
  the coastline all fit in one frame, and get a photo of you with
  it behind you. Then take your time and scan the water: sea otters float in
  the kelp, and gray whales pass by in winter and spring. Bring a jacket, since
  it's windy. This stretch of Highway 1 sometimes closes after storms, so
  check Caltrans QuickMap before you drive.
for_kids:
  short: Ocean lookout! Find each thing.
  steps:
