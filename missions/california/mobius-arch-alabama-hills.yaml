short: Mobius Arch in the Alabama Hills near Lone Pine. Frame Mount Whitney through it at sunrise.
description: >
  Drive Movie Road into the Alabama Hills, a maze of rounded orange
  boulders, and hike the short loop to Mobius Arch before sunrise. Watch the
  first light turn the Sierra peaks bright pink, then line up Mount Whitney
  through the rock window. The photo to get: you beside the arch with
  Whitney glowing in it. Bring coffee and layers for the wait.
about: >
  Hundreds of movies have been filmed in the Alabama Hills, from old
  Westerns to Gunga Din, Iron Man and Django Unchained. The Museum of
  Western Film History in Lone Pine has the story, plus a great stop for
  breakfast nearby.

  The hills got their odd name during the Civil War, when Southern-leaning
  miners named their claims after a Confederate warship, the CSS Alabama.
  Mount Whitney is the tallest mountain in the lower 48, at about 14,500
  feet.
