short: Picnic under the stars at a Hollywood Bowl concert. Pack wine, cheese and a blanket.
description: >
  Pick a concert, anything from the LA Phil to a movie-with-orchestra night or
  a big headliner, and go to the famous outdoor amphitheater in the
  Hollywood Hills. Get there early to picnic: pack wine, cheese and snacks
  (you can bring your own food) and eat at one of the picnic areas or your
  seats. Watch the shell light up as the sun goes down, and get a photo of
  the two of you with the stage glowing behind you. Bring a blanket and a
  jacket. The season runs through summer; buy tickets ahead and take the Bowl
  shuttle.
