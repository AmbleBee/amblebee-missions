short: Hollywood Bowl in LA. Picnic under the stars before a summer concert in the hills.
description: >
  Pick a concert, anything from the LA Phil to a movie-with-orchestra night
  or a big headliner, and get there early to picnic. Pack your favorite
  snacks and a blanket, and eat at a picnic area or your seats as the sun
  goes down. The photo to get: you with the shell glowing behind you once
  the lights come up. Then each pick your favorite song of the night on the
  way out.
about: >
  The Hollywood Bowl opened in 1922 in a natural bowl in the hills and seats
  about 17,500 people, which makes it one of the biggest outdoor music
  venues in the country. Its stacked white arches are one of the most famous
  sights in LA.

  You can bring your own food. Whether you can bring wine depends on the
  event, so check before you go. Bring a jacket, since it cools off after
  dark. The season runs through summer. Buy tickets ahead and take the Bowl
  shuttle or park-and-ride; parking near the Bowl is slow to leave.
