short: Bumpass Hell in Lassen Volcanic. Walk the boardwalk over bubbling mud pots and steam vents.
description: >
  Hike over a ridge and down into Bumpass Hell, then walk the boardwalk over
  boiling pools, bubbling mud pots and hissing steam vents in a valley
  painted yellow, orange and turquoise. It smells strongly of sulfur. Each
  pick the weirdest bubbling spot and vote on a winner. The photo to get:
  you on the boardwalk with the steam rising behind you.
about: >
  Bumpass Hell is named for Kendall Bumpass, who found it in the 1860s and
  later broke through the thin crust and badly burned his leg. That's why
  you stay on the boardwalk: the ground can be thin and scalding.

  It's the biggest hydrothermal area in the park, powered by the same
  volcanic system as Lassen Peak, which last erupted from 1914 to 1917. The
  trail is about three miles round trip and is snowed in much of the year,
  usually opening in mid-summer.

  The park ranges from about 5,600 to 10,400 feet, so take it slow if you
  feel the altitude. Cell service is limited, so download maps before you go.
