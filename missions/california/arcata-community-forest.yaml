short: Arcata Community Forest in Humboldt. Hike the redwoods and stand inside the biggest stump you find.
description: >
  Walk from Redwood Park into Arcata's community forest, through fern
  glades under tall redwoods. Hunt for the biggest old-growth stump you can
  find, and look for the square notches cut into its sides. Then get a photo
  of you standing inside it or in front of it for scale. Finish with a
  picnic back at the park.
about: >
  Arcata bought this forest in 1955, and it's known as the first city-owned
  community forest in California. The giant stumps are from the original
  old-growth redwoods logged in the late 1800s and early 1900s. The notches
  were cut so loggers could stand on springboards high above the swollen
  base of the tree. The redwoods around them today are second growth, and
  the city still manages the forest for careful, sustainable timber
  harvests.

  There are more than ten miles of trails. The short nature trail near
  Redwood Park has markers about the logging days. Watch for banana slugs on
  damp days. They're bright yellow and can be longer than your hand.
for_kids:
  short: Forest hunt! Find each thing.
  steps:
