short: Tour a hand-dug underground home in Fresno, with fruit trees growing up through skylights.
description: >
  Walk through the tunnels, rooms and courtyards that one man, Baldassare
  Forestiere, dug by hand under Fresno over 40 years to escape the summer
  heat. Fruit trees grow down in the pits and reach up through openings to
  the sunlight, some of them over a hundred years old. Take the one-hour
  guided tour, and each pick the room you'd want as your bedroom. Get a photo
  of the two of you under one of the skylights. Tours are seasonal and book
  up, so reserve ahead and arrive early.
for_kids:
