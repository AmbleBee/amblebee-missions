short: Forestiere Underground Gardens in Fresno. Tour a hand-dug home with trees growing to skylights.
description: >
  Walk through the tunnels, rooms and courtyards one man dug by hand under
  Fresno to escape the summer heat. Fruit trees grow down in the pits and
  reach up through openings to the sunlight. On the guided tour, each pick
  the room you'd want as your bedroom and explain why. The photo to get: you
  under one of the skylights, with leaves overhead.
about: >
  Baldassare Forestiere came from Sicily around 1901, bought land that
  turned out to be too hard for farming, and started digging instead. Over
  about 40 years he carved out underground rooms, a chapel, a fishpond and
  courtyards, using only hand tools. Down below, it stays much cooler than
  the Fresno summer above.

  Some of his citrus trees are still alive and fruiting more than a century
  later. The gardens are a California Historical Landmark. Tours are
  seasonal and book up, so reserve ahead.
