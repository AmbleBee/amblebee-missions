short: Petersen Automotive Museum in LA. Tour the galleries and the Vault, and pick your dream garage.
description: >
  Explore three floors of car history and LA car culture, then add the
  Vault, the basement full of rare classics, supercars, movie cars and
  presidential limousines. Pick three cars for your dream garage as you go,
  and if you came with others, compare lists over lunch. The photo to get:
  you in front of the wild red-and-steel building outside.
about: >
  The Petersen was founded in 1994 by Robert Petersen, the publisher of Hot
  Rod magazine. In December 2015 it reopened after a $125 million makeover by
  architects Kohn Pedersen Fox, who wrapped the bright red building in curving
  ribbons of stainless steel.

  Inside are more than 25 galleries over three floors, plus a kids' Discovery
  Center and a 1910 Model T you're allowed to sit in. It has shown famous
  cars like the Magnum, P.I. Ferrari, the 1989 Batmobile and a De Tomaso
  Pantera that belonged to Elvis. The Vault downstairs holds more than 300
  rare cars and motorcycles that rarely go on display. It needs its own
  ticket, so book it with your admission, and note that kids under 4 and
  strollers aren't allowed in the Vault.
