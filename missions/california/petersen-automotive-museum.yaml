short: Petersen Automotive Museum in LA. Tour the galleries and the Vault, and pick your dream garage.
description: >
  Explore three floors of car history and LA car culture, then add the
  Vault, the basement full of rare classics, supercars, movie cars and
  presidential limousines. Each pick three cars for your dream garage as you
  go, then compare lists over lunch. The photo to get: you in front of the
  wild red-and-steel building outside.
about: >
  The museum was founded in 1994 by Robert Petersen, the publisher of Hot
  Rod magazine. In 2015 it got its famous makeover: curving ribbons of
  stainless steel wrapped over a bright red building.

  The Vault holds hundreds of cars that rarely go on display, and it needs
  its own tour ticket, so book it with your admission.
