short: Zabriskie Point sunrise in Death Valley. Watch the badlands glow, then walk Badwater Basin.
description: >
  Get to Zabriskie Point before dawn and walk up to the overlook as the first
  light turns the folded, golden badlands pink and orange. Bring coffee and a
  blanket, since desert mornings are cold. Afterward, drive down to Badwater
  Basin and walk out onto the white salt flats, and each look up at the cliff
  to spot the tiny "sea level" sign high above you. The photo to get: you on
  the salt with that sign far overhead.
about: >
  Zabriskie Point is named for Christian Zabriskie, who ran the borax company
  famous for its 20-mule-team wagons. Badwater Basin, about 280 feet below
  sea level, is the lowest point in North America. The hottest air
  temperature ever recorded on Earth was measured nearby at Furnace Creek.

  The salt flats form a honeycomb of white crust; walk out past the busy
  first stretch to find the cleanest patterns. Go from fall to spring, since
  summer heat here is dangerous.
