short: Watch sunrise light up the golden badlands at Zabriskie Point. Then stand at Badwater Basin.
description: >
  Get to Zabriskie Point before dawn and walk up to the overlook as the first
  light turns the folded, golden badlands pink and orange, with the Panamint
  Mountains glowing across the valley. Bring coffee and a blanket, since desert
  mornings are cold. Afterward, drive down to Badwater Basin, the lowest
  point in North America, and walk out onto the white salt flats. Get a photo
  of the two of you at the sea-level sign high on the cliff above. Go from
  fall to spring; summer heat here is dangerous.
for_kids:
