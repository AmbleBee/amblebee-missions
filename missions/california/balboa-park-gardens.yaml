short: Balboa Park in San Diego. Crawl its free gardens, from the lily pond to the cactus, and crown a winner.
description: >
  Start at the Botanical Building reflected in the lily pond, then crawl
  from garden to garden: the tiled Alcazar Garden under the California
  Tower, the little sunken Zoro Garden, and across the footbridge to the
  Rose Garden and the Desert Garden. Score each one out of ten as you go,
  and crown a winner. The photo to get: the two of you in the winning
  garden, then the Botanical Building upside down in the lily pond.
about: >
  Most of what you'll see was built for two world's fairs. The Botanical
  Building, one of the largest wooden lath structures in the world, went up
  for the 1915 Panama-California Exposition and holds thousands of plants.
  The Alcazar Garden is modeled on the gardens of the Alcázar in Seville.

  The Zoro Garden has the best story: at the 1935 exposition it was a
  "nudist colony" exhibit that fairgoers paid to peek at. Today it's a quiet
  butterfly garden.

  The Inez Grant Parker Memorial Rose Garden and the Desert Garden sit side
  by side across the Park Boulevard footbridge. Roses peak in spring, and
  the Desert Garden blooms in late winter and spring. All of the gardens are
  free.
for_kids:
  short: Garden hunt! Find each thing.
  steps:
    - The big lily pond
    - A fountain
    - A butterfly or a bee
    - A giant cactus
    - A selfie in your favorite garden!
