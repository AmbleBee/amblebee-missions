short: Crawl Balboa Park's free gardens. Each crown your favorite one.
description: >
  Start at the Botanical Building, the big 1915 wooden lath house reflected in
  the lily pond, then wander from garden to garden: the tiled Spanish-style
  Alcazar Garden under the California Tower, the little sunken Zoro Garden, and
  across the bridge to the Rose Garden and Desert Garden. They're all free. Each
  crown one garden the winner and get a photo of the two of you in it.
for_kids:
