short: California Science Center in LA. Stand under Space Shuttle Endeavour, ready to launch.
description: >
  See the real Space Shuttle Endeavour standing upright in launch position,
  with its giant orange fuel tank and rocket boosters attached. Stand at the
  bottom and look up, and get your photo with the whole stack behind you.
  Then explore the science galleries and each find the exhibit that
  surprised you most.
about: >
  Endeavour flew 25 missions into space before it retired in 2011. In 2012
  it was slowly towed through the streets of Los Angeles to get here, and
  crowds lined the route.

  It's the only complete shuttle stack (orbiter, fuel tank and boosters) on
  display anywhere. General admission to the science center is free; the
  shuttle gallery uses timed reservations, so book ahead.
for_kids:
  short: Space hunt! Find each thing.
  steps:
    - The giant space shuttle
    - The big orange tank
    - A rocket or a plane
    - An experiment you tried
    - A selfie with the shuttle!
