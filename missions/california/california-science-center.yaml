short: Stand under Space Shuttle Endeavour, upright and ready to launch. Then explore the science halls.
description: >
  See the real Space Shuttle Endeavour standing 20 stories tall in launch
  position, with its orange fuel tank and rocket boosters attached. It's the
  only complete shuttle stack on display anywhere. Then explore the free
  science galleries and each find the exhibit that surprised you most. General
  admission is free; the shuttle gallery uses timed reservations, so book ahead.
