short: Watch the sea lions at La Jolla Cove from the boardwalk. Count them and find a pup.
description: >
  Walk the coastal path above La Jolla Cove and watch the sea lions sprawled on
  the rocks, barking, napping and squabbling. Count how many you can see, try to
  spot a pup, and each pick the laziest one. Watch from the boardwalk and stay
  well back; they're wild, protected, and the big males do charge people who
  get close. No selfies with them. Then walk on to the Children's Pool to see
  the harbor seals.
