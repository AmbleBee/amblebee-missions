short: La Jolla Cove in San Diego. Watch the sea lions from the cliff path, count them and find a pup.
description: >
  Walk the coastal path above La Jolla Cove and watch the sea lions sprawled
  on the rocks, barking, napping and squabbling. Count how many you can see,
  try to spot a pup, and each pick the laziest one. The photo to get: you at
  the railing with the sea lion rocks below. Then walk on to the Children's
  Pool to see the harbor seals.
about: >
  The sea lions here are wild and protected, so watch from the path and
  stay well back. The big males will charge people who get too close, and
  no selfies with them. Pups are born in early summer.

  The Children's Pool was built in 1931 as a calm swimming spot for kids,
  but harbor seals took it over and now use it as a nursery. The beach is
  closed to people during their pupping season in winter and spring. The
  water off the cove is a protected reserve, and you may spot bright orange
  garibaldi, California's state marine fish, from the rocks.
