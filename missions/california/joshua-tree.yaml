short: Joshua Tree National Park. Climb Hidden Valley's boulders, find Skull Rock, then stay for stars.
description: >
  Walk the Hidden Valley loop through giant boulder piles and spiky Joshua
  trees, then stop at Skull Rock and get your photo copying its face. Each
  find the weirdest Joshua tree you can and give it a name. Stay through
  sunset and wait for full dark. On a moonless night, the Milky Way is
  incredible.
about: >
  Joshua trees aren't really trees; they're giant yuccas. Mormon settlers
  are said to have named them in the 1850s because the branches looked like
  the biblical Joshua raising his arms. The park sits where two deserts
  meet, the higher Mojave and the lower Colorado.

  Joshua Tree is an International Dark Sky Park. There's no food or gas
  inside, so bring plenty of water, snacks and warm layers. Skip summer
  afternoons, when the heat is dangerous.
