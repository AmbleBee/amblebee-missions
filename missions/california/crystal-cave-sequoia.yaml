short: Walk down to Crystal Cave in Sequoia and tour a glittering marble cave. Book tickets ahead.
description: >
  Hike a steep half mile down through the forest to a giant spider-web gate,
  then follow a guide into a cool marble cave full of polished walls,
  stalactites and shimmering formations. On the 50-minute tour, each find the
  strangest shape you can and name it. Bring a jacket, since it's chilly
  inside year-round. Tickets are sold online only, at least a day and a half
  ahead (none at the cave), and tours run only from late spring through
  early fall.
