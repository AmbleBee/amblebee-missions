short: Crystal Cave in Sequoia National Park. Tour a glittering marble cave behind a spider-web gate.
description: >
  Hike a steep half mile down through the forest to a giant spider-web gate,
  then follow a guide into a cool marble cave full of polished walls,
  stalactites and shimmering formations. On the tour, each find the
  strangest shape you can and give it a name. The photo to get: you at the
  spider-web gate before you head in.
about: >
  Two park workers found Crystal Cave in 1918 while fishing nearby. It's
  carved from marble, which is why the walls look polished and glittery,
  and miles of passages have been mapped beyond the part you tour. The
  spider-web gate was built in the 1940s with gaps wide enough for bats to
  fly through.

  It stays around 50°F inside all year, so bring a jacket. Tickets are sold
  online only, well ahead (none at the cave), and tours run from late
  spring through early fall.
for_kids:
