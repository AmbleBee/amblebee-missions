short: Santa Barbara's Funk Zone. Walk the tasting rooms and murals at golden hour.
description: >
  Wander the Funk Zone, a few blocks of old warehouses near the beach now
  packed with tasting rooms, small breweries, galleries and murals. Visit two
  or three tasting rooms, and at each one pick a glass for the other. Find
  your favorite mural for a photo of the two of you, then walk out onto
  Stearns Wharf as the light goes golden. End with dinner by the water.
about: >
  The Funk Zone was once Santa Barbara's industrial and fishing area, full
  of boat shops and warehouses, and artists and winemakers moved in over the
  last few decades. Many tasting rooms here pour wine from the Santa Ynez
  Valley and Santa Rita Hills, inland from town.

  Stearns Wharf dates to 1872, making it one of the oldest working wooden
  wharves in California. Everything is walkable, so leave the car parked.
