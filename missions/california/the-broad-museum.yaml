short: The Broad in downtown LA. Free contemporary art, from giant balloon sculptures to mirror rooms.
description: >
  Walk through one of LA's most fun art museums, full of contemporary art
  you can't stop looking at: giant shiny balloon sculptures, a huge table
  and chairs that make you feel tiny, and bright pop art. Each pick the piece
  you'd steal if you could and plan the heist out loud. The photo to get:
  you under the giant table. Then walk across the street to see the silver
  curves of Walt Disney Concert Hall.
about: >
  The Broad opened in 2015 to show the collection of Eli and Edythe Broad,
  about 2,000 works of modern and contemporary art, with free general
  admission. The building's white honeycomb shell is called "the veil."

  Look for Jeff Koons's shiny balloon sculptures, Robert Therrien's giant
  Under the Table, and Yayoi Kusama's Infinity Mirrored Room, where you stand
  in a room of endless lights for about a minute. Reserve free timed
  tickets ahead and book the mirror room separately. Check the hours, since
  it's closed some days.
for_kids:
