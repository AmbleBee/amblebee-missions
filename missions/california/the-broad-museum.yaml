short: Explore The Broad's free contemporary art in downtown LA, from giant balloon dogs to mirror rooms.
description: >
  Walk through one of LA's most fun art museums, free to enter, full of
  contemporary art you can't stop looking at: giant shiny balloon sculptures,
  a huge table and chairs that make you feel tiny, and bright pop art. Each
  pick the piece you'd steal if you could. Reserve free timed tickets ahead.
  If you can, also book the Infinity Mirror Room, where you stand in a
  glittering room of endless lights for a minute. Then walk across the street
  to see the silver curves of Walt Disney Concert Hall. Closed Mondays.
