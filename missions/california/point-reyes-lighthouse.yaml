short: Point Reyes Lighthouse and elephant seals. Walk down to the windswept light, then the seals.
description: >
  Drive out to the far tip of Point Reyes and walk down the long staircase
  to the old lighthouse perched on the cliffs. Count the steps on the way
  down and see who guesses closest. Then stop at the Elephant Seal Overlook
  near Chimney Rock to watch the huge seals on the beach below. The photo to
  get: you on the windy cliff with the lighthouse below.
about: >
  Point Reyes is one of the windiest and foggiest places on the Pacific
  coast. The lighthouse went up in 1870, and its giant glass lens was made
  in France. The staircase down to it has about 300 steps, and the climb back
  up is the hard part.

  Elephant seals came back to Point Reyes in the 1970s after being hunted
  nearly to extinction. In winter you'll see bulls fighting and newborn
  pups, and gray whales pass offshore. Bring binoculars and layers. On busy
  winter weekends a shuttle may be required, and the lighthouse stairs keep
  limited hours.
