short: Walk down to the windswept Point Reyes Lighthouse, then watch elephant seals at Chimney Rock.
description: >
  Drive out to the far tip of Point Reyes, one of the windiest, foggiest
  places on the Pacific coast, and walk down the long staircase to the old
  lighthouse perched on the cliffs. Then stop at the Elephant Seal Overlook
  near Chimney Rock to watch the huge seals on the beach below; in winter,
  you'll see bulls fighting and newborn pups. Watch for whales passing
  offshore too, and get a photo of you on the windy cliff. Bring
  binoculars and layers. The lighthouse stairs keep limited hours.
