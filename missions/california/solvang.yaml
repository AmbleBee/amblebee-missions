short: Solvang, California's Danish village. Wander the windmills and bakeries, split an aebleskiver.
description: >
  Spend a day in a little town built to look like Denmark, with windmills,
  half-timbered buildings and Danish bakeries on every block. Split a plate
  of aebleskiver (round Danish pancake puffs) and a fresh kringle, and find
  the copy of Copenhagen's Little Mermaid statue. Each pick the windmill
  you'd live in. The photo to get: you in front of the biggest windmill.
about: >
  Danish Americans from the Midwest founded Solvang in 1911, and the name
  means "sunny field." The storybook Danish look came later, in the
  mid-1900s, and it turned the town into a tourist favorite.

  Look for the small museum about Hans Christian Andersen, author of The
  Little Mermaid. The Santa Ynez Valley wineries are a few minutes away if
  you want to add a tasting.
for_kids:
