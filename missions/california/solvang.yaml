short: Wander Solvang's Danish village of windmills and bakeries. Split an aebleskiver.
description: >
  Spend a day in a little town built to look like Denmark, with windmills,
  half-timbered buildings and Danish bakeries on every block. Split a plate of
  aebleskiver (round Danish pancake puffs) and a fresh kringle, browse the
  shops, and find the copy of Copenhagen's Little Mermaid statue. Each pick the
  windmill you'd live in. Get a photo of you in front of the
  biggest windmill. The Santa Ynez Valley wineries are just a few minutes
  away if you want to add a tasting.
for_kids:
  short: Village hunt! Find each thing.
  steps:
    - A windmill
    - A Danish pancake ball
    - The little mermaid
    - A wooden shoe
    - A selfie with a windmill!
