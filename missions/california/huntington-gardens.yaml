short: Each pick a garden at the Huntington and lead the other through it. Desert, Japanese, Chinese?
description: >
  Spend a slow half-day at the Huntington. Look at the map, and each secretly
  pick one garden "world" to lead the other through: the spiky Desert Garden,
  the Japanese Garden with its moon bridge, the Chinese Garden's pavilions and
  lake, or the Rose Garden. Give your best tour-guide pitch for why yours is the
  best. Finish in the art galleries to find The Blue Boy, and get a photo of the
  two of you in your favorite spot of the day.
for_kids:
  short: Garden explorer! Find each thing.
  steps:
    - A giant spiky cactus
    - A curved bridge
    - A fish in a pond
    - The boy in the blue painting
    - A selfie in your favorite garden!
