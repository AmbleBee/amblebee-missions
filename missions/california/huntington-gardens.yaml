  name: The Huntington Library, Art Museum, and Botanical Gardens
  area: San Marino, near Pasadena
  address: 1151 Oxford Rd, San Marino, CA 91108
  coords: [34.12910, -118.11440]  # APPROX: set at the visitor entrance before publishing
