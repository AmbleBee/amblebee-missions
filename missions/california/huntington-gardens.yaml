short: The Huntington in San Marino. Each pick a garden and lead your group on a tour of it.
description: >
  Look at the map and each secretly pick one garden to lead everyone
  through: the spiky Desert Garden, the Japanese Garden with its moon
  bridge, the Chinese Garden's pavilions and lake, or the Rose Garden. Give
  your best tour-guide pitch for why yours is the best. Finish in the art
  galleries to find The Blue Boy. The photo to get: you in your favorite
  spot of the day.
about: >
  Railroad tycoon Henry E. Huntington founded the Huntington in 1919 on his
  estate. Today the gardens cover more than 120 acres, and the library holds
  treasures like a Gutenberg Bible.

  The Blue Boy, painted by Thomas Gainsborough around 1770, was bought in
  1921 for a record price and is the museum's most famous painting. The
  Desert Garden is one of the oldest and biggest collections of cactus and
  succulents in the world, and the Chinese Garden is called Liu Fang Yuan,
  the Garden of Flowing Fragrance. Tickets are timed, so book ahead.
