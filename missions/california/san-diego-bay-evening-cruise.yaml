short: San Diego Bay evening cruise. Watch the skyline and the Coronado Bridge light up from the water.
description: >
  Board an evening harbor cruise or a dinner cruise from the downtown
  waterfront and glide around San Diego Bay as the sun sets. Pass the giant
  Navy ships, the USS Midway and the sweeping Coronado Bridge, and see who
  spots the first sea lion lounging on a buoy. The photo to get: you at the
  rail with the city lights behind you.
about: >
  San Diego is a Navy town. The USS Midway, now a museum on the waterfront,
  was one of the longest-serving aircraft carriers of the 20th century, and
  North Island, across the bay, is known as the birthplace of naval
  aviation.

  The Coronado Bridge opened in 1969. Its curve lets it rise high enough for
  aircraft carriers to pass underneath. Several companies run cruises; book
  ahead for dinner cruises and bring a jacket.
