short: Cruise San Diego Bay at dusk as the city skyline and the Coronado Bridge light up.
description: >
  Board an evening harbor cruise or a dinner cruise from the downtown
  waterfront and glide around San Diego Bay as the sun sets. Pass the giant
  Navy ships, the USS Midway and the sweeping Coronado Bridge, and watch for
  sea lions lounging on the buoys. Then watch the skyline light up across the
  water, and get a photo of you at the rail with the city lights
  behind you. Several companies run cruises; book ahead for dinner cruises
  and bring a jacket, since it's chilly on the water at night.
for_kids:
