short: Ride the 1924 Giant Dipper at the Santa Cruz Beach Boardwalk, then grab a caramel apple.
description: >
  Spend a day at California's classic seaside amusement park, right on the
  sand. Ride the Giant Dipper, a wooden roller coaster from 1924, and the
  century-old Looff carousel, where you can still try to grab the brass ring.
  Win each other a prize at the games, share a caramel apple or salt water
  taffy, and walk out on the wharf to see the sea lions under it. Get a photo
  of you on the beach with the coaster behind you. Rides run daily
  in summer and mostly on weekends the rest of the year.
