short: Santa Cruz Beach Boardwalk. Ride the 1924 Giant Dipper, then grab a caramel apple on the sand.
description: >
  Ride the Giant Dipper, a wooden roller coaster from 1924, then hop on the
  old carousel and try to grab the brass ring as you go around. Win each
  other a prize at the games, share a caramel apple or saltwater taffy, and
  walk out on the wharf to see the sea lions underneath. The photo to get:
  you on the beach with the coaster behind you.
about: >
  The Boardwalk opened in 1907 and is the oldest surviving amusement park in
  California. The Giant Dipper and the 1911 Looff carousel are both National
  Historic Landmarks, and the carousel is one of the few left where you can
  still try for the brass ring. Movie fans may know the Boardwalk from The
  Lost Boys.

  Rides run daily in summer and mostly on weekends the rest of the year.
