short: Hearst Castle in San Simeon. Tour the hilltop palace and find the famous Neptune Pool.
description: >
  Ride the bus up the hill to the over-the-top estate newspaper tycoon
  William Randolph Hearst built above the coast, packed with art and
  treasures from around the world. Walk through the giant dining hall, then
  see the gold-tiled indoor Roman Pool and the famous outdoor Neptune Pool.
  Each pick the room you'd move into. The photo to get: you by the Neptune
  Pool. On the drive, watch the hills for zebras.
about: >
  Architect Julia Morgan designed the estate, and work went on from 1919
  until 1947. Hearst called it La Cuesta Encantada, "the Enchanted Hill,"
  and hosted Hollywood stars here. His family gave it to the state in the
  1950s.

  Hearst kept a private zoo on the hill, and zebras descended from it still
  graze the ranchland along Highway 1. Just up the coast, the elephant seal
  viewing area at Piedras Blancas is a great free stop. Reserve tour
  tickets ahead.
