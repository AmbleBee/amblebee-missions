short: Sequoia National Park. Stand under General Sherman, the biggest tree on Earth, then climb Moro Rock.
description: >
  Start early and walk the path down to General Sherman, the largest living
  tree on Earth, before the crowds arrive. Each guess how old it is before
  you read the sign, and closest wins. The photo to get: you at the base
  looking tiny against the trunk. Then head over to Moro Rock and climb the
  carved stone steps to the top of the granite dome for a huge view over
  the mountains.
about: >
  General Sherman is about 275 feet tall and somewhere around 2,200 years
  old. It isn't the tallest or widest tree, but it has more wood than any
  other living tree on Earth. A settler named it in 1879 after the Civil War
  general.

  The path to the tree is paved but steep on the way back up. Moro Rock's
  stairway has more than 350 steps with railings, built into the granite in
  the 1930s, and climbs to about 6,700 feet. In summer a free shuttle
  connects the stops. There's a park entrance fee, and winter snow can close
  roads.
