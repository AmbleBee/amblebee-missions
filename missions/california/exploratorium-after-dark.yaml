short: Play with hundreds of science exhibits at the Exploratorium's adults-only After Dark night.
description: >
  Go to the Exploratorium's After Dark night, when the hands-on science museum
  on the Embarcadero is just for adults (18 and up), with a bar and special
  themed programs. Play with hundreds of exhibits: optical illusions, giant
  bubbles, a pitch-black crawl-through Tactile Dome (book that separately),
  and machines that make your voice weird. Each find the exhibit that blows
  your mind and show it to the other. Get a photo of the two of you in one of
  the illusions. Check the schedule and buy tickets ahead.
