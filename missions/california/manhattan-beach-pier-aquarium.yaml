short: Walk to the end of Manhattan Beach Pier. Visit the tiny free aquarium at the tip.
description: >
  Walk the whole length of the pier, watching the surfers below and keeping an
  eye out for dolphins. At the very end, step into the little Roundhouse
  Aquarium for touch pools, sharks, an octopus and jellyfish. It's free, but a
  small donation helps. No food or drinks inside, so finish your snacks
  first. On the walk back, get a photo with the whole pier behind you.
