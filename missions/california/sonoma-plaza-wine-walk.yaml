short: Walk between the tasting rooms around Sonoma's historic plaza. Each pick a glass for the other.
description: >
  Leave the car parked and spend an afternoon walking around Sonoma's
  shady historic plaza, ringed by more than two dozen tasting rooms, cafés and
  old adobe buildings, including the last of California's Spanish missions.
  Visit two or three tasting rooms, and at each one pick a glass for the other
  person to try. Pack or buy a picnic and eat it on the plaza lawn, and get a
  photo of the two of you by the duck pond. No driving needed between tastings,
  but plan your ride home.
