  name: Venice Canals Historic District
  area: Venice, Los Angeles
  coords: [33.98420, -118.46660]  # APPROX: set at a canal bridge (Dell Ave) before publishing
short: Venice Canals in LA. Wander the little bridges and each pick the house you'd live in.
description: >
  Leave the noise of the boardwalk behind and wander the quiet canals a few
  blocks inland: arched footbridges, ducks, little rowboats and every style
  of house right on the water. Each pick the house you'd move into and say
  why. The photo to get: you on the prettiest bridge. Then walk back to
  Venice Beach for the sunset.
about: >
  Developer Abbot Kinney built Venice of America in 1905, with canals,
  gondolas and Italian-style buildings modeled on Venice, Italy. In 1929 most
  of the canals were filled in and paved over for cars, and only a handful
  survived.

  The surviving canals were listed on the National Register of Historic Places
  in 1982, then restored and reopened in 1993. These are people's front yards,
  so keep it quiet and stay on the public walkways.
for_kids:
