short: Hotel del Coronado near San Diego. Walk the beach at sunset, then toast at the Del.
description: >
  Dress up a little and walk the wide, flat beach in front of the Del as
  the sun sets, shoes in hand. Then wander the grand old lobby and finish
  with a drink at the hotel. Each make a toast to something from this year.
  The photo to get: the two of you on the sand with the red turrets glowing
  behind you.
about: >
  The Hotel del Coronado opened in 1888 and is one of the last great
  wooden seaside resorts in the country. Marilyn Monroe filmed Some Like It
  Hot here, and Wizard of Oz author L. Frank Baum spent winters in Coronado.
  The hotel even has its own ghost story, about a guest named Kate Morgan
  who checked in in 1892 and never checked out.

  You don't need to stay at the hotel to walk the beach or have a drink. In
  winter, a seaside ice rink makes it even better.
