short: Walk the beach at the Hotel del Coronado at sunset, then toast with a drink at the Del.
description: >
  Dress up a little and head to the Del, the grand red-roofed hotel on the sand
  since 1888. Walk the wide, flat beach out front as the sun sets, shoes in hand,
  then wander the historic lobby and finish with a drink at the hotel. Get a
  photo of the two of you on the beach with the red turrets glowing behind you.
  In winter, the hotel's seaside ice rink makes it even better.
