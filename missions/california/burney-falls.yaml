short: Walk down to Burney Falls, where water pours straight out of the cliff in hundreds of streams.
description: >
  Walk down the trail to the base of Burney Falls, a 129-foot curtain of water
  where much of the flow seeps straight out of the mossy rock wall in hundreds
  of little streams. Feel the mist, then loop around the trail along the creek
  and back up the other side. Get a photo of the two of you with the whole
  falls behind you. The flow stays strong all year, since it's fed by
  underground springs. The falls loop reopened in 2025 after a long rebuild.
  There's a state park day-use fee.
for_kids:
  short: Waterfall hunt! Find each thing.
  steps:
    - The big waterfall
    - Water coming out of rocks
    - Mist on your face
    - A fish or a duck
    - A selfie by the falls!
