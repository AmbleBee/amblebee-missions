short: Burney Falls near Burney. Walk down to the falls where water pours straight out of the cliff.
description: >
  Walk down the trail to the base of Burney Falls, a 129-foot curtain of
  water where much of the flow seeps straight out of the mossy rock wall in
  hundreds of little streams. Stand close enough to feel the mist, then
  loop along the creek and back up the other side. Each count how many
  separate streams you can see coming out of the rock. The photo to get:
  you with the whole falls behind you.
about: >
  Burney Falls is fed by underground springs, so it runs strong all year,
  even in late summer. Teddy Roosevelt is often quoted calling it "the
  eighth wonder of the world," though no one has ever found where he said
  it.

  The falls loop trail reopened in 2025 after a long rebuild. There's a
  state park day-use fee, and the parking lots fill on summer weekends.
for_kids:
  short: Waterfall hunt! Find each thing.
  steps:
    - The big waterfall
    - Water coming out of rocks
    - Mist on your face
    - A fish or a duck
    - A selfie by the falls!
