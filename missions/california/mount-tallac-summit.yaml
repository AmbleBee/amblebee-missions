short: Mount Tallac at South Lake Tahoe. Climb past alpine lakes to a summit over the whole lake.
description: >
  Climb the peak that towers over Lake Tahoe's southwest shore, past
  Floating Island Lake and Cathedral Lake, then make the last rocky push up
  the ridge. Each guess how much of the lake you'll see from the top before
  you get there. From the summit, nearly all of Tahoe spreads out on one
  side and Desolation Wilderness's granite and lakes on the other. The photo
  to get: you at the summit with the whole lake below.
about: >
  Mount Tallac rises to about 9,700 feet. In late spring, snow lingers in
  two crossing gullies on its face, making a giant cross you can see from
  across the lake.

  The trail is roughly 10 miles round trip with more than 3,000 feet of
  climbing, a full and steep day. Fill out the free self-serve Desolation
  Wilderness day permit at the trailhead. Start early, carry plenty of water
  and layers, and turn around if storms build.
steps:
