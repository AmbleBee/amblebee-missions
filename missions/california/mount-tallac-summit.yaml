short: Climb Tahoe's big peak past two alpine lakes. Photo with the whole lake below you.
description: >
  Mount Tallac is the peak that towers over the southwest shore of Lake Tahoe, and the trail
  to the top is a full, steep day: roughly 10 miles round trip with over 3,000 feet of climbing.
  Fill out the free self-serve Desolation Wilderness day permit at the trailhead, then climb
  past Floating Island Lake and Cathedral Lake before the last rocky push up the ridge. From
  the summit you can see nearly all of Lake Tahoe on one side and Desolation's granite and
  lakes on the other. Get a summit photo with the lake stretched out below you. Start early,
  carry plenty of water and layers, and turn around if storms build.
