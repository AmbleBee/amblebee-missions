short: Walk the redwoods of Muir Woods first thing in the morning, while the forest is still quiet.
description: >
  Book the earliest parking reservation and walk into an old-growth redwood
  forest just a few miles from the Golden Gate Bridge, while it's still misty
  and quiet. Follow the boardwalk along Redwood Creek through Cathedral Grove,
  where visitors are asked to stay silent, and listen to the forest together.
  Get a photo of you looking up at the tallest trees. Driving in
  needs a parking reservation (it sells out), and there's an entrance fee;
  hikers and rideshare don't need one.
for_kids:
