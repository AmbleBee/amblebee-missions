short: Muir Woods near Mill Valley. Walk the redwoods first thing in the morning, while it's quiet.
description: >
  Book the earliest parking reservation and walk into an old-growth redwood
  forest a few miles from the Golden Gate Bridge, while it's still misty and
  quiet. Follow the boardwalk along Redwood Creek to Cathedral Grove, where
  visitors are asked to stay silent, and stand together for one full minute
  just listening. The photo to get: you looking straight up at the tallest
  trees.
about: >
  In 1908, a local couple, William and Elizabeth Kent, donated the land to
  save it from logging, and President Theodore Roosevelt made it a national
  monument. They asked that it be named for naturalist John Muir. In 1945,
  delegates founding the United Nations held a memorial for President
  Franklin Roosevelt in Cathedral Grove.

  The tallest trees here are about 250 feet. Driving in needs a parking
  reservation, which sells out, and there's an entrance fee.
for_kids:
  short: Redwood hunt! Find each thing.
  steps:
    - A giant redwood
    - A tree you can stand inside
    - The creek
    - A banana slug
    - A selfie in the forest!
