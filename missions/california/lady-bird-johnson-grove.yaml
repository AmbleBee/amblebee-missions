place:
  name: Lady Bird Johnson Grove trailhead, Redwood National and State Parks
  area: Bald Hills Road, near Orick
  coords: [41.30348, -124.01833]
  website: https://www.nps.gov/places/lbjtrailhead.htm
  links:
    - label: alltrails
      url: https://www.alltrails.com/trail/us/california/lady-bird-grove-trail
short: Walk among old-growth redwoods hundreds of feet tall. Lie on the ground and look straight up.
description: >
  Drive three miles up Bald Hills Road and walk the easy loop through a grove of
  ancient redwoods that were never logged. Only a tiny share of the world's
  old-growth redwood forest is left, and much of it is right here. Find the
  biggest tree on the loop, stand at its base for a photo that shows how small
  you are, then lie back and look straight up its trunk. Go early or late if
  there's fog for the most magical light. The lot is too small for RVs or
  trailers.
for_kids:
  short: Giant tree hunt! Find each thing.
  steps:
    - The biggest tree you can find
    - A fern
    - A banana slug
    - The wooden bridge
    - A selfie with a giant tree!
