short: Lady Bird Johnson Grove near Orick. Walk the old-growth redwoods, then lie down and look up.
description: >
  Drive up Bald Hills Road and walk the easy loop through a grove of ancient
  redwoods that were never logged. Find the biggest tree on the loop and get
  a photo of you at its base, tiny against the trunk. Then lie back on the
  ground, look straight up, and each guess how tall it is. Go early or late
  if there's fog for the most magical light.
about: >
  More than 90 percent of the world's original old-growth redwood forest
  was logged, and much of what's left is protected right here. The grove is
  named for First Lady Lady Bird Johnson, who championed protecting
  America's wild places. It was dedicated in 1969, with President Nixon and
  former President Johnson both there.

  The loop is about a mile and a half on a gentle trail. The parking lot is
  too small for RVs or trailers.
