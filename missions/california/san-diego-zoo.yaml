short: San Diego Zoo in Balboa Park. Ride the Skyfari and find the animal most like each other.
description: >
  Ride the Skyfari aerial tram over the treetops, take the guided bus tour
  to get your bearings, then wander the canyons on foot. Each find the
  animal that's most like someone else in your group and explain why over a
  snack. The photo to get: your group with the animal that won.
about: >
  The zoo got its start in 1916, after Dr. Harry Wegeforth heard a lion
  roaring from an exhibit left over from the world's fair and said San Diego
  should have a zoo. It grew into one of the most famous zoos in the world,
  on about 100 acres of canyons and mesas.

  It's hilly, so wear comfortable shoes. Go early on a weekday, buy tickets
  ahead, and check the daily schedule for keeper talks.
for_kids:
  short: Zoo safari! Find each animal.
  steps:
    - An animal from the sky tram
    - A panda or a polar bear
    - Something with stripes
    - An animal that is sleeping
    - A selfie with your grown-up!
