short: Taste wine in the Sierra foothills, then go meet the shaggy Highland cattle on the ranch.
description: >
  Spend an afternoon at a small family winery in the Sierra foothills, where
  a guided tasting comes with a vineyard tour and a visit to the ranch's herd
  of shaggy, long-horned Highland cattle. Taste your way through the flight
  and each pick a favorite bottle, then head out to the pasture to meet the
  cows up close. Get a photo of the two of you with the fluffiest one. Tastings
  are by appointment and have run on weekends only, so book ahead. It's 21 and
  up for the wine; they've also offered a cattle-only visit for families.
