short: Saluti Cellars in Somerset. Taste foothill wine, then meet the shaggy Highland cattle.
description: >
  Spend an afternoon at a small family winery in the Sierra foothills,
  where a guided tasting comes with a vineyard tour and a visit to the
  ranch's herd of shaggy, long-horned Highland cattle. Taste your way
  through the flight and each pick a favorite bottle, then head out to the
  pasture to meet the cows. The photo to get: you with the fluffiest one.
about: >
  Highland cattle come from the Scottish Highlands, where their long, shaggy
  coats and big horns help them handle cold, wet weather. They're one of
  the oldest cattle breeds in the world, and famously gentle.

  Somerset is in the Fair Play wine area, one of the highest-elevation wine
  regions in California, with small family wineries along winding back
  roads. Tastings here are by appointment and have run on weekends only, so
  book ahead. It's 21 and up for the wine; the ranch has also offered a
  cattle-only visit for families.
