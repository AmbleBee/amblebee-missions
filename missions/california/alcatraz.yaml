short: Alcatraz Island in San Francisco. Tour the cellhouse and find the cells from the 1962 escape.
description: >
  Ride the ferry across the bay to the old prison island and take the
  cellhouse audio tour, told by former guards and inmates. Find the cells
  from the famous 1962 escape and spot the fake air vents they dug out with
  spoons. The photo to get: one of you inside a cell, looking out through
  the bars. Then step outside and look back at the city skyline from the
  island.
about: >
  Alcatraz was a federal prison from 1934 to 1963 and held some of the
  country's most notorious inmates, including Al Capone. In June 1962, Frank
  Morris and brothers John and Clarence Anglin slipped out through tunnels
  they'd dug behind their cells, leaving dummy heads made of plaster and
  real hair in their beds. They were never found.

  From 1969 to 1971, Native American activists occupied the island, and
  their painted messages are still visible today. The lighthouse was the
  first on the West Coast.

  Tours often sell out, so book ahead through the official link on the
  National Park Service site and avoid resellers. The walk up to the
  cellhouse is steep, and it's windy on the water, so bring a jacket.
