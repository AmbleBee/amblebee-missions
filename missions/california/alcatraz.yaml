short: Take the ferry to Alcatraz. Tour the cellhouse and find the cell from the famous escape.
description: >
  Ride the ferry across the bay to the old federal prison island and take the
  cellhouse audio tour, told by former guards and inmates. Find the cells from
  the 1962 escape attempt, step into a cell for a photo, and look back at the
  city skyline from the island. Bring a jacket; it's windy on the water. Tours
  sell out, so book the ferry ahead.
