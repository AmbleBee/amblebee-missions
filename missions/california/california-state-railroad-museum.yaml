short: Climb aboard giant locomotives at the California State Railroad Museum in Old Sacramento.
description: >
  Walk among huge restored steam locomotives and passenger cars, then climb
  aboard a few, including a rocking sleeper car that feels like it's moving
  through the night. Learn how the railroad was built over the Sierra, and
  each pick the train you'd want to ride across the country. Get a photo of
  the two of you in front of the biggest engine. Check the schedule for
  excursion train rides along the river. Then walk the wooden sidewalks of Old
  Sacramento for saltwater taffy.
for_kids:
