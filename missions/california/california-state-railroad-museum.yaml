short: California State Railroad Museum in Old Sacramento. Climb aboard giant steam locomotives.
description: >
  Walk among huge restored steam locomotives and passenger cars, then climb
  aboard a few, including a sleeping car that rocks and clatters like it's
  rolling through the night. Each pick the train you'd want to ride across
  the country and plan the trip out loud. The photo to get: you in front of
  the biggest engine in the hall. Then walk the wooden sidewalks of Old
  Sacramento for saltwater taffy.
about: >
  The first transcontinental railroad started right here: the Central
  Pacific broke ground in Sacramento in 1863, and its tracks met the Union
  Pacific's in Utah in 1869. The museum tells the story of building the
  line over the Sierra Nevada, mostly by thousands of Chinese workers.

  Look for the Southern Pacific "cab-forward," a giant locomotive built with
  the engineer's cab in front so crews wouldn't choke on smoke in the
  mountain tunnels. On some weekends, excursion trains run along the river,
  so check the schedule.
