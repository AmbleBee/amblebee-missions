short: Santa Monica Pier. Find the Route 66 End of the Trail sign and ride the Ferris wheel at sunset.
description: >
  Walk out onto the pier and find the "End of the Trail" sign, the symbolic
  finish line of Route 66. Ride the Ferris wheel around sunset and watch its
  lights come on over the water, then play one midway game each and loser
  buys something fried. The photo to get: you under the Route 66 sign.
  Finish with a walk down to the sand.
about: >
  The Santa Monica Pier opened in 1909, built mostly to carry sewer pipes out
  past the breakers. The fun came later: the Looff Hippodrome, listed on the
  National Register of Historic Places, still houses a carousel from 1922, and
  the pier has turned up in movies from The Sting to Forrest Gump.

  Pacific Park opened on the pier in 1996, and its Ferris wheel runs on solar
  panels, with light shows after dark. Route 66 officially ended a little
  inland, but the "End of the Trail" sign has made the pier the road's
  unofficial finish line since 2009.
