short: Find the Route 66 "End of the Trail" sign. Ride the Ferris wheel at sunset.
description: >
  Walk out onto the pier and find the "End of the Trail" sign, the symbolic
  finish line of Route 66, for a photo. Ride the solar-powered Ferris wheel
  around sunset and watch its lights come on over the water, play one midway
  game each, and grab something fried. Finish with a walk down to the sand.
