short: Catalina Island. Ferry to Avalon and hike from the Wrigley garden up to the ridge.
description: >
  Catch a morning boat to Avalon and head 1.5 miles up the canyon, on foot or
  by island bus, to the Wrigley Memorial and Botanic Garden. Wander the cactus
  and island plants, climb to the memorial's deck, then take the Garden to Sky
  trail up to the ridge for a sweeping view over Avalon Bay and the mainland.
  Keep watch for the little island fox along the way. The photo to get: you
  on the ridge with the harbor far below.
about: >
  Chewing gum maker William Wrigley Jr. bought most of the island in 1919,
  and the 130-foot memorial in the canyon honors him. The Garden to Sky trail
  starts right beside it and climbs about 1.2 miles to the top of Avalon
  Canyon. The round white building on the harbor is the Casino, built in
  1929, a ballroom, never a gambling hall.

  The island fox lives only on California's Channel Islands. Catalina even
  has bison, descended from a small herd brought over for a movie in the
  1920s. Book the ferry ahead, and register for the free hiking permit
  before you go. The trail starts inside the garden, so you'll need garden
  admission too.
steps:
  - The view from the ferry deck as the island gets closer
  - You on top of the memorial
  - Avalon Bay from the ridge
  - Lunch on the waterfront
