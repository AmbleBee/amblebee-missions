short: Ferry to Catalina, walk up the canyon and climb to the ridge over Avalon Bay. Kiss at the top.
description: >
  Catch a morning boat to Avalon on Catalina Island and walk up Avalon Canyon
  to the Wrigley Memorial and Botanic Garden. Wander the cactus and island
  plants, climb up to the memorial's observation deck, then take the Garden to Sky trail up to
  the ridge for a sweeping view over Avalon Bay, the round Casino building and
  the mainland. Keep an eye out for the little island fox. Get a photo of
  you on the ridge with the harbor far below. Walk back down for a
  late lunch on the waterfront before the boat home. Book the ferry ahead, buy garden
  tickets, and register for the free hiking permit before you go.
steps:
  - The view from the ferry deck as the island gets closer
  - You on top of the memorial
  - Avalon Bay from the ridge
  - Lunch on the waterfront
