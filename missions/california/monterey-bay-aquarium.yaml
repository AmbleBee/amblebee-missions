short: Watch the sea otters and stand under the kelp forest at Monterey Bay Aquarium.
description: >
  Spend the day at one of the best aquariums anywhere, built on the site of an
  old sardine cannery. Catch a sea otter feeding, stand in front of the
  towering kelp forest, and sit by the giant open-ocean window. Each pick your
  favorite creature of the day. Afterward, walk Cannery Row and look out over
  the bay for wild otters and sea lions.
