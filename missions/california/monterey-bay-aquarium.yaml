short: Monterey Bay Aquarium on Cannery Row. Watch the sea otters and stand under the kelp forest.
description: >
  Catch a sea otter feeding, stand in front of the towering kelp forest, and
  sit by the giant open-ocean window as tuna and sharks glide past. Each
  pick your favorite creature of the day and do your best impression of it.
  The photo to get: you silhouetted against the open-ocean window.
  Afterward, walk Cannery Row and look out over the bay for wild otters.
about: >
  The aquarium opened in 1984 inside an old sardine cannery on the street
  John Steinbeck made famous in his novel Cannery Row. Its kelp forest
  exhibit, about three stories tall, was the first living kelp forest ever
  shown in an aquarium.

  The aquarium also rescues stranded sea otter pups. Its resident otters
  help raise them so they can go back to the wild. Buy tickets online to
  skip the line.
