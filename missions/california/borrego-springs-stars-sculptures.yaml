short: Borrego Springs metal sculptures at sunset, then a dark desert sky full of stars.
description: >
  Drive the desert roads around Borrego Springs hunting for giant metal
  sculptures standing out in the sand: dinosaurs, horses, a mammoth and a
  huge serpent that seems to swim under the road. Find the serpent as the
  light fades and get your photo with its head against the sunset. Then
  stay after dark, lie back on a blanket, and each count shooting stars.
  Whoever sees the most picks the snack on the drive home.
about: >
  The sculptures, more than 100 of them, are by artist Ricardo Breceda and
  stand on open land around town known as Galleta Meadows. They're free to
  visit, and pick-up maps are usually available in town. The serpent is
  about 350 feet long.

  Borrego Springs is surrounded by Anza-Borrego Desert State Park, the
  biggest state park in California, and it was the state's first
  International Dark Sky Community. Go in the cooler months, avoid the full
  moon for the best stars, and bring layers and plenty of water.
for_kids:
  short: Desert night! Find each thing.
  steps:
