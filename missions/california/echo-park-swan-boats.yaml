short: Rent a swan boat on Echo Park Lake. Pedal past the fountain with the skyline behind you.
description: >
  Rent one of the big swan pedal boats and take a slow loop around Echo Park
  Lake, past the fountain and the lotus beds, with the downtown skyline rising
  behind the palms. Take turns pedaling and taking photos, and get one of the
  whole swan with the skyline behind it. In summer the lotus beds are in bloom.
  Snacks are allowed on board; book ahead on weekends.
