short: Swan boats on Echo Park Lake in LA. Pedal past the fountain and the lotus beds, skyline behind.
description: >
  Rent one of the big swan pedal boats and take a slow loop around Echo Park
  Lake, past the fountain and the lotus beds, with the downtown skyline
  rising behind the palm trees. Take turns pedaling and taking photos, and
  get the classic shot: your whole swan with the skyline behind it. Then
  each pick a spot on the shore where you'd have a picnic next time.
about: >
  Echo Park Lake started as a reservoir in the 1800s and has been a park
  lake for over a century. It's famous for its lotus beds, which bloom in
  summer and have their own festival each July. The "Lady of the Lake"
  statue near the shore dates to the 1930s.

  Movie fans may recognize it: Jack Nicholson rows across this lake in
  Chinatown (1974).

  Snacks are allowed on board. Book ahead on weekends, when the boats go
  fast.
for_kids:
  short: Swan boat ride! Find each thing.
  steps:
    - Our swan boat
    - The big fountain
    - A duck or a bird
    - The tall buildings far away
    - A selfie in the swan!
