short: Knott's Berry Farm in Buena Park. Ride GhostRider, explore Ghost Town, split boysenberry pie.
description: >
  Spend the day at the park that started as a berry stand. Ride the
  GhostRider wooden coaster, wander the old Ghost Town and pan for gold, and
  each pick one ride everyone else has to go on with you. Finish with a
  slice of boysenberry pie. The photo to get: your group on the wooden
  sidewalks of Ghost Town.
about: >
  Walter and Cordelia Knott started with a roadside berry stand in the
  1920s and helped make the boysenberry famous. Cordelia's fried chicken
  dinners drew lines so long that Walter built Ghost Town in 1940 to keep
  waiting customers busy. That's why Knott's is often called America's first
  theme park.

  GhostRider, opened in 1998, is one of the longest wooden coasters on the
  West Coast. Ticket prices change by date, so buy online and pick a
  quieter weekday.
