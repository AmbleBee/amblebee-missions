short: Ride GhostRider at Knott's, explore the old ghost town, and split a boysenberry pie.
description: >
  Spend the day at the park that started as a berry stand. Ride the GhostRider
  wooden coaster, wander the old Ghost Town, pan for gold, and each pick one ride
  the other has to go on with you. Finish with a slice of boysenberry pie and a
  photo in the Ghost Town. Prices change by date, so buy online and pick a
  quieter weekday.
