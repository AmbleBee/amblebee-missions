short: Hike among the oldest trees on Earth. Photograph the most ancient one you can find.
description: >
  Drive up into the White Mountains to a forest of twisted bristlecone pines,
  some more than 4,000 years old. Walk the Methuselah Trail, a 4.5-mile loop
  that passes the world's oldest known tree, which is kept unmarked on
  purpose. Each hunt for the most ancient-looking tree you can find and
  photograph it, then compare and guess its age. You're above 10,000 feet:
  take it slow, bring water and layers, and stay on the trail. There is no cell phone service.
