short: Ancient Bristlecone Pine Forest near Bishop. Hike among the oldest trees on Earth.
description: >
  Drive up into the White Mountains to a forest of twisted bristlecone
  pines, some more than 4,000 years old. Walk the Methuselah Trail, which
  passes the world's oldest known tree, kept unmarked on purpose. Each hunt
  for the most ancient-looking tree you can find and photograph it, then
  compare and guess which one is the real Methuselah.
about: >
  Methuselah is more than 4,800 years old, so it was already growing when
  the Egyptian pyramids were built. Its exact spot is kept secret to protect
  it. Scientist Edmund Schulman first dated these trees in the 1950s, and
  the visitor center grove is named for him.

  The Methuselah Trail is a 4.5-mile loop at over 10,000 feet. Take it slow,
  bring water and layers, and stay on the trail. The road up is usually open
  from late spring to fall. Cell service is unreliable here, so download
  offline maps before you go.
