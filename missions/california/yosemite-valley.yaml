short: Yosemite Valley. Take in Tunnel View, then walk to the base of Lower Yosemite Fall.
description: >
  Stop at Tunnel View for the famous first look down Yosemite Valley: El
  Capitan, Bridalveil Fall and Half Dome all in one frame. The photo to get:
  you at the wall with the whole valley behind you. Then drive into the
  valley, walk the easy loop to the base of Lower Yosemite Fall, and see who
  gets mistier.
about: >
  In 1864, President Lincoln signed the Yosemite Grant, protecting the
  valley for public use, the first time the U.S. government set aside land
  like this. Ansel Adams made Tunnel View famous with his photographs.

  Yosemite Falls drops about 2,400 feet, one of the tallest waterfalls in
  North America. Spring has the most water; by late summer the falls can be
  a trickle. Entrance stations are cashless, and some busy seasons have
  needed a reservation to drive in, so check the park website.
