short: Take in Tunnel View, then walk to the base of Lower Yosemite Fall. Photo with El Capitan.
description: >
  Stop at Tunnel View for the famous first look down Yosemite Valley: El
  Capitan, Bridalveil Fall and Half Dome all in one frame. Get a photo of
  you there, then drive into the valley and walk the easy loop to the
  base of Lower Yosemite Fall. Spring has the most water; by late summer the
  falls can be a trickle. Leave early to beat the lines and the parking crunch,
  and bring a card, since the entrance stations are cashless.
