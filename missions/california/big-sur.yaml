short: Drive Highway 1 through Big Sur. Photograph Bixby Bridge, then the waterfall onto the beach.
description: >
  Drive south from Carmel on Highway 1 and pull over at Bixby Bridge for the
  classic photo of the arch over the canyon. Keep going down the coast, stopping
  at whatever pullout makes you both say wow, to Julia Pfeiffer Burns State
  Park, where McWay Falls drops straight onto a little beach. Only stop in real
  pullouts and never walk along the highway. Winter storms can close sections,
  so check road conditions first, and fill up before you go.
