short: Ride the rotating Palm Springs tram from the desert floor up into pine forest.
description: >
  Ride the world's largest rotating tram car, which spins slowly as it climbs
  more than 8,500 feet up the cliffs of Chino Canyon, from palm trees to pine
  forest in about ten minutes. At the top it's often 30 to 40 degrees cooler,
  and in winter there can be snow. Walk the trails at Mountain Station, find
  a viewpoint over the whole Coachella Valley, and get a photo of the two of
  you with the desert far below. Bring a jacket. The tram closes for a few
  weeks each fall for maintenance.
