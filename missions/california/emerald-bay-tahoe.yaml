short: Emerald Bay at Lake Tahoe. Photograph Fannette Island from above, then hike down to Vikingsholm castle.
description: >
  Start at the overlook above Emerald Bay and photograph the green water
  with tiny Fannette Island in the middle. Then take the steep trail down to
  Vikingsholm, a 1920s Scandinavian-style mansion on the shore. From the
  beach, each try to spot the little stone teahouse on top of the island.
  Picnic on the sand before the climb back up, which is harder than the way
  down.
about: >
  Vikingsholm was built in 1929 as a summer home for Lora Knight, in the
  style of an old Scandinavian castle, with sod roofs, carved dragon heads
  and hand-made furniture. Tours run in summer and take about half an hour.

  Fannette Island is the only island in Lake Tahoe. Knight built the
  teahouse at its peak and would have guests rowed out for tea. The island
  is closed in late winter and spring while Canada geese nest there.

  The trail is about a mile each way with a big drop down to the lake.
  The parking lot fills by mid-morning in summer, and winter storms often
  close Highway 89 around the bay.
