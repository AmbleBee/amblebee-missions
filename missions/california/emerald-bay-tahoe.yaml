short: Look down on Emerald Bay and its little island, then hike down to the lakeside Viking castle.
description: >
  Start at the overlook above Emerald Bay and photograph the green water with
  tiny Fannette Island in the middle. Then take the steep one-mile trail down
  to Vikingsholm, a 1920s Scandinavian-style mansion on the shore. In summer,
  take the 30-minute tour inside. Picnic on the beach before the climb back up,
  which is harder than the way down. The lot fills by mid-morning in summer,
  and winter storms close the road around the bay.
