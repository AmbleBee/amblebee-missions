short: Old Sacramento at night. Stroll the gold-rush streets, then cross the glowing Tower Bridge.
description: >
  Spend an evening in Old Sacramento's gold-rush streets, with wooden
  sidewalks and old brick saloons. Have dinner by the river, then walk the
  boardwalk to the golden Tower Bridge, all lit up over the Sacramento
  River, and cross it. Each count the old-time painted signs on the way. The
  photo to get: you with the glowing bridge behind you.
about: >
  Old Sacramento boomed during the Gold Rush. It was the western end of the
  Pony Express and where the first transcontinental railroad started, which
  you can see at [[california-state-railroad-museum]].

  Tower Bridge opened in 1935. Its middle section lifts straight up to let
  tall boats through, and it was painted its famous gold in the early 2000s.
  Weekend nights are the liveliest. Grab saltwater taffy on the way back.
