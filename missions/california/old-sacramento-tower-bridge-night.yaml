short: Stroll Old Sacramento after dark, then walk across the glowing gold Tower Bridge.
description: >
  Spend an evening in Old Sacramento's gold-rush streets, with wooden
  sidewalks, gas-lamp-style lights and old brick saloons. Have dinner on the
  riverfront, then walk the boardwalk to the golden Tower Bridge, all lit up
  over the Sacramento River, and stroll across it. Get a photo of you with the glowing bridge behind you. Grab ice cream or saltwater taffy on
  the way back. Weekend nights are the liveliest.
