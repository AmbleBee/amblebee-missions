short: See a movie in a 1939 Art Deco palace. Sit dead center and share the popcorn.
description: >
  The Senator is a round 1939 Art Deco movie palace on York Road, with a
  glowing neon marquee, a curved lobby, and a grand main
  auditorium. Pick a showing, ideally one of its classic-film revivals, get
  a popcorn to share and grab seats right in the middle. Before the lights
  go down, check out the walk of fame in the sidewalk out front. Get a photo of the
  two of you under the lit-up marquee after the show. Belvedere Square across
  the street is an easy spot for a bite before or after.
steps:
  - The two of you under the neon marquee
  - The big screen before the lights go down
