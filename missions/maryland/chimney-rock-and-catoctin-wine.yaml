short: Catoctin Mountain Park in Thurmont, MD. Scramble to Chimney Rock, then a winery tasting.
description: >
  Hike the loop up to Wolf Rock, a jumble of giant boulders split by deep
  cracks, and over to Chimney Rock, an outcrop looking out over the valley.
  Each guess how many miles away the farthest hill is. The photo to get: the
  two of you sitting at the edge of Chimney Rock. Then drive about ten
  minutes to Catoctin Breeze Vineyard for a tasting on the stone patio.
about: >
  Catoctin Mountain Park began in 1936, when the government bought worn-out
  farmland and crews from the WPA and the Civilian Conservation Corps turned
  it into a recreation area for city families.

  In 1942, President Franklin Roosevelt picked one of its camps as a cool
  mountain retreat and named it Shangri-La. President Eisenhower renamed it
  Camp David, after his grandson. It's still hidden inside the park, closed to
  the public and left off maps.

  The loop is about four miles, with the steepest climbing in the park. Book a
  table at the vineyard ahead; it's 21 and up and closed some weekdays.
steps:
  - The two of you in a crack in Wolf Rock
  - Sitting together at Chimney Rock
  - A toast at the vineyard
