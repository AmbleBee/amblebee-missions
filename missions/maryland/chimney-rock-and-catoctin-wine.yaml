short: Scramble up to Wolf Rock and Chimney Rock, then toast the view at a mountain winery.
description: >
  From the Catoctin Mountain Park visitor center, hike the loop up to Wolf Rock,
  a jumble of giant boulders split by deep cracks, and over to Chimney Rock,
  where a rock outcrop looks out over the valley. It's about four miles with
  some steep, rocky stretches, the steepest climbing in the park. Get a photo of
  the two of you sitting on the edge at Chimney Rock. Then drive about ten
  minutes to Catoctin Breeze Vineyard
  for a tasting on the stone patio or in the upstairs lounge; book a table ahead.
  The vineyard is 21 and up (no children) and closed some weekdays.
steps:
  - The two of you in a crack in Wolf Rock
  - Sitting together at Chimney Rock
  - A toast at the vineyard
