short: Amana Colonies, Iowa. Stroll the old German villages, taste local beer and share a feast.
description: >
  Wander Main Amana's brick and stone shops, the woolen mill and bakeries,
  and walk the trail around Lily Lake if the weather is good. Share a flight
  at the brewery or a winery, and each pick a favorite. Finish with a big
  family-style dinner where the platters keep coming until you give up. The
  photo to get: the two of you under the sign of the oldest building you can
  find.
about: >
  German religious settlers founded the Amana Colonies in 1855 and lived
  communally for almost 80 years. They shared everything, including their
  meals, cooked in big community kitchens. In 1932 they voted to end
  communal life, and the family-style restaurants carry on that tradition.

  The seven villages are a National Historic Landmark, and the woolen mill
  has been running since the 1850s. Pick a driver before the tastings.
