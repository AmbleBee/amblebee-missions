short: Stroll the old German villages, taste the local beer and wine, then share a family-style feast.
description: >
  The Amana Colonies are seven old German villages west of Iowa City, with
  brick and stone buildings, a working woolen mill, bakeries and tasting
  rooms. Start at the visitor center for a map, walk the Kolonieweg trail
  around Lily Lake if the weather is good, then wander Main Amana's shops and
  share a flight at the brewery or a winery. Finish with a big family-style
  dinner, where the platters keep coming until you give up. Get a photo of
  the two of you under the sign of the oldest building you can find. Pick a
  driver before the tastings.
