short: Roseman Covered Bridge near Winterset. Find the bridge from the movie and trade little notes.
description: >
  The Roseman Covered Bridge from The Bridges of Madison County still stands
  on a quiet country road outside Winterset. Write each other a little note
  on the drive over, then walk through the bridge together and swap them in
  the middle, like the note in the movie. The photo to get: the two of you
  at the entrance of the old red bridge.
about: >
  The bridge was built in 1883 and is one of six historic covered bridges
  still standing in Madison County. It became famous after the 1992 novel
  The Bridges of Madison County and the 1995 movie with Clint Eastwood and
  Meryl Streep.

  There's even a local legend that it's haunted, after an escaped jail
  prisoner was cornered on the bridge in 1892 and vanished. Winterset is
  also John Wayne's birthplace, with a museum in town, and each October the
  county holds a Covered Bridge Festival. Please keep your notes, not the
  walls; the bridge is historic.
