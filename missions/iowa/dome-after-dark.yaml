short: Dome After Dark at the Des Moines Botanical Garden. Trade winter for the glowing tropics.
description: >
  Trade the snow outside for warm, humid air and tropical plants under the
  big glass dome, lit up after dark. Grab a glass of wine or a beer, wander
  the paths slowly, and find the quietest bench under the canopy. Each pick
  the plant you'd want in your living room. The photo to get: the two of you
  with the lit-up plants all around.
about: >
  Dome After Dark has run on winter Friday nights, roughly January through
  March, when the conservatory stays open late. The geodesic dome first
  opened in the late 1970s and was renovated as part of the garden's
  makeover in the 2010s.

  Buy tickets ahead or at the door. The garden's restaurant, Flora, has
  offered dinner packages that include Dome After Dark tickets.
