short: Escape an Iowa winter night under the glowing tropical dome. Kiss under the palms.
description: >
  On Friday nights from January through March, the Botanical Garden keeps its
  big glass conservatory dome open late and lights it up, so you can trade the
  snow outside for warm, humid air and tropical plants. Grab a glass of wine or
  a beer in the Garden Gateway, wander the paths slowly, and find the quietest
  bench under the canopy. Get a photo of the two of you with the lit-up plants
  all around. It runs only in winter; buy tickets ahead or at the door, or book
  the Friday dinner at Flora that includes Dome After Dark tickets.
