short: Dome After Dark at the Des Moines Botanical Garden. Trade winter for the glowing tropics.
description: >
  Trade the snow outside for warm, humid air and tropical plants under the
  big glass dome, lit up after dark. Grab a glass of wine or a beer from the
  Flora bar, wander the paths slowly, and find the quietest bench under the
  canopy. Each pick the plant you'd want in your living room, and hunt for the
  chocolate tree. For a bigger night, book dinner at Flora or a private heated
  igloo. The photo to get: the two of you with the lit-up plants all around.
about: >
  Dome After Dark has run on winter Friday nights, roughly January through
  March, when the conservatory and the Gardeners Show House stay open late
  under colored lights. The geodesic dome, 80 feet tall and 150 feet wide,
  first opened on a frigid day in December 1979. Inside are banana plants, a
  chocolate tree, and the plant that gave Iowa its first corpse flower bloom.

  Buy tickets ahead or at the door. The garden's restaurant, Flora, has
  offered dinner packages that include Dome After Dark tickets.
