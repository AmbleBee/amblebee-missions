short: Tour a 65-room Tudor mansion, then pick your favorite garden room outside.
description: >
  The country estate built by Goodyear's founder: a 65-room Tudor-style manor
  full of carved wood, hidden nooks and grand halls, surrounded by formal
  gardens, a long birch allée and an English garden. Each pick the room you'd
  live in. It's open from spring through fall, and in December the house is
  decorated for Deck the Hall nights.
about: >
  F.A. Seiberling, who co-founded Goodyear, finished the house in 1915 and
  named it Stan Hywet, Old English for "stone quarry," after the old quarry
  on the land. Its 65 rooms and 70 acres were planned by architect Charles
  Schneider and landscape designer Warren Manning.

  In 1935, Henrietta Seiberling arranged a meeting at the estate's Gate
  Lodge between Bill Wilson and Dr. Bob Smith, the meeting that led to the
  founding of Alcoholics Anonymous.
