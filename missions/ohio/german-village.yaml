short: Walk the brick streets of German Village. Get lost in the 32-room bookstore.
description: >
  A neighborhood of tiny brick cottages, brick sidewalks and hidden gardens,
  built by German immigrants in the 1800s. Wander the side streets, stop in
  The Book Loft (a maze of more than thirty rooms of books) and pick a book for
  each other, then rest in Schiller Park. Find a German bakery or a beer hall
  for a snack on the way back.
