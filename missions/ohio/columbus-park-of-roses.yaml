short: Columbus Park of Roses. Walk through 11,000 roses and find the one that smells best.
description: >
  One of the biggest public rose gardens in the country, free and open every
  day. Wander the paths, smell your way through the beds, and pick the rose
  with the best scent. Climb the little observation tower for a view over the
  whole garden. June is peak bloom. Note: the garden entrance is on Hollenback
  Road inside Whetstone Park, not on High Street, so map apps can get it
  wrong. The photo to get: you with your best-smelling rose.
about: >
  The Park of Roses opened in 1953 and covers about 13 acres inside
  Whetstone Park, with about 11,000 roses in more than 350 varieties, plus
  perennial and herb gardens and a heritage rose garden of varieties grown
  before 1867.

  The first big bloom comes in June, and many roses flower again into the
  fall. Volunteers keep it going, and there are summer concerts on the
  grounds. It's open dawn to dusk. The Olentangy Trail runs right past, if
  you'd rather bike in.
