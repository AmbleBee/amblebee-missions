short: Walk through thousands of roses. Each find the one that smells best.
description: >
  One of the biggest public rose gardens in the country, free and open every
  day. Wander the paths, smell your way through the beds, and each pick the
  rose with the best scent. June is peak bloom. Note: the garden entrance is
  on Hollenback Road inside Whetstone Park, not on High Street, so map apps
  can get it wrong. The photo to get: you with your best-smelling rose.
about: >
  The Park of Roses opened in 1953 and covers about 13 acres inside
  Whetstone Park, with thousands of roses in hundreds of varieties, plus
  perennial, herb and heritage rose gardens.

  The first big bloom comes in June, and many roses flower again into the
  fall. Volunteers keep it going, and there are summer concerts on the
  grounds. The Olentangy Trail runs right past, if you'd rather bike in.
