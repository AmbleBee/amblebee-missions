short: Cleveland Museum of Art, free every day. Find the knights in armor and a piece for each other.
description: >
  One of the best art museums in the country, and general admission is always
  free. Walk from Egyptian mummies and a hall of knights in armor to Monet and
  Picasso, then rest in the huge glass atrium. Find a piece that reminds you
  of someone you love, or each find one that reminds you of the other. Then
  walk the lagoon and Wade Park outside. The photo to get: you with the piece
  you picked.
about: >
  The museum opened in 1916 on land given "for the benefit of all the people
  forever," words written into the 1892 deed, and general admission is still
  free. Its collection holds more than 61,000 works spanning about 6,000 years.
  The Armor Court has been at the heart of the museum since opening day,
  because its first director insisted the armor go right in the center.

  Outside the south entrance sits Rodin's The Thinker, one of the last casts
  Rodin oversaw himself. A bomb blew it off its pedestal in 1970, and the
  museum chose to leave its twisted legs unrepaired. The lagoon and the Fine
  Arts Garden in Wade Park are lovely for a walk after. Special exhibitions
  can charge a ticket.
