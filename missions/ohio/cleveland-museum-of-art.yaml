short: Wander Cleveland's big art museum, free every day. Find the knights in armor.
description: >
  One of the best art museums in the country, and general admission is always
  free. Walk from Egyptian mummies and a hall of knights in armor to Monet and
  Picasso, then rest in the huge glass atrium. Each find a piece that reminds
  you of the other. Afterward, walk the lagoon and Wade Park outside. Closed
  Mondays. The photo to get: you with the piece you picked for the other.
about: >
  The museum opened in 1916, and it has been free to visit since the start,
  "for the benefit of all the people forever." Its collection holds more
  than 60,000 works spanning about 6,000 years.

  Outside the south entrance stands one of Rodin's Thinker casts, damaged by
  a bomb in 1970 and left unrepaired on purpose. The lagoon and the Fine
  Arts Garden in Wade Park are lovely for a walk after. Special exhibitions
  can charge a ticket.
