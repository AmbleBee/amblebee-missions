short: Ride a vintage train through Cuyahoga Valley National Park. Watch for herons.
description: >
  Ride a vintage train through the woods and wetlands of Cuyahoga Valley
  National Park, along the river and the old canal towpath. Sit by the window
  and watch for herons, beavers and waterfalls. Feeling active? Bike or hike
  part of the towpath and catch the train back. Fall color rides sell out, so
  book ahead.
