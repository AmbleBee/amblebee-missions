short: Ride a vintage train through Cuyahoga Valley National Park. Watch for herons.
description: >
  Ride a vintage train through the woods and wetlands of Cuyahoga Valley
  National Park, along the river and the old canal towpath. Sit by the window
  and watch for herons, beavers and waterfalls. Feeling active? Bike or hike
  part of the towpath and catch the train back. Fall color rides sell out, so
  book ahead. The photo to get: you at the train window with the valley
  rolling by.
about: >
  The line was built as the Valley Railway in the 1880s, hauling coal along
  the old Ohio and Erie Canal. The valley around it became a national
  recreation area in 1974 and a national park in 2000.

  Bike Aboard lets you ride the Towpath Trail one way and flag the train
  back for a small fare. Brandywine Falls and the Beaver Marsh boardwalk are
  both close to the tracks if you want to stop along the way.
