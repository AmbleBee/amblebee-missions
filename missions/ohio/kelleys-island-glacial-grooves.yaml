short: Ferry to Kelleys Island and hike or bike to the giant glacier scratches. Lake Erie photo.
description: >
  Walk on (or roll your bikes on) the ferry from Marblehead and cross to
  Kelleys Island, a quiet little Lake Erie island. From the
  dock, bike or hike a few miles across the island to the Glacial Grooves, deep
  smooth troughs carved into the limestone by an ice-age glacier, and follow
  the walkway around them. Keep going along the North Shore Loop Trail through
  the state park woods to the lakeshore, then wander back to town for food
  before the ferry home. Get a crew photo lined up along the walkway with
  the grooves behind you.
about: >
  The Glacial Grooves were carved about 18,000 years ago by the ice sheet
  that dug out Lake Erie. At about 400 feet long and up to 15 feet deep,
  they are among the largest and easiest to see anywhere. Quarrying on the
  island destroyed many other grooves before these were saved.

  The whole island is only about four square miles, so bikes and golf carts
  get you everywhere. It's on the National Register as a historic district,
  with old stone houses and quarry ruins along the roads.
steps:
