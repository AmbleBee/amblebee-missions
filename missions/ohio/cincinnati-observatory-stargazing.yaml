short: Cincinnati Observatory. Look at the planets through a telescope from the 1840s.
description: >
  Book an evening program and look at the Moon and planets through the old
  brass telescopes, one of them from 1845. Take turns at the eyepiece and
  each describe what you see before the other looks. On the way home, each
  pick a star to name after the other. The photo to get: the two of you
  under the open dome with the old telescope.
about: >
  The Cincinnati Observatory calls itself the birthplace of American
  astronomy. It was founded in 1842, and former President John Quincy Adams
  laid the cornerstone, in one of his last public speeches.

  The observatory moved up to Mount Lookout in the 1870s to get away from
  the city's smoke. Its 1845 telescope is one of the oldest working
  telescopes in the world that the public can still look through. Programs
  depend on the weather, so check before you go.
