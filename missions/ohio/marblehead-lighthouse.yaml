short: Picnic on the rocks by Marblehead Lighthouse, then climb the tower in summer.
description: >
  The oldest lighthouse still working on the Great Lakes stands on a rocky
  point over Lake Erie. Bring a picnic, find a flat rock by the water, and
  watch the boats. In summer you can climb the tower for a few dollars, and
  the keeper's house museum next door is free. Stay for sunset if you can. The
  photo to get: you with the lighthouse and Lake Erie behind you.
about: >
  Marblehead Lighthouse was lit in 1822, which makes it the oldest
  lighthouse in continuous use on the Great Lakes. Its first keeper was
  Benajah Wolcott, and after he died his wife Rachel took over, the first
  woman to keep a light on the Great Lakes.

  The tower was raised to 65 feet in 1903. The rocky shore is limestone,
  carved by waves, and on clear days you can see Kelleys Island and Cedar
  Point across the water.
