short: Hike the gorge at Old Man's Cave, past two waterfalls and the Devil's Bathtub.
description: >
  Follow the one-way loop down into a mossy sandstone gorge: Upper Falls, a
  stone tunnel, the Sphinx Head rock, the swirling pool called the Devil's
  Bathtub, Lower Falls, and the huge recess cave a hermit once lived in. It's
  about a mile and a half with lots of stairs. Wear shoes with grip; the rock
  is slick when wet, and there's no swimming. Fall color here is beautiful.
