short: Hike the forest trail down to a 50-foot falls spilling over rock ledges. Photo at the base.
description: >
  Start at the Yellow Branch Picnic Area west of Walhalla and follow the
  nature trail to the falls trail, an out-and-back of about three miles
  through rhododendron and hardwood forest. The first stretch is easy, then the
  trail drops more steeply along deep ravines and crosses a few creeks on
  rocks and roots before you reach the falls, a wide veil of water sliding
  down stacked rock ledges. Take your photo from the base of the falls, but
  stay off the rocks around it. Go after a good rain; in a dry spell it can
  shrink to a trickle.
steps:
