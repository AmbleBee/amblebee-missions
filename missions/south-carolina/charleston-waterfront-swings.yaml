short: Charleston Waterfront Park. Walk past Rainbow Row, then share a pier swing at dusk.
description: >
  Walk down East Bay Street past the pastel houses of Rainbow Row, and each
  pick the color you'd paint your front door. Head into Waterfront Park, dip
  your fingers in the Pineapple Fountain, and end on the long pier where
  shaded porch swings face the harbor. The photo to get: the two of you on a
  swing with the harbor behind you. Stay until the lights come on.
about: >
  Rainbow Row is a stretch of colorful 1700s houses along East Bay Street.
  They were run down by the early 1900s, and the pastel colors came with
  their restoration in the 1930s.

  The pineapple is a Southern symbol of welcome, which is why it became
  Charleston's most famous fountain. Waterfront Park opened in 1990 on old
  wharf land, and the pier swings are first come, first served, so sunset
  ones go fast.
