short: Walk past Rainbow Row to the Pineapple Fountain, then share a pier swing at dusk.
description: >
  Walk down East Bay Street past the pastel houses of Rainbow Row, then into Waterfront
  Park. Dip your fingers in the Pineapple Fountain, Charleston's symbol of welcome, and
  end on the long pier where shaded porch swings face the harbor. Stay until the lights
  come on.
