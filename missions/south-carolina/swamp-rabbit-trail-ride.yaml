short: Rent bikes downtown and ride the Swamp Rabbit Trail north. First one to the cafe buys snacks.
description: >
  Rent bikes in downtown Greenville, roll through Falls Park past the Reedy River
  waterfall, then follow the Swamp Rabbit Trail north on a paved, mostly flat old
  rail line. Stop at the Swamp Rabbit Cafe & Grocery for a snack, keep going past
  Furman's Swan Lake, and if the group has legs left, push on to Travelers Rest for
  lunch before riding back. The full round trip is about 20 miles, so turn around
  wherever the group decides. Get a group photo with your bikes at your turnaround
  point. Bring water and stop at every road crossing.
