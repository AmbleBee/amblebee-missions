about: >
  Looking for date ideas in Charleston or around South Carolina? It mixes Lowcountry marshes, historic streets
  and long beaches, with Greenville and the mountains upstate. At Charleston's Waterfront Park, the big porch
  swings by the harbor are made for slowing down.
