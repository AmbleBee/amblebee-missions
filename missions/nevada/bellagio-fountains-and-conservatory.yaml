short: Bellagio in Las Vegas. Wander the free flower conservatory, then watch the fountains dance.
description: >
  Walk through the Bellagio Conservatory, where the giant flower displays
  change with the seasons, and each find your favorite detail. Then head out
  front to the lake and watch the fountains shoot up in time with the music.
  Stay for two shows, since they're different songs, and guess the next
  song before it starts. The photo to get: the two of you at the railing
  with the fountains at full height behind you.
about: >
  The fountains opened with the hotel in 1998, with more than 1,200 water
  jets in an eight-acre lake. The biggest shoot water hundreds of feet into
  the air. Shows run all afternoon and evening, more often after dark.

  The conservatory is redone by a big team of gardeners for each season and
  holiday, so it's different every time you go. On your way through the
  lobby, look up at the ceiling of glass flowers by artist Dale Chihuly. All
  of it is free.
