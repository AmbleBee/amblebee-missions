short: Wheeler Peak in Great Basin National Park. Climb to 13,063 feet at sunrise for a summit photo.
description: >
  Drive to the top of the Wheeler Peak Scenic Drive and start early from the
  Summit Trailhead. The trail climbs gently past alpine meadows, then turns
  into a steep, rocky ridge walk above treeline for the last couple of miles,
  about 8.6 miles round trip with over 3,000 feet of climbing at serious
  altitude. Take a summit photo with the desert valleys stretching out in
  every direction. Afternoon thunderstorms are common, so turn around if
  clouds build, carry plenty of water (there's none on the drive), and go
  slow if the altitude hits you. Pets aren't allowed on the trail. The upper
  scenic drive is closed by snow in winter and usually opens by Memorial Day,
  and vehicles over 24 feet can't go past Upper Lehman Campground.
about: >
  Wheeler Peak is the highest mountain entirely inside Nevada. Great Basin
  National Park is also home to ancient bristlecone pines, some of the
  oldest living things on Earth, along a trail near the peak, plus Lehman
  Caves below.

  The hike is about 8.6 miles round trip with more than 3,000 feet of
  climbing at serious altitude. Afternoon thunderstorms are common, so start
  early and turn around if clouds build. The upper scenic drive is closed by
  snow in winter and usually opens by Memorial Day. It's also a Dark Sky Park,
  so stay for the stars.
steps:
