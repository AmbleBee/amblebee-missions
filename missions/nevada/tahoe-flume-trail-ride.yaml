short: Tahoe Flume Trail from Incline Village. Mountain bike the cliffside trail high above the lake.
description: >
  Rent mountain bikes, take the shuttle to Spooner Lake, and ride back:
  first a climb to quiet Marlette Lake for a picnic, then the famous Flume
  Trail, a narrow singletrack cut into the granite cliffs with Lake Tahoe
  glowing blue far below. Each pick the best viewpoint along the way. The
  photo to get: your crew on a big boulder halfway along with the whole lake
  behind.
about: >
  In the 1870s, a wooden flume ran along this route carrying water and
  timber toward the silver mines of Virginia City. Marlette Lake was dammed
  to feed it. The trail follows the old flume's path.

  It's about 14 miles at around 8,000 feet, an intermediate to advanced ride.
  The first stretch of the flume section is rocky and technical, and the
  drop-off is real, so walk anything that spooks you. Book bikes and the
  shuttle ahead.
steps:
  - Marlette Lake from your picnic spot
  - You with Tahoe behind
  - Muddy legs back at the shop
