short: Mountain bike the cliffside Flume Trail high above Lake Tahoe. Lunch at Marlette Lake.
description: >
  Rent mountain bikes at the shop in Incline Village, take their shuttle to
  Spooner Lake, and ride about 14 miles back: a climb of over 1,000 feet to
  quiet Marlette Lake, then the famous Flume Trail, a narrow singletrack cut into the granite cliffs with
  Lake Tahoe glowing blue far below. Pack a picnic for Marlette and take your
  time on the flume section; the first stretch is rocky and technical and the
  drop-off is real, so walk anything that spooks you. Stop on a big boulder halfway along for the
  photo of the two of you with the whole lake behind. It's an intermediate to
  advanced ride at 8,000 feet, so you should be fit, comfortable on dirt trails
  and fine with heights. Book bikes and the shuttle ahead.
steps:
  - Marlette Lake from your picnic spot
  - The two of you with Tahoe behind
  - Muddy legs back at the shop
