short: Turkey Run State Park in Indiana. Cross the suspension bridge and climb ladders through canyons.
description: >
  Cross the suspension bridge over Sugar Creek and string together Turkey
  Run's rugged trails: squeeze through the narrow sandstone canyons of Rocky
  Hollow and Bear Hollow and climb the wooden ladders on Trail 3. Count the
  ladders as you go and see who guesses the total closest. The photo to get:
  looking up from the bottom of a ladder with the canyon walls on both
  sides.
about: >
  Turkey Run opened in 1916 as Indiana's second state park. It's named for
  the wild turkeys that once gathered in the sheltered canyons in winter.
  Cool, shady hollows here still hold hemlock trees left over from the end of
  the Ice Age, far south of where they usually grow.

  Expect wet feet, slick rock and lots of up and down. Skip Trail 3 after
  heavy rain, and leave small kids and dogs for the gentler trails. Save time
  for the 1840s Lusk home and the old covered bridge.
steps:
  - The suspension bridge over Sugar Creek
  - Looking up a ladder between the canyon walls
  - The narrowest squeeze in Bear Hollow
  - The covered bridge
