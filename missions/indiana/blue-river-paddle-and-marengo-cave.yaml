short: Paddle seven miles of the clear Blue River, then go underground at Marengo Cave.
description: >
  Start your day at the outfitter in tiny Milltown, ride the bus up to the
  launch, and paddle about seven miles of the Blue River back to town through
  riffles, little rapids and deep green pools under limestone bluffs. Pull over
  on a gravel bar for a packed lunch and get a photo of the two of you in your
  boats with the bluffs behind you. Dry off and drive ten minutes to Marengo Cave
  for a walking tour through its glittering formations, a cool 52 degrees all
  year. Reserve the river trip ahead; it runs about April through October.
steps:
