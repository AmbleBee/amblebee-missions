short: Blue River paddle in Milltown, Indiana, then go underground at Marengo Cave.
description: >
  Ride the outfitter's bus up to the launch and paddle about seven miles of
  the Blue River back to Milltown, through riffles and deep green pools
  under limestone bluffs. Pull over on a gravel bar for a packed lunch and
  each find the flattest skipping stone. The photo to get: the two of you in
  your boats with the bluffs behind you. Then dry off and tour Marengo
  Cave's glittering formations.
about: >
  The Blue River is one of Indiana's protected scenic rivers, known for its
  clear water and the caves and springs along its banks.

  Marengo Cave was found in 1883 by two kids, a brother and sister who
  crawled into a sinkhole with candles. It's now a National Natural
  Landmark and stays about 52 degrees all year, so bring a layer. Reserve the
  river trip ahead; it runs roughly April through October.
steps:
