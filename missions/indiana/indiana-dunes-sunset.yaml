short: Indiana Dunes State Park near Chesterton. Take the 3 Dune Challenge, then watch the sunset.
description: >
  Take on the 3 Dune Challenge together, climbing the park's three tallest
  sand dunes one after another. Then head down to the beach for sunset over
  Lake Michigan. On a clear evening, you can see the Chicago skyline across
  the water. The photo to get: the two of you on top of the last dune,
  windblown and proud.
about: >
  The 3 Dune Challenge climbs Mount Jackson, Mount Holden and Mount Tom,
  more than 550 feet of climbing in about a mile and a half, much of it in
  soft sand. Mount Tom is the tallest dune in the park, about 190 feet high.

  Indiana Dunes State Park opened in 1925. It's surrounded by Indiana Dunes
  National Park, which became a national park in 2019. The Dunes Pavilion by
  the beach, first built in 1930, has food and a rooftop for a drink after.
