name: Amble Montana
region: Montana
description: Real places all over Montana, from hot springs in Paradise Valley to the mountains around Glacier and Yellowstone.
icon: antler
# A longer description for this pack's own page on the website (not sent to the Hive).
about: >
  Montana is big sky country: mountains, rivers, hot springs and towns that still feel like the Old West, from
  Missoula to Whitefish and Paradise Valley. For an easy adventure, soak in Chico Hot Springs on the road toward
  Yellowstone.
