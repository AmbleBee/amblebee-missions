short: Chico Hot Springs near Pray, MT. Soak under the mountains, then dinner in the old lodge.
description: >
  Soak together in the outdoor hot spring pools in Paradise Valley,
  especially good on a cold night with steam rising off the water and the
  mountains dark around you. Each count shooting stars or snowflakes,
  whichever the night brings. Then dress up a little for dinner in the
  historic dining room. The photo to get: the two of you in the steamy pool
  with the old lodge behind.
about: >
  Chico has been pulling hot spring water into its pools since 1900, when
  Bill and Percie Knowles opened a hotel here. The lodge has kept much of
  its old look, and it even has a ghost story: some guests say Percie never
  left.

  Paradise Valley follows the Yellowstone River north of Yellowstone
  National Park, about half an hour from the park's north entrance. Dinner
  reservations are a good idea, especially on weekends.
