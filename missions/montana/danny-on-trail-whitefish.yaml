short: Hike 2,000 feet up Big Mountain, toast at the summit, then ride the chairlift down.
description: >
  Start in the village at Whitefish Mountain Resort and hike the Danny On Trail
  up through the forest and open ski runs, almost four miles and over 2,000
  feet of climbing, with Whitefish Lake and the Glacier Park peaks opening up
  behind you. At the top, grab a cold drink at the Summit House, then buy a
  scenic lift ticket and ride the chairlift back down instead of pounding your
  knees. Get a group photo at the summit with the peaks behind you. Summer only,
  and the lower trail sometimes gets rerouted for forest work, so check the
  resort's trail notes first.
