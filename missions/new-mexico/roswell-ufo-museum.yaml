short: International UFO Museum in Roswell. Investigate the 1947 crash and decide for yourself.
description: >
  Spend an hour or two inside an old downtown movie theater turned UFO museum,
  reading the timeline, newspaper clippings and witness statements about the
  1947 Roswell Incident. Wander past the crop-circle and abduction exhibits,
  then make up your mind: weather balloon or something else? Get a photo with
  the alien-and-spaceship display that's the museum's star. Afterward, walk
  Main Street to spot the alien-shaped streetlights and storefront aliens.
about: >
  In July 1947, the Roswell Army Air Field announced it had recovered a
  "flying disc," then said the next day it was a weather balloon. Decades
  later, the Air Force said it was a secret balloon project for spying on
  Soviet nuclear tests. Believers still aren't convinced.

  The museum is in an old downtown movie theater, and the town leans in, with
  alien-shaped streetlights and a big UFO festival every summer.
