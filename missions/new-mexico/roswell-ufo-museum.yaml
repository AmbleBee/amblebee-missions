short: International UFO Museum in Roswell. Investigate the 1947 crash and decide for yourself.
description: >
  Spend an hour or two inside an old downtown movie theater turned UFO museum,
  reading the timeline, newspaper clippings and witness statements about the
  1947 Roswell Incident. Wander past the crop-circle and abduction exhibits,
  then make up your mind: weather balloon or something else? Get a photo with
  the life-size flying saucer and its little green crew, the museum's star.
  Afterward, walk Main Street to spot the alien-shaped streetlights and
  storefront aliens.
about: >
  In July 1947, the Roswell Army Air Field announced it had recovered a
  "flying disc," then within hours said it was a weather balloon. In 1994 the
  Air Force said it was really a secret balloon project for spying on Soviet
  nuclear tests, and in 1997 it said the "alien bodies" people remembered were
  crash-test dummies. Believers still aren't convinced.

  The museum was started by Walter Haut, the officer who sent out that
  original "flying disc" press release in 1947. It now fills the old Plains
  Theater downtown, and the town leans in, with alien-shaped streetlights and
  a big UFO festival every July.
