short: Carlsbad Caverns in New Mexico. Drop 750 feet underground and loop the giant Big Room.
description: >
  Take the elevator down 750 feet, or walk in through the Natural Entrance if
  you want the steep switchbacks, and follow the paved loop around the Big
  Room. Lights are low and voices carry, so keep it to whispers, and pick a
  favorite formation along the way. The photo to get: you in front of the Rock
  of Ages. Book a timed-entry slot ahead, and wear shoes with good grip; some
  of the trail is wet and steep.
about: >
  A teenage cowboy named Jim White explored the cave in the late 1890s after
  spotting a huge cloud of bats pouring out of the ground. The Big Room is the
  largest single cave chamber by volume in North America, and its loop is
  about a mile and a quarter. Will Rogers called it "the Grand Canyon with a
  roof over it."

  From late spring to fall, hundreds of thousands of bats fly out of the
  Natural Entrance at dusk, and rangers hold a bat flight program at the
  amphitheater. A timed-entry reservation is required, kids 15 and under get
  in free, and the cave stays cool all year.
