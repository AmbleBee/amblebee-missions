short: Carlsbad Caverns in New Mexico. Drop 750 feet underground and loop the giant Big Room.
description: >
  Take the elevator down 750 feet, or walk in through the Natural Entrance if
  your crew wants the steep switchbacks, and follow the paved loop around the
  Big Room. Lights are low and voices carry, so keep it to whispers, and
  everyone picks a favorite formation along the way. The photo to get: your
  group with the Rock of Ages behind you.
about: >
  A teenage cowboy named Jim White explored the cave in the late 1890s after
  spotting a huge cloud of bats pouring out of the ground. The Big Room is
  one of the largest cave chambers in North America, and its loop is a bit
  over a mile.

  From late spring to fall, hundreds of thousands of bats fly out of the
  Natural Entrance at dusk, and rangers hold a bat flight program at the
  amphitheater. A timed-entry reservation is required, and the cave stays
  cool all year.
steps:
