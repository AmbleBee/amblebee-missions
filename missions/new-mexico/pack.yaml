name: Amble New Mexico
region: New Mexico
description: Real places all over New Mexico, starting on a tram up the Sandia Mountains above Albuquerque.
icon: zia
# A longer description for this pack's own page on the website (not sent to the Hive).
about: >
  Looking for things to do in New Mexico? It's high desert, adobe towns, chile and huge skies, from Albuquerque
  to Roswell and Carlsbad Caverns. Ride the Sandia Peak Tramway above Albuquerque at sunset and watch the
  mountains glow.
