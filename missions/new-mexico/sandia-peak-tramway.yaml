short: Ride the tram 2.7 miles up the Sandias and watch the sunset turn the mountain pink.
description: >
  One of the longest aerial trams in the Americas carries you 2.7 miles up to over 10,000
  feet. Ride up before sunset, watch the light spread across the desert from the top, and
  catch the mountains glowing pink, which is how the Sandias ("watermelon") got their
  name. Bring a jacket.
