short: Sandia Peak Tramway in Albuquerque. Ride 2.7 miles up and watch the mountain turn pink.
description: >
  Ride the tram up to over 10,000 feet before sunset, and watch the light
  spread across the desert and the city below. Stay for the moment the
  mountains glow pink, and each guess when it'll peak. The photo to get: the
  two of you on the observation deck with the pink light and the valley
  behind you.
about: >
  The tramway opened in 1966 and is one of the longest aerial trams in the
  world, about 2.7 miles from bottom to top. The ride takes around 15
  minutes and passes over deep canyons.

  "Sandía" means watermelon in Spanish. The mountains are said to be named
  for the pink-red color they turn at sunset, with a green band of trees on
  top like a rind. It's much colder at the top, so bring a jacket. There's a
  restaurant up there if you want to stay for dinner.
