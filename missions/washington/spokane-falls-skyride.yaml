short: Ride the SkyRide gondola down over the roaring Spokane Falls. Spring has the most water.
description: >
  Ride a little gondola down into the gorge right over Spokane Falls, dropping
  about 200 feet and crossing the river in front of the thundering water.
  Spring, when the snowmelt pours over the falls, is the most dramatic. Then
  walk Riverfront Park: find the giant Red Wagon slide, the old clock tower
  and the big garbage-eating goat sculpture, and get a photo of you
  with the falls behind you. The ride can close in high wind.
for_kids:
