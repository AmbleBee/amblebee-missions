short: Ferry from Seattle to Bainbridge Island. Photograph the skyline shrinking from the back deck.
description: >
  Walk on the ferry to Bainbridge Island and head to the back deck as
  Seattle shrinks behind you. The photo to get: you with the
  skyline and the boat's wake behind. On the island, wander the little town
  by the dock, grab a coffee or an ice cream, and catch a ferry back around
  sunset to watch the city light up.
about: >
  The crossing takes about 35 minutes on one of Washington State Ferries'
  big boats, part of the largest ferry system in the country. On a clear day
  you can see Mount Rainier to the south and the Olympic Mountains ahead.

  Walk-on passengers only pay going west from Seattle; the ride back is
  free. The town of Winslow is an easy walk up from the Bainbridge terminal,
  with shops, cafés and the free Bainbridge Island Museum of Art close to
  the dock.

  Walking on is cheaper and simpler than driving, and you never wait in the
  car line.
