short: Fort Vancouver in Washington. Walk the rebuilt fur-trade fort, Officers Row and the land bridge.
description: >
  Explore Fort Vancouver National Historic Site in Vancouver, Washington, a
  reconstructed 1800s Hudson's Bay Company fur-trading post. Peek into the
  blacksmith shop and the trade store, and in summer ask the costumed rangers
  what life here was like. Then stroll the old houses of Officers Row and walk
  the land bridge down toward the Columbia River. The free Pearson Air Museum
  is right next door if you want more. The photo to get: you at the gate in
  the tall wooden stockade.
about: >
  The Hudson's Bay Company built Fort Vancouver in 1825, and it became the
  center of the fur trade across the Pacific Northwest under Dr. John
  McLoughlin. The US Army set up Vancouver Barracks next door in 1849.

  Ulysses S. Grant served here in the early 1850s, and Officers Row's houses
  date from the 1850s to the early 1900s. The land bridge, designed with
  Maya Lin and opened in 2008, links the fort to the Columbia River. The
  reconstructed fort charges a card-only entrance fee for ages 16 and up,
  and pets aren't allowed inside, but the grounds, Officers Row and the land
  bridge are free.
