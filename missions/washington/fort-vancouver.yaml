place:
  name: Fort Vancouver National Historic Site
  area: Vancouver, WA
  coords: [45.62550, -122.65670]  # APPROX: set at the fort's entrance before publishing
short: Walk the rebuilt fur-trade fort, Officers Row, and the land bridge to the river.
description: >
  Explore the reconstructed 1800s fur-trading fort, peek into the blacksmith shop
  and trade store, then stroll the old houses of Officers Row. Finish by walking
  the land bridge down toward the Columbia River.
about: >
  The Hudson's Bay Company built Fort Vancouver in 1825, and it became the
  center of the fur trade across the Pacific Northwest under Dr. John
  McLoughlin. The US Army set up Vancouver Barracks next door in 1849.

  Ulysses S. Grant served here in the early 1850s, and Officers Row's houses
  date from the 1850s to the early 1900s. The land bridge, designed with
  Maya Lin and opened in 2008, links the fort to the Columbia River.
for_kids:
