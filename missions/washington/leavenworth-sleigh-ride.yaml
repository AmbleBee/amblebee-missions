short: Bundle up under wool blankets for a horse-drawn sleigh ride through the snowy fields.
description: >
  Ride a horse-drawn sleigh pulled by big draft horses through snowy woods and
  fields outside Leavenworth, tucked under blankets, then warm up by the fire
  with hot cider. Get a photo of you in the sleigh with the horses.
  Rides depend on snow, and December dates sell out weeks ahead, so book early.
  Finish in town under the lights.
about: >
  Leavenworth was a logging and railroad town until the 1920s, when the
  sawmill closed and the Great Northern moved its rail yards away. In the
  1960s, with help from a University of Washington program called Project
  LIFE, the town planned a comeback and remade itself in Bavarian style, and
  it worked.

  Red Tail Canyon Farm keeps a team of big draft horses, which pull wagons in
  other seasons. Freund Canyon is just north of town, along the Chumstick
  Highway.
