short: Race each other down the snow tubing lanes at Snoqualmie Pass. The lift brings you back up.
description: >
  Grab a tube and fly down the groomed lanes at Snoqualmie Pass, no skiing
  skills needed, while a lift carries you back to the top for another run.
  Link your tubes and spin down together, then race side by side and keep
  score. Get a photo of you at the bottom covered in snow. Book a
  timed session ahead, since weekends sell out, and check the pass on WSDOT
  before you drive. Warm up with hot chocolate in the lodge after.
about: >
  Snoqualmie Pass sits at about 3,000 feet on I-90, one of the busiest
  mountain passes in the country. People have been skiing here since the
  1930s.

  Tubing is easy for all ages, with no lessons needed. The pass can close in
  storms, and traction tires or chains may be required, so check WSDOT
  before you drive up.
