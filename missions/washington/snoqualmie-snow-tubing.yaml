short: Race each other down the snow tubing lanes at Snoqualmie Pass. The lift brings you back up.
description: >
  Grab a tube and fly down the groomed lanes at Snoqualmie Pass, no skiing
  skills needed, while a lift carries you back to the top for another run.
  Link your tubes and spin down together, then race side by side and keep
  score. Book a timed session ahead, since weekends sell out, and check the
  pass on WSDOT before you drive. Warm up with hot chocolate in the lodge
  after. The photo to get: you at the bottom of the lane, covered in snow.
about: >
  Skiers were heading up to Snoqualmie Pass by the 1920s and 30s, and Webb
  Moffett's ski area at the summit opened in 1937 with a rope tow. It became
  the nation's second night-skiing area, and in 1949 Ski Acres next door built
  the first chairlift in Washington.

  The pass sits at about 3,000 feet on I-90, one of the busiest mountain
  passes in the country. It can close in storms, and traction tires or chains
  may be required, so check WSDOT before you drive up.
