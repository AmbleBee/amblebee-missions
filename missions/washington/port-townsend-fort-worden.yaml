short: Explore Port Townsend's Victorian streets, then the old bunkers at Fort Worden. Bring a flashlight.
description: >
  Start in Port Townsend's Victorian downtown, with brick buildings, bookshops
  and an ice cream cone by the water. Then head to Fort Worden, an old army
  fort on the bluffs, and explore the dark concrete gun bunkers with a
  flashlight. Walk out to Point Wilson Lighthouse on the beach and get a photo
  of the two of you with the Olympic Mountains across the water. Each pick the
  Victorian house you'd live in on the drive out.
for_kids:
