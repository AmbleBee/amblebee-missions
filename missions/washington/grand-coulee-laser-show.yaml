short: Watch the free laser show light up the face of Grand Coulee Dam on a summer night.
description: >
  Visit one of the biggest concrete dams on Earth, a wall of concrete almost a
  mile long across the Columbia River. Tour the visitor center during the day,
  then stay for "One River, Many Voices," a free laser show projected onto the
  whole face of the dam after dark. Bring a blanket and snacks, get a spot on
  the lawn early, and get a photo of the two of you with the dam lit up. The
  show runs nightly from late May through September.
for_kids:
  short: Dam night! Find each thing.
  steps:
    - The giant dam
    - Water pouring down
    - A laser picture
    - A star
    - A selfie in the dark!
