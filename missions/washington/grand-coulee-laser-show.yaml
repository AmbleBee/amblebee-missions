short: Watch the free laser show light up the face of Grand Coulee Dam on a summer night.
description: >
  Visit one of the biggest concrete dams on Earth, a wall of concrete almost a
  mile long across the Columbia River. Tour the visitor center during the day,
  then stay for "One River, Many Voices," a free laser show projected onto the
  whole face of the dam after dark. Bring a blanket and snacks, get a spot on
  the lawn early, and get a photo of you with the dam lit up. The
  show runs nightly from late May through September.
about: >
  Grand Coulee Dam was built from 1933 to 1942, and it's about 550 feet tall
  and nearly a mile long. It's the largest power producer in the United
  States.

  Woody Guthrie wrote "Roll On, Columbia" and other songs about the dam in
  1941. The lake behind it, Lake Roosevelt, runs about 150 miles, and it
  also flooded Kettle Falls, a fishing place used by tribes for thousands of
  years.
