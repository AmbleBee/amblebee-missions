short: Wander Azalea Way in the Arboretum. Find the tree with the best color of the season.
description: >
  Walk the arboretum's trails and grassy Azalea Way through trees from all over
  the world. Spring brings blooming azaleas and cherries, fall brings fiery
  maples. Each find the tree with the best color today and photograph it. Add
  the Japanese Garden at the south end (it has its own small fee) for a quiet
  pond and koi.
for_kids:
