short: Wander Azalea Way in the Washington Park Arboretum and find the tree with the season's best color.
description: >
  Walk the Washington Park Arboretum's trails and grassy Azalea Way through
  trees from all over the world. Spring brings blooming azaleas, rhododendrons
  and cherries; fall brings fiery maples. Hunt for the single tree with the
  best color today. The photo to get: you under your winning tree. If you have
  time, follow the boardwalks out to Foster Island's marsh to look for ducks
  and herons, or add the Seattle Japanese Garden at the south end, which has
  its own small fee, for a quiet pond full of koi.
about: >
  The Washington Park Arboretum was founded in 1934 on land the city bought
  in 1900, with a park plan by the famous Olmsted Brothers landscape firm.
  It covers about 230 acres along the shore of Union Bay and is run by the
  University of Washington Botanic Gardens and Seattle Parks and Recreation,
  with trees and shrubs from around the world.

  Azalea Way, the grassy promenade through the middle of the park, started
  out as a horse-racing track before it was turned into a walking path in
  1934. The Arboretum Loop Trail circles the park in about two miles, and
  boardwalks lead out across the wetlands of Foster Island.

  At the south end, the 3.5-acre Seattle Japanese Garden opened in 1960,
  designed by Juki Iida. Spring and fall are the showiest seasons, but the
  arboretum is free and open year-round.
