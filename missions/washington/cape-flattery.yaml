short: Cape Flattery near Neah Bay. Walk the boardwalk to the far northwest tip of the lower 48.
description: >
  Walk the boardwalk trail through old cedar forest to the cliffs at the
  most northwestern point of the lower 48. From the viewing decks, look down
  into sea caves and out to Tatoosh Island and its lighthouse, and each keep
  watch for whales, sea lions and puffins. The photo to get: you
  on the last deck with Tatoosh behind you, the farthest corner of the map.
about: >
  The trail is about three-quarters of a mile each way, mostly on cedar
  planks and steps, ending at four lookout decks on the cliffs. It's on the
  Makah Reservation, so buy a Makah Recreation Pass in Neah Bay before you
  drive out, and stay on the trail.

  Captain James Cook named the cape in 1778. The lighthouse on Tatoosh
  Island has stood since 1857. Gray whales pass in spring and fall, and the
  cliffs are busy with seabirds most of the year.

  Save time for the Makah Museum in Neah Bay. It holds thousands of objects
  from Ozette, a Makah village buried by a mudslide about 500 years ago and
  uncovered in the 1970s, one of the most important finds of its kind in
  North America.
