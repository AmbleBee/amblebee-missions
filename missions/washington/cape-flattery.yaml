place:
  name: Cape Flattery trailhead, Makah Reservation
  area: Near Neah Bay, northwest tip of the Olympic Peninsula
  coords: [48.38450, -124.71500]  # APPROX: set at the trailhead parking lot before publishing
  website: https://makah.com/attractions/recreation-permits/
short: Hike the boardwalk to the far northwest tip of the lower 48. Look for whales and sea caves.
description: >
  Drive out to Neah Bay and walk the short boardwalk trail through the forest to
  the cliffs at the most northwestern point of the lower 48. From the viewing
  decks, look down into sea caves, out to Tatoosh Island and its lighthouse, and
  watch for whales, sea lions and seabirds. This is Makah land: buy a Makah
  Recreation Pass in Neah Bay first, stay on the trail, and stop by the Makah
  Museum in town.
for_kids:
