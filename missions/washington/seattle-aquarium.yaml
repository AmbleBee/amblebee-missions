short: Visit the Seattle Aquarium. Find the otters, and pick your favorite sea creature.
description: >
  Spend a rainy morning at the aquarium on the waterfront. Watch the sea otters,
  look into the big underwater dome and the touch pools, and each pick your
  favorite creature. Then walk the waterfront toward Pike Place.
about: >
  The Seattle Aquarium opened in 1977 on Pier 59. It focuses on the animals
  of Puget Sound and the Pacific Northwest, and its sea otters are the
  stars.

  The Ocean Pavilion, opened in 2024, added a big tropical reef across the
  street. The waterfront was rebuilt after the old Alaskan Way Viaduct came
  down, so the walk to Pike Place is much nicer now.
