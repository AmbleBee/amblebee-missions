short: Meet the sea otters at the Seattle Aquarium and pick your favorite sea creature.
description: >
  Spend a rainy morning at the Seattle Aquarium on the waterfront. Watch the
  sea otters and harbor seals play, sit inside the underwater dome while
  fish swim all around you, and reach into the touch pools to feel a sea
  star. Then cross the street to the Ocean Pavilion to stand in front of a
  giant window full of sharks and rays. Each pick your favorite creature of
  the day. The photo to get: everyone in front of the big shark window.
  Afterward, walk the waterfront up to Pike Place Market.
about: >
  The Seattle Aquarium opened in 1977 on Pier 59, and the pier building is
  now a city landmark. It focuses on the animals of Puget Sound and the
  Pacific Northwest: sea otters, river otters, harbor seals and northern fur
  seals are the stars. Its Underwater Dome is a 360-degree room sitting
  inside a 400,000-gallon tank, and the Window on Washington Waters, a
  120,000-gallon tank of salmon, rockfish and anemones, has divers giving
  talks several times a day.

  In 2024 the aquarium opened the Ocean Pavilion across the street, focused
  on the coral reefs of the Coral Triangle near Indonesia. Its main tank
  holds nearly 500,000 gallons, home to sharks and stingrays, and the
  aquarium also helps breed zebra sharks for release back into the wild.

  The waterfront was rebuilt after the old Alaskan Way Viaduct came down,
  and a new promenade and overpass now link the aquarium to Pike Place
  Market. Make a day of it with [[pike-place-picnic]].
