short: Explore the MAC in Spokane, then tour the 1898 Campbell House mansion next door.
description: >
  Explore the region's big museum of art, history and Indigenous culture,
  with rotating art shows and one of the country's great collections of
  Plateau tribal beadwork and baskets. Then walk next door into the Campbell
  House, an 1898 mansion from Spokane's mining-boom days, and wander the
  rooms. Each pick the room you'd claim as yours. Afterward, stroll the old
  mansions of Browne's Addition and get a photo of the two of you on one of
  the grand porches. Open Tuesday through Sunday; the Campbell House has
  shorter afternoon hours.
