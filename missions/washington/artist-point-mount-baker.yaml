short: Artist Point at the end of the Mount Baker Highway. Stand between two giant peaks.
description: >
  Drive to the very end of the Mount Baker Highway, where the road climbs
  above the trees to Artist Point, with Mount Baker on one side and jagged
  Mount Shuksan on the other. Walk the short Artist Ridge loop and find the
  spot where you can see both peaks in one shot. On the way back, stop at
  Picture Lake for the classic photo: you with Shuksan reflected
  in the water behind you.
about: >
  Artist Point sits about 5,100 feet up in the Heather Meadows area, at the
  end of State Route 542. The last stretch of road is usually snowed in until
  around mid-July and closes again with the first big snow in fall, so the
  window is short. Check WSDOT before you go.

  Artist Ridge is an easy loop of about a mile with views the whole way. For
  more, the Table Mountain trail climbs steeply onto a flat-topped lava
  plateau. Picture Lake is just down the road, and Mount Shuksan reflected
  in it is one of the most photographed mountain views in the country. Go
  early on a still morning for the best mirror.

  Parking needs a Northwest Forest Pass or an Interagency (America the
  Beautiful) pass. Patches of snow can linger on the trails well into
  August.
for_kids:
  short: Mountain hunt! Find each thing.
  steps:
    - A snowy mountain
    - A mountain in a lake
    - A patch of snow
    - A marmot or chipmunk
    - A selfie on the trail!
