short: Walk the Spruce Railroad Trail to the Devil's Punchbowl bridge. Photo over the blue water.
description: >
  Follow the old railroad grade along the north shore of Lake Crescent to the
  little bridge over Devil's Punchbowl, a cove of unbelievably clear blue water.
  Peek into the old train tunnel nearby. In summer, wade in from the shore if
  you're brave; the water is freezing. Skip jumping off the bridge, which has
  killed people.
