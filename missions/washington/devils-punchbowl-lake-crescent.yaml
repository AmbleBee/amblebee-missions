short: Walk the Spruce Railroad Trail to the Devil's Punchbowl bridge over Lake Crescent's blue water.
description: >
  Follow the old railroad grade along the north shore of Lake Crescent to the
  little bridge over Devil's Punchbowl, a cove of unbelievably clear blue
  water. Keep going a bit farther to walk through the restored McFee Tunnel,
  blasted for the railroad more than a century ago. In summer, wade in from
  the shore if you're brave; the water is freezing. Skip jumping off the
  bridge, which has killed people. The photo to get: you on the bridge with
  the blue water below.
about: >
  The Spruce Railroad was built during World War I to haul spruce for
  airplane frames, but it wasn't finished until 1919, a year too late for
  the war. It was abandoned in 1951. Today its grade is the Spruce Railroad
  Trail, about 4 miles one way, rebuilt so hikers, bikes and wheelchairs can
  all use it. The 450-foot McFee Tunnel reopened in 2017, and the shorter
  Daley-Rankin Tunnel in 2020. The trail is part of the 134-mile Olympic
  Discovery Trail.

  Lake Crescent is about 600 feet deep. Glaciers carved its valley during
  the last Ice Age, and a landslide later dammed it into a lake. Its water
  has so little nitrogen that almost no algae grows, which is why it's so
  clear and blue. It's also home to the Beardslee trout, found nowhere else.

  The lake has its own famous mystery: the Lady of the Lake, a woman who
  vanished in 1937 and was found years later, preserved by the icy water.
