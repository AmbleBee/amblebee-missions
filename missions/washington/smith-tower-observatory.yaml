short: Smith Tower in Seattle. Ride the old brass elevator up for a drink on the 35th-floor deck.
description: >
  Ride a hand-operated brass elevator up Seattle's oldest skyscraper to the
  35th-floor Observatory, a Prohibition-style bar wrapped in an open-air
  deck. Order a drink, walk the deck all the way around, and see who spots
  a ferry, the stadiums and the Space Needle first. The photo to get: you
  against the city at dusk.
about: >
  Smith Tower opened in 1914, built by typewriter maker Lyman C. Smith, and
  it was the tallest building west of the Mississippi for years. Its
  elevators are still run by operators, among the last of their kind on
  the West Coast.

  Inside the Observatory, look for the carved "Wishing Chair." Legend says
  anyone single who sits in it will be married within a year. Admission
  needs a ticket, and the bar is first come, first served, so a weeknight
  is quieter.
