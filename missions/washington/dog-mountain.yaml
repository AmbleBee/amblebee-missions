  name: Dog Mountain Trailhead
  area: Columbia River Gorge, Washington side (SR 14)
  coords: [45.69940, -121.70830]  # APPROX: set at the trailhead before publishing
short: Climb Dog Mountain in spring for the meadows of yellow balsamroot.
description: >
  One of the Gorge's hardest classic hikes, rewarded in spring with hillsides
  covered in yellow balsamroot and big views over the Columbia. Bring lots of
  water and take it slow. On spring weekends you need a permit to park at the
  trailhead, or you can take the shuttle instead.
about: >
  Dog Mountain tops out at about 2,950 feet, and the trail climbs around
  2,800 feet to get there. The big meadows near the summit are covered in
  yellow arrowleaf balsamroot, with peak bloom usually in May.

  Weekend permits in spring were added to ease crowding and parking along
  Highway 14. The summit is often windy, so bring a layer even on a warm
  day.
