short: Climb Dog Mountain in spring for the meadows of yellow balsamroot.
description: >
  Climb Dog Mountain on the Washington side of the Columbia River Gorge, one
  of the Gorge's hardest classic hikes: steep and steady the whole way. In
  spring the upper slopes turn yellow with balsamroot wildflowers, with big
  views up and down the Columbia. Bring lots of water, take it slow, and pick
  a spot at the top for lunch. On spring weekends you need a permit to park at
  the trailhead, or you can take the shuttle instead. The photo to get: you in
  the wildflowers with the river far below.
about: >
  Dog Mountain tops out at about 2,950 feet, and the trail climbs around
  2,800 feet to get there. The big meadows near the summit are covered in
  yellow arrowleaf balsamroot, with peak bloom usually in May.

  Weekend permits in spring were added to ease crowding and parking along
  Highway 14. The summit is often windy, so bring a layer even on a warm
  day.
