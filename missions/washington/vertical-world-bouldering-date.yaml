short: Boulder together at the gym from the folks who opened America's first. Cheer every send.
description: >
  Vertical World opened America's first climbing gym in Seattle in 1987, and today
  its Commodore Way gym welcomes total beginners to just show up and boulder: short
  walls, no ropes, no class needed. Buy two day passes, rent climbing shoes, and
  pick easy problems to work out together, taking turns coaching each other on
  where to put your feet, and rest between tries. Get a photo of your partner at the
  top of their best climb. Everyone, even people just watching, needs a waiver, so
  fill it out online before you go; the roped walls need a belay check or an intro
  class first.
