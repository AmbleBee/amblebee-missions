short: Boulder together at Vertical World, the folks behind America's first climbing gym.
description: >
  Bouldering is climbing on short walls with no ropes and no class needed,
  which makes it a perfect first-try date. Buy two day passes, rent climbing
  shoes, and pick the easiest problems on the wall. Work them out together,
  taking turns coaching each other on where to put your hands and feet, and
  rest between tries. Cheer every send, even the tiny ones. The photo to get:
  your partner at the top of their best climb, grinning. Everyone, even
  people just watching, needs a waiver, so fill it out online before you go.
  The roped walls need a belay check or an intro class first.
about: >
  Vertical World opened the very first rock climbing gym in America in 1987,
  in a run-down warehouse on Elliott Avenue in Seattle. Founders Rich
  Johnston and Dan Cauthorn helped start a sport that now has gyms in nearly
  every city, and their Commodore Way gym in Magnolia carries on the
  tradition with bouldering and roped walls for every level.

  Bouldering problems are graded on the V scale, starting at V0 for total
  beginners and climbing into the teens for the world's best. Gyms reset
  their routes often, so there's always something new to try, and sore
  forearms the next day are part of the fun.

  Make an afternoon of it: the Ballard Locks are a few minutes away, where
  boats are lifted between Puget Sound and the lakes, and salmon climb the
  fish ladder in summer.
