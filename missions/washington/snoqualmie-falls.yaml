short: Watch Snoqualmie Falls thunder down 268 feet. Hike to the bottom and feel the spray.
description: >
  Start at the upper viewing deck for the classic view of the falls dropping
  into the gorge, with the historic lodge perched on the edge. Then take the
  steep trail down to the river and the lower viewpoint, where the spray can
  soak you in spring. Grab something warm at the lodge after. Winter and
  spring have the most water. The photo to get: you on the upper deck with the
  falls behind you.
about: >
  Snoqualmie Falls drops about 268 feet, roughly 100 feet more than Niagara.
  In 1898, Charles Baker built a power plant carved into the rock behind it,
  one of the first underground power plants in the world.

  The falls are a sacred place for the Snoqualmie Tribe. The lodge on the
  edge is the Salish Lodge, famous from the opening of the TV show Twin
  Peaks.
