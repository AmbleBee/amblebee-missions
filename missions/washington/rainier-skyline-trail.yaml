short: Hike the Skyline Trail loop to Panorama Point. Lunch with Mount Rainier right in front of you.
description: >
  A real day hike: the Skyline Trail loops about five and a half miles up from
  Paradise through wildflower meadows to Panorama Point, with glaciers, marmots
  and Mount Rainier filling the view, plus Mount Adams and Mount St. Helens on a
  clear day. Eat lunch at the top, and get a photo with the mountain right
  behind you. Snow can linger on the upper trail into July, so check conditions
  and turn back if it's icy. Start early; Paradise parking fills fast.
