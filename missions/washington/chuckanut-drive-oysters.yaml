short: Drive Chuckanut's cliffside curves, then eat oysters fresh from Samish Bay at sunset.
description: >
  Drive Chuckanut Drive, a winding road carved into the cliffs above Samish
  Bay, with the San Juan Islands floating out on the water. Stop at the pullouts
  for the views, then pull in at the Taylor Shellfish farm right on the bay.
  Get oysters and clams straight from the water and eat them at the picnic
  tables by the shore as the sun goes down behind the islands. Take turns
  shucking (carefully) and get a photo of the two of you with your oysters and
  the sunset. Check the farm's hours before you go.
