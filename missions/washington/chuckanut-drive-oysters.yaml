short: Drive Chuckanut's cliffside curves, then eat oysters fresh from Samish Bay at sunset.
description: >
  Drive Chuckanut Drive, a winding road carved into the cliffs above Samish
  Bay, with the San Juan Islands floating out on the water. Stop at the
  pullouts for the views, then pull in at the Taylor Shellfish farm right on
  the bay. Order a tray of freshly shucked oysters, or grab some shellfish to
  throw on the grill, and eat at the waterfront picnic tables as the sun goes
  down behind the islands. Each pick your favorite oyster of the night. The
  photo to get: the two of you with your oysters and the sunset over the bay.
  Outside food and drinks aren't allowed, and parking is limited.
about: >
  Chuckanut Drive, State Route 11, runs about 21 miles between Burlington and
  Bellingham's Fairhaven district. Its cliffside section opened as a gravel
  road in 1916 and was paved in 1921, and it's now an official state scenic
  byway, often called one of the prettiest drives in Washington. Along the
  way, Larrabee State Park is the oldest state park in Washington, with
  trails down to rocky coves and tide pools.

  The Taylor family has farmed shellfish in Washington since the 1890s.
  Samish Bay's tide flats are shallow and wide, so the water goes out a long
  way at low tide, which is when the oysters are harvested. At the Samish
  farm you can eat them right beside the beds they came from.

  Go on a clear evening for the sunset over the San Juan Islands, and leave
  time to wander Fairhaven's old brick streets at the north end of the drive.
