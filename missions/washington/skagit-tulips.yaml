short: Walk the rainbow rows of the Skagit tulip fields in April. Get there early and wear boots.
description: >
  Every April the fields of the Skagit Valley turn into stripes of red,
  yellow, pink and purple, with Mount Baker on the horizon. Walk the rows at
  one of the big farms, each pick a favorite color, and get a photo of you in the middle of the flowers. Bloom timing changes with the weather,
  so check the bloom map before you go. Go early on a weekday to beat the
  traffic, and wear boots, since the fields get muddy.
about: >
  The Skagit Valley Tulip Festival began in 1984. Skagit County grows more
  tulip bulbs than any other county in the US, thanks to rich soil left by
  the river.

  Roozengaarde is run by the Roozen family, who brought their bulb business
  from the Netherlands. Fields change each year as farmers rotate crops, so
  the best rows move around.
for_kids:
