short: Hike to Sol Duc Falls in the old-growth forest, then soak in the hot springs pools.
description: >
  Walk an easy mile through cathedral-like old-growth forest to Sol Duc Falls,
  where the river splits and pours into a narrow mossy canyon, and get a photo
  of you on the bridge over the falls. Then soak in the mineral hot
  springs pools at the resort just down the road, with the rainforest all
  around you. The pools are seasonal, roughly spring through fall, and fill up
  on weekends, so reserve a soak time ahead. You'll need a park entrance pass.
