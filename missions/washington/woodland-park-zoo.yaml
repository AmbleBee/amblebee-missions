short: Explore Woodland Park Zoo and each find the animal that's most like someone else.
description: >
  Spend a day wandering Woodland Park Zoo's savanna, tropical rain forest and
  northwest trail. Watch the giraffes and lions on the African Savanna, the
  gorillas in the rain forest, the tigers in Banyan Wilds and the grizzly
  bears fishing in their stream. Along the way, everyone secretly picks the
  animal that's most like someone else in the group, then reveals and
  explains their picks over a snack. The photo to get: each person next to
  the animal they got picked as. On the way out, walk the free rose garden
  by the entrance.
about: >
  Woodland Park Zoo began in 1899 as a small menagerie on Guy Phinney's
  estate, after his widow sold the land to the city. Today it covers 92
  acres in north Seattle, with hundreds of species and more than a million
  visitors a year.

  In the 1970s the zoo helped invent "landscape immersion," building
  habitats that look like the animals' real homes instead of cages. Its
  gorilla habitat, redesigned under director David Hancocks in the late
  1970s, became a model for zoos around the world. Today's highlights
  include the African Savanna, the Tropical Rain Forest, Banyan Wilds with
  Malayan tigers and sloth bears, and the Living Northwest Trail with
  grizzlies.

  The Woodland Park Rose Garden next door is free to walk, and in summer
  the ZooTunes concert series has been bringing music to the zoo's lawn
  since 1983.
