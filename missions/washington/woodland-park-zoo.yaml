short: Visit Woodland Park Zoo. Each find the animal most like the other.
description: >
  Spend a day wandering the zoo's forests, savanna and tropical rain forest.
  Watch the grizzlies and the snow leopards, and each find the animal that's
  most like the other person. Explain your pick over a snack, then walk the rose
  garden by the entrance on the way out.
about: >
  The land was once Guy Phinney's private estate, which the city bought in
  1899. The zoo became a leader in naturalistic exhibits in the 1970s,
  putting animals in settings that look like their real homes.

  Its gorilla exhibit, opened in 1979, was one of the first of its kind. The
  rose garden next door has been there since the 1920s and is free to walk.
