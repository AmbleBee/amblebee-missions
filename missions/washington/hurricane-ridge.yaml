short: Drive up to Hurricane Ridge for the Olympic Mountains. Spot a deer or marmot in the meadows.
description: >
  Drive the winding road up to Hurricane Ridge, a mile up in the Olympic
  Mountains, and walk one of the short meadow trails for a wall of snowy peaks
  on one side and the Strait of Juan de Fuca on the other. Keep an eye out for
  deer and marmots. There's no lodge or indoor facilities anymore (it burned
  in 2023), so bring water, food and layers. In winter the road is usually
  only open Friday through Sunday, weather permitting. The photo to get: you
  on a meadow trail with the snowy Olympics behind you.
about: >
  Hurricane Ridge sits at about 5,240 feet and is named for its strong
  winds. The Olympics are home to plants and animals found nowhere else,
  like the Olympic marmot, because the range was cut off by ice during the
  ice ages.

  The day lodge burned down in 2023. Olympic National Park was created in
  1938. Drivers should carry chains in winter, and it's often clear up top
  when Port Angeles is in clouds.
