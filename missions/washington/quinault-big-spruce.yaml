  area: Lake Quinault, Olympic Peninsula
  coords: [47.46560, -123.86160]  # APPROX: set at the trailhead before publishing
short: Walk to the world's largest Sitka spruce. See how many of you it takes to hug it.
description: >
  Take the short trail off South Shore Road near Lake Quinault, on the Olympic
  Peninsula, to a giant Sitka spruce more than a thousand years old, billed as
  the largest spruce in the world. Stand at its base to see how tiny you are,
  and try a group hug around the trunk to see how many people it takes. Then
  explore the mossy rainforest trails around the lake. The photo to get: your
  whole crew at the base of the tree, tiny against the trunk.
about: >
  The Big Spruce is a Sitka spruce about 1,000 years old, around 190 feet
  tall and nearly 60 feet around its base. It sits in the Quinault Valley,
  known as the Valley of Rain Forest Giants.

  The valley gets about 12 feet of rain a year. Lake Quinault Lodge, built
  in 1926, hosted Franklin D. Roosevelt in 1937, a visit that helped lead to
  Olympic National Park being created the next year.
