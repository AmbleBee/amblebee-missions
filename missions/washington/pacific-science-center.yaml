short: Explore Pacific Science Center. Walk through the butterfly house and catch a laser show.
description: >
  Spend a few hours with the hands-on science exhibits, the dinosaurs, and the
  tropical butterfly house, where butterflies might land on you. Reserve a
  planetarium or laser show (included, but they fill up), and each find the
  exhibit that blew your mind. Photo under the white arches with the Space
  Needle behind you.
about: >
  The Pacific Science Center was built as the United States Science Pavilion
  for the 1962 Seattle World's Fair. Its white arches were designed by
  Minoru Yamasaki, who later designed New York's World Trade Center.

  After the fair it became one of the first science centers in the country.
  The butterfly house is warm and humid all year, a good escape from Seattle
  rain.
