short: Watch storm waves crash at Cape Disappointment, where Lewis and Clark reached the Pacific.
description: >
  Stand on the cliffs where the Columbia River meets the Pacific, one of the
  most dangerous river mouths in the world. Visit the interpretive center
  where Lewis and Clark's journey ended, walk the trail to the Cape
  Disappointment Lighthouse, and drive up to North Head Lighthouse for the
  view down the long beach. Come in winter to watch the storm waves crash
  over the jetty. Get a photo of the two of you by a lighthouse, then grab
  fish and chips in Ilwaco. Parking takes a Discover Pass.
