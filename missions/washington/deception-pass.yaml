short: Walk Deception Pass Bridge, 180 feet above a churning tidal channel, then hit the beach.
description: >
  Walk out onto the narrow sidewalk of Deception Pass Bridge and look straight
  down at the tide racing through the channel about 180 feet below, sometimes
  spinning into whirlpools. Hold the rail and keep kids close; traffic runs
  right beside you. Then take the trail down to North Beach or Rosario Beach,
  climb the driftwood, and watch for seals and eagles. Come at sunset for the
  best light. The photo to get: you on the bridge with the swirling water far
  below. State park lots need a Discover Pass.
about: >
  Deception Pass Bridge opened on July 31, 1935, linking Whidbey Island to
  Fidalgo Island. It's really two spans, one over Canoe Pass and one over
  Deception Pass, meeting on little Pass Island in the middle. Workers from
  the Civilian Conservation Corps helped build it, and it's on the National
  Register of Historic Places. At peak tide the current through the pass
  runs up to about 9 knots, fast enough to make whirlpools.

  The name goes back to 1792, when Joseph Whidbey, Captain George
  Vancouver's navigator, found that what the charts showed as a small bay
  was actually a deep, turbulent channel. Whidbey was an island after all,
  and Vancouver named the pass for how it had fooled them.

  Deception Pass is Washington's most visited state park, with more than 3
  million visitors a year. At Rosario Beach, a carved story pole tells the
  Samish legend of the Maiden of Deception Pass, and the CCC-built shelters
  at North Beach and Cranberry Lake are historic in their own right.
