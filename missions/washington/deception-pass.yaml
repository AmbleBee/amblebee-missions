place:
  name: Deception Pass State Park (bridge parking)
  area: Between Whidbey and Fidalgo Islands
  coords: [48.40600, -122.64500]  # APPROX: set at the bridge pullout before publishing
  website: https://parks.wa.gov  # verify: link the Deception Pass park page
short: Walk across Deception Pass Bridge, 180 feet over a churning tidal channel. Then hit the beach.
description: >
  Walk out onto the narrow sidewalk of Deception Pass Bridge and look straight
  down at the tide rushing through the channel nearly 180 feet below. Hold the
  rail and get a photo of the two of you with the water swirling under you.
  Then take the trail down to the beach at Rosario or North Beach, climb the
  driftwood, and watch for seals. Come at sunset for the best light. State park
  lots take a Discover Pass.
for_kids:
  short: Bridge hunt! Find each thing.
  steps:
    - The big green bridge
    - Swirling water
    - A boat
    - A piece of driftwood
    - A selfie on the bridge!
