short: Drive up Steptoe Butte at sunrise and watch the light roll across the Palouse hills.
description: >
  Drive the road that spirals to the top of Steptoe Butte, an island of old
  rock rising over the rolling farm hills of the Palouse. Get there before
  sunrise and watch the first light roll across miles of wheat fields, the
  patterns of green or gold changing with every minute. Bring coffee and a
  blanket, it's windy up top, and get a photo of the two of you with the
  hills glowing below. Late spring is greenest and late summer is golden.
  Parking takes a Discover Pass.
