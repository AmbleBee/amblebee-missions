short: Sullivan Lake near Metaline Falls, WA. Hike the shore and look up for bighorn sheep.
description: >
  Hike the trail along the shore of a long, clear mountain lake ringed by
  forest, as far as you like. Scan the steep slopes of Hall Mountain, and
  whoever spots the first bighorn sheep picks the lunch beach. Then find a
  flat stone and have a rock-skipping contest. The photo to get: you with
  the lake behind you.
about: >
  Sullivan Lake is in the far northeast corner of Washington, in the
  Colville National Forest. Hall Mountain above it is home to one of eastern
  Washington's biggest herds of bighorn sheep.

  The full shoreline trail is about 8 miles round trip. The second half of
  October is the prettiest time, when the larches on the slopes turn gold;
  they're conifers that lose their needles each fall. It's remote, so fill
  up on gas and expect no cell service.
