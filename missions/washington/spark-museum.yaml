short: Watch the MegaZapper throw lightning at SPARK in Bellingham. Each pick the coolest old gadget.
description: >
  Wander through centuries of electrical inventions, from glowing early radios
  to old telephones and odd machines, then catch the MegaZapper show, when a
  giant Tesla coil throws real lightning bolts across the room. Each pick the
  gadget you'd want in your house and get a photo of you by the
  big coil. The show runs on select days and often sells out, so buy tickets
  ahead. It isn't recommended for kids under 5. Make a day of it with dinner
  in downtown Bellingham.
about: >
  SPARK began in 1985 as Jonathan Winter's collection of antique radios,
  opened as a radio museum in 1998, and moved into its 23,000-square-foot home
  downtown in 2001. Today it covers electrical invention from the 1600s to the
  radio age.

  The MegaZapper is an 8-foot Tesla coil that throws 4 million volts. The
  museum says the show is safe for the audience, though it's loud and bright.
  Downtown Bellingham has plenty of restaurants and breweries nearby.
