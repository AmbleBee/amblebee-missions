short: Watch the MegaZapper throw lightning at SPARK in Bellingham. Each pick the coolest old gadget.
description: >
  Wander through centuries of electrical inventions, from glowing early radios
  to old telephones and odd machines, then catch the MegaZapper show, when a
  giant Tesla coil throws real lightning bolts across the room. Each pick the
  gadget you'd want in your house and get a photo of the two of you by the
  big coil. The show runs on select days and often sells out, so buy tickets
  ahead. It isn't recommended for kids under 5. Make a day of it with dinner
  in downtown Bellingham.
