short: Stand inside a full-size Stonehenge above the Columbia Gorge, then explore the Maryhill Museum.
description: >
  Walk into a full-size concrete copy of Stonehenge, built as a World War I
  memorial on a windy bluff high above the Columbia River. Stand on the altar
  stone in the center, which lines up with sunrise on the summer solstice.
  Then drive down to the Maryhill Museum of Art, a castle-like mansion in the
  middle of nowhere, full of Rodin sculptures, hundreds of chess sets and
  treasures from the Queen of Romania. Pick your favorite chess set. The
  photo to get: you framed between the giant stones with the gorge behind.
  Stonehenge is free; the museum is seasonal, roughly spring to fall.
about: >
  Sam Hill, a road builder and businessman, built this Stonehenge as the
  first memorial in the United States to the dead of World War I, honoring
  the soldiers and sailors of Klickitat County. It was dedicated on July 4,
  1918, and finished in 1929. Hill, a Quaker, believed the original
  Stonehenge had been a place of sacrifice, and he built his copy as a
  reminder that people are still sacrificed to war. He's buried on the bluff
  just below it.

  A few miles west, Hill's unfinished mansion became the Maryhill Museum of
  Art. Queen Marie of Romania dedicated it in 1926, and it opened to the
  public in 1940, on Hill's birthday. It holds more than 70 works by Rodin,
  including a version of The Thinker, more than 300 chess sets from around
  the world, and tiny fashion mannequins from France's postwar Theatre de la
  Mode.

  Hill also built the Peace Arch at the Canadian border. Bring a jacket: the
  wind on the bluff is fierce.
