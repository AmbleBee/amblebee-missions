short: Stand inside a full-size Stonehenge over the Columbia Gorge. Then explore the Maryhill museum.
description: >
  Walk into a full-size concrete copy of Stonehenge, built as a World War I
  memorial on a windy bluff high above the Columbia River. Stand in the center
  and get a photo of you framed by the giant stones. Then drive
  down to the Maryhill Museum of Art, a castle-like mansion in the middle of
  nowhere, full of Rodin sculptures, chess sets and a royal collection from
  Romania. Stonehenge is free; the museum is seasonal, roughly spring to fall.
about: >
  Sam Hill, a road builder and businessman, built the Stonehenge copy as the
  first World War I memorial in the country. It was dedicated in 1918 and
  honors Klickitat County soldiers who died in the war. Hill is buried
  nearby.

  His mansion became the Maryhill Museum of Art. Queen Marie of Romania
  dedicated it in 1926, and it opened in 1940. Hill also built the Peace
  Arch at the Canadian border.
