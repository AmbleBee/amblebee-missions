short: Walk through rooms of giant blown glass, then the glass garden under the Space Needle.
description: >
  Wander gallery after gallery of Dale Chihuly's huge, wildly colored glass
  sculptures, then step into the Glasshouse and out to the garden, where glass
  grows among the real plants with the Space Needle overhead. Each pick the piece
  you'd want in your living room. Go near dusk if you can; the garden glows as
  the light fades.
about: >
  Dale Chihuly was born in Tacoma in 1941 and became the best-known glass
  artist in the world. After losing the sight in one eye in a 1976 car
  accident, he began leading teams of glassblowers instead of blowing every
  piece himself.

  The exhibit opened in 2012 on the grounds of the 1962 World's Fair. The
  Glasshouse is about 40 feet tall, with a 100-foot-long sculpture in red,
  orange and yellow hanging from the ceiling.
