short: Walk through rooms of giant blown glass, then the glass garden under the Space Needle.
description: >
  Wander gallery after gallery of Dale Chihuly's huge, wildly colored glass
  sculptures, then step into the Glasshouse and out to the garden, where glass
  grows among the real plants with the Space Needle overhead. Each pick the piece
  you'd want in your living room. Go near dusk if you can; the garden glows as
  the light fades.
