place:
  name: Front Street Park, Leavenworth
  area: Downtown Leavenworth
  coords: [47.59640, -120.66130]  # APPROX: set at Front Street Park before publishing
short: Walk Leavenworth's Bavarian village lit with half a million lights. Mulled cider in hand.
description: >
  After dark, the whole Bavarian-style town glows with half a million lights.
  Wander Front Street with something warm to drink, listen for carolers, and
  each pick your favorite lit-up building. Christmastown festivities run from
  Thanksgiving to Christmas Eve, but the lights stay on through February, and
  January and February are far less crowded. December weekends get packed, so
  go midweek if you can.
for_kids:
