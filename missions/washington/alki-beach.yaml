  coords: [47.57900, -122.41000]  # APPROX: set at the Alki Statue of Liberty replica before publishing
short: Walk Alki Beach at sunset, find the mini Statue of Liberty, and watch the ferries cross.
description: >
  Head to West Seattle's long city beach and walk the promenade as the sun
  drops behind the Olympic Mountains across the water. Find the little Statue
  of Liberty replica, watch the ferries go by, and grab fish and chips or ice
  cream from a shop across the street. For a bonus, take the water taxi over
  from downtown and get the skyline view from the boat.
