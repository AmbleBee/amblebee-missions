short: Alki Beach in West Seattle at sunset. Find the mini Statue of Liberty and count the ferries.
description: >
  Walk the Alki Beach promenade as the sun drops behind the Olympic Mountains
  across the water. Find the little Statue of Liberty, count the ferries
  crossing the Sound, and grab fish and chips or ice cream from across the
  street. The photo to get: your silhouettes against the sunset at the
  water's edge. Bonus: ride the water taxi over from downtown for the skyline
  view from the boat.
about: >
  Alki is where Seattle began. The Denny Party landed on this beach in
  November 1851, and a small stone monument on the promenade marks the
  "Birthplace of Seattle."

  The Statue of Liberty replica was first put up by the Boy Scouts in 1952.
  The one you see today is a bronze replacement, set in a small plaza near
  the beach.

  The King County Water Taxi runs from downtown to Seacrest Park, about two
  miles up the shore from the main beach. Walk the waterfront path or catch
  the shuttle bus that meets the boat. Parking along Alki Avenue fills up
  fast on sunny evenings.
