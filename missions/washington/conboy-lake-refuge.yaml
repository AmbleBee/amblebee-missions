short: Walk the Willard Springs Trail at Conboy Lake and listen for sandhill cranes under Mount Adams.
description: >
  Walk an easy 3.5-mile loop through meadows, marsh and ponderosa pines in a
  quiet valley right under Mount Adams. Stop at the observation platform for
  the best view of the mountain, and listen for the rattling calls of sandhill
  cranes, which nest here in spring and summer. Watch for bald eagles and
  hawks too, and keep a count of every bird you spot. It's free, and fall
  brings golden aspens and larches. Afterward, go for huckleberry pie in
  nearby Trout Lake. The photo to get: you on the platform with Mount Adams
  behind you.
about: >
  Conboy Lake National Wildlife Refuge was set up in 1964 and covers about
  7,000 acres at the foot of Mount Adams, which rises to 12,281 feet. Early
  settlers drained the old Conboy and Camas lakes for farmland, and today the
  refuge is a patchwork of shallow seasonal marsh, grassland and pine forest
  that fills with snowmelt in spring and dries into meadow by late summer.

  It's one of the few places in Washington where greater sandhill cranes
  nest. In spring you may spot their fuzzy chicks, called colts, near the
  headquarters and along the nearby roads. The refuge is also home to the
  rare Oregon spotted frog and to bald eagles, and the historic
  Whitcomb-Cole hewn log house is a reminder of the valley's homestead days.

  Early mornings are best for birds. Trout Lake, a few miles away, is known
  for wild huckleberries in late summer.
