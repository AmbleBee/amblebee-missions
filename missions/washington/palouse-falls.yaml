short: See Palouse Falls plunge 200 feet into a basalt canyon in Washington's dry east side.
description: >
  Make the drive out to Washington's dry east side, where the Palouse River
  suddenly drops about 200 feet into a huge basalt canyon. Walk the short
  overlook trail and then wander the other viewpoints to find your favorite
  angle. Stay behind the railings and on the official viewpoints; the canyon
  rim is crumbly and dangerous. Spring has the most water. The photo to get:
  you at the overlook with the falls and the canyon walls behind you.
about: >
  Palouse Falls drops about 200 feet into a canyon nearly 380 feet deep. The
  canyon was carved by the Ice Age Missoula Floods, enormous floods that
  burst out of a glacial lake in Montana again and again and scoured the
  basalt of eastern Washington into the Channeled Scablands. About four
  miles downstream, the Palouse River joins the Snake River.

  In 2014 Palouse Falls became Washington's official state waterfall, after
  elementary school students from nearby Washtucna proposed it to the
  legislature. In 2009 the kayaker Tyler Bradt paddled over the falls, setting
  an unofficial world record for the highest waterfall ever run.

  The park is small and remote, with no services nearby, so bring water,
  snacks and a full tank of gas. A Discover Pass is needed to park. Spring
  and early summer have the most water, and late afternoon light makes the
  canyon walls glow.
