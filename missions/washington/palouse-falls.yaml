  name: Palouse Falls State Park
  area: Eastern Washington, near Washtucna
  coords: [46.66350, -118.22350]  # APPROX: set at the park parking before publishing
short: See Palouse Falls drop into its canyon. Stay behind the railings for the photo.
description: >
  Make the drive out to the dry east side to see a waterfall plunging into a
  huge basalt canyon. Walk the short overlook trails and find your favorite
  angle. Stay on the official viewpoints; the canyon rim is dangerous. Spring
  has the most water.
about: >
  Palouse Falls drops about 198 feet into a canyon carved by the ice age
  Missoula Floods, which roared across eastern Washington more than 15,000
  years ago.

  It became Washington's official state waterfall in 2014, after a class of
  schoolkids pushed for it. The park is small, with no services nearby, so
  bring water and snacks. Spring and early summer have the most water.
