short: Have a slow dinner at Mizuna in downtown Spokane. Each pick a wine for the other.
description: >
  Settle in for dinner at Mizuna, a downtown Spokane favorite for seasonal
  Northwest food made from local farms, in a cozy old brick building. Order
  for each other one course, and each pick a glass of wine you think the other
  will love from the long list. In summer, ask for a table on the hidden patio
  in the alley. Afterward, walk a few blocks to Riverfront Park and the falls
  lit up at night. Reserve ahead on weekends. The photo to get: the two of you
  clinking the glasses you picked for each other.
about: >
  Mizuna opened in 1996 as a vegetarian restaurant, named for the Japanese
  mustard green in its salads, inside the Bennett Block, a brick building put
  up after the Great Spokane Fire of 1889. It added meat and seafood later and
  is now on its third set of owners.

  Spokane grew around the falls of the Spokane River. In 1974 it hosted Expo
  '74, the first World's Fair with an environmental theme, which turned old
  rail yards into Riverfront Park. The Davenport Hotel, from 1914, is a short
  walk away and worth peeking into.
