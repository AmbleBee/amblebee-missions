short: Picnic by the rusted towers of Gas Works Park, then climb the hill for the Seattle skyline.
description: >
  Wander among the old rusted towers of Seattle's former gas plant, then
  climb the big grassy hill for the view across Lake Union to downtown and
  the Space Needle. At the top, stand on the sundial and use your own shadow
  to tell the time. Bring a blanket and a snack, watch the seaplanes and
  sailboats out on the lake, and stay for sunset if you can. The photo to
  get: you on the hill with the towers and the skyline behind you.
about: >
  From 1906 to 1956 this point on Lake Union was a plant that made gas for
  Seattle, first from coal and later from oil. When the city turned it into
  a park, landscape architect Richard Haag made a bold choice: instead of
  tearing the plant down, he kept the rusted towers as giant sculptures. The
  park opened in 1975, and it holds the last remaining coal gasification
  plant in the United States. It joined the National Register of Historic
  Places in 2013.

  The big mound, often called Kite Hill, is one of the best places in the
  city to fly a kite. The sundial at the top, by artists Chuck Greening and
  Kim Lazare, uses you as its pointer. The old pump house is now a covered
  play barn. You may recognize the park from the movies Singles and 10
  Things I Hate About You.

  On the Fourth of July, Gas Works hosts one of Seattle's big fireworks
  shows over the lake, so expect crowds that night. The Burke-Gilman Trail
  runs right past the park if you'd rather arrive by bike.
