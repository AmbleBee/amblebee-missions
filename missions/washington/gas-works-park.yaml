short: Picnic by the rusted towers at Gas Works Park. Climb the hill for the skyline.
description: >
  Explore the old rusted gas plant towers, then climb Kite Hill for the view
  across Lake Union to downtown. Bring a blanket and a snack, watch the
  seaplanes take off, and stay for sunset if you can.
about: >
  The plant made gas for Seattle from coal, then oil, from 1906 until 1956.
  The city turned it into a park that opened in 1975, keeping the towers
  instead of tearing them down, which was a bold idea at the time.

  It's the only remaining coal gasification plant of its kind in the United
  States, and it's on the National Register of Historic Places. The sundial
  on top of Kite Hill uses you as the pointer.
