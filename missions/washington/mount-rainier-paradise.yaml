short: Walk the meadows at Paradise under Mount Rainier. Wildflowers in summer, snow in winter.
description: >
  Drive up to Paradise and walk a stretch of trail right under the mountain. In
  summer the meadows fill with wildflowers; in winter it's snowshoes and snow
  play. Find a spot where the whole mountain fits behind you. Summer
  weekends get very busy, so go early.
about: >
  Paradise got its name in the 1880s, when Virginia Longmire saw the meadows
  and called them paradise. It averages more than 600 inches of snow a year,
  and in 1971-72 it set a world record with over 1,100 inches.

  The Paradise Inn opened in 1916. Mount Rainier was the fifth national
  park, in 1899. Summer weekends are busiest, so arrive early for parking.
