short: Walk the Paradise meadows under Mount Rainier, wildflowers in summer and snow in winter.
description: >
  Drive up to Paradise on the south side of Mount Rainier and walk a stretch
  of trail right under the mountain. In summer the meadows fill with
  wildflowers and the short walk to Myrtle Falls frames the peak perfectly;
  if you're up for more, climb part of the Skyline Trail. In winter it's
  snowshoes, sledding and snow play. Find a spot where the whole mountain
  fits behind you. The photo to get: you in the meadow with Rainier towering
  behind. Summer weekends get very busy, so go early.
about: >
  Paradise got its name in the summer of 1885, when Virinda Longmire saw the
  meadows full of wildflowers and called them paradise. It sits at about
  5,400 feet on Mount Rainier's south slope and is one of the snowiest places
  on Earth, averaging about 670 inches of snow a year. In the winter of
  1971-72 it got about 1,122 inches, a world record at the time.

  Mount Rainier became the country's fifth national park in 1899. The
  historic Paradise Inn opened in 1916, and the Henry M. Jackson Visitor
  Center, rebuilt in 2008, has exhibits, rangers and trail maps. The road up
  from the Nisqually entrance is one of the few park roads kept open to cars
  in winter.

  Summer weekends are the busiest, so arrive early for parking. Wildflowers
  usually peak from late July into August. In winter, carry tire chains and
  check road conditions before you go, since the road to Paradise can close
  in storms. Ready for the full loop above the meadows? That's its own
  mission: [[rainier-skyline-trail]].
