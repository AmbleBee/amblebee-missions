short: Pearson Air Museum in Vancouver, WA. Explore vintage planes and pick the one you'd fly.
description: >
  Look over the vintage aircraft in the hangar at Pearson Air Museum in
  Vancouver, Washington, on one of the oldest operating airfields in the
  country. Each pick the plane you'd most want to fly and explain where you'd
  take it first. Find the monument to the 1937 Soviet flight that crossed the
  North Pole and landed here by surprise. Then walk next door to the rebuilt
  fort at Fort Vancouver. The photo to get: you in front of your plane.
about: >
  Pearson Field has seen aircraft since an airship landed here in 1905. In
  1937, a Soviet crew flew nonstop from Moscow over the North Pole and landed
  here unexpectedly, and a monument near the museum marks it.

  The museum is part of Fort Vancouver National Historic Site. The fort
  next door is a rebuilt Hudson's Bay Company trading post from the 1800s,
  with costumed rangers in summer.
