short: Step inside the reindeer pen and hand-feed the herd. Then hot cocoa in Leavenworth.
description: >
  Take the farm tour, learn about the reindeer, then step right inside the
  enclosure and feed them by hand. Get a photo with the biggest antlers you
  can find. In November and December Santa visits every tour and tickets
  sell out months ahead; January and February are snowy and quieter. Tours
  are by reservation all year, so book ahead and wear clean boots.
about: >
  Reindeer are the domesticated cousin of caribou, raised for thousands of
  years in northern Europe and Asia. Both males and females grow antlers,
  which they shed and regrow every year.

  The farm runs timed tours year-round, by reservation. Their reindeer have
  names, and the guides know each one. Leavenworth is a few minutes away for
  lunch after.
