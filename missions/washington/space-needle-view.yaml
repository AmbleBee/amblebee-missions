short: Go up the Space Needle. Find your favorite thing in the view.
description: >
  Head up the Space Needle, ideally on a clear day or at sunset. Walk the
  whole way around, and each pick one thing in the view you want to go and
  see up close another day.
about: >
  The Space Needle was built for the 1962 World's Fair in about 400 days and
  stands 605 feet tall. It was the tallest structure west of the Mississippi
  when it opened.

  A 2018 renovation added the Loupe, a rotating glass floor you can look
  straight down through. On New Year's Eve, fireworks launch from the
  Needle.
for_kids:
