short: Make a weekend of Walla Walla wine country. Toast with your favorite pour.
description: >
  Head to Walla Walla for a weekend of wine tasting, with plenty of tasting rooms
  right downtown and more out among the vineyards. Each pick your favorite pour
  of the trip and bring a bottle home to remember it. Pick a designated driver
  or stay downtown and walk.
about: >
  Walla Walla's modern wine scene began in the 1970s, and its American
  Viticultural Area was created in 1984. The valley now has well over 100
  wineries, spread across Washington and Oregon.

  The name comes from a Native American phrase often translated as "many
  waters." The town is also famous for Walla Walla sweet onions, harvested
  in early summer.
