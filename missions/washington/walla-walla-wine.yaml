short: Make a weekend of Walla Walla wine country. Toast with your favorite pour.
description: >
  Head to Walla Walla for a weekend of wine tasting, with dozens of tasting
  rooms right downtown and more out among the vineyards. Each pick your
  favorite pour of the trip and bring a bottle home to open on a special day.
  Between tastings, walk Main Street and find something made with Walla Walla
  sweet onions if they're in season. Pick a designated driver or stay downtown
  and walk. The photo to get: the two of you toasting with your favorite pour.
about: >
  Walla Walla's modern wine scene took off in the 1970s with Leonetti Cellars,
  and the valley became an official wine region (AVA) in 1984. It stretches
  from southeast Washington into Oregon, with about 140 wineries, tasting
  rooms and wine bars.

  The town is also famous for Walla Walla sweet onions, harvested in early
  summer. Downtown's Main Street is walkable, so you can taste your way along
  it without driving.
