short: Bellevue Botanical Garden. Cross the swaying ravine bridge and each find the bloom of the day.
description: >
  Wander the free garden's flower borders, the Japanese garden and the
  woodland trail, and cross the suspension bridge over the ravine. Each pick
  your "bloom of the day," photograph it up close, then show each other and
  vote on the winner. The bonus photo: the two of you halfway across the
  bridge, with the treetops below.
about: >
  The garden opened in 1992 and covers about 53 acres on Wilburton Hill.
  Entry is free. Highlights include the Yao Japanese Garden, named for
  Bellevue's sister city in Japan, and the Ravine Experience, a suspension
  bridge that hangs over a wooded ravine.

  The perennial border is at its best from late spring through summer, but
  something is always blooming, and the woodland trail is lovely even in
  the rain.

  Each winter the garden hosts Garden d'Lights, a holiday show with hundreds
  of thousands of lights shaped like flowers and plants. That one is
  ticketed and runs in the evenings, so check the website for dates.
