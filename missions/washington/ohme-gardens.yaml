short: Wander the alpine gardens of Ohme, built on a desert bluff above Wenatchee.
description: >
  Explore an alpine garden that a family carved out of a bare desert bluff by
  hand over decades: stone paths, evergreens, waterfalls and little ponds,
  all perched high above the Columbia River and the orchards. Follow the paths
  up to the lookout for the view over the valley, find the wishing well, and
  get a photo of the two of you on one of the rock stairways. Open from
  mid-April through October.
