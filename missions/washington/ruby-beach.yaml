place:
  name: Ruby Beach, Olympic National Park
  area: Olympic Coast, south of Forks
  coords: [47.71005, -124.41370]
  website: https://www.nps.gov/places/000/ruby-beach.htm
short: Ruby Beach on the Olympic coast. Climb over driftwood and photograph the sea stacks.
description: >
  Take the short path down from Highway 101 to one of the wildest beaches on
  the coast: giant bleached driftwood, sea stacks rising out of the surf, and
  tide pools at low tide. Each hunt for the reddest pebble or patch of sand
  you can find. The photo to get: you on a big driftwood log with Abbey
  Island behind you.
about: >
  Ruby Beach is named for the reddish sand, colored by tiny garnet crystals.
  Look offshore on a clear day for Destruction Island and its old
  lighthouse.

  Driftwood logs here can weigh tons. Never climb on logs that are in the
  surf, since a wave can roll them. Check the tide tables before you go;
  low tide is best for tide pools. Please leave rocks where they are, and
  don't build rock stacks.
for_kids:
  short: Beach hunt! Find each thing.
  steps:
    - A giant log
    - A rock tower in the ocean
    - A sea star or crab
    - A smooth stone
    - A selfie on the beach!
