place:
  name: Ruby Beach, Olympic National Park
  area: Olympic Coast, south of Forks
  coords: [47.710054, -124.413704]
  website: https://www.nps.gov/places/000/ruby-beach.htm
short: Walk down to Ruby Beach. Climb over the driftwood and photograph the sea stacks.
description: >
  Take the short path down from Highway 101 to one of the wildest beaches on the
  coast: giant bleached driftwood logs, sea stacks rising out of the surf, and
  tide pools at low tide. Each build a tiny rock stack or find the best piece of
  driftwood to sit on, and get a photo with Abbey Island behind you. Watch the
  waves and never climb on logs in the surf; they roll.
for_kids:
  short: Beach hunt! Find each thing.
  steps:
    - A giant log
    - A rock tower in the ocean
    - A sea star or crab
    - A smooth stone
    - A selfie on the beach!
