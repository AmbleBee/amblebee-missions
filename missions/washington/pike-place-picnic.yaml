short: Build a picnic from Pike Place stalls. Eat it by the water.
description: >
  Wander Pike Place Market and each pick two things for a shared picnic:
  something sweet, something savory. Find a spot by the waterfront and
  unpack it together.
about: >
  Pike Place Market opened in 1907, and it's one of the oldest continuously
  running public farmers markets in the country. Farmers, craftspeople and
  small shops still fill its stalls.

  Rachel the bronze pig, from 1986, is the market's mascot and a piggy bank
  for its charities. The fish throwers at Pike Place Fish and the gum wall
  under the market are classic stops.
