short: Wander Manito Park's gardens. Each crown your favorite and warm up in the conservatory.
description: >
  Spend a slow afternoon in Spokane's favorite park: the formal Duncan Garden,
  the rose garden, the Japanese garden and the Gaiser Conservatory's tropical
  greenhouse, which is warm even in winter. Each crown one garden the winner,
  then feed the ducks at Mirror Pond. The gardens are free.
