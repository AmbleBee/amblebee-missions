short: Wander Manito Park's gardens. Each crown your favorite and warm up in the conservatory.
description: >
  Spend a slow afternoon in Spokane's favorite park: the formal Duncan Garden,
  the rose garden, the Japanese garden and the Gaiser Conservatory's tropical
  greenhouse, which is warm even in winter. Each crown one garden the winner,
  then feed the ducks at Mirror Pond. The gardens are free. The photo to get:
  you in the garden that won.
about: >
  Manito Park opened in the early 1900s and was shaped with help from the
  Olmsted Brothers, the famous landscape architects. It once even had a zoo,
  which closed in the 1930s.

  The Japanese Garden, built with Spokane's sister city Nishinomiya, opened
  in 1974. The Duncan Garden is a formal European-style garden, and the
  lilac garden peaks in May, fitting for the Lilac City.
