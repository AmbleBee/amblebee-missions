place:
  name: Kerry Park
  area: Queen Anne Hill, Seattle
  coords: [47.62950, -122.36000]  # APPROX: set at the viewpoint before publishing
short: Watch the Seattle skyline light up from Kerry Park. Space Needle in front, Rainier behind.
description: >
  Climb up to Queen Anne Hill for Seattle's most famous view: the Space Needle
  right in front of you, downtown behind it, and on a clear day Mount Rainier
  floating over everything. Bring a hot drink, find a spot on the wall, and
  stay as the sun sets and the city lights come on. Get a photo of you with the Needle lit up behind you. It's free and tiny, so arrive a bit
  before sunset for a good spot.
about: >
  Albert Sperry Kerry and his wife gave the land to the city in 1927 so that
  everyone who stops here could enjoy the view. The sculpture in the park,
  Changing Form, by Doris Totten Chase, dates to 1971.

  This view shows up in countless movies and postcards, from the Space
  Needle and downtown to the Port of Seattle's cranes. Street parking along
  Highland Drive is limited, so walking or a short ride is easiest.
for_kids:
  short: City hunt! Find each thing.
  steps:
    - The Space Needle
    - A big mountain
    - A ferry boat
    - The first city lights
    - A selfie with the city!
