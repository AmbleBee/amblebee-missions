short: Watch Seattle light up at sunset from Kerry Park, with the Space Needle right in front.
description: >
  Head up Queen Anne Hill to Kerry Park for Seattle's most famous view: the
  Space Needle front and center, downtown behind it, Elliott Bay off to the
  side and, on a clear day, Mount Rainier floating over everything. Bring a
  hot drink, find a spot along the railing, and stay as the sun goes down
  and the city lights come on. The photo to get: you at the railing with the
  Needle lit up behind you. It's free and small, so come a little before
  sunset to get a good spot.
about: >
  Kerry Park is a tiny 1.26-acre lookout on West Highland Drive, on the
  south side of Queen Anne Hill. Albert and Katharine Kerry gave the land to
  the city in 1927 so that everyone who stopped there could enjoy the view,
  and it's been Seattle's classic skyline shot ever since. You've probably
  seen it already: it's a go-to backdrop for local TV news, it's in the
  opening of 10 Things I Hate About You, and it's the view behind Frasier's
  apartment.

  From the railing you see the Space Needle in the middle, downtown, Elliott
  Bay, West Seattle and Bainbridge Island, with Mount Rainier behind it all
  when the sky is clear. Sunset and the blue hour after it are the best
  times, and summer evenings get crowded. The big steel sculpture, Changing
  Form by Doris Chase, has been there since 1971 and makes a good frame for
  photos.

  Want to see the view from the other direction? Go up the Needle itself on
  [[space-needle-view]] and look back toward Queen Anne Hill. If you have
  kids along, the stairs at the west end lead down to the playground at
  Bayview-Kinnear Park.
