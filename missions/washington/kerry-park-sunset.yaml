short: Watch the Seattle skyline light up from Kerry Park. Space Needle in front, Rainier behind.
description: >
  Climb up to Queen Anne Hill for Seattle's most famous view: the Space Needle
  right in front of you, downtown behind it, and on a clear day Mount Rainier
  floating over everything. Bring a hot drink, find a spot on the wall, and
  stay as the sun sets and the city lights come on. Get a photo of the two of
  you with the Needle lit up behind you. It's free and tiny, so arrive a bit
  before sunset for a good spot.
for_kids:
