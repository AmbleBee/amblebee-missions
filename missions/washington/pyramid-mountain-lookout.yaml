short: Climb to the WWII spotter cabin on Pyramid Mountain and eat lunch high above Lake Crescent.
description: >
  A real climb: about 7 miles round trip and nearly 2,750 feet up through
  old forest to a tiny World War II aircraft-spotting cabin perched on the
  summit. Eat lunch beside it with Lake Crescent spread out far below and the
  Strait of Juan de Fuca beyond. Start early, bring plenty of water and
  trekking poles, and give yourself the whole day. The photo to get: you by
  the cabin with the lake behind you. Parking is just a few roadside spots.
about: >
  The cabin on the summit was built during World War II to watch the sky for
  enemy aircraft heading toward the coast. It's one of the few such spotter
  posts still standing in Olympic National Park, and the view from it takes
  in nearly the whole length of Lake Crescent.

  The Pyramid Peak Trail climbs about 2,750 feet in 3.4 miles to a summit
  just over 3,000 feet. It starts from the Spruce Railroad Trail, the same
  path that leads to [[devils-punchbowl-lake-crescent]], so the two pair
  well. About 1.7 miles up, the trail crosses an old slide area of loose
  rock for roughly 100 yards. Trekking poles help, and it shouldn't be
  crossed when it's wet or icy.

  The trailhead is on North Shore Road off US 101, with only a few shoulder
  parking spots, so go early on summer weekends. No pass is required.
caution: A loose slide area crosses the trail about 1.7 miles up. Don't cross it when wet or icy.
