short: Drive the Spirit Lake Highway into Mount St. Helens' blast zone and picnic at Coldwater Lake.
description: >
  Drive up the Spirit Lake Memorial Highway toward Mount St. Helens,
  stopping at viewpoints as the forest gives way to the 1980 blast zone.
  Picnic at Coldwater Lake, a lake the eruption itself created, with the
  volcano's open crater looking down on you. If you have energy left, walk
  an easy trail through the hummocks, giant mounds left behind by the
  landslide. The photo to get: you at the lake's edge with the mountain
  behind you.
about: >
  On May 18, 1980, at 8:32 in the morning, Mount St. Helens erupted after
  its north side collapsed in the largest landslide in recorded history. The
  mountain lost about 1,300 feet of its top, the sideways blast flattened
  about 230 square miles of forest, and ash fell across 11 states. About 57
  people died.

  The landslide dammed Coldwater Creek and created Coldwater Lake. Spirit
  Lake, on the other side of the ridge, was hit by a wave about 600 feet
  high, and mats of logs from the blast still float on it today, more than
  40 years later. The Johnston Ridge Observatory is named for David
  Johnston, the volcanologist who was killed at his observation post about
  six miles from the mountain.

  The highway climbs from Interstate 5 into the national volcanic monument,
  with viewpoints and exhibits along the way. Bring food and water, since
  services thin out the higher you go, and expect snow to close the upper
  road in winter.
