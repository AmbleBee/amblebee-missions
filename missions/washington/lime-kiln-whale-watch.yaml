short: Watch for orcas from the rocks at Lime Kiln on San Juan Island. Bring a picnic and be patient.
description: >
  Take the ferry from Anacortes to San Juan Island and drive across to Lime
  Kiln Point, one of the best places in the world to see orcas from shore.
  Find a spot on the rocks below the little white lighthouse, spread out a
  picnic, and take turns on whale watch. Each guess what you'll spot first:
  orca, porpoise, seal or eagle. Summer gives you the best odds, but whales
  are never guaranteed, so enjoy the sunset either way and get a photo of the
  two of you by the lighthouse. Parking takes a Discover Pass.
