short: Walk four floors of classic cars at LeMay in Tacoma. Each pick your dream car.
description: >
  Spiral down through four floors of hundreds of cars, from Model Ts and
  big-finned 1950s cruisers to race cars and wild one-offs. Each pick the car
  you'd drive home if you could, and get a photo of you next to it.
  Try the racing simulators if you want to settle who's the better driver.
  It's closed Tuesdays and Wednesdays, so check the hours before you go.
about: >
  Harold LeMay, who ran a Tacoma garbage business, collected more than 3,000
  vehicles, at one point the largest private car collection in the world.
  The museum opened in 2012.

  Its building looks like a car's curved hood. Hundreds of cars are on
  display at a time, and the collection changes, so return visits can look
  different. The Tacoma Dome next door has big shows and concerts.
