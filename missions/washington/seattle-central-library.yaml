short: Explore Seattle's glass-and-steel library. Ride the neon escalators and find the red floor.
description: >
  Explore one of the most striking buildings in the city: a tilted glass-and-
  steel library with neon-yellow escalators, a blood-red fourth floor, and a
  spiral of book stacks. Ride up to the top floor reading room for the view
  through the diamond windows, then each pick a book the other should read.
  It's free and great on a rainy day. The photo to get: you on the neon-yellow
  escalator.
about: >
  The Central Library opened in 2004, designed by Rem Koolhaas and his firm
  OMA, with Seattle's LMN Architects. Its Books Spiral runs the collection
  up four floors on a continuous ramp.

  The fourth floor's all-red meeting rooms and hallways are a favorite photo
  spot. The building has a free self-guided tour, and the top floor reading
  room is open to anyone.
