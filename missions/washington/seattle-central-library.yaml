short: Explore Seattle's glass-and-steel library. Ride the neon escalators and find the red floor.
description: >
  Explore one of the most striking buildings in the city: a tilted glass-and-
  steel library with neon-yellow escalators, a blood-red fourth floor, and a
  spiral of book stacks. Ride up to the top floor reading room for the view
  through the diamond windows, then each pick a book the other should read. It's
  free and great on a rainy day.
