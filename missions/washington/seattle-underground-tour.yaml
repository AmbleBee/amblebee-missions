short: Explore the buried streets under Pioneer Square on the Seattle Underground Tour.
description: >
  Walk the buried sidewalks and old storefronts hidden under Pioneer Square,
  left behind when the city rebuilt its streets a story higher after the Great
  Fire of 1889. A guide leads the 75-minute walk and tells the strange, funny
  and slightly scandalous stories of early Seattle. Each pick the weirdest
  thing you learned. Look up for the purple glass skylights in the sidewalk
  overhead, and get a photo of the two of you in the old underground
  street. Buy tickets ahead on weekends.
