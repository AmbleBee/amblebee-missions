short: Watch glassblowers work in the Tacoma Museum of Glass hot shop. Then cross the Bridge of Glass.
description: >
  Sit in the cone-shaped hot shop and watch artists blow and shape molten
  glass in front of you, then wander the galleries of wild, colorful glass art.
  Each pick the piece you'd take home. On the way out, walk across the Chihuly
  Bridge of Glass, lined with glowing glass sculptures, and get a photo of
  you under the blue glass ceiling. The bridge is free anytime. The
  museum is open Wednesday through Sunday, and it's free on Third Thursday
  evenings.
