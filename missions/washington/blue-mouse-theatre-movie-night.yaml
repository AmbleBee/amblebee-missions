short: Blue Mouse Theatre in Tacoma's Proctor District. A 1920s movie house and a marquee photo.
description: >
  Catch an evening show at the Blue Mouse, a little neighborhood movie house
  that's been running since the 1920s. Pick whatever's playing, split one big
  popcorn, and settle into the small, old-fashioned auditorium. After the
  show, get a photo of the two of you under the lit-up marquee, then stroll
  the few blocks of Proctor shops before heading home.
about: >
  The Blue Mouse opened in 1923 and bills itself as the oldest continuously
  operating movie theater in Washington. In the 1990s a group of local
  neighbors bought and restored it, and it's still community-run, with one
  screen and a lot of personality.

  Besides new releases, watch the calendar for special nights, like silent
  films with live music or a late-night Rocky Horror Picture Show.
