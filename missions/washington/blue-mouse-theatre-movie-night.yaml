short: Catch a movie at Tacoma's century-old Blue Mouse. Share popcorn, then a photo under the marquee.
description: >
  See an evening show at the Blue Mouse, a little 1920s neighborhood theater
  in Tacoma's Proctor District that bills itself as the oldest continuously
  operating theater in Washington. Pick whatever's playing, or watch the
  calendar for its special nights like silent films with live accompaniment
  or a late-night Rocky Horror. Split a big popcorn and settle into the
  small, old-fashioned auditorium. Get a photo of the two of you under the lit-up marquee after
  the show. Afterward, stroll the few blocks of Proctor shops before heading
  home.
