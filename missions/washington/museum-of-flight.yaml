short: Walk under the planes at the Museum of Flight. Board a real jet and each pick the one you'd fly.
description: >
  Explore the Great Gallery full of hanging aircraft, then cross to the Aviation
  Pavilion and walk aboard real planes, from a Concorde to an old Air Force One.
  Each pick the aircraft you'd take on a dream trip and where you'd fly it. Don't
  skip the space gallery and its shuttle trainer.
