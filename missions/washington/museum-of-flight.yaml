short: Museum of Flight in Seattle. Board a real Air Force One and each pick the plane you'd fly.
description: >
  Explore the Great Gallery full of hanging aircraft, then cross to the
  Aviation Pavilion and walk aboard real planes, from a Concorde to the first
  jet Air Force One. Each pick the aircraft you'd take on a dream trip and
  where you'd fly it. Don't skip the space gallery and its shuttle trainer.
  Admission is free on the first Thursday evening of every month. The photo to
  get: you at the door of Air Force One.
about: >
  The Museum of Flight began in 1965 and is now the largest independent air
  and space museum in the world. It grew around the Red Barn, Boeing's first
  factory, where the company started building airplanes in 1916. In 1975 the
  whole barn was floated down the Duwamish River on a barge to its spot here.

  The Air Force One on display was the first presidential jet: Eisenhower
  became the first president to fly by jet on it in 1959, and it carried
  Kennedy, Johnson and Nixon too. The Concorde set the record for the fastest
  coast-to-coast flight across the U.S. and is one of only four outside
  Europe. The shuttle trainer is the real one every space shuttle astronaut
  trained in.
