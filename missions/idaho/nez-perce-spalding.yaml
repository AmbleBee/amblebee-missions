short: Learn the Nez Perce story at the Spalding visitor center. Then walk down to the Clearwater River.
description: >
  Start at the park's visitor center and museum, where the Nez Perce (Nimiipuu)
  people tell their own history: life along these rivers for thousands of years,
  the treaties, and the 1877 flight from the U.S. Army. Take your time, and each
  pick one thing you learned that you want to remember. Then walk the grounds
  down to the Clearwater River for a quiet moment and a photo of the two of you
  by the water. It's free. The visitor center keeps shorter hours in winter
  (it has been closed Sundays and Mondays), so check before you go.
for_kids:
