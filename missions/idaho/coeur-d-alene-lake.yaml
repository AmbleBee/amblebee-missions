  coords: [47.67400, -116.78600]  # APPROX: set at Independence Point before publishing
short: Walk the floating boardwalk on Coeur d'Alene Lake. Take a lake cruise if you can.
description: >
  Walk the long floating boardwalk around the resort marina, one of the longest
  in the world, then stroll the beach and park downtown. For the best view, take
  a lake cruise out onto the water, which runs in the warmer months, and watch
  for osprey and eagles. Get a photo of the two of you with the lake behind you
  at sunset.
for_kids:
