short: Coeur d'Alene Lake. Walk the floating boardwalk, then take a lake cruise at sunset.
description: >
  Walk the long floating boardwalk around the resort marina, then stroll the
  beach and park downtown. For the best view, take a lake cruise out onto the
  water in the warmer months, and each keep watch for ospreys and eagles; first
  to spot a nest wins. The photo to get: you with the lake behind you at
  sunset.
about: >
  The floating boardwalk is more than half a mile long and is often called
  the longest in the world. The lake stretches about 25 miles, and north
  Idaho has one of the biggest osprey populations in the West.

  The name came from French fur traders, who called the local people "Coeur
  d'Alêne," roughly "heart of an awl," said to describe them as sharp
  traders. Lake cruises run in the warmer months.
