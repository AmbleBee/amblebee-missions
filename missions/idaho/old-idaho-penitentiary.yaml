short: Old Idaho Penitentiary in Boise. Explore the cellhouses, solitary and the gallows.
description: >
  Wander the sandstone cellhouses of a prison that held inmates for over a
  century, from the territorial days to 1973. Step into the cells, find the dark
  solitary block, and read the stories of the people locked up here. Find the
  strangest story in the place, and if you're not alone, compare picks. Get a
  photo framed by the old gate. Tickets are sold at the gate, not online. Watch
  for evening and spooky events in October.
about: >
  The prison held more than 13,000 inmates from 1872 until 1973, when it
  closed after riots. Inmates quarried the sandstone for its walls from Table
  Rock in the hills nearby, and it's one of only four territorial prisons in
  the country open to the public.

  Its most famous inmates include Harry Orchard, who assassinated a former
  governor in 1905, and Lyda Southard, "Lady Bluebeard," who poisoned her
  husbands for their life insurance. More than 500 inmates tried to escape and
  about 90 made it, including Bob Meeks of Butch Cassidy's gang, who jumped
  from a cellhouse roof with one leg.
