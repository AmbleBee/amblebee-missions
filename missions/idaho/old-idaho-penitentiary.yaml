short: Explore the cellhouses of the Old Idaho Penitentiary. Find solitary and the gallows.
description: >
  Wander the sandstone cellhouses of a prison that held inmates for over a
  century, from the territorial days to 1973. Step into the cells, find the dark
  solitary block, and read the stories of the people locked up here. Each pick
  the strangest story you read. Get a photo framed by the old gate. Watch for
  evening and spooky events in October.
