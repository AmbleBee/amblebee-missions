  coords: [42.61900, -112.00900]  # APPROX: set at the hot pools entrance before publishing
short: Soak in the natural hot pools at Lava Hot Springs. Work up to the hottest one.
description: >
  Soak in the town's natural mineral hot pools, each a different temperature.
  Start in the warm one and dare each other up to the hottest pool you can
  stand. Go on a cold winter evening, when steam rises off the water. In summer,
  add a tube float down the Portneuf River through town. Bring a towel and
  water; stay hydrated in the heat.
for_kids:
  short: Hot pool day! Find each thing.
  steps:
