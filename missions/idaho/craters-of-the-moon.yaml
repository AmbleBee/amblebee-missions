place:
  name: Craters of the Moon visitor center
  area: US-20/26/93, near Arco
  coords: [43.46100, -113.56300]  # APPROX: set at the visitor center before publishing
  website: https://www.nps.gov/crmo
short: Craters of the Moon near Arco. Climb a cinder cone and walk into a lava tube.
description: >
  Drive the loop road through a black, otherworldly lava field, climb
  Inferno Cone for the view over the volcanic plain, then walk into the lava
  tubes at the Caves Area with a good flashlight each. Each find the
  strangest lava shape you can and give it a name. The photo to get: you on
  top of Inferno Cone with the lava field stretching away.
about: >
  The lava here erupted from a long crack in the Earth called the Great
  Rift, between about 15,000 and 2,000 years ago. Apollo astronauts trained
  here in 1969 to study volcanic rock before going to the moon.

  Get a free cave permit at the visitor center first. It's also an
  International Dark Sky Park, so on a clear night the Milky Way shows. Summer
  afternoons on black rock get very hot, so go early.
for_kids:
  short: Moon hunt! Find each thing.
  steps:
    - A black lava rock
    - The top of a cinder hill
    - A cave
    - A lizard or chipmunk
    - A selfie on the moon!
