short: Climb a cinder cone and walk into a lava tube at Craters of the Moon. Bring a flashlight.
description: >
  Drive the loop road through a black, otherworldly lava field, climb Inferno
  Cone for the view over the volcanic plain, then walk into the lava tubes at
  the Caves Area. Get your free cave permit at the visitor center first and
  bring a good flashlight each. Each find the strangest lava shape you can and
  photograph it. Summer afternoons on black rock get very hot; go early.
for_kids:
  short: Moon hunt! Find each thing.
  steps:
    - A black lava rock
    - The top of a cinder hill
    - A cave
    - A lizard or chipmunk
    - A selfie on the moon!
