short: Drive through Yellowstone Bear World. See bears, elk and bison right outside your window.
description: >
  Drive slowly through the park with the windows up while black bears,
  grizzlies, elk, bison and wolves roam around your car. Go around as many times
  as you want. Each keep count of the bears you spot, then compare at the end.
  Admission includes a petting zoo and little rides. It's seasonal; check the
  dates.
