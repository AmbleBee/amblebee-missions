short: Yellowstone Bear World near Rexburg. Drive through and see bears, elk and bison up close.
description: >
  Drive slowly through the park with the windows up while black bears,
  grizzlies, elk, bison and wolves roam around your car. Go around as many times
  as you want. Each keep count of the bears you spot, then compare at the end.
  Admission includes a petting zoo and little rides. It's seasonal; check the
  dates.
about: >
  Bear World is a drive-through wildlife park, so the animals roam while you
  stay in your car. It's one of the easiest ways to see grizzlies and black
  bears up close, and spring visits sometimes include young cubs.

  Keep windows up and stay in your car the whole way through. Yellowstone
  National Park itself is about an hour and a half away. It's seasonal, so
  check the dates.
