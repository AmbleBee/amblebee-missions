short: Redfish Lake near Stanley. Ride the hiker boat across, then hike the ridge trail home.
description: >
  Catch the hiker shuttle boat from Redfish Lake Lodge across to the inlet
  trailhead at the foot of the Sawtooth peaks. Take the short side trip to
  the Lily Ponds and little waterfalls, then hike back to the lodge along
  the ridge above the lake. Race the last stretch to the lodge beach, loser
  buys the cold drinks. The photo to get: your crew on the beach at the inlet
  with the jagged peaks behind you.
about: >
  Redfish Lake is named for the sockeye salmon that once turned the water
  red when they spawned. They swim about 900 miles from the Pacific and
  climb more than 6,000 feet to get here, one of the longest salmon
  migrations on Earth. They nearly disappeared in the 1990s, and a breeding
  program is helping bring them back.

  The hike back is about five miles with some switchbacks and around 1,000
  feet of climbing. Boats run from late spring to mid-fall.
