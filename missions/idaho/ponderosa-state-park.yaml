short: Ponderosa State Park in McCall. Hike to Osprey Point over Payette Lake, then ice cream.
description: >
  Drive the peninsula road through tall old ponderosa pines and hike out to
  Osprey Point, a rocky cliff above Payette Lake. Look for osprey and deer, and
  get a photo of you on the point with the lake below. Then head
  into little downtown McCall for ice cream on the shore. In winter the park
  grooms trails for snowshoeing and cross-country skiing.
about: >
  The park covers a peninsula sticking out into Payette Lake, with
  old-growth ponderosa pines, some of them hundreds of years old. Their bark
  smells like vanilla or butterscotch on a warm day; try sniffing one.

  McCall's Winter Carnival each February fills town with giant snow
  sculptures. In winter the park grooms trails for snowshoeing and
  cross-country skiing.
