short: Silverwood near Coeur d'Alene. Ride the wooden coasters; each pick a ride the other must ride.
description: >
  Spend the day at Silverwood, the Northwest's biggest theme park, north of
  Coeur d'Alene. Ride the wooden coasters, take a loop on the old steam train
  through the woods, and in summer cool off at Boulder Beach water park,
  included with your ticket. Each pick one ride the other has to go on with
  you. The photo to get: your faces right after the scariest drop.
about: >
  Silverwood started as an airfield: in 1973 Clayton Henley opened the Henley
  Aerodrome here, a private airport with an antique plane museum. Businessman
  Gary Norton bought it in 1981, then won a 1915 steam locomotive at an auction
  in Reno, outbidding Disney. He laid more than three miles of track for it,
  built a Victorian-style town for it to run through, and opened Silverwood on
  June 20, 1988.

  Today it's the biggest theme park in the Pacific Northwest. Its wooden coaster
  Tremors hits 65 mph and dives underground four times. Boulder Beach water park
  is open from June through Labor Day, and in October the park turns into
  Scarywood for Halloween nights, when Timber Terror runs backwards.
