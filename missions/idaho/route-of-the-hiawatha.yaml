short: Ride an old railroad through 10 tunnels and over 7 trestles. Lights on for the 1.7-mile tunnel.
description: >
  Bike 15 miles downhill along an old mountain railroad, through ten tunnels and
  across seven sky-high trestles. It starts with the Taft Tunnel, 1.7 miles long,
  pitch black, cold and wet, so wear a jacket and a bright light. Stop on the
  highest trestle for a photo of you with the valley far below, then
  ride the shuttle back up. Helmets and lights are required. Rent bikes at
  Lookout Pass and book ahead; it's a summer-only trail.
