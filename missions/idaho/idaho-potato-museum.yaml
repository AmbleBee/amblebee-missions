short: Idaho Potato Museum in Blackfoot. Learn everything about spuds and see the giant potato.
description: >
  Tour a museum devoted entirely to the potato, in an old train depot: the
  history of Idaho spuds, odd old farm tools, and the largest potato crisp
  Pringles ever made. Each find the weirdest potato fact and quiz the other.
  Out-of-staters get a free potato in the gift shop with admission. Get a photo
  with the giant potato out front, then have a baked potato at the café.
about: >
  Blackfoot calls itself the "Potato Capital of the World," and the museum
  is in its old 1913 railroad depot. Look for the giant Pringles potato
  crisp, one of the biggest ever made, and the giant baked potato statue out
  front.

  Visitors from out of state have been given a free bag of potatoes, or a
  potato treat, with admission, so ask. The café serves baked potatoes, of
  course.
