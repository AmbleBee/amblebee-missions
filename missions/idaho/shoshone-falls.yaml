short: Shoshone Falls in Twin Falls. Watch the "Niagara of the West" thunder into the Snake River Canyon.
description: >
  Drive down into the Snake River Canyon to a wide curtain of water called
  the "Niagara of the West." Walk the overlooks and each try to find the
  angle where the mist makes a rainbow. The photo to get: you at the overlook
  with the falls and its rainbow behind you. Picnic at Dierkes Lake nearby.
about: >
  Shoshone Falls is about 212 feet tall, roughly 45 feet taller than Niagara
  Falls. Come in spring when the river runs high; by late summer much of the
  water is diverted for farms and the falls can shrink to a trickle.

  Twin Falls has more canyon stories: in 1974, daredevil Evel Knievel tried
  to jump the Snake River Canyon on a rocket bike nearby, and today BASE
  jumpers leap from the Perrine Bridge.
for_kids:
  short: Waterfall hunt! Find each thing.
  steps:
    - The giant waterfall
    - A rainbow in the mist
    - The deep canyon
    - A selfie at the overlook!
