short: Shoshone Falls in Twin Falls. Watch the "Niagara of the West" thunder into the Snake River Canyon.
description: >
  Drive down into the Snake River Canyon to a wide curtain of water called
  the "Niagara of the West." Walk the overlooks and hunt for the angle where
  the mist makes a rainbow; race each other to find it if you're not alone.
  The photo to get: you at the overlook with the falls and its rainbow behind
  you. Picnic at Dierkes Lake nearby, and on the way out, stop at Evel
  Knievel's old jump ramp about a mile west.
about: >
  Shoshone Falls is about 212 feet tall, roughly 45 feet taller than Niagara
  Falls, and nearly 1,000 feet wide. It was made in a matter of weeks by the
  Bonneville Flood about 15,000 years ago, when a giant ice-age lake burst and
  poured into the Snake River. Come in spring when the river runs high; by
  late summer much of the water is diverted for farms and the falls can
  shrink to a trickle. In May, the falls are lit up at night.

  Twin Falls has more canyon stories: in 1974, daredevil Evel Knievel tried
  to jump the canyon on a rocket "Skycycle" in front of about 30,000 people.
  His parachute opened too early, but stuntman Eddie Braun finally made the
  jump in 2016. Today BASE jumpers leap from the Perrine Bridge.
for_kids:
