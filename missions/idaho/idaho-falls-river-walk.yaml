place:
  name: Idaho Falls Greenbelt (by the falls)
  area: Downtown Idaho Falls, Snake River
  coords: [43.49500, -112.04200]  # APPROX: set at the falls viewpoint before publishing
short: Idaho Falls Greenbelt. Walk the river path along the falls and stay until the lights come on.
description: >
  Walk the paved Greenbelt along the Snake River right through downtown,
  beside the wide, rushing falls the city is named after. Cross the bridges
  and each pick your favorite spot on the loop, then sit on a bench facing
  the water as the evening lights come on. The photo to get: you with the
  falls and their reflected lights behind you.
about: >
  The town was called Eagle Rock until 1891, when land promoters renamed it
  Idaho Falls. The falls are partly man-made: the Snake River had rapids here,
  and in 1911 the city built a long retaining wall and a dam with a
  powerhouse, which shaped the wide falls you see today and still makes power
  for the city.

  The project also turned Sportsmen's Park into an island, which became a home
  for waterfowl. The Greenbelt loop runs along both sides of the river, flat
  and easy, and it's free and lovely at dusk.
