short: Kathryn Albertson Park in Boise. Wander the quiet ponds and gazebos and count the wildlife.
description: >
  Walk the winding paths of a quiet wildlife park right by downtown Boise, with
  ponds, little bridges and gazebos. Count the ducks, geese, turtles and
  herons you spot, and find the prettiest gazebo for a photo of you.
  Then step out onto the Boise River Greenbelt for a longer walk or ride. It's
  free; no dogs or bikes inside the park.
about: >
  Grocery founder Joe Albertson gave the park to Boise in the late 1980s and
  named it for his wife, Kathryn. It was designed as a quiet refuge for
  wildlife in the middle of the city.

  It's free. No dogs or bikes are allowed inside the park, which keeps it
  calm for the animals. Early mornings and evenings are best for spotting
  wildlife.
