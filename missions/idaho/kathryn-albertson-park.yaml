short: Kathryn Albertson Park in Boise. Wander the quiet ponds and gazebos and count the wildlife.
description: >
  Walk the winding paths of a quiet wildlife park right by downtown Boise, with
  ponds, little bridges and gazebos. Count the ducks, geese, turtles and
  herons you spot, and find the prettiest gazebo for a photo of you.
  Then step out onto the Boise River Greenbelt for a longer walk or ride. It's
  free; no dogs or bikes inside the park.
about: >
  Grocery founder Joe Albertson gave this land to Boise in 1979, then built
  the park himself when it sat empty for years. It was dedicated on his 84th
  birthday in 1989 and named for his wife, Kathryn, after nearly 60 years of
  marriage.

  The 41 acres were once a camp for Chinese immigrant workers, then a gravel
  quarry and a horse pasture. Today the park is built for wildlife, with
  meadows, ponds and boardwalks that were refreshed in 2021. No dogs or bikes
  are allowed inside, which keeps it calm for the animals. Early mornings and
  evenings are best for spotting wildlife.
