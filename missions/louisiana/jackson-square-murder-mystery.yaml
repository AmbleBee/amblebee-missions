description: >
  Book a self-guided mystery hunt that turns the streets around Jackson Square
  into a crime scene. Follow clues on your phone from corner to corner, size up
  the suspects, and each make your guess before the big reveal. Loser buys
  the beignets. It takes about two hours of easy walking. Get a photo of
  you looking suspicious in front of the cathedral.
about: >
  Jackson Square was the city's old parade ground, renamed for Andrew
  Jackson after the Battle of New Orleans in 1815. His statue stands in the
  middle, with St. Louis Cathedral behind it.

  Self-guided hunts send clues to your phone, so you can start whenever you
  like and take breaks. Café du Monde, famous for beignets since the 1860s,
  is right across the street for the loser to pay up.
