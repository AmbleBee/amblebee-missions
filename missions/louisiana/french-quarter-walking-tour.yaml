short: French Quarter history walk in New Orleans. Find your favorite iron balcony.
description: >
  Join a guided daytime walking tour of the French Quarter's history and
  architecture; many start around Jackson Square. Peek into hidden
  courtyards, and each pick your favorite iron-lace balcony along the way.
  At the end, each share the one story you'll retell at home. The photo to
  get: you in front of St. Louis Cathedral.
about: >
  Here's the twist most tours mention: the "French" Quarter mostly looks
  Spanish. Two huge fires in 1788 and 1794 burned most of the French-era
  buildings, and the city was rebuilt while Spain ruled it, with courtyards,
  stucco walls and iron balconies.

  St. Louis Cathedral is one of the oldest cathedrals in the country. The
  red-brick Pontalba Buildings along the sides of Jackson Square went up in
  the 1840s and are often called the oldest apartment buildings in the
  United States. Look for the initials "AP" worked into their iron railings,
  for the baroness who built them.
