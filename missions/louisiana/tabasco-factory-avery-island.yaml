short: Tabasco Factory on Avery Island. Watch the bottling line, then dare each other at the tasting bar.
description: >
  Drive out onto Avery Island, the salt dome where the Tabasco family has made
  its pepper sauce since the 1860s, and take the self-guided factory tour through
  the museum, the pepper greenhouse, the barrel warehouse full of aging mash, and
  the windows over the bottling line. Finish in the Country Store, where you can
  sample flavors you never knew existed. Make it a challenge: everyone ranks the
  samples, and the loser tries the hottest one again. Get a group photo with the
  biggest Tabasco bottle you can find. Your ticket also covers Jungle Gardens,
  so drive the loop afterward, and stay for Cajun food and a Bloody Mary at
  the restaurant on site if you're hungry.
about: >
  Edmund McIlhenny first made Tabasco sauce here in 1868, and his family
  still runs the company more than five generations later. The peppers are
  mashed with salt and aged in oak barrels for up to three years. Avery
  Island sits on top of a giant salt dome, and salt from the island has long
  been part of the recipe.

  Next door, Jungle Gardens has Bird City, a rookery started in the 1890s to
  save snowy egrets when they were being hunted for hat feathers, and you
  may spot alligators along the way. Reservations are recommended, so book
  tickets online.
steps:
