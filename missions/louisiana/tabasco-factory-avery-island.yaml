short: Watch Tabasco get bottled, then dare each other at the hot-sauce tasting bar.
description: >
  Drive out onto Avery Island, the salt dome where the Tabasco family has made
  its pepper sauce since the 1860s, and take the self-guided factory tour through
  the museum, the pepper greenhouse, the barrel warehouse full of aging mash, and
  the windows over the bottling line. Finish in the Country Store, where you can
  sample flavors you never knew existed. Make it a challenge: everyone ranks the
  samples, and the loser tries the hottest one again. Get a group photo with the
  biggest Tabasco bottle you can find. Reserve tickets online, and stay for lunch at the
  restaurant on site if you're hungry.
steps:
