short: Tour Louisiana's story at the Capitol Park Museum. Then ride up the State Capitol tower.
description: >
  Spend a couple of hours with Louisiana's whole story in one building: Mardi
  Gras, music legends, sugar cane, river life and the state's colorful
  politics. Each pick the exhibit you'd tell a friend about. Then walk across
  to the art deco State Capitol, the tallest state capitol in the country, and
  ride up to the observation deck for a view over the Mississippi. The first
  Sunday of the month is free at the museum.
