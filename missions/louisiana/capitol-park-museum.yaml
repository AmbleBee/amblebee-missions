short: Capitol Park Museum in Baton Rouge, then ride up the tallest state capitol in the country.
description: >
  Spend a couple of hours with Louisiana's whole story in one building:
  Mardi Gras, music legends, sugar cane, river life and the state's colorful
  politics. Each pick the exhibit you'd tell a friend about. Then walk across
  to the art deco State Capitol and ride up to the observation deck. The
  photo to get: you with the Mississippi River far below.
about: >
  Capitol Park Museum is a branch of the Louisiana State Museum, just down the
  street from the State Capitol. Its two big permanent exhibits cover the
  state's history and culture, with odd treasures like a Civil War-era
  submarine pulled from Bayou St. John and Louis Armstrong's childhood bugle.

  Governor Huey Long had the State Capitol built in about 14 months in the
  early 1930s, and at about 450 feet it's still the tallest state capitol in
  the country. Long was shot inside it in 1935 and is buried out front, facing
  his building. The observation deck has been free to visit.
