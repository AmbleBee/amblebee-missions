short: Ruby Slipper brunch in New Orleans. Order one sweet and one savory and share both.
description: >
  Get brunch at the Ruby Slipper, a New Orleans favorite for Southern
  breakfast. Order one sweet dish and one savory one, like a Benedict and the
  bananas Foster pain perdu, split them, and vote on which one wins. The
  photo to get: both plates on the table before anyone takes a bite. Expect a
  wait on weekends.
about: >
  The Ruby Slipper Cafe opened in New Orleans in 2008, started by Jennifer and
  Erich Weishaupt, two engineers who had been helping their neighborhood
  rebuild after Hurricane Katrina. The name came from a little girl on the
  radio who described New Orleans as Oz and everywhere else as Kansas.

  It has grown to more than 30 locations across the South, but the menu still
  leans New Orleans: a whole lineup of Benedicts, biscuits and gravy, and
  bananas Foster pain perdu. Bananas Foster itself was invented in New Orleans
  in the 1950s at Brennan's.

  Weekend waits can be long, so go early or on a weekday.
