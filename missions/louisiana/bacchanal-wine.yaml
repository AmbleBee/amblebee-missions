short: Pick a bottle and cheese inside Bacchanal, then sit out back under string lights with live jazz.
description: >
  Walk into Bacchanal's little wine shop, pick a bottle together and a few
  cheeses, then carry them out to the rambling backyard under the string lights,
  where a live band plays every night. Grab mismatched chairs, order a plate
  from the kitchen, and stay for a second set. Each pick the song of the night,
  and get a photo of the two of you clinking glasses in the lights. It gets
  busy; go early for a good table.
