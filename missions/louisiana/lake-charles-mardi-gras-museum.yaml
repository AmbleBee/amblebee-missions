short: Wander a hall of sparkling Mardi Gras costumes. Try one on and ride the fake parade float.
description: >
  Southwest Louisiana throws its own Mardi Gras, and this museum in Lake
  Charles shows off the costumes: rooms of towering gowns and headpieces
  covered in beads, sequins and feathers, plus the stories of the local
  krewes that made them. Take your time with the details, learn how the
  floats get built, and climb aboard the simulated parade ride. Find the one
  costume you'd actually dare to wear. Get a photo of yourself trying on a
  costume piece in front of the brightest display. The museum recently
  moved into a new building and isn't open every day, so check before you go.
