short: Audubon Aquarium in New Orleans. Walk the reef tunnel and each find the strangest fish.
description: >
  Explore the aquarium at the foot of Canal Street, from the bayou to the
  Amazon rainforest and the giant Gulf of Mexico tank. Walk the Caribbean
  reef tunnel with fish overhead, and each find the strangest creature in
  the building. Get a photo of you against the big Gulf tank. The Algiers
  ferry leaves right next door if you want to keep going.
about: >
  The aquarium opened on the riverfront at the foot of Canal Street in 1990.
  Its giant Gulf of Mexico tank recreates the sea floor around an offshore
  oil platform, where sharks, rays and huge tarpon gather in real life too.

  It reopened in June 2023 after a big renovation: now you can see the Gulf
  tank from above and below, touch a stingray, and walk through an aviary in
  the Amazon exhibit. The Audubon Insectarium moved into the same building
  at the same time, so bugs and butterflies are part of the visit now too.
