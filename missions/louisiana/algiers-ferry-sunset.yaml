short: Algiers ferry at sunset in New Orleans. Cross the river and walk the levee at Algiers Point.
description: >
  Hop the little ferry at the foot of Canal Street for a quick ride across
  the Mississippi to Algiers Point, a quiet old neighborhood of shotgun
  houses. Climb up onto the levee, walk the river path, and each count the
  big ships passing. Watch the sun go down behind the city skyline across
  the water. The photo to get: you with the city glowing behind you.
about: >
  A ferry has crossed the river here since the 1820s, one of the oldest
  ferry runs in the country. Algiers Point is New Orleans's second-oldest
  neighborhood, and the levee path has plaques honoring jazz musicians who
  came from this side of the river.

  The Mississippi here is deep and fast, with huge ships passing close by.
  Grab a drink at a neighborhood bar before riding back, and check the last
  ferry time.
