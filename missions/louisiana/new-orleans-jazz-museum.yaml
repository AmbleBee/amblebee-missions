short: New Orleans Jazz Museum at the Old Mint. Learn jazz history, then hear it live on Frenchmen.
description: >
  Explore the story of jazz in the city that invented it, inside the old
  granite U.S. Mint: instruments, recordings and the musicians who made New
  Orleans sound like New Orleans. Each pick a song from the exhibits you've
  never heard before. Then walk two blocks to Frenchmen Street and follow the
  best live band you hear. The photo to get: you outside the band's door
  with the music going.
about: >
  The jazz museum started in 1961 in the French Quarter, built on a collection
  the New Orleans Jazz Club spent decades gathering and gave to the state in
  1977. Today it fills the Old U.S. Mint, and its collection of jazz
  instruments is billed as the largest in the world, including Louis
  Armstrong's first cornet and horns played by Sidney Bechet, Kid Ory and
  Dizzy Gillespie.

  The Old U.S. Mint opened in 1838, and it's the only mint to have made both
  U.S. and Confederate coins. Check the calendar for free concerts upstairs.
  Frenchmen Street is where locals go for live music, with several clubs in a
  row and bands on the sidewalk.
