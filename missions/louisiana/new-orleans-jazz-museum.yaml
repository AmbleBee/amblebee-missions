short: New Orleans Jazz Museum at the Old Mint. Learn jazz history, then hear it live on Frenchmen.
description: >
  Go in the afternoon and explore the story of jazz in the city that invented
  it, inside the old granite U.S. Mint: instruments, recordings and the
  musicians who made New Orleans sound like New Orleans. Each pick a song from
  the exhibits you've never heard before. Then stay into the evening, walk two
  blocks to Frenchmen Street and follow the best live band you hear. The photo
  to get: you outside the band's door with the music going.
about: >
  The world's first jazz museum opened in 1961 on Dumaine Street in the French
  Quarter, built on a collection the New Orleans Jazz Club had gathered since
  1948. The club gave it to the state in 1977, and in 2018 it moved into the
  Old U.S. Mint. It's the largest collection of instruments played by jazz
  greats, including Louis Armstrong's first cornet, with notches a teenage
  Armstrong cut into the mouthpiece still visible, and a 1917 disc of the first
  jazz record ever made.

  The Mint started making coins in 1838, and it's the only mint to have made
  both U.S. and Confederate coins. Check the calendar for free concerts
  upstairs. Frenchmen Street is where locals go for live music, with several
  clubs in a row and bands on the sidewalk.
