short: Cruise the Mississippi on a real steamboat with a live jazz band. Dinner at night or lunch by day.
description: >
  Board the Natchez, a real steam-powered paddlewheeler, for a cruise on the
  Mississippi with a live jazz band on deck. For a date, book the evening dinner
  cruise with a Creole buffet and watch the city lights slide by. In the
  daytime, take the jazz cruise with lunch and peek into the steam engine room.
  Listen for the calliope, and get a photo of the two of you at the rail with
  the skyline behind you.
