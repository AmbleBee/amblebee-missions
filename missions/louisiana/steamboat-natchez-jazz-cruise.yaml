short: Steamboat Natchez in New Orleans. Cruise the Mississippi on a paddlewheeler with a jazz band.
description: >
  Board the Natchez, a real steam-powered paddlewheeler, for a cruise on the
  Mississippi with a live jazz band on deck. For a date, book the evening dinner
  cruise with a Creole buffet and watch the city lights slide by. In the
  daytime, take the jazz cruise with lunch and peek into the steam engine room.
  Listen for the calliope, and get a photo of you at the rail with
  the skyline behind you.
about: >
  The Natchez is a real steam-powered sternwheeler, built in 1975 and the
  ninth steamboat to carry the name. Before you board, listen for its steam
  calliope, an organ played with steam whistles, which you can hear all over
  the French Quarter.

  Peek into the engine room to see the steam engines working. For a date,
  book the evening dinner cruise and watch the city lights slide by.
