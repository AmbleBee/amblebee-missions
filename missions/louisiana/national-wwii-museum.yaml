short: National WWII Museum in New Orleans. Follow one real person's story through the war.
description: >
  At the start, each get a dog tag card linking you to a real person who
  lived through the war, and follow their story through the galleries. Walk
  under the planes hanging in the big pavilion, and add the 4D film if you
  can. Afterward, swap your person's story over lunch. The photo to get: you
  under the planes in the pavilion. It's heavy in places; take breaks.
about: >
  The museum opened on June 6, 2000, the anniversary of D-Day, as the
  National D-Day Museum, founded by historian Stephen Ambrose. Congress later
  named it America's official WWII museum.

  It's in New Orleans because the Higgins boats, the landing craft that
  carried troops onto the beaches, were built here. General Eisenhower
  credited their builder, Andrew Higgins, with helping win the war. Give it
  most of a day.
