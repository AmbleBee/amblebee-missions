short: Spend a day at the National WWII Museum. Each follow one real person's story through the war.
description: >
  Give yourselves most of a day for one of the best history museums in the
  country. At the start, each get a dog tag card linking you to a real person
  who lived through the war, and follow their story through the galleries.
  Walk under the planes hanging in the big pavilion, and add the 4D film Beyond
  All Boundaries if you can. Afterward, swap your person's story over lunch.
  It's heavy in places; take breaks.
