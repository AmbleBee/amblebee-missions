short: National WWII Museum in New Orleans. Follow one real person's story through the war.
description: >
  At the start you get a dog tag card linking you to a real person who lived
  through the war; follow their story through the galleries. Walk under the
  planes hanging in the big pavilion, and add the 4D film or the submarine
  experience if you can. Afterward, talk over the story you followed at lunch,
  or swap stories if you came together. The photo to get: you under the planes
  in the pavilion. It's heavy in places; take breaks.
about: >
  The museum opened on June 6, 2000, the anniversary of D-Day, as the
  National D-Day Museum, founded by historian Stephen Ambrose. Congress later
  named it America's official WWII museum. One of the planes overhead, the
  B-17 "My Gal Sal," crash-landed in Greenland during the war and was
  recovered from the ice 53 years later.

  It's in New Orleans because the Higgins boats, the landing craft that
  carried troops onto the beaches, were built here: more than 20,000 of them.
  General Eisenhower called their builder, Andrew Higgins, "the man who won
  the war for us." Give it most of a day.
