short: Hike 20 minutes through rhododendron tunnels to a 360° Blue Ridge sunset.
description: >
  A short climb from the Blue Ridge Parkway takes you through tunnels of
  rhododendron to the top of Craggy Pinnacle, with mountains rolling away in
  every direction. Bring a blanket and something warm to drink for sunset.
  Parkway sections close in winter; in June the rhododendrons bloom. The photo
  to get: the two of you on the summit as the sun drops behind the ridges.
about: >
  Craggy Pinnacle tops out at about 5,890 feet, on one of the Blue Ridge's
  "heath balds," treeless summits covered in rhododendron and twisted,
  wind-stunted trees. The trail is under a mile each way.

  The Catawba rhododendrons usually bloom in mid to late June. The Parkway
  near Asheville closes in winter, and some stretches were closed for
  repairs after Hurricane Helene in 2024, so check the Parkway's road status
  page before you drive up.
