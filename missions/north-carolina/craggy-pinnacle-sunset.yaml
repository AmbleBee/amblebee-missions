short: Hike 20 minutes through rhododendron tunnels to a 360° Blue Ridge sunset.
description: >
  A short climb from the Blue Ridge Parkway takes you through tunnels of rhododendron to
  the top of Craggy Pinnacle, with mountains rolling away in every direction. Bring a
  blanket and something warm to drink for sunset. Parkway sections close in winter; in
  June the rhododendrons bloom.
