short: NASCAR Hall of Fame in Charlotte. Race each other in the simulators; the loser buys dinner.
description: >
  Get the ticket package with unlimited simulator rides and make it a
  rivalry. Walk Glory Road, the banked ramp lined with famous race cars, try
  the pit-stop challenge to see who changes a tire faster, then strap into
  the racing simulators side by side and race head to head. Best of three,
  and the loser buys dinner in Uptown. The photo to get: the two of you on
  the steep banked curve of Glory Road.
about: >
  The Hall of Fame opened in Uptown Charlotte in 2010, in the heart of
  stock car country; many NASCAR teams are based in the Charlotte area.
  Glory Road's curves are built at the same steep angles as real tracks, so
  you can feel how hard they lean, and it's harder to stand on than it looks.

  The Hall of Honor, a round room in the middle, holds the inductees' stories
  and is worth a quiet walk-through between races.
steps:
  - Your favorite car on Glory Road
  - The pit-stop challenge mid-swap
  - Two racers in the simulators
