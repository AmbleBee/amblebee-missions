short: Pick a film you've never heard of at a/perture. Grab popcorn, then debate it.
description: >
  Head downtown to a/perture, a small nonprofit art house cinema showing indie,
  foreign and documentary films. Choose something neither of you knows much about,
  grab popcorn and a drink from the concession stand, and settle in. Afterward,
  walk Fourth Street and each give the movie a score out of ten, then defend your
  number. Get a photo of the two of you with your tickets outside the theater.
  Showtimes change weekly, so check the schedule and buy tickets ahead for popular films.
about: >
  a/perture is a nonprofit art house cinema on Fourth Street, showing the
  indie, foreign and documentary films the big chains skip, along with
  special screenings and Q&As.

  Winston-Salem calls itself the City of Arts and Innovation, and it also
  hosts the RiverRun International Film Festival each spring. Fourth Street
  has plenty of places for dinner before or a drink after, all in walking
  distance.
