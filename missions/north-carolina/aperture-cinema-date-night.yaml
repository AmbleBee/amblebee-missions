description: >
  Head downtown to a/perture, a small nonprofit art house cinema showing indie,
  foreign and documentary films. Choose something neither of you knows much about,
  grab popcorn and a drink from the concession stand, and settle in. Afterward,
  walk Fourth Street and each give the movie a score out of ten, then defend your
  number. Get a photo of the two of you with your tickets outside the theater.
  Showtimes change weekly, so check the schedule and buy tickets ahead for popular films.
