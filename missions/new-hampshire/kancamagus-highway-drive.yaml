short: Drive the Kancamagus through the White Mountains. Stop at a waterfall and a big overlook.
description: >
  The Kancamagus runs about 34 miles through the White Mountains with no gas stations or
  shops, just forest, rivers and overlooks. Start at the White Mountains Visitors Center
  in Lincoln, then stop at a waterfall like Sabbaday Falls and the high overlooks near
  Kancamagus Pass. Best in fall color. Parking at the stops needs a forest recreation
  pass.
