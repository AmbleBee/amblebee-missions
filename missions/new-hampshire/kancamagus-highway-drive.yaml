  name: Kancamagus Highway (NH-112)
  area: Lincoln to Conway, White Mountains
  address: 200 Kancamagus Hwy, North Woodstock, NH 03262
  coords: [44.03565, -71.67718]
  website: https://www.visitwhitemountains.com/things-to-do/scenic-drives/kancamagus-highway/
short: Kancamagus Highway in the White Mountains. Drive it, stop at a waterfall and a big overlook.
description: >
  Drive the Kancamagus through the White Mountains, with nothing but forest,
  rivers and overlooks for about 34 miles. Take turns being navigator and
  pick one stop each: a waterfall like Sabbaday Falls, a swimming hole at
  the Lower Falls, or the high overlooks near Kancamagus Pass. The photo to
  get: the two of you at the biggest overlook with the mountains rolling
  away behind you.
about: >
  The highway is named for Kancamagus, a leader of the Pennacook people in
  the late 1600s. It opened as a through road in 1959 and is a National
  Scenic Byway, with no gas stations or shops the whole way, so fill up in
  Lincoln or Conway.

  It's most famous in early October, when the fall color peaks and traffic
  gets heavy. Sabbaday Falls is a short, easy walk. Parking at the stops
  needs a White Mountain National Forest recreation pass.
