description: >
  Pick a movie neither of you knows much about, grab popcorn and a beer or
  glass of wine from the café, and settle into the stadium seats. Afterward,
  walk Main Street and each give the film a score out of ten; whoever's
  further from the other's score buys dessert. The photo to get: the two of
  you out front with your tickets.
about: >
  Red River is downtown Concord's nonprofit arthouse cinema, with three
  screens showing independent, foreign and classic films. It's run with
  help from members and volunteers, so buying a ticket supports it.

  Downtown Concord's Main Street has cafés and dessert spots within a short
  walk, which makes the after-movie debate easy.
