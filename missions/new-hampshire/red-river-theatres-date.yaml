short: Pick an indie film neither of you has heard of. Glass of wine, popcorn, then argue about it.
description: >
  Red River is downtown Concord's nonprofit arthouse cinema, showing indie,
  foreign and classic films on three screens. Pick a movie neither of you knows
  much about, grab popcorn and a beer or glass of wine from the Indie Cafe, and
  settle into the stadium seats. Afterward, walk Main Street and each give the
  film a score out of ten; whoever's further from the other's score buys
  dessert. Get a photo of the two of you out front with your tickets.
