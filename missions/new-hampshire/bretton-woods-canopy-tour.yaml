short: Gondola up, then zipline, rappel and cross sky bridges down the mountain. Warm up by a fire after.
description: >
  Ride the gondola up the mountain, then work your way back down with a guide
  through nine ziplines, two sky bridges and three rappels, with Mount
  Washington across the valley. You'll do short hikes between lines and brake
  with a gloved hand, so wear sturdy closed-toe shoes. Get a photo of your
  partner launching off the longest line. Afterward, warm up with a drink by
  the fire at the grand old hotel across the road. Reservations are required,
  the season and days change through the year, and riders must be 12 or
  older and between 90 and 250 pounds.
