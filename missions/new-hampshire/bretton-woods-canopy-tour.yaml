short: Bretton Woods Canopy Tour in the White Mountains. Zipline, rappel and cross sky bridges.
description: >
  Ride the gondola up the mountain, then work your way back down with a
  guide through ziplines, sky bridges and rappels, with Mount Washington
  across the valley. Before the longest line, each predict who'll scream
  first. The photo to get: your partner launching off the longest line.
  Afterward, warm up with a drink by the fire at the grand old hotel across
  the road.
about: >
  The tour has nine ziplines, two sky bridges and three rappels, with short
  hikes in between. You brake with a gloved hand, so wear sturdy closed-toe
  shoes. Riders must be 12 or older and within the posted weight limits.

  The hotel across the road is the Omni Mount Washington, opened in 1902. In
  1944 it hosted the Bretton Woods Conference, where world leaders created
  the International Monetary Fund and the World Bank. Reservations are
  required, and the season changes through the year.
