short: Boulder Dushanbe Teahouse. Share a pot of tea under a hand-carved, hand-painted ceiling.
description: >
  Spend an evening inside Boulder's Dushanbe Teahouse, a building sent as a
  gift from Boulder's sister city in Tajikistan, with a hand-carved, painted
  ceiling and columns and a little fountain in the middle of the room. Order
  for each other from the long tea list, then share a couple of small plates
  or a dessert. Take your time and look up at the details between sips. Get a
  photo of the two of you with the teapot and the ceiling above you.
  Reserve a table ahead, and check for private-event closures before you go.
about: >
  The teahouse was a gift to Boulder from its sister city, Dushanbe,
  Tajikistan. More than 40 artisans there carved and painted it by hand, then
  it was shipped to Colorado in pieces and put back together. It opened in
  1998.

  No nails hold the ceiling's carved panels in the traditional way, and no
  two panels are exactly alike. Look up between sips. Reserve a table ahead,
  and check for private-event closures before you go.
