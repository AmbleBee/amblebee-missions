short: Share a pot of tea under a hand-carved painted ceiling. Each pick a tea for the other.
description: >
  Spend an evening inside Boulder's Dushanbe Teahouse, a building sent as a
  gift from Boulder's sister city in Tajikistan, with a hand-carved, painted
  ceiling and columns and a little fountain in the middle of the room. Order
  for each other from the long tea list, then share a couple of small plates
  or a dessert. Take your time and look up at the details between sips. Get a
  photo of the two of you with the teapot and the ceiling above you.
  Reserve a table ahead, and check for private-event closures before you go.
