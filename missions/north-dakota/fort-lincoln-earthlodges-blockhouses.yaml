short: Fort Abraham Lincoln near Mandan. Duck into an earthlodge, then climb to the fort's blockhouses.
description: >
  Spend a few hours at a state park on the Missouri River where two worlds sit
  side by side. Start at On-A-Slant Village, with its six reconstructed Mandan
  earthlodges, and imagine a whole family living around the fire. Then head up
  the hill to the wooden blockhouses of the old army post and look out over the
  river and prairie. In summer you can add a guided tour of the Custer House.
  Get a photo of everyone in the doorway of an earthlodge.
about: >
  On-A-Slant Village was home to about 1,500 Mandan people in roughly 85
  earthlodges, from the 1500s until 1781, when smallpox swept the Upper
  Missouri. In the 1930s, Civilian Conservation Corps crews rebuilt lodges on
  their original sites with guidance from Scattered Corn, the first woman to
  serve as a Mandan corn priest.

  The army fort above was built in 1872. In 1876 Lt. Col. George Custer rode
  out from here to the Little Bighorn and never came back. His house was
  rebuilt in the 1980s, and the CCC built the blockhouses and the stone
  visitor center museum in the 1930s. Tours of the Custer House run in summer.
