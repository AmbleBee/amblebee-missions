short: Duck into a Mandan earthlodge, then climb the hill to the fort's blockhouses. Spot the river!
description: >
  Spend a few hours at a state park on the Missouri River where two worlds sit
  side by side. Start at On-A-Slant Village, with its six reconstructed Mandan
  earthlodges, and imagine a whole family living around the fire. Then head up the
  hill to the wooden blockhouses of the old army post and look out over the river
  and prairie. From Memorial Day to Labor Day you can add a guided tour that
  includes the Custer House. Get a photo of everyone in the doorway of an earthlodge.
for_kids:
