name: Amble North Dakota
region: North Dakota
description: Real places all over North Dakota, starting in the Badlands town of Medora.
icon: bison
# A longer description for this pack's own page on the website (not sent to the Hive).
about: >
  North Dakota is prairie, Badlands and real Old West towns, from Bismarck and Mandan to Medora. For one of the
  most memorable things to do in North Dakota, head to Medora for a steak fondue dinner and an outdoor musical
  on a summer night.
