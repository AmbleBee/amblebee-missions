short: ND Heritage Center in Bismarck. Meet a T. rex and the world's biggest giant squid fossil, free.
description: >
  The state museum on the Capitol grounds is free every day and packs 600
  million years into four galleries. Start with the fossils: a life-size
  T. rex skeleton cast, the world's largest giant squid fossil, and out in the
  hallway, Dakota, a rare dinosaur with its skin turned to stone. Then climb
  into the tractor cab simulator, check out the Mars spacesuit, and let little
  ones loose in the Treehouse, with its lookout, kid-size fire station and
  grocery store. Get a photo of everyone doing their best roar in front of the
  T. rex.
about: >
  The North Dakota Heritage Center first opened in 1981 and roughly doubled
  in size with an expansion that opened on the state's 125th birthday in
  2014. Its galleries run from the age of dinosaurs through the people who
  first lived on the plains to modern farming and oil.

  Many of the fossils came out of North Dakota's own badlands, which were
  ancient seas and swamps millions of years ago; even the giant squid fossil
  was found in the state. The Mars spacesuit was built by a team at the
  University of North Dakota. Admission is free, and it's a good indoor plan
  for a cold or rainy day in Bismarck.
