short: Meet a T. rex and a giant squid fossil at Bismarck's free state museum.
description: >
  The state museum on the Capitol grounds is free every day and packs 600
  million years into four galleries. Start with the fossils: a life-size
  T. rex skeleton cast and the world's largest giant squid fossil. Then climb
  into the tractor cab simulator, check out the Mars spacesuit, and let little
  ones loose in the Treehouse play area. Get a photo of everyone doing their
  best roar in front of the T. rex.
