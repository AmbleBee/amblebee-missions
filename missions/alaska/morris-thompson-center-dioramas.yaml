short: Walk through Interior Alaska's seasons indoors. Find a moose, a fish camp and a cabin.
description: >
  Warm up inside downtown Fairbanks' free cultural and visitors center, where
  a big exhibit hall walks you through a year in Interior Alaska. Life-size
  dioramas show wildlife and the changing seasons, and you can step into a
  fish camp smokehouse, a hunting camp and a public-use cabin. Pick up a national
  parks passport stamp at the public lands desk on the way out. Get a
  photo of the family in the doorway of the cabin. On a nice day, peek at the
  old log cabin and sculptures outside along the Chena River.
