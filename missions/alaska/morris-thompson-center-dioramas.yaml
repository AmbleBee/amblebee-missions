short: Morris Thompson Center in Fairbanks. Walk through a year in Interior Alaska and find the fish camp.
description: >
  Warm up inside downtown Fairbanks' free cultural center and walk through a
  year in Interior Alaska, season by season. Find the moose, step into the
  fish camp smokehouse and the hunting camp, and each pick the season you'd
  most want to live in. The photo to get: the family in the doorway of the
  little cabin. On the way out, stamp your national parks passport at the
  public lands desk.
about: >
  The center opened in 2008 and is named for Morris Thompson, a Koyukon
  Athabascan leader from Tanana who served as U.S. Commissioner of Indian
  Affairs and later led Doyon, the regional Native corporation for Interior
  Alaska.

  It's shared by several groups, including the Tanana Chiefs Conference and
  the Alaska Public Lands Information Center, so it's a good place to ask
  about parks, trails and road conditions too. Entry is free.

  On a nice day, walk the grounds outside along the Chena River to see an
  old log cabin and sculptures.
for_kids:
  short: Explore Alaska inside! Find each thing.
  steps:
