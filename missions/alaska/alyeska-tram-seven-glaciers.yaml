short: Alyeska Resort in Girdwood. Ride the tram up Mount Alyeska to dinner facing the glaciers.
description: >
  Ride the aerial tram up Mount Alyeska above Girdwood and sit down to
  dinner at Seven Glaciers, with windows looking out over hanging glaciers
  and Turnagain Arm. Before you eat, step out on the mountain for the photo:
  the two of you with the glaciers and the arm far below. Then each try to
  count how many glaciers you can spot from your table.
about: >
  The tram climbs to about 2,300 feet in a few minutes, and Seven Glaciers
  is named for the glaciers you can see from the top. Girdwood is about 40
  miles south of Anchorage along Turnagain Arm, one of the most beautiful
  drives in Alaska. Watch for Dall sheep on the cliffs and, in summer,
  beluga whales in the water.

  Go in summer for evening light that lasts long past dinner, or in winter
  for snow on everything. Dinner needs a reservation, and the tram closes
  for a few weeks in spring and late fall for maintenance.
