short: Mendenhall Glacier in Juneau. Walk the flat trail to a roaring waterfall beside the blue ice.
description: >
  Walk the mostly flat Nugget Falls Trail out to a waterfall that crashes
  down right beside Mendenhall Glacier. On the gravel beach, get a family
  photo with the falls and the blue ice behind you, and see who can spot the
  bluest patch of ice. On the way back, walk the Steep Creek boardwalk and
  look for spawning salmon, beavers and, in late summer, black bears fishing.
about: >
  Mendenhall Glacier flows about 13 miles down from the Juneau Icefield. It
  has pulled back well over a mile since the visitor center opened in the
  1960s. Old photos inside show where the ice used to reach, and it's
  striking to compare them with the view out the big windows.

  The Nugget Falls Trail is about two miles round trip. Black bears use the
  Steep Creek area, so stay on the boardwalk and follow rangers' directions.

  Visitors 16 and up need a small day pass for the visitor center area. Kids
  are free, and the Nugget Falls Trail itself needs no pass.
