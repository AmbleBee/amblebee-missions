short: Bike the car-free paths of an old tobacco heiress's estate. Hunt for turtles, statues and orchids.
description: >
  Duke Farms is Doris Duke's huge former estate, now free to visit, with miles
  of quiet, car-free paths past lakes, meadows, big outdoor sculptures and old
  estate buildings. Bring your bikes or a stroller (there's also a pay-per-ride
  bike share on site), ride a loop at kid speed,
  and stop at the lakes to look for turtles sunning on logs. Finish inside the
  glass Orchid Range, a greenhouse full of orchids. Get a photo of the family
  with the biggest statue you find. It isn't open every day, so check the hours
  calendar, and on Saturdays from April through October you need a free parking
  pass reserved ahead.
steps:
