short: Duke Farms in Hillsborough, NJ. Bike the car-free estate paths and find turtles and orchids.
description: >
  Duke Farms is Doris Duke's huge former estate, now free to visit, with miles
  of quiet, car-free paths past lakes, meadows, old statues and historic
  estate buildings. Bring your bikes or a stroller (there are seasonal bike
  rentals when they're running), ride a loop at kid speed, and stop at the
  lakes to look for turtles sunning on logs. Finish inside the glass Orchid
  Range, a greenhouse full of orchids. Get a photo of the family with the
  biggest statue you find.
about: >
  Duke Farms in Hillsborough, New Jersey, was the childhood estate of Doris
  Duke, heir to a tobacco and energy fortune. After she died, her foundation
  turned its 2,700 acres into a nature preserve and opened it to the public
  for free in 2012. Today there are more than 18 miles of trails through
  meadows, woodlands and wetlands and around the lakes, some of them paved
  and stroller-friendly, and bald eagles nest on the property.

  The Orchid Range, a glass conservatory from 1899, holds nearly 2,000 orchids
  in about 1,300 varieties. Doris Duke loved orchids, and in 1940 she created
  an orchid hybrid here that's the ancestor of the most common orchids sold
  today. The trails aren't open every day and Saturdays need a free parking
  pass reserved ahead for much of the year, so check the hours calendar
  before you go.
