name: Amble New Jersey
region: New Jersey
description: Real places all over New Jersey, starting at the very southern tip in Cape May.
icon: ferris-wheel
# A longer description for this pack's own page on the website (not sent to the Hive).
about: >
  New Jersey has more shoreline than people expect, plus Pine Barrens forest and lively towns from Trenton to
  Cape May. For a date idea at the southern tip, Cape May's Sunset Beach is known for its sunsets and the old
  concrete ship just offshore.
