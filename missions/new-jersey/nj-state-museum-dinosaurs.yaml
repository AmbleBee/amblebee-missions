short: Meet New Jersey's own dinosaur at the free state museum in Trenton. Find the biggest bones!
description: >
  Walk through the free state museum's natural history hall, where fossils and
  casts trace life in New Jersey from ancient seas to the Ice Age, including
  Hadrosaurus, the state dinosaur first dug up in Haddonfield. Let the kids
  lead the way and hunt for the biggest skull, the sharpest teeth and the
  strangest sea creature. Get a photo of everyone standing under the tallest
  skeleton. The planetarium runs weekend shows for an extra fee if you want
  to add one. Expect a bag check at the door.
