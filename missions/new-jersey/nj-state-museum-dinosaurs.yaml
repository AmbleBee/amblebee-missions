short: New Jersey State Museum in Trenton. Meet the state dinosaur at this free museum.
description: >
  Head up to the free state museum's fossil hall, where fossils and casts
  trace life in New Jersey from ancient seas to the Ice Age. Meet
  Hadrosaurus, the state dinosaur first dug up in Haddonfield, and a 50-foot
  Mosasaurus, a sea monster found in South Jersey. Let the kids lead the way
  and hunt for the biggest skull, the sharpest teeth and the strangest sea
  creature, and look for the rocks and fossils you're allowed to touch. Get a
  photo of everyone standing under the tallest skeleton.
about: >
  Hadrosaurus, New Jersey's state dinosaur, was dug up in Haddonfield in
  1858. It was one of the first nearly complete dinosaur skeletons ever
  found, and in 1868 it became the first dinosaur skeleton ever mounted for
  display, in nearby Philadelphia. The museum's full-size cast is 25 feet
  long, and it shares the hall with Dryptosaurus, a meat-eating dinosaur also
  found in New Jersey, and the giant sea reptile Mosasaurus.

  The museum is free, with a bag check at the door. The planetarium has
  shows for an extra fee if you want to add one.
