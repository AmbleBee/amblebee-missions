description: >
  At New Jersey's southern tip you can watch the sun set over the water. Hunt the beach
  for little polished quartz pebbles called Cape May diamonds, spot the wreck of a
  concrete ship just offshore, and stay for sunset. On summer evenings there's a short
  flag-lowering ceremony for veterans.
