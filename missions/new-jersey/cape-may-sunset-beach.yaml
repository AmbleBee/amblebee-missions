short: Sunset Beach in Cape May. Hunt for Cape May diamonds, then watch the sun set over the bay.
description: >
  Hunt the beach for little polished quartz pebbles called Cape May
  diamonds, and see who finds the clearest one. Spot the wreck of a concrete
  ship just offshore, then stay for the sun setting over the water. The
  photo to get: the two of you holding up your best diamonds with the
  sunset behind you.
about: >
  Cape May diamonds are bits of quartz that washed down the Delaware River
  and got tumbled smooth by the waves. Polished, they really do sparkle.

  The ship offshore is the SS Atlantus, one of a handful of concrete ships
  built around World War I. It ran aground here in 1926, and what's left is
  slowly sinking. On summer evenings, a flag-lowering ceremony honors
  veterans, using flags that once covered their caskets. The Cape May
  Lighthouse is just down the road.
