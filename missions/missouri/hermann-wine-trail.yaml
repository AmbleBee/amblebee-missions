short: Taste your way along the Missouri River on the Hermann Wine Trail. Bring home one bottle.
description: >
  Spend a day in Hermann, an old German river town, and taste your way along
  the Hermann Wine Trail: six family-owned wineries along about 30 miles of the
  Missouri River, from historic stone cellars downtown to hilltop vineyards.
  Each pick your favorite pour, then buy one bottle together to save for a
  special occasion. Tastings run year-round; the trail's ticketed food-and-wine
  weekends are worth planning around. Pick a designated driver.
