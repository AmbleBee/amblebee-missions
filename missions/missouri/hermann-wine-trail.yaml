short: Hermann Wine Trail along the Missouri River. Taste your way through and bring home one bottle.
description: >
  Spend a day in Hermann, an old German river town, and taste your way along
  the wine trail, from historic stone cellars downtown to hilltop vineyards
  over the Missouri River. Each pick your favorite pour, then buy one bottle
  together to save for a special occasion. The photo to get: the two of you
  in the vineyard rows with the river valley behind you.
about: >
  German settlers founded Hermann in 1837 and planted vineyards on the river
  bluffs, and the area became known as the Missouri Rhineland. By the
  late 1800s, Hermann's Stone Hill Winery was one of the largest wineries in
  the country, until Prohibition shut it all down.

  The trail's six family wineries stretch along about 30 miles of the river,
  so pick a designated driver. The ticketed food-and-wine weekends are worth
  planning around.
