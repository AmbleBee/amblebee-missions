short: Rooftop Cinema Club in Kansas City's Crossroads. A movie under the sky, skyline behind the screen.
description: >
  Get to the rooftop early to grab a drink, play a yard game and watch the
  sun go down over the city, then settle in with wireless headphones for a
  movie under the open sky. Pick a classic you both love, or one neither of
  you has seen. Get a photo of the two of you with the screen and skyline
  behind you before it starts. It's a seasonal venue, fully outdoors, so
  check the weather and bring a layer.
about: >
  Rooftop Cinema Club started in London in 2011 and now runs rooftop movie
  nights in cities across the US. Everyone wears wireless headphones, so the
  neighbors stay happy and you hear every word. The Kansas City rooftop
  opened in 2025 on the fourth floor of a building in the Crossroads, and
  shows can sell out, so book ahead.

  The Crossroads Arts District below is full of galleries, and on First
  Fridays it fills with street art and food trucks.
