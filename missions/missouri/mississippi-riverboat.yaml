short: Mississippi riverboat cruise at the Gateway Arch in St. Louis. See the Arch from the water.
description: >
  Board a paddlewheel-style riverboat at the foot of the Arch and cruise the
  Mississippi while the captain tells stories about the river. Each count
  the barges you pass and guess what they're carrying. The photo to get: the
  Arch from the water, with you at the rail. For a date version, book an
  evening dinner cruise and watch the skyline light up.
about: >
  The riverboats are replicas of 1800s paddlewheelers. The Tom Sawyer was
  built in 1966, and a brand-new Becky Thatcher, the first new boat in the
  fleet since 1987, arrived on the riverfront in August 2026.

  Mark Twain worked as a Mississippi steamboat pilot before he became a
  writer, and he took his pen name from a riverboat call: "mark twain" meant
  the water was two fathoms deep, safe to pass. Cruises run seasonally and
  depend on river levels, so check before you go.
for_kids:
  short: Riverboat ride! Find each thing.
  steps:
    - The big riverboat
    - The arch from the boat
    - A barge on the river
    - A selfie on the deck!
