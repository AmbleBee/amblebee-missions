short: Lone Elk Park near St. Louis. Drive slowly through bison and elk, then meet the owls next door.
description: >
  Roll down the windows and creep along the park road while you hunt for the
  herds of elk and bison that wander right up near the cars, plus deer and
  wild turkeys. Never get out near the animals; watch from the car or a safe
  distance. Have a picnic, then head next door to the World Bird Sanctuary (small
  admission fee) to walk past outdoor enclosures of eagles, owls, hawks and vultures that can't
  go back to the wild. Get a photo of a bison through your car window. No pets
  are allowed in Lone Elk Park, not even inside the car, and motorcycles
  aren't allowed either.
about: >
  During and after World War II, this land was used by the military, and the
  original elk herd was lost. The park is named for a single bull elk that
  was later found living here, and elk were brought back, along with bison.

  The World Bird Sanctuary next door, founded in 1977, cares for eagles,
  owls and hawks that can't return to the wild. No pets are allowed in Lone
  Elk Park, not even in the car, and motorcycles aren't allowed either.
