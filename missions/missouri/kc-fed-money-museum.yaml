short: Money Museum at the Kansas City Fed. Go inside the Federal Reserve and try to lift a gold bar.
description: >
  Visit the free Money Museum at the Federal Reserve Bank of Kansas City, near
  Crown Center. Go through the airport-style security, then take turns trying
  to lift a real gold bar, peek into the giant cash vault where billions of
  dollars get counted, check out the Truman coin collection, and learn how to
  spot a counterfeit bill. Each guess how much the gold bar weighs before you
  try, then see who was closest. Everyone leaves with a free bag of shredded
  money. The photo to get: each person's face mid-lift.
about: >
  The Federal Reserve Bank of Kansas City is one of twelve regional banks
  that make up the country's central bank. The museum is free and right
  across from the WWI Museum and Memorial. Ask whether one of the free
  staff-led tours is running when you visit.

  The gold bar was cast in 1959 and weighs about 27 pounds, about as much as
  a big bag of dog food, and it's heavier than it looks. President Harry
  Truman, who was from nearby Independence, collected one coin from every
  presidential administration back to George Washington, and his collection
  is on display here. It's open weekdays only. Grown-ups need a photo ID, and
  no photos of the security gear or cash operations.
