short: Go inside the Federal Reserve and try to lift a real gold bar. Who's strongest?
description: >
  The Federal Reserve Bank of Kansas City runs a free, walk-in money museum
  right across from the WWI Memorial. Go through the airport-style security,
  then take turns trying to lift a real gold bar, check out the Truman coin
  collection, and learn how to spot a counterfeit bill. Get a photo of each
  person's face mid-lift. It's open weekdays only, grown-ups need a photo ID,
  and no pocketknives. No photos of the security gear or the cash operations.
