short: 1984 Arcade in Springfield, MO. One cover, all-night classic 80s games. Set a high score.
description: >
  Step into an 80s time machine: rows of original arcade cabinets, neon,
  black lights and 80s music videos. Each pick the game you were best at as
  a kid, go head to head on Pac-Man or Galaga, and try to get your initials
  on the high-score board. The photo to get: you mid-game in the neon.
about: >
  One cover charge gets you unlimited play on the video games; pinball still
  takes quarters, so bring some. It's open on certain evenings each week, so
  check the hours.

  Springfield has its own claim to fame: it's called the birthplace of Route
  66, since the highway's name was chosen here in 1926.
