short: Pay one cover and play classic 80s arcade games all night. Set a high score together.
description: >
  Step into an 80s time machine: dozens of original arcade cabinets, neon,
  black lights and 80s music videos. One cover charge gets you unlimited play
  on the video games (pinball takes quarters). Each pick the game you were best
  at as a kid, go head to head on Pac-Man or Galaga, and try to get one of your
  initials on the high-score board. Get a photo of the two of you mid-game in
  the neon. Open Wednesday through Saturday evenings.
