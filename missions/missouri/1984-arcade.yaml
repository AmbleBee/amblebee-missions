short: 1984 Arcade in Springfield, MO. One cover, all-night classic 80s games. Set a high score.
description: >
  Step into an 80s time machine: rows of original arcade cabinets, neon,
  black lights and 80s music videos. Each pick the game you were best at as
  a kid, go head to head on Pac-Man or Galaga, and try to get your initials
  on the high-score board. The photo to get: you mid-game in the neon.
about: >
  1984 Arcade has been Springfield’s retro arcade since 2005. It started
  with a TRON and an Asteroids cabinet that co-owner Devin Durham bought for
  his brother. Now nearly 100 classic machines fill a century-old brick
  building downtown that began as a hotel and later housed nuns.

  One cover charge gets you free play on every video game all night, from
  Pac-Man, Galaga and Donkey Kong to TRON and Pong. The pinball machines and
  the claw machine still take quarters. Head down to the basement for a
  recreation of the haunted library from Ghostbusters, and check the
  high-score wall to see whose initials you’re up against. It’s alcohol-free
  and family-friendly, and anyone 15 or under needs an adult along.

  There’s a sister arcade, 1984 Branson, at the Shoppes at Branson Meadows.
  And while you’re downtown: Springfield calls itself the birthplace of
  Route 66, because the highway got its number here in 1926.
