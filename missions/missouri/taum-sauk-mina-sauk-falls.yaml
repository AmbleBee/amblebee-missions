short: Taum Sauk Mountain near Ironton. Stand on Missouri's highest point, then hike to its tallest falls.
description: >
  Walk the short paved path to the top of Taum Sauk Mountain, the highest
  point in Missouri, and get your summit photo by the marker. Then take the
  loop down across open rocky glades to Mina Sauk Falls, which tumbles in
  steps down the mountainside. Each guess how tall the falls are before you
  read the sign, and closest gets to pick the dinner spot.
about: >
  The summit is 1,772 feet, low by mountain standards, but the St. Francois
  Mountains are some of the oldest exposed rock in North America, worn down
  from ancient volcanoes more than a billion years old.

  Mina Sauk Falls drops about 130 feet in a series of ledges, the tallest
  waterfall in Missouri. It runs best after rain and can be a trickle in
  dry spells. The loop is about three miles, rocky and steep in places, and
  part of it follows the Ozark Trail. Wear real shoes and bring water.
