description: >
  A family day at St. Louis's beloved hands-on children's museum. Touch the
  famous electrostatic ball and watch your hair stand on end, climb the
  three-story beanstalk, run a kid-sized town, and splash at the water
  exhibits. Let the kids pick the order, and get a photo of everyone's crazy
  hair. Timed tickets can sell out on busy days, so book ahead.
