short: Ha Ha Tonka State Park near Camdenton. Explore stone castle ruins over the Lake of the Ozarks.
description: >
  Walk out to the shell of a 1900s stone mansion that burned in 1942, standing
  on a bluff high above the Lake of the Ozarks. Explore the ruins and the old
  water tower, then take the boardwalk stairs down to the big blue spring and
  the natural bridge. Each pick the room you'd have claimed if the castle were
  still standing, and get a photo framed in one of the empty stone windows. The
  stairs back up are a workout.
about: >
  Kansas City businessman Robert Snyder started building his dream castle
  here in 1905, but he died the next year in one of Missouri's early car
  crashes. His sons finished it in the 1920s, and a fire, said to have
  started from fireplace sparks, gutted it in 1942.

  The spring at the bottom of the bluff pours out millions of gallons of
  water every day. The name Ha Ha Tonka is often said to mean "laughing
  waters." The stairs back up are a workout.
for_kids:
