short: Classic's Yard in Springfield, MO. Run a game tournament with fowling, pickleball and cornhole.
description: >
  Head to the indoor game hall behind Classic Rock Coffee and run your own
  tournament: pickleball, fowling (bowling pins and a football), giant Connect
  4 basketball, cornhole, ping-pong, darts and more. Play best of three in three
  different games, keep score, and the overall winner picks dessert. Get a
  photo of the champion.
about: >
  Fowling was dreamed up by a group of Detroit-area friends tailgating at the
  Indianapolis 500: you throw a football at a rack of bowling pins at the
  other end of a lane. It caught on, and fowling halls have since opened
  around the country. It's easy to learn and loud to play.

  Some games book up on weekend nights, so reserve ahead. Classic Rock Coffee
  out front is handy for drinks between rounds.
