short: Breakout KC in Kansas City. Crack codes and solve riddles to escape a themed room in an hour.
description: >
  Book a room at one of Kansas City's first escape rooms and work together to
  find clues, crack codes and solve riddles before the hour runs out. Pick a
  theme neither of you has tried, and take a photo before you go in and right
  after, whether you made it out or not. Then celebrate (or regroup) over food
  in the River Market. Book ahead; rooms run in timed slots.
about: >
  Escape rooms started in Japan in the early 2000s, inspired by puzzle video
  games, and reached Kansas City in 2015, when Breakout KC opened in the
  River Market as one of the city's first. Tips: split up to search, shout
  out every number and symbol you find, and ask for a hint before you're
  totally stuck.

  For a real-life mystery afterward, walk a few blocks to the Arabia
  Steamboat Museum. The Arabia hit a submerged tree and sank in the Missouri
  River in 1856 with 200 tons of cargo. Over the next century the river
  moved, and in 1988 a local family dug the boat out from 45 feet under a
  Kansas cornfield, half a mile from the water. Its dishes, tools, boots and
  even jars of food are on display.
