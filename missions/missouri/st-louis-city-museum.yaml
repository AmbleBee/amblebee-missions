short: City Museum in St. Louis. Crawl the caves, ride the 10-story slide, climb MonstroCity.
description: >
  Spend the day exploring an old shoe warehouse turned into a giant
  climbable maze: caves and tunnels, a 10-story slide, and the outdoor
  MonstroCity jungle gym. Everyone picks one tunnel the rest of the group
  has to follow them through, no matter how tight. The photo to get: your
  group at the bottom of the big slide. In warmer months, ride the rooftop
  Ferris wheel around sunset.
about: >
  Artist Bob Cassilly and a crew of artists opened City Museum in 1997 in
  the old International Shoe Company building. Almost everything is built
  from salvaged pieces of the city: old bridges, chimneys, airplanes and
  even a school bus hanging off the edge of the roof.

  Wear closed-toe shoes and clothes you can crawl in (knee pads help), and
  bring a small flashlight for the caves. Get tickets online to skip the
  line.
