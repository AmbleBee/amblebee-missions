short: Mid America Adventure near St. Louis. Ride the wooden coasters; each pick a ride for the other.
description: >
  Spend the day at St. Louis's big theme park, open since 1971. Ride the classic
  wooden coasters like the Screamin' Eagle and American Thunder, cool off on the
  rapids, and each pick one ride the other has to go on with you. Get a photo of you right after the scariest drop. The park runs spring through
  fall, with Halloween events in October.
about: >
  The park opened in 1971 as Six Flags Over Mid-America and took on a new
  name after it changed owners. Its Screamin' Eagle wooden coaster, opened in
  1976, was once the longest and fastest wooden coaster in the world.

  The park runs spring through fall, with Halloween events in October. Check
  the current name, hours and ticket site before you go, since things
  changed with the rebrand.
