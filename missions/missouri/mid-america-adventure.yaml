short: Ride the wooden coasters at Mid America Adventure. Each pick one ride the other must take.
description: >
  Spend the day at St. Louis's big theme park, open since 1971. Ride the classic
  wooden coasters like the Screamin' Eagle and American Thunder, cool off on the
  rapids, and each pick one ride the other has to go on with you. Get a photo of
  the two of you right after the scariest drop. The park runs spring through
  fall, with Halloween events in October.
