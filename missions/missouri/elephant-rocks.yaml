short: Elephant Rocks State Park in Missouri. Climb giant pink granite boulders lined up like elephants.
description: >
  Walk the short paved Braille Trail loop to a "herd" of huge pink granite
  boulders, some as big as a house, lined up like circus elephants. Scramble
  around the smaller rocks, find the old quarry pond, and name the biggest
  elephant before you read what the park calls it. Get a photo of you
  standing on top of one.
about: >
  The granite here formed about 1.5 billion years ago, then slowly wore into
  rounded boulders. The biggest, nicknamed Dumbo, is 27 feet tall and weighs
  about 680 tons. Granite quarried nearby was used to build the Eads Bridge
  and pave St. Louis streets, and you can still see those paving stones at
  Laclede's Landing.

  The paved Braille Trail, opened in 1973, was the first trail in Missouri's
  state parks built for visitors who are blind or have low vision, with signs
  in braille.
caution: "Rocks get slick when wet. Stay off steep edges and away from the quarry pond ledges."
for_kids:
