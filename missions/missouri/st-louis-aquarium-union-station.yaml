short: St. Louis Aquarium at Union Station. Explore it, then ride the 200-foot Wheel at dusk.
description: >
  Start inside historic Union Station, once the biggest train terminal in the
  country, with the aquarium's train-ride entrance, sharks and river animals.
  Each pick your favorite creature. Then ride the 200-foot St. Louis Wheel next
  door around sunset and find the Arch from the top. Tickets are timed, so
  book ahead; combo tickets cover the Wheel too. Stop by the Grand Hall's light
  show before you leave.
about: >
  Union Station opened in 1894 and was once one of the biggest and busiest
  train stations in the world. The aquarium and the Wheel both opened in
  2019 as part of its comeback.

  Inside the Grand Hall, a light show is projected onto the huge arched
  ceiling in the evenings. Tickets are timed, and combo tickets cover the
  Wheel too.
