short: St. Louis Aquarium at Union Station. Explore it, then ride the 200-foot Wheel at dusk.
description: >
  Start inside historic Union Station, once the biggest train terminal in the
  country, with the aquarium's train-ride entrance, sharks and river animals.
  Each pick your favorite creature. Then ride the 200-foot St. Louis Wheel
  next door around sunset and find the Arch from the top. Tickets are timed,
  so book ahead; combo tickets cover the Wheel too. Stop by the Grand Hall's
  light show before you leave. The photo to get: you at the top of the Wheel
  with the Arch in the distance.
about: >
  Union Station opened in 1894, designed by Theodore Link, and in the 1940s
  about 100,000 passengers a day passed through it. The last train left in
  1978. The Grand Hall has a gold-leafed, 65-foot barrel-vaulted ceiling, and
  a light show is projected onto it in the evenings.

  The aquarium opened on Christmas Day 2019 and the St. Louis Wheel followed
  in 2020, as part of the station's comeback. Tickets are timed, and combo
  tickets cover the Wheel too.
