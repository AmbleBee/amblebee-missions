short: Gateway Arch in St. Louis. Ride the tiny tram to the top, then photograph it from below.
description: >
  Squeeze into the little pod-shaped tram and ride up inside the Arch, then
  look out the narrow windows at the top over the Mississippi and the city.
  Back on the ground, walk out under the legs and find your best angle. The
  photo to get: straight up from the base, the Arch shrinking into the sky.
about: >
  The Gateway Arch is 630 feet tall and 630 feet wide, the tallest monument in
  the United States and the tallest arch in the world. Architect Eero Saarinen
  designed it, and its stainless steel sections were finished in 1965. The
  tram pods hold five people and take about four minutes to reach the top,
  where you get a few minutes at the windows before heading back down.

  The grounds became Gateway Arch National Park in 2018, Missouri's first
  national park. The free museum under the Arch tells the story of St. Louis
  and the westward expansion, and the historic Old Courthouse across the
  street is free too. Tram tickets often sell out, so buy them ahead, and if
  tight spaces worry you, sit in the replica tram car by the ticket counter
  before you buy.
for_kids:
  short: Ride to the top of the giant arch!
  steps:
    - The arch from the ground
    - The tiny tram car
    - The river from the top
    - A selfie under the arch!
