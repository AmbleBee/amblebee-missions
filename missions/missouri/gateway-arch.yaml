short: Gateway Arch in St. Louis. Ride the tiny tram to the top, then photograph it from below.
description: >
  Squeeze into the little pod-shaped tram and ride up inside the Arch, then
  look out the narrow windows at the top over the Mississippi and the city.
  Back on the ground, walk out under the legs and each find your best angle.
  The photo to get: straight up from the base, the Arch shrinking into the
  sky.
about: >
  The Arch is 630 feet tall and 630 feet wide, the tallest monument in the
  country. Architect Eero Saarinen designed it, and it was finished in 1965.
  The tram pods hold five people and take about four minutes to reach the
  top.

  The grounds became Gateway Arch National Park in 2018, and the museum under
  the Arch tells the story of the westward expansion. Buy tram tickets ahead,
  especially on weekends.
for_kids:
