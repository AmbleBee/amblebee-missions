short: Ride the tiny tram to the top of the Gateway Arch. Then photograph it from below.
description: >
  Take the little pod-shaped tram up inside the Arch and look out the windows at
  the top over the Mississippi and the city. Back on the ground, walk out under
  the legs and find your best angle: straight up from the base, or the whole
  curve from across the park.
