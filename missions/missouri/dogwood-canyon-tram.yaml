short: Dogwood Canyon near Branson. Ride the tram into bison and elk country and feed the giant trout.
description: >
  Take the narrated tram tour through a canyon of bluffs, waterfalls and
  creek crossings, out into the pasture where bison and elk roam. Each guess
  how many bison you'll see before you spot the first one. Stop at the little
  chapel and toss food to the huge trout at the Glory Hole. The photo to get:
  you on the tram with the bison behind you.
about: >
  Dogwood Canyon was put together in the 1990s by Johnny Morris, the founder
  of Bass Pro Shops, to protect a wild Ozarks canyon. The park is so big that
  the tram crosses the state line into Arkansas and back.

  Park admission is separate from the tram, and tours sell out often, so
  book ahead.
