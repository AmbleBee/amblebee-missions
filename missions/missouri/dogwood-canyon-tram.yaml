short: Ride the open-air tram through Dogwood Canyon into bison and elk country. Feed the giant trout.
description: >
  Take the two-hour narrated tram tour through a canyon of bluffs, waterfalls
  and creek crossings, out into the pasture where the bison and elk roam. Stop
  at the little 1800s-style chapel and toss food to the huge trout at the Glory
  Hole. Each guess how many bison you'll see before you spot the first one. Park
  admission is separate, and tours sell out often, so book ahead.
for_kids:
