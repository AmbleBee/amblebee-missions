short: Go Ape at Swope Park in Kansas City. Zip, swing and climb through the treetops.
description: >
  Harness up and take on the Treetop Adventure course in Swope Park: rope
  bridges, wobbly ladders, a giant Tarzan swing and five ziplines, the longest
  475 feet, up to 45 feet in the trees. Cheer each other through the scariest
  crossing and get a photo coming off the last zip. Plan two to three hours,
  wear closed-toe shoes, and book ahead. Younger kids can do the lower Treetop
  Journey course instead.
about: >
  Go Ape started in England in 2002 and now runs treetop courses in forests
  around the world. Here you're up to about 45 feet in the trees, clipped in
  the whole time.

  Swope Park is one of the biggest city parks in the country, given to
  Kansas City in 1896 by Thomas Swope. The Kansas City Zoo is in the park too.
  Plan two to three hours, wear closed-toe shoes, and book ahead.
