short: Go Ape at Swope Park in Kansas City. Zip, swing and climb through the treetops.
description: >
  Harness up and take on the Treetop Adventure course in Swope Park: rope
  bridges, wobbly ladders, a giant Tarzan swing and five ziplines, the longest
  475 feet, up to 45 feet in the trees. Cheer each other through the scariest
  crossing and get a photo coming off the last zip. Plan two to three hours,
  wear closed-toe shoes, and book ahead. Treetop Adventure is for ages 10 and
  up; younger kids can do the lower Treetop Journey course instead.
about: >
  Go Ape started in England in 2002 and now runs treetop courses in forests
  around the world. You're clipped in the whole time, and staff help you
  through the Tarzan swing, the one crossing that works differently.

  Swope Park is more than twice the size of New York's Central Park, making it
  one of the largest city parks in the country. Thomas Swope gave the land to
  Kansas City in 1896, and he's buried beneath the Swope Memorial inside the
  park. The Kansas City Zoo is here too, and part of the park covers the site
  of the Battle of Byram's Ford, part of the Civil War's Battle of Westport.
