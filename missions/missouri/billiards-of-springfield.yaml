short: Billiards of Springfield. Shoot pool on nine-foot tables at a classic hall; loser buys burgers.
description: >
  Grab a table at Springfield's classic pool hall, with sixteen full-size
  nine-foot tables, and play a best-of-five. Loser buys the burgers, which
  locals swear are some of the best in town. If one of you is new to pool,
  the other has to teach a trick shot. Get a photo lining up the winning
  shot.
about: >
  The hall sits on St. Louis Street across from the historic Shrine Mosque,
  a few blocks from where Route 66 got its name. On April 30, 1926, highway
  officials sent a telegram from the Colonial Hotel at St. Louis and
  Jefferson proposing the number 66 for the new Chicago-to-Los Angeles road.
  The hotel is gone, but Birthplace Plaza and its steel "Ghost of the
  Colonial Hotel" sculpture mark the spot, an easy walk after your match.

  Nine-foot tables are the size used in professional tournaments, bigger
  than most bar tables, so long shots are harder than you expect. Beginner
  tips: keep your bridge hand steady, look at the spot on the ball you want
  to hit, and follow through smoothly instead of jabbing. Ask a regular for
  a trick shot; most are happy to show off.
