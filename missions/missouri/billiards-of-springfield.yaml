short: Billiards of Springfield. Shoot pool on nine-foot tables at a classic hall; loser buys burgers.
description: >
  Grab a table at Springfield's longtime pool hall, with sixteen full-size
  nine-foot tables, and play a best-of-five. Loser buys the burgers, which
  locals swear are some of the best in town. If one of you is new to pool, the
  other has to teach a trick shot. Get a photo lining up the winning shot.
about: >
  Springfield calls itself the Birthplace of Route 66: on April 30, 1926,
  highway officials meeting at the Colonial Hotel downtown sent the telegram
  that proposed the number 66 for the new Chicago-to-Los Angeles road.

  Nine-foot tables are the size used in professional tournaments, bigger than
  most bar tables, so long shots are harder than you expect. Beginner tips:
  keep your bridge hand steady, look at the spot on the ball you want to hit,
  and follow through smoothly instead of jabbing. Ask a regular for a trick
  shot; most are happy to show off.
