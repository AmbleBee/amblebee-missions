short: KC Wheel at Pennway Point. Ride after dark as the Kansas City skyline lights up, then mini golf.
description: >
  Book an evening ride on the 150-foot KC Wheel and float up over the city in
  an enclosed, climate-controlled gondola, with Union Station, the Kauffman
  Center and the downtown towers lit up around you. Sit by the doors for the
  best skyline view, and get a photo of the two of you with the city behind
  you at the top. Then play a round at Pennway Putt, the mini golf course
  right under the wheel; loser buys dessert.
about: >
  The KC Wheel opened in December 2023 at Pennway Point and stands about 150
  feet tall, with 36 enclosed, heated and cooled gondolas, so it works in any
  season. From the top, look for Union Station, which opened in 1914, and the
  curved Kauffman Center for the Performing Arts. Pennway Putt below has 16
  holes, including ones themed for the Royals and the Chiefs.

  Tickets are sold online for set times, so book ahead. For a splurge, the
  VIP gondola has leather seats, mood lighting and a free drink. A clear
  night after rain gives the sharpest view.
