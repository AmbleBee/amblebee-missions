short: KC Wheel at Pennway Point. Ride after dark as the Kansas City skyline lights up, then mini golf.
description: >
  Book an evening ride on the 150-foot KC Wheel and float up over the city in
  your own warm, enclosed gondola, with Union Station, the Kauffman Center and
  the downtown towers lit up around you. Get a photo of the two of you with the
  skyline behind you at the top. Then play a round of mini golf next door;
  loser buys dessert. Tickets are for set times, so book ahead.
about: >
  The KC Wheel opened in 2022 at Pennway Point and stands about 150 feet
  tall, with enclosed, heated and cooled gondolas, so it works in any season.
  From the top, look for Union Station, which opened in 1914, and the curved
  Kauffman Center for the Performing Arts.

  Rides are for set times, so book ahead. A clear night after rain gives the
  sharpest view.
