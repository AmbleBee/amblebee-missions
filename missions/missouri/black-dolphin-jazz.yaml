short: Kansas City jazz night at the Black Dolphin. Dress up for live jazz, then one more set next door.
description: >
  Dress up a little and spend an evening at the Black Dolphin, a dark,
  vintage lounge with live jazz, then walk next door to its sister club, the
  Green Lady Lounge, for one more set. Put your phones away and really
  listen; each pick your favorite song of the night. The photo to get: the
  two of you in the lounge glow.
about: >
  Kansas City is one of jazz's hometowns. In the 1920s and 30s, under
  political boss Tom Pendergast, clubs around 18th and Vine and 12th Street
  stayed open all night, and musicians jammed until morning. Count Basie came
  up in Bennie Moten's band here, and Kansas City native Charlie Parker pushed
  the sound toward bebop.

  The American Jazz Museum at 18th and Vine tells the story. The Green Lady
  Lounge is known for live jazz nearly every night of the year. Both clubs are
  closed some nights, so check before you go.
