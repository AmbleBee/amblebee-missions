short: Kansas City jazz night at the Black Dolphin. Dress up for live jazz in a glowing vintage lounge.
description: >
  Dress up a little and spend an evening at the Black Dolphin, a dark,
  vintage lounge glowing red and purple, with live Kansas City jazz. Grab a
  table near the band, put your phones away and really listen; each pick
  your favorite song of the night. If its sister club next door, the Green
  Lady Lounge, is open, your cover usually gets you in there for one more
  set. The photo to get: the two of you in the lounge glow.
about: >
  Kansas City is one of jazz's hometowns. In the 1920s and 30s, under
  political boss Tom Pendergast, clubs around 18th and Vine and 12th Street
  stayed open all night, and musicians jammed until morning. Count Basie came
  up in Bennie Moten's band here, and Kansas City native Charlie Parker pushed
  the sound toward bebop.

  The American Jazz Museum at 18th and Vine tells the story. The Black
  Dolphin and the Green Lady Lounge next door share an owner and usually a
  single small cover, but they're 21 and up and closed some nights, so check
  before you go.
