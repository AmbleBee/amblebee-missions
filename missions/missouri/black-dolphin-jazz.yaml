description: >
  Dress up a little and spend an evening at the Black Dolphin, a dark,
  vintage lounge with live jazz, then walk next door to its sister club, the
  Green Lady Lounge, for one more set. Put your phones away and really
  listen; each pick your favorite song of the night. The photo to get: the
  two of you in the lounge glow.
about: >
  Kansas City is one of jazz's hometowns. In the 1930s, clubs around 18th
  and Vine stayed open all night, and Count Basie and Charlie Parker came up
  through this scene. The American Jazz Museum tells the story.

  The Green Lady Lounge is known for live jazz nearly every night of the
  year. Both clubs are closed some nights, so check before you go.
