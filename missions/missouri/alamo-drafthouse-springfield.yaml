about: >
  Alamo Drafthouse started in Austin, Texas, in 1997 and became famous for
  dinner served to your seat and its strict rule: no talking or texting
  during the movie, or you get one warning and then you're out.

  Special screenings, like quote-alongs and themed parties, are where the
  Alamo shines. You order by writing on a slip of paper so the servers don't
  interrupt the movie.
