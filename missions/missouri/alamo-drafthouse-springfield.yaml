description: >
  Skip a regular showing and pick one of the Alamo's special screenings: a
  classic you've never seen on the big screen, a sing-along or quote-along, or
  a themed movie party. Order dinner and a milkshake to your seat, follow the
  strict no-talking, no-phones rule, and debate the movie on the drive home.
  Get a photo with the poster before you go in.
about: >
  Alamo Drafthouse Springfield moved into the old Campbell 16 on South
  Avenue in 2017 and turned the 16-screen theater, first opened in 1996,
  into a dine-in cinema with food and drinks brought to your seat. The chain
  started in Austin, Texas, in 1997, and Sony Pictures bought it in 2024.

  Alamo is famous for its no-talking, no-texting rule. In 2011 it turned an
  angry voicemail from a moviegoer kicked out for texting into a “Don’t talk
  or text” ad that went viral. Since early 2026 you order through the Alamo
  app on a dimmed screen instead of the old paper cards, but talking and
  scrolling are still off-limits.

  The nights worth planning around are the special screenings: quote-alongs,
  sing-alongs and themed Movie Parties with props, plus the custom pre-show
  clips Alamo plays before the movie instead of ads.
