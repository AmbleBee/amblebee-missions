short: Spend a free day in Forest Park. Zoo, art museum, then the view from Art Hill.
description: >
  Forest Park is bigger than Central Park, and its big museums are free. Pick
  two: the Saint Louis Zoo, the Art Museum on top of Art Hill, the Science
  Center, or the History Museum. Then sit at the top of Art Hill and look down
  over the Grand Basin's fountains, and each say which stop was your favorite.
  In warm months, rent a paddleboat at the Boathouse. In winter, Art Hill is
  the city's sledding hill.
