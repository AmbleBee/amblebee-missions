short: Rent a canoe, kayak or raft near Steelville and float the Meramec. Picnic on a gravel bar.
description: >
  Pick an outfitter near Steelville, the "floating capital of Missouri," and
  rent a canoe, kayak or raft for a few hours on the Meramec. They shuttle you
  upstream and you drift back past bluffs and gravel bars. Stop on a gravel bar
  for lunch and a swim, and get a photo of the two of you in the boat. Wear
  water shoes, bring sunscreen and a dry bag, and pack out every can. Check
  river levels first; the outfitter will tell you if it's too high.
for_kids:
  short: River float! Find each thing.
  steps:
    - A tall rock bluff
    - A turtle or a fish
    - A gravel beach
    - A big splash
    - A selfie in the boat!
