short: Meramec River float near Steelville, MO. Canoe, kayak or raft, and picnic on a gravel bar.
description: >
  Rent a canoe, kayak or raft from an outfitter near Steelville. They shuttle
  you upstream and you drift back past bluffs and gravel bars. Stop on a
  gravel bar for lunch and a swim, and hold a skipping-stone contest. The
  photo to get: your crew in the boats with a tall bluff behind you.
about: >
  Steelville calls itself the "Floating Capital of Missouri," and the
  Meramec is one of the longest free-flowing rivers in the state, fed by
  cold springs. Meramec Caverns, a few miles away, claims Jesse James once
  hid out inside.

  Wear water shoes, bring sunscreen and a dry bag, and pack out every can.
  Check river levels first; the outfitter will tell you if it's too high.
