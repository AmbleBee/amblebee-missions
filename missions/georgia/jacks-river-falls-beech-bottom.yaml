short: Jacks River Falls in Georgia's Cohutta Wilderness. Hike in and lunch on the big rocks.
description: >
  Hike from the Beech Bottom trailhead into the Cohutta Wilderness, fording
  a few creeks on the way to the Jacks River. Follow it to Jacks River
  Falls, where the water pours over wide rock ledges into a deep green
  pool. Eat lunch on the dry rocks well back from the edge, and each give
  the falls a score out of ten. The photo to get: the crew with the falls
  behind you.
about: >
  The trailhead sits just over the line in Tennessee, and the falls are in
  Georgia, about nine gently rolling miles round trip. Beech Bottom was once
  a small mountain farming community. The flat clearing you pass through is
  where it stood.

  The Cohutta is one of the biggest wilderness areas in the eastern U.S.,
  with no roads or buildings inside. The rocks are slick and the current is
  strong, so stay off the falls and out of the water above them. Skip it
  after heavy rain, bring a paper map, and don't count on cell service. The
  last stretch to the trailhead is on gravel forest roads.
