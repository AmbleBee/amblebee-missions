name: Amble Georgia
region: Georgia
description: Real places all over Georgia, starting under the live oaks of Savannah.
icon: peach
# A longer description for this pack's own page on the website (not sent to the Hive).
about: >
  Looking for date ideas in Georgia? The state runs from Savannah's live-oak squares to waterfalls in the north
  Georgia mountains. Grab ice cream at Leopold's and stroll Forsyth Park in Savannah, or lace up for a
  backcountry trail to a river waterfall in the Cohutta Wilderness.
