short: Ferry to a wild island. Find the mansion ruins, the wild horses and an empty beach.
description: >
  Take the morning ferry from St. Marys to Cumberland Island, a national seashore with no
  stores, no cars for visitors and wild horses grazing under the live oaks. Walk the shaded
  path to the Dungeness mansion ruins, then cut across the dunes to miles of empty beach and
  walk the sand together. It adds up to several miles on foot, so pack a lunch, water, bug
  spray and sunscreen, since there's nowhere to buy anything once you're there. Get a photo of
  the two of you in front of the Dungeness ruins (with a horse in the frame if you're lucky),
  and keep well back from the horses. Book the ferry ahead and don't miss the last boat back.
