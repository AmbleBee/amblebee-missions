short: See Muddy Waters' cabin, then catch live blues in a juke joint. Dance at least one song.
description: >
  Spend the late afternoon at the Delta Blues Museum in Clarksdale, in an old
  railroad freight depot, where the remains of Muddy Waters' sharecropper cabin
  sit inside the gallery. When it closes, walk next door to Ground Zero Blues
  Club for dinner and live blues on the graffiti-covered stage, or wander
  downtown to whichever juke joint has a band that night. Get a photo of the two
  of you in front of the stage, then get up and dance to at least one song.
  Museum is daytime only and closed Sundays; music is mostly at night, so plan
  for a late start that runs into the evening.
