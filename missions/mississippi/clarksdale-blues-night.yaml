short: Clarksdale blues night. See Muddy Waters' cabin, then dance to live blues in a juke joint.
description: >
  Spend the late afternoon at the Delta Blues Museum, where the remains of
  Muddy Waters' sharecropper cabin sit inside the gallery. Then walk next door
  to Ground Zero Blues Club for dinner and live blues, or wander downtown to
  whichever juke joint has a band that night. Live music runs mostly late in
  the week, so check what's playing before you pick your night. The photo to
  get: the two of you in front of the stage. Then get up and dance to at least
  one song.
about: >
  Clarksdale is in the heart of the Mississippi Delta, where the blues was
  born. Legend says bluesman Robert Johnson sold his soul to the devil at
  the crossroads of Highways 61 and 49, right in town. Ground Zero was
  co-founded by actor Morgan Freeman in 2001.

  The Delta Blues Museum, founded in 1979, is Mississippi's oldest music
  museum, in a 1918 railroad depot. Muddy Waters lived in his cabin on Stovall
  Farm until folklorist Alan Lomax recorded him there in 1941. The museum is
  open during the day and closed some days, while the music is mostly at
  night, so plan for a late afternoon that runs into the evening.
