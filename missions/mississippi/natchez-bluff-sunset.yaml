description: >
  Natchez sits high on a bluff over the Mississippi River. Find a bench along the bluff at
  sunset and watch the river and the bridge to Louisiana go gold, then walk down Silver
  Street to Natchez Under-the-Hill, the old riverboat landing, for dinner by the water.
