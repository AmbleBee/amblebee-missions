short: Sit in the live audience of Oxford's Thursday radio show. Dinner on the Square after.
description: >
  Oxford's homegrown radio show tapes in front of a free live audience on
  Thursday evenings: an hour of Southern authors reading from new books, mixed with
  live bands and plenty of local banter. Show up a little early, grab a seat
  together, and watch how a radio broadcast comes together. Get a photo of the
  two of you with the stage behind you before the show starts. Afterward, walk
  over to the Square for dinner and a browse through the bookstores if
  they're still open. Shows run in spring and fall seasons, and the venue
  sometimes moves, so check the schedule first.
