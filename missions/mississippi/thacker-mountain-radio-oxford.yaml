short: Thacker Mountain Radio Hour in Oxford, MS. Join the live audience, then dinner on the Square.
description: >
  Sit in the free live audience of Oxford's homegrown radio show: Southern
  authors reading from new books, mixed with live bands and local banter.
  Show up a little early, grab seats together, and watch a broadcast come
  together. The photo to get: the two of you with the stage behind you
  before the show starts. Afterward, walk to the Square for dinner and each
  pick a book for the other at the bookstore.
about: >
  Thacker Mountain Radio has been taping in Oxford since the 1990s and airs
  on Mississippi Public Broadcasting. It's usually recorded on Thursday
  evenings during its spring and fall seasons.

  Oxford is a book town: William Faulkner lived here, and his home, Rowan
  Oak, is open to visit. Square Books on the town square is one of the most
  loved independent bookstores in the South. The show's venue sometimes
  moves, so check the schedule first.
