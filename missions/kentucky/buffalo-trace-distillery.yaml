short: Buffalo Trace Distillery in Frankfort. Take the free tour and tasting, then pick a bottle together.
description: >
  Take a free guided tour of one of the oldest distilleries in the country,
  with a tasting at the end for anyone 21 and up. Each of you picks a
  favorite pour, then buy one bottle together to open on a special day.
  The photo to get: the two of you among the barrels in the warehouse. Then
  walk the grounds along the Kentucky River.
about: >
  The distillery is named for an ancient buffalo path that crossed the
  Kentucky River here. It's a National Historic Landmark, and it was one of
  the few distilleries allowed to keep running during Prohibition, making
  whiskey "for medicinal purposes."

  Some of the most sought-after bourbons in the world are made here, so the
  gift shop's rare bottles go fast. Tours are free but book up, so reserve
  online ahead.
