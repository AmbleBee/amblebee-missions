short: Climb the cliffside trail to hidden Eagle Falls and look back at the big Cumberland Falls.
description: >
  Drive across the river bridge from the busy main overlook and start up the
  Eagle Falls Trail, which climbs the cliffs above the Cumberland River on stairs
  and rocky ledges. It's only about a mile and a half, but steep in spots, and it
  ends with a stair spur down to the base of Eagle Falls, a narrow ribbon dropping
  into a rocky pool with the much bigger Cumberland Falls roaring in the
  distance. Get a photo of yourself on the rocks at the base with both waterfalls
  in view. The steps get slick when wet and the small lot fills on summer
  weekends, so go early.
