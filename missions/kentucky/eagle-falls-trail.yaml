short: Eagle Falls Trail at Cumberland Falls, KY. Climb to hidden Eagle Falls and look back at the big one.
description: >
  Drive across the river bridge from the busy main overlook and climb the
  Eagle Falls Trail on stairs and rocky ledges above the Cumberland River.
  Take the stair spur down to the base of Eagle Falls, a narrow ribbon
  dropping into a rocky pool, with the much bigger Cumberland Falls roaring in
  the distance. The photo to get: you on the rocks at the base with both
  waterfalls in view.
about: >
  Cumberland Falls is called the "Niagara of the South," a wide curtain of
  water about 68 feet tall. On clear nights around the full moon, its mist
  makes a moonbow, a rainbow lit by moonlight, one of the only places in the
  Western Hemisphere where that happens regularly.

  The Eagle Falls Trail is about a mile and a half and steep in spots. The
  steps get slick when wet, and the small lot fills on summer weekends, so
  go early.
