short: Hike up to a giant sandstone arch, walk across the top, and ride the chairlift down.
description: >
  Start near Hemlock Lodge and climb the Original Trail through hemlocks and
  rock shelters to Natural Bridge, a huge sandstone arch you can walk right
  across. Squeeze through the narrow rock slot of Fat Man's Squeeze beside the
  arch, then follow the Laurel Ridge Trail out to Lover's Leap for the big view
  over the gorge. Come down the
  Balanced Rock Trail for a full loop, or hop on the Sky Lift chairlift for a
  lazy ride back to the bottom. Get a photo of the group standing on top of
  the arch. The trails are steep with lots of stairs; the lift only runs
  seasonally, roughly spring through fall.
steps:
  - Fat Man's Squeeze
  - The group on top of the arch
  - The view from Lover's Leap
