short: Natural Bridge State Park in Kentucky. Hike to a giant sandstone arch and ride the chairlift down.
description: >
  Park at the Sky Lift and walk the short path to the Original Trail behind
  Hemlock Lodge, then climb through hemlocks and rock shelters to Natural
  Bridge, a huge sandstone arch you can walk right across. Squeeze single file
  through the narrow rock slot of Fat Man's Squeeze beside the arch. Follow the
  Laurel Ridge Trail to Lover's Leap for the big view, then ride the Sky Lift
  back down to your car. Get there early, since the lot fills up. The photo to
  get: your group standing on top of the arch.
about: >
  Natural Bridge is about 78 feet long and 65 feet high, carved over
  millions of years as wind and water wore away softer rock beneath harder
  sandstone. The Red River Gorge around it has an estimated 150 natural
  arches, more than anywhere in the country except Arches National Park in
  Utah.

  The L&N Railroad once ran excursion trains to the arch, and gave the land
  to Kentucky for a state park in 1926. The Sky Lift chairlift opened in 1967
  and runs from April through October, with one-way tickets for hiking up and
  riding down. The trails are steep with lots of stairs.
