short: Natural Bridge State Park in Kentucky. Hike to a giant sandstone arch and ride the chairlift down.
description: >
  Climb the Original Trail through hemlocks and rock shelters to Natural
  Bridge, a huge sandstone arch you can walk right across. Squeeze through
  the narrow rock slot of Fat Man's Squeeze beside the arch, and see who gets
  through without turning sideways. Follow the Laurel Ridge Trail to Lover's
  Leap for the big view, then ride the Sky Lift back down. The photo to get:
  your group standing on top of the arch.
about: >
  Natural Bridge is about 78 feet long and 65 feet high, carved over
  millions of years as wind and water wore away softer rock beneath harder
  sandstone. The Red River Gorge nearby has more than a hundred natural
  arches.

  The Sky Lift chairlift has been carrying visitors since the 1960s and runs
  seasonally, roughly spring through fall. The trails are steep with lots of
  stairs.
