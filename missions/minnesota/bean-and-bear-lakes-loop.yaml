short: Bean and Bear Lakes loop near Silver Bay, MN. Hike the cliffs over twin lakes and Lake Superior.
description: >
  Follow the Superior Hiking Trail up into the hills to the cliffs above
  Bean and Bear Lakes, two narrow lakes tucked between rocky ridges, with
  glimpses of Lake Superior in the distance. Find a safe spot away from the
  cliff edges to enjoy a long lunch, and guess which lake is deeper. The
  trail climbs through forests and across rocky terrain, so bring sturdy
  shoes, plenty of water, and a trail map. The photo to get: you at an
  overlook with both lakes below.
about: >
  The Superior Hiking Trail runs more than 300 miles along the ridges above
  Lake Superior, from the Duluth area toward the Canadian border. Bean and
  Bear Lakes sit in rocky basins shaped by glaciers.

  The loop is approximately 6.5 to 7 miles, with steep climbs, rocky
  sections, roots, and occasional mud. Allow four to six hours, depending on
  your pace, and bring plenty of water.
steps:
