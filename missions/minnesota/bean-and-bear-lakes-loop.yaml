short: Hike the ridges above twin lakes on the North Shore. Lunch on the cliff, Lake Superior below.
description: >
  Start at the Penn Boulevard trailhead outside Silver Bay and follow the
  Superior Hiking Trail up into the hills to the cliffs above Bean and Bear
  Lakes, two narrow lakes tucked between rock walls, with Lake Superior and
  Tettegouche spread out behind you. The loop is about 7 miles with constant
  steep ups and downs, rocks, roots and mud, so plan four to five hours on the
  trail (more with a long lunch) and bring poles, lunch and plenty of water
  (there's nothing at the trailhead). Take your
  long lunch on the ledge where both lakes line up below you and get that photo.
  Fall color peaks here in late September and early October.
