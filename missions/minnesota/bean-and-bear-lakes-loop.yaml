short: Bean and Bear Lakes loop near Silver Bay, MN. Hike the cliffs over twin lakes and Lake Superior.
description: >
  Follow the Superior Hiking Trail up into the hills to the cliffs above
  Bean and Bear Lakes, two narrow lakes tucked between rock walls, with Lake
  Superior spread out behind you. Take your long lunch on the ledge where
  both lakes line up below you, and each guess which lake is deeper. The
  photo to get: you on the ledge with both lakes below.
about: >
  The Superior Hiking Trail runs more than 300 miles along the ridges above
  Lake Superior, from Duluth to the Canadian border. Bean and Bear Lakes sit
  in basins scraped out of the rock by glaciers.

  The loop is about 7 miles with constant steep ups and downs, rocks, roots
  and mud. Plan four to five hours, and bring poles and plenty of water;
  there's nothing at the trailhead. Fall color peaks in late September and
  early October.
