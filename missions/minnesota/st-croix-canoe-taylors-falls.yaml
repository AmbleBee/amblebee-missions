short: Paddle past cliffs and sandbars from Taylors Falls to Osceola. Picnic on an island beach.
description: >
  Start the morning poking around the glacial potholes in Interstate State
  Park, giant holes the old river drilled into the rock. Then rent a canoe
  and let the outfitter's shuttle bring you back later while you paddle about
  seven miles down the St. Croix to Osceola Landing, past tall cliffs, eagles
  and sandy islands made for a long lunch stop. The current is gentle, but
  it's still a few hours of paddling. Get a photo of the two of you in the
  canoe with the cliffs behind you. Finish with burgers at the old drive-in
  in Taylors Falls. You'll need a Minnesota state park vehicle permit, and
  the outfitter sat out the 2026 season, so confirm it's running before you go.
steps:
  - The deepest glacial pothole
  - The two of you in the canoe, cliffs behind
  - Your picnic beach
  - Burgers at the drive-in
