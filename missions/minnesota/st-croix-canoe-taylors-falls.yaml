short: Canoe the St. Croix from Taylors Falls, MN. Paddle past cliffs and picnic on an island beach.
description: >
  Start the morning poking around the glacial potholes in Interstate State
  Park, giant holes the old river drilled into the rock. Then rent a canoe
  and let the outfitter's shuttle bring you back later while you paddle about
  seven miles down the St. Croix to Osceola Landing, past tall cliffs, eagles
  and sandy islands made for a long lunch stop. The current is gentle, but
  it's still a few hours of paddling. Get a photo of you in the
  canoe with the cliffs behind you. Finish with burgers at the old drive-in
  in Taylors Falls. You'll need a Minnesota state park vehicle permit, and
  the outfitter sat out the 2026 season, so confirm it's running before you go.
about: >
  Interstate State Park, opened in 1895 by Minnesota and Wisconsin together,
  was the first state park shared by two states. Its glacial potholes were
  drilled into the rock by swirling meltwater and stones at the end of the
  Ice Age; the deepest is around 60 feet.

  The St. Croix was one of the first rivers protected as a National Wild and
  Scenic River, in 1968. You'll need a Minnesota state park vehicle permit.
  The outfitter sat out the 2026 season, so confirm it's running before you
  go.
