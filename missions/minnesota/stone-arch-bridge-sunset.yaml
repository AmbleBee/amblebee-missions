short: Stone Arch Bridge in Minneapolis. Walk over the Mississippi at sunset and watch the falls.
description: >
  Walk across the old Stone Arch Bridge at sunset, with St. Anthony Falls
  rushing below and the old flour mills along the river. Stop in the middle
  and each pick the spot on the skyline you'd most like to see from up close.
  The photo to get: the two of you on the bridge with the falls and the
  glowing city behind you. Then wander the Mill Ruins Park paths below.
about: >
  Railroad builder James J. Hill had the bridge built in 1883, and it's the
  only arched stone bridge across the Mississippi River. Trains used it for
  about a century; now it's for people on foot and bikes.

  St. Anthony Falls is the only major natural waterfall on the Mississippi,
  and its power made Minneapolis the flour-milling capital of the world.
  The Mill City Museum, built inside the ruins of a burned-out mill, tells
  the story. Look for the glowing Gold Medal Flour sign across the river.
