short: Grab the brass ring on Watch Hill's 1800s flying-horse carousel, then walk Napatree Point.
description: >
  The Flying Horse Carousel in Watch Hill has been spinning since the 1800s,
  and its hand-carved horses hang from chains, so they swing out and "fly" as
  it turns. It's for kids only (ages 2 to 12, under 100 lb), so grown-ups cheer from
  the rail while riders on the outside horses reach for the rings and try to
  catch the brass one for a free ride. Afterward, walk out onto Napatree Point,
  a sandy strip of beach and dunes with ocean on one side and a calm bay on
  the other; stay on the marked paths and off the roped-off nesting areas. Get
  a photo of your rider flying past on their horse. Summer parking in Watch
  Hill fills up early, so go in the morning.
about: >
  The Flying Horse Carousel dates to the late 1800s, and it's one of the
  oldest carousels of its kind in the country. Each horse was carved from a
  single block of wood, with real horsehair manes and agate eyes. It's a
  National Historic Landmark.

  Napatree Point was once lined with summer houses, until the 1938 hurricane
  swept nearly all of them away. Walk to the far end and you'll find the
  ruins of Fort Mansfield, an old army fort from around 1900.
