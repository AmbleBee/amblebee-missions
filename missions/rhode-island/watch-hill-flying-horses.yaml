short: Watch Hill in Westerly, RI. Ride the 1800s flying-horse carousel, then walk out Napatree Point.
description: >
  The Flying Horse Carousel in Watch Hill has been spinning since the 1800s,
  and its hand-carved horses hang from chains, so they swing out and "fly" as
  it turns. It's for kids only (ages 2 to 12, under 100 lb), so grown-ups cheer
  from the rail while riders on the outside horses reach for the rings and try
  to catch the brass one for a free ride. Afterward, walk out onto Napatree
  Point, a sandy strip of beach and dunes with ocean on one side and a calm bay
  on the other; stay on the marked paths and off the roped-off nesting areas.
  Get a photo of your rider flying past on their horse.
about: >
  The Flying Horse Carousel is the oldest operating carousel in the country
  whose horses hang from chains, and it's a National Historic Landmark. Each
  horse's body was carved from a single block of wood, and the horses still
  have their original agate eyes, with real horsehair manes and tails. It
  runs in summer only.

  Napatree Point once held 39 summer cottages, until the 1938 hurricane swept
  every one of them away and took 15 lives. Walk to the far end to find the
  concrete gun pits of Fort Mansfield, an army fort from 1901 that war games
  soon showed enemy ships could slip right past. The roped-off dunes protect
  nesting piping plovers, an endangered shorebird. Summer parking in Watch
  Hill fills up early, so go in the morning.
