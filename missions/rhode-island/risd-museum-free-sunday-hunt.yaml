short: RISD Museum in Providence. A family art hunt on a free Sunday; find the giant Buddha.
description: >
  Turn the RISD Museum into a scavenger hunt: track down the huge wooden
  Buddha in its own quiet room, something from ancient Egypt, and the
  strangest painting each of you can find. Let the kids lead and pick which
  gallery comes next. The photo to get: the family in front of the big
  Buddha (no flash).
about: >
  The RISD Museum belongs to the Rhode Island School of Design, founded in
  1877. The giant Buddha is a wooden Japanese sculpture from the 1100s, one of
  the largest of its kind outside Japan.

  Admission has been free for everyone on Sundays, and kids are free any
  day. Check the website for current free days, since they've changed over
  the years. It makes an easy rainy-day outing.
