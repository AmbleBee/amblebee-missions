short: Go on a Sunday art hunt at the RISD Museum. Find the giant Buddha!
description: >
  Spend a Sunday at the RISD Museum, Rhode Island School of Design's art museum,
  when admission is free for everyone (kids 18 and under are free any day). Turn
  it into a scavenger hunt: track down the huge wooden Buddha in its own quiet
  room, something from ancient Egypt, and the strangest painting each of you can
  find. Let the kids lead and pick which gallery comes next. Get a family photo in
  front of the big Buddha (no flash). It's an easy rainy-day outing, and Thursday
  evenings are free too.
