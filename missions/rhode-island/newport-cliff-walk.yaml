description: >
  The Cliff Walk runs along the rocky shore of Newport with the ocean on one side and huge
  Gilded Age mansions on the other. Start at the Forty Steps, walk south as far as you
  like, and sit on the stone steps down to the water to watch the waves. Some sections are
  rough and parts may be closed for repairs.
