short: Walk the cliffs between the ocean and the Gilded Age mansions. Sit on the Forty Steps.
description: >
  The Cliff Walk runs along the rocky shore of Newport with the ocean on one
  side and huge Gilded Age mansions on the other. Start at the Forty Steps,
  sit on the stone steps overlooking the water, and watch the waves. Then
  follow the Cliff Walk north for an easy coastal stroll. If you want to
  explore farther south toward the famous mansions, follow the posted
  detours around any closed sections. Some stretches are rough, so wear
  comfortable walking shoes. The photo to get: the two of you on the path
  with a mansion on one side and the ocean on the other.
about: >
  The Cliff Walk runs about 3.5 miles along Newport's shore and was named a
  National Recreation Trail in 1975. Its path follows old fishermen's rights
  of way, which is why it passes right through the mansions' back lawns.

  The biggest house you'll pass is The Breakers, finished in 1895 for
  Cornelius Vanderbilt II. The southern stretch gets rougher, with rocks to
  scramble over, so wear real shoes if you plan to go far.
