description: >
  Walk the Rehoboth boardwalk in the evening with a bucket of boardwalk fries
  and a bag of saltwater taffy. In summer, hit the old-school rides and
  arcades and try to win each other a prize, no matter how many tries it
  takes. End with your shoes off on the sand. The photo to get: the two of
  you under the boardwalk lights with your prize.
about: >
  Rehoboth Beach started in 1873 as a Methodist camp meeting by the sea.
  Today it's called "the Nation's Summer Capital" because so many people
  from Washington, D.C., vacation here.

  The boardwalk is about a mile long. Look for Dolle's, a saltwater taffy
  shop with a famous sign that's been on the boardwalk since the 1920s, and
  Funland, a small family amusement park that's been running since the
  1960s. Rides and many shops are seasonal, so summer evenings are best.
