short: Markell Trail in Wilmington. Walk the boardwalk over a tidal marsh and count the herons.
description: >
  Start at the environmental center on the Wilmington Riverfront and head
  south on the Markell Trail's long elevated boardwalk across the tidal
  marsh. Go slow and keep a count of herons, turtles and eagles; whoever spots
  the most picks lunch. Keep going on the paved trail as far as you like, then
  turn back. The photo to get: looking down the boardwalk with the marsh
  grass on both sides and the city skyline behind.
about: >
  The boardwalk crosses the Russell W. Peterson Urban Wildlife Refuge, a
  freshwater tidal marsh right next to downtown that rises and falls with the
  tides. The trail is named for former Delaware governor Jack Markell and
  connects Wilmington to historic New Castle, several miles south.

  The surface is easy, but out-and-back distances add up fast. Bring water,
  since the only restrooms are back at the center.
