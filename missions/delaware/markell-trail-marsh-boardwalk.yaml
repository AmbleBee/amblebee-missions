short: Walk the boardwalk over a tidal marsh in the middle of the city. Count the herons.
description: >
  Start at the environmental center on the Wilmington Riverfront and head south
  on the Jack A. Markell Trail, which begins with a long elevated boardwalk
  across the freshwater tidal marsh of the Peterson Wildlife Refuge. Go slow
  on the boardwalk and look for herons, turtles and maybe an eagle, then keep
  going on the paved trail toward New Castle until you've done about two and
  a half miles, and turn back. Get a photo looking down the boardwalk with the
  marsh grass on both sides and the city skyline behind. It's an easy surface
  but a good five miles round trip; bring water since the only restrooms are back
  at the center.
