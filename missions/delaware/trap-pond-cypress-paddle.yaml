short: Rent kayaks and weave through the northernmost wild bald cypress swamp in the country.
description: >
  Trap Pond protects the northernmost natural stand of bald cypress trees in the US, and the
  best way to see it is from the water. Rent kayaks or canoes at the park (or bring your own),
  then follow the marked water trails out of the open pond and into the narrow, tea-colored
  channels where the cypress knees poke up around you. Race to the far end of the pond,
  then drift back slowly and look for turtles, herons and the occasional bald eagle. Get a
  group photo of your boats lined up among the cypress trunks. Finish with a picnic on shore.
