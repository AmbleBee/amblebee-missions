short: Trap Pond State Park near Laurel, DE. Kayak through the northernmost wild bald cypress swamp.
description: >
  Rent kayaks or canoes and follow the marked water trails out of the open
  pond and into the narrow, tea-colored channels where cypress knees poke up
  around you. Race to the far end of the pond, then drift back slowly looking
  for turtles, herons and the occasional bald eagle. The photo to get: your
  boats lined up among the cypress trunks. Finish with a picnic on shore.
about: >
  Trap Pond protects the northernmost natural stand of bald cypress trees in
  the country, a little piece of the Deep South in Delaware. The pond itself
  was made in the 1700s to power a sawmill that cut the swamp's timber.

  Nearby Trussum Pond is home to some of the oldest cypress trees in the
  area, centuries old. The water is tea-colored from tannins in the leaves,
  not dirt. Rentals are seasonal, so check before you go.
