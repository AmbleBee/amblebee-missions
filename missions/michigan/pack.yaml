name: Amble Michigan
region: Michigan
description: Real places all over Michigan, starting on car-free Mackinac Island.
icon: mitten
# A longer description for this pack's own page on the website (not sent to the Hive).
about: >
  Looking for things to do in Michigan? It's two peninsulas wrapped in the Great Lakes, with dunes, lighthouses
  and freshwater beaches, plus Detroit and Ann Arbor. On Mackinac Island cars aren't allowed, so the best way
  around is by bike.
