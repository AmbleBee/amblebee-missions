short: Ferry to car-free Mackinac Island, bike the 8-mile shore loop and share some fudge.
description: >
  Cars aren't allowed on Mackinac Island, so you'll hear horses and bike bells instead of
  traffic. Rent bikes (or a tandem) by the ferry dock and ride the flat 8-mile road around
  the island's shore, then grab a slab of fudge on Main Street for the boat back.
