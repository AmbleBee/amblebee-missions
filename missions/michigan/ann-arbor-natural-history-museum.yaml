short: U-M Museum of Natural History in Ann Arbor. Meet the dueling mastodons, then the planetarium.
description: >
  Walk into the bright atrium, where a pair of full-size mastodon skeletons
  face off under two hanging prehistoric whales. Explore the fossil galleries
  and Michigan nature exhibits, and each find the strangest creature in the
  building. Then catch a show in the planetarium dome. The photo to get: you
  looking straight up at the mastodons from under their tusks.
about: >
  The museum moved into the Biological Sciences Building in 2019. Its
  mastodons are a male and female shown in a fight, and the mastodon is
  Michigan's state fossil. The hanging skeletons are early whales that still
  had small legs, found by a U-M scientist who studied how whales came from
  land animals.

  The museum is free; planetarium shows need a ticket and run on certain
  days, so check the schedule. Campus parking is tight, so walk or bus in.
