short: Meet the dueling mastodons in Ann Arbor, then catch a planetarium show. Shoot up at the tusks.
description: >
  Wander the free natural history museum inside U-M's bright Biological
  Sciences Building, where a pair of full-size mastodon skeletons stands in
  the atrium under two hanging prehistoric whales. Take your time in the
  fossil galleries and the Michigan natural history exhibits, then grab a
  ticket at the museum store for a show in the planetarium dome (shows run
  Friday through Sunday). Get a photo looking straight up at the
  mastodons from underneath their tusks. Campus parking is tight right now, so
  plan to walk or bus in.
