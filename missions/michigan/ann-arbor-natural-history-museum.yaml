short: U-M Museum of Natural History in Ann Arbor. Meet the mastodon couple, then the planetarium.
description: >
  Walk into the bright atrium, where a pair of full-size mastodon skeletons
  stand side by side under hanging prehistoric whales. Step into a real
  mastodon footprint, explore the dinosaur and fossil galleries and the
  Michigan nature exhibits, and find the strangest creature in the building.
  Then catch a show in the planetarium dome. The photo to get: you looking
  straight up at the mastodons from under their tusks.
about: >
  The museum moved into the Biological Sciences Building in 2019, and it's the
  only place in the world where you can see a male and female mastodon
  together. The female is real bone, found in Owosso, Michigan, and the male
  stands over casts of the only mastodon trackway ever found, from nearby
  Saline. The mastodon is Michigan's state fossil. The whales hanging
  overhead are early species that still had small legs, and the museum has
  the biggest dinosaur display in Michigan.

  The museum is free; planetarium shows need a ticket and run on certain
  days, so check the schedule. Campus parking is tight, so walk or bus in.
