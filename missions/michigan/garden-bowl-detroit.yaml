short: Garden Bowl in Detroit. Bowl at an alley rolling since 1913, and the loser buys the snacks.
description: >
  The Garden Bowl has been knocking down pins on Woodward since 1913, and it
  still has the feel of well-worn neighborhood lanes, with low lights and
  the Majestic's bar and pizza right next door. Grab a lane, play a couple of
  games with silly side bets (granny-style frame, wrong-hand frame), and the
  lowest score buys the snacks. Get a photo of everyone lined up at the ball
  return with your best strike pose. Book a lane online for weekend nights, and
  check the age rules if anyone in your group is under 21 late at night.
about: >
  The Garden Bowl opened in 1913 and is often called the oldest active
  bowling alley in the country. It's part of the Majestic complex on
  Woodward, along with the Majestic Theatre next door, a music venue that
  opened as a movie house in 1915.

  On some nights the lanes switch to glow-in-the-dark "cosmic" bowling. Book
  a lane online for weekend nights, and check the age rules if anyone is
  under 21 late at night.
