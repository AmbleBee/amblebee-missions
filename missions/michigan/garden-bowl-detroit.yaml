short: Bowl a few frames at a Detroit alley that's been rolling since 1913. Loser buys the snacks.
description: >
  The Garden Bowl has been knocking down pins on Woodward since 1913, and it
  still has the feel of well-worn neighborhood lanes, with low lights and
  the Majestic's bar and pizza right next door. Grab a lane, play a couple of
  games with silly side bets (granny-style frame, wrong-hand frame), and the
  lowest score buys the snacks. Get a photo of everyone lined up at the ball
  return with your best strike pose. Book a lane online for weekend nights, and
  check the age rules if anyone in your group is under 21 late at night.
