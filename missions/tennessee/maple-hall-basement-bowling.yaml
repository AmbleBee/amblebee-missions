short: Bowl a few frames in a cozy basement alley under Gay Street. Loser picks the next drinks.
description: >
  Head downstairs below Gay Street to Maple Hall, an 11-lane boutique bowling
  alley with leather couches at every lane, craft cocktails and a made-from-scratch
  menu. You pay by the lane and the hour, so it's just the two of you on your own
  lane: play a game, and the loser picks the next round. Afterward, go upstairs to
  the cocktail lounge for life-sized board games and the patio. Get a photo of the
  two of you mid-throw with the lanes glowing behind you. They don't take lane
  reservations, and it turns 21+ at 9 PM on Friday and Saturday nights.
about: >
  Maple Hall opened in 2016 in a basement under Gay Street, the heart of
  downtown Knoxville. Its lanes are built with leather couches and dim
  lighting, more lounge than bowling alley.

  Gay Street is lined with restored theaters, including the Tennessee and
  the Bijou, so it's easy to pair bowling with a show. Market Square, a
  block over, has more restaurants and bars.
