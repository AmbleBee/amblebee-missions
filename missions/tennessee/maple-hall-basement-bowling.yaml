short: Maple Hall in Knoxville. Bowl in a cozy basement alley under Gay Street; loser picks the drinks.
description: >
  Head downstairs below Gay Street to Maple Hall, an 11-lane boutique bowling
  alley with leather couches at every lane, craft cocktails and a made-from-scratch
  menu. You pay by the lane and the hour, so it's just the two of you on your own
  lane: play a game, and the loser picks the next round. Afterward, head upstairs
  to the Parlor, the 21+ lounge with board games and a patio. Get a photo of the
  two of you mid-throw with the lanes glowing behind you. They don't take lane
  reservations, so expect a wait on weekend nights, and check the age policy
  before you go.
about: >
  Maple Hall opened in 2016 in the basement of the old J.C. Penney building on
  Gay Street, the heart of downtown Knoxville. The building dates to the 1890s,
  and the spot is said to be the site of East Tennessee's first baseball field.
  Its lanes are built with leather couches and dim lighting, more lounge than
  bowling alley.

  Gay Street is lined with restored theaters, including the Tennessee and
  the Bijou, so it's easy to pair bowling with a show. Market Square, a
  block over, has more restaurants and bars.
