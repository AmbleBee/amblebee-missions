short: Helmet up and crawl through a wild cave together. Get muddy, then get a mud-streaked selfie.
description: >
  Skip the walking tour and book a guided Wild Cave Expedition under Raccoon
  Mountain, just outside Chattanooga. The Canyon Crawl is the entry-level
  one: with helmets, pads, gloves and lights provided, you crawl, climb, slide
  and squeeze through undeveloped passages with a small group and a guide. Expect mud and some
  tight spots, so it's not for anyone claustrophobic, and wear clothes you
  don't mind ruining. Get a photo of the two of you, lamps on and covered in
  cave mud, when you crawl back out into daylight. Book ahead online (wild cave
  tickets are non-refundable) and check the age, height and weight rules when
  you do; there are no bathrooms in the cave.
