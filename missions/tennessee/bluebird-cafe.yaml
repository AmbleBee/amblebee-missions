short: The Bluebird Cafe in Nashville. Hear songwriters play the hits they wrote, up close.
description: >
  Squeeze into the tiny Bluebird, where songwriters sit in a circle and
  trade songs, often ones that became big country hits. Before the show,
  each guess which famous song will come up, and see if either of you is
  right. Listen quietly; that's the rule here. The photo to get: the two of
  you outside under the Bluebird sign.
about: >
  The Bluebird opened in 1982 in a strip mall and became the most famous
  listening room in Nashville. Garth Brooks was discovered here, and so was
  a teenage Taylor Swift. The "in the round" shows, with writers taking turns
  around a circle, made it famous.

  It holds only about 90 people, and talking during songs is famously
  frowned on. Reservations go fast online, so book as soon as shows are
  released.
