short: The Elevated Acre in the Financial District. Ride the escalators to a hidden lawn over the river.
description: >
  Find the escalators tucked between the towers at 55 Water Street and ride up
  to a secret one-acre park three stories above the street. Walk up the
  sloping path through the dune grasses and watch the view open up, until the
  East River and the Brooklyn Bridge appear in front of you. Bring a snack,
  grab a spot on the amphitheater steps, and watch the helicopters and
  ferries go by. Get a photo of you on the boardwalk with the river behind
  you.
about: >
  The Elevated Acre is a "privately owned public space," a park a building's
  owners built and keep open to everyone in exchange for being allowed to
  build bigger. Today's design, by Ken Smith and Rogers Marvel Architects, won
  a design competition and opened in 2005. The slope is designed to hide the
  river until you reach the top.

  It has a lawn ringed by amphitheater steps, a hardwood boardwalk about 30
  feet above the street with views to Governors Island and Brooklyn Heights,
  and a light tower you can spot from the FDR Drive. It's free, but it
  sometimes closes for private events, so check before you go.
