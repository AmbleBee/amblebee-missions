short: Royal Palms Shuffleboard Club in Brooklyn. Play a best of three, and the loser buys the round.
description: >
  Rent a court at a huge, Florida-themed shuffleboard club in an old Gowanus
  warehouse, with tiki drinks and a food truck parked inside. Learn the rules
  from the staff, play a best-of-three, and loser buys the next round. Get a
  photo of you with your cues on the court. Weekend nights get
  packed, so reserve a court or go early. Evenings are 21 and up; check the
  age rules if you're bringing anyone younger.
about: >
  Royal Palms opened in 2014 in an old Gowanus warehouse and gave
  shuffleboard a comeback. The Florida theme is a nod to the game's history:
  shuffleboard took off in Florida's retirement communities in the early
  1900s.

  Tips: slide the disc smoothly instead of shoving it, and use your disc to
  knock the other team's off the scoring triangle. Weekend nights get
  packed, so reserve a court or go early.
