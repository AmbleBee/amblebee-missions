description: >
  Rent a court at a huge, Florida-themed shuffleboard club in an old Gowanus
  warehouse, with tiki drinks and a food truck parked inside. Learn the rules
  from the staff, play a best-of-three, and loser buys the next round. Get a
  photo of you with your cues on the court. Weekend nights get
  packed, so reserve a court or go early. Evenings are 21 and up; check the
  age rules if you're bringing anyone younger.
