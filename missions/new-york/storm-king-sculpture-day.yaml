short: Spend the day wandering giant sculptures in the Hudson Valley hills. Find your favorite.
description: >
  Drive up to Storm King, a 500-acre outdoor museum where huge sculptures sit in
  open meadows, on hilltops and along tree lines with mountains behind them. Walk
  or rent bikes on-site and cover as much as you can, from Andy Goldsworthy's stone
  wall snaking through the trees to the giant steel pieces on the hills. Pack a
  picnic or grab lunch at the outdoor cafe, then each pick a favorite piece and
  make the case for it. Get a photo of the two of you dwarfed by the biggest
  sculpture you can find. Buy tickets ahead, since pre-purchased tickets are the
  only way to guarantee entry and parking, especially on fall weekends.
steps:
  - Your first sculpture of the day
  - The two of you next to something enormous
  - The stone wall disappearing into the trees
  - Each of your favorite pieces
  - The view from the top of the hill
