short: Storm King in the Hudson Valley. Wander giant sculptures across the hills and find your favorite.
description: >
  Drive up to Storm King, a 500-acre outdoor museum where huge sculptures sit in
  open meadows, on hilltops and along tree lines with mountains behind them. Walk
  or rent bikes on-site and cover as much as you can, from Andy Goldsworthy's stone
  wall snaking through the trees to the giant steel pieces on the hills. Pack a
  picnic or grab lunch at the outdoor cafe, then each pick a favorite piece and
  make the case for it. Get a photo of the two of you dwarfed by the biggest
  sculpture you can find.
about: >
  Storm King opened in 1960, first meant as a museum for Hudson River School
  paintings, before its founders started placing big sculptures out on the
  land. Today it's one of the largest outdoor sculpture parks in the country,
  with more than 100 works across 500 acres of meadows, woods and hills.

  Andy Goldsworthy's Storm King Wall runs 2,278 feet through the trees and
  into a pond, built by hand from fieldstone with no mortar. Maya Lin's
  Wavefield turns 11 acres into rolling grass waves up to 15 feet high. A tram
  loops the grounds for anyone who'd rather not walk it all. It's open spring
  through fall and closed Tuesdays, and fall weekends sell out, so buy tickets
  ahead to guarantee entry and parking.
steps:
  - Your first sculpture of the day
  - The two of you next to something enormous
  - The stone wall disappearing into the trees
  - Each of your favorite pieces
  - The view from the top of the hill
