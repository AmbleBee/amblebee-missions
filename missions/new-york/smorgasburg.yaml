short: Graze Smorgasburg's food stalls on the Brooklyn waterfront. Each pick one dish to share.
description: >
  Wander dozens of food stalls on the Williamsburg waterfront, with the
  Manhattan skyline right across the river. Each pick one dish to split, then a third you choose together, and crown a winner. Find a
  spot on the grass to eat, and get a photo of you with your food
  and the skyline. It runs Saturdays in Williamsburg, Sundays in Prospect
  Park and Fridays at the World Trade Center, from April through late
  October. Go hungry and early; it's mostly cashless.
about: >
  Smorgasburg started in 2011 as a food-only spinoff of the Brooklyn Flea,
  and it now draws tens of thousands of people on a busy weekend. Many of
  its vendors started here before opening their own restaurants.

  The Williamsburg market sits in Marsha P. Johnson State Park, a waterfront
  park on the site of an old rail freight terminal, renamed in 2020 for the
  gay rights activist. There's little shade, so bring a hat on hot days.
