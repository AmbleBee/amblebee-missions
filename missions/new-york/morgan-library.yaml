short: Explore J.P. Morgan's private library, three floors of books under a painted ceiling.
description: >
  Step into J.P. Morgan's private library, three stories of rare books behind
  carved walnut, with hidden staircases and a painted ceiling overhead. Look
  for a Gutenberg Bible and original handwritten manuscripts, then see what's
  in the special exhibitions. Each pick the book you'd steal if you could, and
  get a photo of you in the East Room. It's closed Mondays. Free on
  Friday evenings from 5 to 8, but reserve those tickets a week ahead.
