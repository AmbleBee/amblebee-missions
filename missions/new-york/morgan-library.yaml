short: The Morgan Library in NYC. Explore J.P. Morgan's three floors of books under a painted ceiling.
description: >
  Step into J.P. Morgan's private library, three stories of rare books behind
  carved walnut, with hidden staircases and a painted ceiling overhead. Look
  for a Gutenberg Bible and original handwritten manuscripts, and each pick
  the book you'd steal if you could. The photo to get: you in the East Room
  with the shelves rising behind you.
about: >
  Banker J.P. Morgan built the library in the early 1900s to hold his
  collection, and his son opened it to the public in 1924. It has more
  Gutenberg Bibles than anywhere else in the world. Morgan's librarian,
  Belle da Costa Greene, became one of the most respected experts on rare
  books of her time.

  The museum is closed some days and has had free evenings that need tickets
  reserved ahead, so check the website.
