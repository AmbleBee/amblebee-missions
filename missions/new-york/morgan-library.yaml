short: The Morgan Library in NYC. Explore J.P. Morgan's three floors of books under a painted ceiling.
description: >
  Step into J.P. Morgan's private library, three stories of rare books behind
  carved walnut, with secret staircases hidden behind the shelves and a
  painted ceiling overhead. Look for a Gutenberg Bible and original
  handwritten manuscripts, find your zodiac sign on the East Room ceiling,
  and pick the book you'd steal if you could. The photo to get: you in the
  East Room with the shelves rising behind you.
about: >
  Banker J.P. Morgan built the library in 1906 to hold his collection, and
  his son opened it to the public in 1924. It's the only museum in the world
  with three Gutenberg Bibles, and around the holidays it often displays
  Charles Dickens' own manuscript of A Christmas Carol. Morgan's librarian,
  Belle da Costa Greene, became one of the most respected experts on rare
  books of her time.

  The museum is closed Mondays. It's free on Friday evenings with a
  reservation, and the historic library rooms are free on Tuesday and Sunday
  afternoons with no reservation needed, so check the website.
