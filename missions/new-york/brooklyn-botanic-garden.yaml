short: Brooklyn Botanic Garden. Wander the Japanese pond garden, the roses and the greenhouses.
description: >
  Spend a slow afternoon wandering the gardens: the Japanese Hill-and-Pond
  Garden with its red torii gate and koi, the Cranford Rose Garden, and the
  Steinhardt Conservatory's greenhouses full of desert and tropical plants.
  Find your favorite spot, and if you're not alone, take each other to yours.
  Kids under 12 get in free. The photo to get: you by the red gate with the
  pond behind.
about: >
  The garden was founded in 1910, laid out by the Olmsted Brothers, and opened
  in 1911. Its Japanese Hill-and-Pond Garden, designed by Takeo Shiota and
  opened in 1915, was the first Japanese garden built in an American public
  botanic garden, and its pond sits in a kettle pond left by a glacier in the
  last Ice Age.

  In spring, the cherry trees bloom along the Cherry Esplanade, the garden's
  busiest and prettiest time. Winter weekdays are pay what you wish, and the
  garden is closed some days, so check the hours before you go.
