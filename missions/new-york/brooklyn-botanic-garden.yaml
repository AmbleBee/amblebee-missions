short: Brooklyn Botanic Garden. Wander the Japanese pond garden, the roses and the greenhouses.
description: >
  Spend a slow afternoon wandering the gardens: the Japanese Hill-and-Pond
  Garden with its red torii gate and koi, the rose garden, and greenhouses
  full of desert and tropical plants. Each pick your favorite spot and take
  the other there. The photo to get: you by the red gate with the pond
  behind.
about: >
  The garden opened in 1910. Its Japanese Hill-and-Pond Garden was built in
  the 1910s and is one of the oldest Japanese gardens in an American public
  garden. In spring, the cherry trees bloom along the Cherry Esplanade, the
  garden's busiest and prettiest time.

  The garden has had pay-what-you-wish days in winter and is closed some
  days, so check the hours before you go.
for_kids:
