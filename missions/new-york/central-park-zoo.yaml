short: Central Park Zoo. Visit the snow leopards, penguins and sea lions, and catch a feeding.
description: >
  Walk through a small zoo tucked right into Central Park: sea lions in the
  center pool, penguins and puffins in the polar building, snow leopards, red
  pandas and a steamy rainforest. Check the day's schedule for a sea lion
  feeding and get there early for a spot at the rail. Each pick your favorite
  animal and get a photo with it. On your way out, wait for the Delacorte
  Clock to play on the hour.
about: >
  Animals have lived in this corner of Central Park since the 1860s, when it
  started as a small menagerie of donated animals. The zoo you see today was
  rebuilt in the 1980s, and it starred in the animated movie Madagascar.

  The Delacorte Clock, near the entrance, has bronze animals that dance
  around it and play music on a regular schedule through the day. Check the
  zoo's daily schedule for sea lion feedings.
