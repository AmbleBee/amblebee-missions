short: Visit the snow leopards, penguins and sea lions at the Central Park Zoo. Catch a sea lion feeding.
description: >
  Walk through a small zoo tucked right into Central Park: sea lions in the
  center pool, penguins and puffins in the polar building, snow leopards, red
  pandas and a steamy rainforest. Check the day's schedule for a sea lion
  feeding and get there early for a spot at the rail. Each pick your favorite
  animal and get a photo with it. On your way out, wait for the Delacorte
  Clock to play on the hour.
