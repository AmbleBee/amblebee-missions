  coords: [40.69960, -73.99030]  # APPROX: set at the Brooklyn-side pedestrian entrance before publishing
short: Walk the Brooklyn Bridge from DUMBO into Manhattan, skyline ahead the whole way.
description: >
  Start on the Brooklyn side so the Manhattan skyline is ahead of you the
  whole walk. Stop under the stone towers, look back for the Statue of
  Liberty off to the south, and each count the bridges you can see. The photo
  to get: you under a stone tower with the cables fanning out above. Stay out
  of the bike lane.
about: >
  The Brooklyn Bridge opened in 1883, the first steel-wire suspension bridge
  in the world. When its engineer, Washington Roebling, got too sick to
  visit the site, his wife Emily Warren Roebling carried his instructions
  and oversaw much of the building. She was the first person to cross it.

  In 1884, P.T. Barnum marched 21 elephants across to prove the bridge was
  safe. It's about a mile across; go at sunrise or early morning before the
  crowds, and grab a bagel in DUMBO before you start.
for_kids:
  short: Bridge walk! Find each thing.
  steps:
    - A stone tower
    - A boat on the river
    - The Statue of Liberty
    - A tall skyscraper
    - A selfie on the bridge!
