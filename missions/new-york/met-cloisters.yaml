short: Step into medieval Europe at the Met Cloisters. Find the unicorn tapestries.
description: >
  Ride up to the top of Manhattan to a museum built from pieces of real
  medieval monasteries, set high above the Hudson. Walk the cloister gardens,
  find the famous Unicorn Tapestries, and each pick the strangest creature you
  can spot in the art. Get a photo of the two of you in one of the arched
  walkways. Pair it with the Fort Tryon Park mission next door. New York State
  residents can pay what they wish; check the hours before you go.
