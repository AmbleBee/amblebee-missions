short: The Met Cloisters in northern Manhattan. Step into medieval Europe and find the unicorn.
description: >
  Ride up to the top of Manhattan to a museum built from pieces of real
  medieval monasteries, high above the Hudson. Walk the cloister gardens,
  find the famous Unicorn Tapestries, and each pick the strangest creature
  you can spot in the art, then show each other. The photo to get: you in
  one of the arched stone walkways with the garden behind you.
about: >
  The Cloisters opened in 1938, paid for by John D. Rockefeller Jr. Its
  courtyards and chapels were built around real stones from monasteries and
  churches in France and Spain. Rockefeller even bought the cliffs across
  the Hudson so the view would stay wild.

  The Unicorn Tapestries were woven around 1500, and the gardens grow plants
  that people in the Middle Ages used for food, medicine and magic. New York
  State residents can pay what they wish. It's in Fort Tryon Park, so pair it
  with [[fort-tryon-park]] for a whole afternoon.
