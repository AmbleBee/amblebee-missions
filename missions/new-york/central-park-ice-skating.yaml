short: Wollman Rink in Central Park. Skate with the skyline over the trees and link arms for a lap.
description: >
  Lace up at Wollman Rink in the south end of Central Park, with the hotels of
  Central Park South lit up over the trees. Link arms for at least one full
  lap, no matter who wobbles, and get a photo of you on the ice with
  the skyline behind you. Go on a weeknight or early on a weekday for a less
  crowded rink. Skating runs in the cold months, roughly late fall through
  winter; check this season's dates and book a time slot ahead.
about: >
  Wollman Rink opened in 1950 at the south end of Central Park. It has turned
  up in a long list of movies, including Love Story, Home Alone 2, Serendipity
  and Stepmom, and the hotels rising over the trees along Central Park South
  make the view pure New York.

  Skating runs in the cold months, roughly late fall through winter. Go on a
  weeknight or early on a weekday for a less crowded rink, and book a time
  slot ahead.
