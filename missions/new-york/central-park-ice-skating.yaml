short: Skate at Wollman Rink with the skyline over the trees. Hold hands for one full lap.
description: >
  Lace up at Wollman Rink in the south end of Central Park, with the hotels of
  Central Park South lit up over the trees. Hold hands for at least one full
  lap, no matter who wobbles, and get a photo of the two of you on the ice with
  the skyline behind you. Go on a weeknight or early on a weekday for a less
  crowded rink. Skating runs in the cold months, roughly late fall through
  winter; check this season's dates and book a time slot ahead.
