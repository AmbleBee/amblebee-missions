short: Race rubber ducks with the water pumps at Fly Creek Cider Mill, then taste the fresh cider.
description: >
  Visit a cider mill from 1856 in the hills of upstate New York, where the
  original water-powered press still squeezes fresh cider in the fall. Pick
  your rubber ducks and race them down the water channels by pumping as fast
  as you can, and best of three wins. Then explore the mill and its history,
  taste the cider and treats at the marketplace, and visit the farm's ducks and
  geese. Get a photo of the two of you with your winning duck. The mill opens
  for the season around Mother's Day and closes just before Christmas. Pair
  it with a visit to Cooperstown.
for_kids:
  short: Duck race! Do each thing.
  steps:
    - Pick your rubber duck
    - Pump the water fast
    - Win a race
    - Find a real duck or goose
    - A selfie with your duck!
