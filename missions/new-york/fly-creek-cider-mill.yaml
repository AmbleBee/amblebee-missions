short: Fly Creek Cider Mill near Cooperstown. Race rubber ducks with water pumps, then taste fresh cider.
description: >
  Visit a cider mill from 1856 in the hills of upstate New York, where the
  original water-powered press still squeezes fresh cider in the fall. Pick
  your rubber ducks and race them down the water channels by pumping as fast
  as you can, and best of three wins. Then explore the mill and its history,
  taste the cider and treats at the marketplace, and visit the farm's ducks and
  geese. Get a photo of you with your winning duck. The mill opens
  for the season around Mother's Day and closes just before Christmas. Pair
  it with a visit to Cooperstown.
about: >
  The mill was built in 1856, and its water-powered press still squeezes
  fresh cider in the fall. It's one of the few water-powered cider mills
  still working in the country.

  The mill opens for the season around Mother's Day and closes just before
  Christmas. Cooperstown, a few minutes away, is home to the National
  Baseball Hall of Fame, opened in 1939.
