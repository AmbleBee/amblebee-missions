short: Fly Creek Cider Mill near Cooperstown. Race rubber ducks with water pumps, then taste fresh cider.
description: >
  Visit a cider mill from 1856 in the hills of upstate New York. Pick your
  rubber ducks and race them down the water channels by pumping as fast as you
  can: best of three wins. Then explore the mill, taste the cider, fudge and
  cheddar at the marketplace, and visit the ducks and geese on the millpond.
  Get a photo of you with your winning duck, and pair it with a visit to
  Cooperstown.
about: >
  Hosea Williams built the mill on the banks of Fly Creek in 1856. In the fall
  you can watch cider being made on its 1889 water-powered press: water from
  the creek spins a restored 1872 turbine, which drives belts and shafts that
  squeeze the apples with 50 tons of pressure. It nearly closed for good in
  2021, and it's since been voted one of the best cideries in the country by
  USA Today readers.

  The mill opens for the season around Mother's Day and closes just before
  Christmas. Cooperstown, a few minutes away, is home to the National
  Baseball Hall of Fame, opened in 1939.
