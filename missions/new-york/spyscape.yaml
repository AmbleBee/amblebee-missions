short: SPYSCAPE in Midtown NYC. Beat the laser maze, then compare your secret spy profiles.
description: >
  Go undercover at a spy museum that tests you as you go: crack codes, spot
  liars, and wriggle through a laser maze without tripping a beam. At the end
  each of you gets a spy profile that says which role you're best at, so
  compare them and argue over who'd make the better agent. Get a photo of
  you in the laser room. The museum takes about 90 minutes, or about two hours
  with the SPYGAMES add-on. It's for ages 8 and up; buy timed tickets ahead.
about: >
  SPYSCAPE opened in Midtown in 2018. Its challenges and spy profiles were
  designed with a former head of training at British intelligence and
  industrial psychologists. The galleries hold real spy history too: one of
  only about 100 working Enigma machines left from World War II, and a model of
  the "bombe" Alan Turing designed to crack its code.

  The profile you get at the end is based on how you did across the
  challenges, so play each one properly instead of rushing through.
