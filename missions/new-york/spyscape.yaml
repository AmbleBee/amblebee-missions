short: Test your spy skills at SPYSCAPE. Beat the laser maze, then compare your secret spy profiles.
description: >
  Go undercover at a spy museum that tests you as you go: crack codes, spot
  liars, and wriggle through a laser maze without tripping a beam. At the end
  each of you gets a spy profile that says which role you're best at, so
  compare them and argue over who'd make the better agent. Get a photo of
  you in the laser room. Plan on about two hours. It's open late on
  weekends; buy timed tickets ahead.
about: >
  SPYSCAPE opened in Midtown in 2018, built with help from former
  intelligence officers. Alongside the games, its galleries hold real spy
  history, from wartime code-breaking to modern surveillance.

  The profile you get at the end is based on how you did across the
  challenges, so play each one properly instead of rushing through. The
  laser room is the most popular stop, and the line moves faster early in
  the day.
