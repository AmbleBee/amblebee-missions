short: Test your spy skills at SPYSCAPE. Beat the laser maze, then compare your secret spy profiles.
description: >
  Go undercover at a spy museum that tests you as you go: crack codes, spot
  liars, and wriggle through a laser maze without tripping a beam. At the end
  each of you gets a spy profile that says which role you're best at, so
  compare them and argue over who'd make the better agent. Get a photo of the
  two of you in the laser room. Plan on about two hours. It's open late on
  weekends; buy timed tickets ahead.
