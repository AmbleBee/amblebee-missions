short: Ride the free Staten Island Ferry past the Statue of Liberty. Grab the right side going out.
description: >
  Ride the big orange ferry across New York Harbor for free. Going out to
  Staten Island, stand on the right (starboard) side for the closest view of
  the Statue of Liberty, then watch the Manhattan skyline shrink behind you.
  Ride back at sunset for the best light, and get a photo of you at
  the rail with the city behind you. It's about 25 minutes each way; you have
  to get off at St. George and walk around to board again.
about: >
  The ferry has crossed New York Harbor for well over a century, and the
  city made it free in 1997. It's about five miles each way and carries tens
  of thousands of commuters on a normal weekday, which is why the boats are
  so big.

  It runs around the clock, every day. Rush hours are packed with commuters,
  so a midday or evening ride is calmer. The St. George terminal has views
  of its own, and the minor league ballpark is a short walk away.
