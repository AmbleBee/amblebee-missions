short: Ride the free Staten Island Ferry past the Statue of Liberty. Grab the right side going out.
description: >
  Ride the big orange ferry across New York Harbor for free. Going out to
  Staten Island, stand on the right (starboard) side for the closest view of
  the Statue of Liberty, then watch the Manhattan skyline shrink behind you.
  Ride back at sunset for the best light, and get a photo of the two of you at
  the rail with the city behind you. It's about 25 minutes each way; you have
  to get off at St. George and walk around to board again.
for_kids:
