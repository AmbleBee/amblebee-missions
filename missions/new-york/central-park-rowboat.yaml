place:
  name: Central Park (Loeb) Boathouse
  area: The Lake, Central Park (enter near E 72nd St)
  address: EAST 72ND ST +, Center Dr, New York, NY 10021
  coords: [40.77530, -73.96852]
  website: https://centralparkboathouse.com/restaurant-menu/
short: Central Park rowboat from the Loeb Boathouse. Take turns rowing the Lake and find Bow Bridge.
description: >
  Rent a rowboat at the Loeb Boathouse and row out onto the Lake, with the
  skyline poking up over the trees. Take turns at the oars, row under or past
  Bow Bridge, and find a quiet cove to just drift for a while. Get a photo of you in the boat with the bridge behind you. Boats hold up to four,
  rent first-come, first-served from April to October, and come back by early
  evening, so go earlier in the day. Weather can close the rentals.
about: >
  Central Park was designed by Frederick Law Olmsted and Calvert Vaux, who
  won a design contest in 1858. The Lake was dug out of a swamp, and Bow
  Bridge, built in 1862, is one of the oldest cast-iron bridges in the
  country and a favorite spot for movie scenes and marriage proposals.

  Boats hold up to four and rent first come, first served from spring to
  fall. They come back by early evening, and weather can close the
  rentals, so go earlier in the day.
for_kids:
  short: Boat ride! Find each thing.
  steps:
    - A turtle or duck
    - The big bridge
    - A tall building over the trees
    - A turn at the oars
    - A selfie in the boat!
