short: Halls of Gems and Minerals at the Natural History Museum. Find the giant amethyst geode.
description: >
  Walk through the museum's glittering gem and mineral halls, past huge
  crystals, glowing minerals and a geode taller than you that you can walk
  right up to. Each pick the gem you'd want if you could take one home, and get
  a photo of you by the giant amethyst geode. The halls come with
  general admission; go on a weekday morning to beat the crowds, and stay for
  the dinosaurs and the blue whale if you have time.
about: >
  The halls reopened in 2021 after a big renovation. Look for the Star of
  India, a huge blue sapphire that was stolen in a famous 1964 jewel heist
  and later recovered. The giant amethyst geodes come from Uruguay and are
  big enough to stand inside.

  The halls come with general admission. Go on a weekday morning to beat the
  crowds, and stay for the dinosaurs and the blue whale if you have time.
