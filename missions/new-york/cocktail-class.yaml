short: Cocktail making class in NYC. Learn to shake classics, then make each other a signature drink.
description: >
  Take a hands-on mixology class where a bartender teaches you to shake, stir
  and balance classic cocktails, then lets you loose to invent your own. Make a
  signature drink for each other and name it after an inside joke. Get a photo toasting with your creations. It's 21 and up, and
  classes book up, so reserve ahead and plan a ride home.
about: >
  A bartender's rule of thumb: shake drinks with citrus or juice, and stir
  drinks made only of spirits. Many classic sours follow the same simple
  balance of two parts spirit, one part sour and one part sweet, so once you
  learn it you can invent your own.

  Classes are 21 and up and book up, so reserve ahead and plan a ride home.
