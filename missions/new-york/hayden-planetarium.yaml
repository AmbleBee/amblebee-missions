short: Hayden Planetarium in NYC. Lean back for the space show, then walk the Cosmic Pathway.
description: >
  Get timed tickets for the space show and lean back under the giant dome as
  it flies you out through the universe. Afterward, walk the spiral Cosmic
  Pathway, where each step covers millions of years, and find the spot that
  marks all of human history. Get a photo of you with the glowing
  sphere of the Rose Center behind you. The show needs a separate timed
  ticket, so book ahead. It's in the same museum as the gem halls, so you can
  do both in one day.
about: >
  The Rose Center opened in 2000, with the planetarium inside a giant glowing
  sphere. Astrophysicist Neil deGrasse Tyson has long directed the
  planetarium. When it opened, its exhibits famously left Pluto out of the
  lineup of planets, years before scientists officially reclassified it.

  The show needs a separate timed ticket, so book ahead. It's in the same
  museum as the gem halls, so you can do both in one day.
for_kids:
