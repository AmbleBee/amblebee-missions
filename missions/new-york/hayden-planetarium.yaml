short: Lean back under the dome for the Hayden Planetarium space show. Then walk the cosmic pathway.
description: >
  Get timed tickets for the space show and lean back under the giant dome as
  it flies you out through the universe. Afterward, walk the spiral Cosmic
  Pathway, where each step covers millions of years, and find the spot that
  marks all of human history. Get a photo of the two of you with the glowing
  sphere of the Rose Center behind you. The show needs a separate timed
  ticket, so book ahead. It's in the same museum as the gem halls, so you can
  do both in one day.
for_kids:
