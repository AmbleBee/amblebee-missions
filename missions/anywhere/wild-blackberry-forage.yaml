number: 66
name: Wild Blackberry Picking
mode: both
who: [friends, family, kids]
short: Pick wild blackberries in late summer, race to fill a cup, then bake something with them.
description: >
  Wild blackberry season usually runs from late July into September, depending
  on where you live. Look for bramble patches along trails, park edges and bike
  paths, and check that picking is allowed there first. Only pick fruit you are
  100% sure is blackberry: the thorny canes and the bumpy, shiny black berries
  are easy to know, and if you are not sure, skip it. Ripe ones are deep black
  and come off with a gentle tug; red ones aren't ready yet. Stay away from busy
  roads, ditches and anywhere that might be sprayed, pick above dog height, and
  leave plenty for the birds. Wear long sleeves, race to fill a cup, and rinse
  everything at home. Then bake a crumble or flip some blackberry pancakes, and
  get a photo of everyone's purple fingers.
steps:
  - The bramble patch
  - A perfect ripe berry
  - The full containers
  - Purple fingers
  - The finished bake
