name: Sunrise Mission
mode: both
who: [solo, friends, family]
short: Sunrise mission. Get up before dawn with a thermos of coffee and watch the sun come up.
description: >
  Set an early alarm, fill a thermos with coffee or cocoa, and head out in the
  dark to a spot facing east: a hilltop, a lake, a beach, or just an open field.
  Get there 20 minutes before sunrise, since the sky starts changing well before
  the sun shows up. Watch the whole thing without phones, then get a photo of you in the first light. Breakfast afterward is mandatory.
about: >
  The show starts well before the sun appears. About half an hour before
  sunrise the sky turns deep blue, then purple, then orange, which is why
  getting there early matters. Look up the exact sunrise time the night
  before.

  East-facing hilltops, lakes and beaches are best. Clouds on the horizon
  can block the sun, but a few clouds higher up often make the most
  colorful mornings.
