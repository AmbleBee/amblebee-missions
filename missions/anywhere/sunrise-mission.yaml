number: 16
name: Sunrise Mission
mode: both
who: [solo, friends, family]
short: Get up before dawn, bring coffee in a thermos, and watch the sun rise somewhere with a view.
description: >
  Set an early alarm, fill a thermos with coffee or cocoa, and head out in the
  dark to a spot facing east: a hilltop, a lake, a beach, or just an open field.
  Get there 20 minutes before sunrise, since the sky starts changing well before
  the sun shows up. Watch the whole thing without phones, then get a photo of
  the two of you in the first light. Breakfast afterward is mandatory.
duration: short
effort: easy
cost: free
setting: outdoor
season: any
time_of_day: morning
travel: local
tags: [sunrise, views, early, coffee]
