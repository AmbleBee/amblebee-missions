name: Take a Class Together
mode: date
short: Take a class together. Pottery, cooking, dance, anything neither of you has tried.
description: >
  Book a one-time class in something neither of you has done before, like
  pottery, cooking, dancing or painting. Go in expecting to be bad at it;
  the point is learning something new together. Each pick the moment you
  were proudest of and the moment you were worst at. The photo to get: the
  two of you with whatever you made, however it turned out.
about: >
  Good places to look: community colleges, parks and rec departments, art
  centers, cooking stores, dance studios and outdoor shops often run
  one-night or weekend classes for beginners. Pottery wheel and cooking
  classes are popular date picks and fill up fast, so book ahead.

  If you love it, keep going. If not, you've got a funny story.
