name: Sushi Night, Something New
mode: both
who: [solo, friends, family]
short: Sushi night. Each order a roll or dish you've never tried and rate every bite out of 10.
description: >
  Find a sushi spot, ideally one neither of you has been to, and make a rule:
  each of you has to order at least one roll or dish you've never had before.
  Try something new like uni, eel, a hand roll or a chef's special. Share
  everything, and give each piece a score out of 10. Keep the scores on a
  napkin or in your phone. At the end, crown the best and worst bites of the
  night, and get a photo of you with the winning plate. Not a raw
  fish fan? Cooked rolls, tempura and veggie rolls count too.
about: >
  A quick guide: nigiri is a slice of fish on a little block of rice, maki
  is a roll cut into pieces, and a hand roll is a cone of seaweed you eat
  with your hands. Uni is sea urchin, and unagi is grilled freshwater eel
  with a sweet sauce.

  Tips from sushi chefs: dip nigiri fish-side down so the rice doesn't fall
  apart, and go easy on the soy sauce. Feeling brave? Ask for "omakase,"
  which means "I'll leave it to you," and let the chef choose.
duration: short
effort: easy
