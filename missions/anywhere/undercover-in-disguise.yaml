number: 52
name: Undercover in Disguise
mode: both
who: [friends, family]
short: Undercover disguise day. Dress each other up, invent secret identities, stay in character.
description: >
  Each of you builds a disguise and a cover story for the other: a fake
  mustache or wig, sunglasses, a thrifted coat, plus a name, a job, and one
  dramatic backstory detail. Head to a main street, a park, or a café and stay
  in character the whole time, including ordering coffee as your alter ego.
  Hand each other one sealed "top secret" card with a small task, like "find a
  red door" or "learn the barista's favorite drink." Keep the missions about yourselves, not about following strangers. Take a stakeout photo from behind a
  newspaper.
about: >
  The best disguises are simple: a hat, glasses, a scarf and a new way of
  walking go a long way. Thrift stores and costume shops are great for
  props.

  Keep the missions about your own group, not strangers, and be friendly
  and in on the joke when you order or chat. The fun is in staying in
  character, not in fooling anyone.
steps:
  - Before and after the disguise
  - Your alter egos' coffee order
  - The stakeout
  - Proof the secret task is done
duration: short
effort: easy
cost: $
setting: outdoor
season: any
time_of_day: daytime
travel: local
themes: [playful]
tags: [disguise day, secret identity game, spy game, role play adventure, playful, silly]
