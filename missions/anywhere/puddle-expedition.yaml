name: Puddle Expedition
mode: adventure
who: [family, kids]
short: Puddle jumping on a rainy day. Suit up and splash in every puddle you can find.
description: >
  Pick a properly rainy day and suit up in rain boots and rain gear, or old
  clothes you don't mind soaking. Walk a loop around the neighborhood and jump
  in every puddle, keep a tally, and crown the biggest splash. Race leaf boats
  down the gutter and look for rain-day finds: worms, snails, and streams that
  only exist today. Set out dry clothes by the door and hot chocolate before
  you leave, so coming home is part of the fun. The photo to get: the biggest
  splash of the day, caught mid-air.
about: >
  Rainy days bring out things you never see on sunny ones: worms on the
  sidewalk, snails on the fences, and little streams in the gutters. Each one
  is something to find.

  Set out dry clothes and towels by the door and have hot chocolate ready
  before you leave, so coming home warm is part of the fun. Stay away from
  storm drains and fast-moving water.
