number: 64
name: Puddle Expedition
mode: adventure
who: [family, kids]
short: Wait for a real rainy day, suit up, and jump in every puddle you can find.
description: >
  Pick a properly rainy day and suit up in rain boots and rain gear, or old
  clothes you don't mind soaking. Walk a loop around the neighborhood and
  jump in every puddle, keep a tally, and crown the biggest splash. Race leaf
  boats down the gutter and look for rain-day finds: worms, snails, and
  streams that only exist today. Set out dry clothes by the door and hot
  chocolate before you leave, so coming home is part of the fun.
steps:
  - Suited up at the door
  - The mid-air jump
  - The biggest splash
  - A rain-day creature
  - Muddy boots lined up at home
