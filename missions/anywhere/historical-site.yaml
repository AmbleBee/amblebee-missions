name: Historical Site or Center
mode: date
short: Visit a local historical site or historic house. Each learn one story you didn't know.
description: >
  Visit a local history center, historic house or landmark. Read the
  plaques, ask a docent a question, and each hunt for one story about the
  place you didn't know before. On the way home, tell each other your
  favorite. The photo to get: the two of you in the oldest-looking doorway
  you can find.
about: >
  Almost every town has more history than you'd think. The National Register
  of Historic Places lists tens of thousands of buildings and sites across the
  country, and the Historical Marker Database (hmdb.org) maps roadside
  markers near you.

  Docents and volunteers usually know the best stories that aren't on the
  signs, so it's worth asking, "What's your favorite thing about this
  place?"
