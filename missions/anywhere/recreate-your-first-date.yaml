name: Recreate Your First Date
mode: date
short: Recreate your first date. Same food, same music, same place if you can.
description: >
  Remember your first date and do it all again: the same place if you can get
  there, or the same food, the same music and the same outfits if you can't. Fill
  in each other's memory gaps along the way and tell each other what you were
  really thinking that first time. Take the photo you wish you'd taken on the
  real first date.
about: >
  It's a sweet anniversary idea, but it works any time. Before you go, each
  write down three details you remember from the first date, then compare.
  You'll be surprised what the other one remembers.

  If the original place has closed, recreate it at home: the same takeout,
  the same songs, the same outfits. Ask each other the questions you were
  too nervous to ask the first time.
