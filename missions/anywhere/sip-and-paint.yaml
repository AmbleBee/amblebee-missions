name: Pass-the-Canvas Sip and Paint
mode: date
short: Sip and paint at home. Each start a canvas, then swap every ten minutes and keep going.
description: >
  Set up a little painting night at home: a couple of small canvases, brushes
  and paints, and a drink each. Wine, a cocktail, a mocktail, juice or bubbly
  water all work, or surprise each other by picking the other person's drink.
  Each start a painting, then every ten minutes or so, swap canvases and keep
  going on the other person's. Take a photo before every swap so you can see
  how each painting changed hands. Start with a photo of the two of you
  clinking glasses, and end with both finished paintings side by side.
about: >
  Paint-and-sip studios got popular in the 2010s, but swapping canvases
  makes the home version even better. Neither painting turns out how anyone
  planned, and that's the fun.

  Tips: acrylic paint dries fast and cleans up with water, small canvases
  or canvas boards are cheap at craft stores, and a paper plate makes a
  great palette. Put down newspaper or an old sheet first.
