number: 2
name: Books and Coffee Swap
mode: date
short: Pick a book (under $10) and a coffee order for each other. Swap them at the café.
description: >
  Head to a used or local bookstore with a café nearby, or one with a café
  inside. Split up and each secretly pick a book under $10 you think the other
  would love. Then, without asking, order the other person's coffee, tea or
  snack: something you think they'd like, or something they'd never pick
  themselves. Sit down, swap the books and the drinks, and explain your picks.
  Get a photo of the two of you with your books and mugs.
duration: short
effort: easy
cost: $
