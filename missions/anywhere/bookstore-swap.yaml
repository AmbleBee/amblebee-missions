name: Books and Coffee Swap
mode: date
short: Bookstore and coffee date. Pick a book and a coffee order for each other, then swap at the café.
description: >
  Head to a used or local bookstore with a café inside or nearby. Split up
  and each secretly pick a book under $10 you think the other would love.
  Then, without asking, order the other person's coffee, tea or snack:
  something you think they'd like, or something they'd never pick. Sit down,
  swap the books and the drinks, and explain your picks. The photo to get:
  the two of you with your books and mugs.
about: >
  Before you hand it over, write a short note inside the front cover with
  today's date. Years from now, it's the best kind of bookmark.

  Used bookstores are the easiest place to stay under $10, and many have a
  dollar or bargain shelf. Some bookstores also do "blind date with a book,"
  books wrapped in paper with a few hints written on the front. If you find
  one, that's a fun pick too.
