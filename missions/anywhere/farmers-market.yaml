name: Farmers Market Morning
mode: date
short: Farmers market date. Stroll the stalls and each try something you've never eaten before.
description: >
  Head to a farmers market in the morning, coffee in hand. Wander the
  stalls and each pick one thing the other has never eaten, then try them
  together. Pick up ingredients for a meal to cook later. The photo to get:
  the two of you with the strangest fruit or vegetable you found.
about: >
  Go early for the best selection, or near closing for deals. Ask the
  growers what's best right now; they love that question, and they'll often
  tell you how to cook it.

  Bring a bag and some small bills, since not every stall takes cards. Most
  markets run on a weekly schedule, often in spring through fall, with some
  open year-round.
