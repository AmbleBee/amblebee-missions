name: Holiday Window Art
mode: both
who: [friends, family, kids]
short: Holiday window art at home. Each decorate a window with chalk markers, then score each other.
description: >
  Pick up a pack of liquid chalk window markers and choose whatever holiday is
  coming up next. Each of you claims a window, or half of a big one, and draws
  your best holiday scene: pumpkins, snowflakes, hearts, fireworks, whatever
  fits. (Test a small corner first; liquid chalk can stain frosted glass,
  window tint film and old painted frames.) No peeking until you're both done.
  Then do the big reveal and rate each other's work out of 10, with one thing
  you loved about it. Take a photo of each window, and a group shot with your art and your scores. Leave it up through the holiday and
  wipe it off with a damp cloth after.
about: >
  Liquid chalk markers are made for glass and wipe off with a damp cloth.
  Test a small corner first, since they can stain frosted glass, window tint
  film and old painted frames.

  Tips: sketch your idea on paper first, draw the outlines before you fill
  in color, and remember that people outside see it backward, so write any
  words from the outside or skip words entirely.
for_kids:
  short: Window art! Do each thing.
  steps:
    - Pick a holiday
    - Draw on your window
    - Show your drawing
    - Give a score out of 10
    - A selfie with your art!
