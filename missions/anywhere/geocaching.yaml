name: Geocaching
mode: both
who: [solo, friends, family, kids]
short: Try geocaching. Find a hidden cache or two near you with the free app.
description: >
  Download a geocaching app and pick two or three easy caches near you,
  ideally in a park or along a trail. Follow the clues, find the hidden
  container, sign the logbook, and trade a little trinket if there's one
  inside. Keep score of who spots each cache first, and play it cool when
  other people walk by. The photo to get: you holding the cache, without
  showing where it was hidden.
about: >
  Geocaching started in May 2000, the day after GPS became accurate enough
  for everyday use. The very first cache was hidden near Portland, Oregon,
  and a plaque now marks the spot. Today there are millions of caches around
  the world, so there's almost certainly one near you.

  Rules of the game: put the cache back exactly where you found it, keep it
  hidden from people walking by (they call them "muggles"), and if you take
  a trinket, leave one of equal value.
