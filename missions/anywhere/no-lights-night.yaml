name: No Lights Night
mode: date
short: No-lights night at home. Phones away, candles lit, and an evening of games and talk.
description: >
  Pick a night, put both phones in a drawer, and turn off the TV and every
  light in the house. Light a few candles (or lanterns) and spend the evening
  together by candlelight: play a board game or cards, read to each other, or
  just talk. Make a simple snack before the lights go out. The one
  exception is the camera: take one photo of the two of you in the candlelight.
  Never leave candles burning unattended.
about: >
  Every March, people around the world switch off their lights for Earth
  Hour, but you don't need an occasion. It's surprising how different home
  feels by candlelight: quieter, slower, and easier to talk.

  Ideas for the evening: read a chapter out loud, play cards, tell each other
  stories from childhood, or plan a trip on paper. Use battery candles if you
  have pets or kids around, and never leave real candles burning
  unattended.
