name: Weird Little Museum
mode: both
who: [solo, friends, family]
short: Find the weirdest little museum near you. Each share the strangest thing you learned.
description: >
  Skip the big famous museum and find the quirky little one instead: the
  historical society in an old house, the museum of one local obsession, the
  unusual collection with hand-written labels and a volunteer who knows
  everything. Read the plaques, ask the volunteer one question, and each find
  the strangest fact in the building. Over coffee or lunch afterward, trade
  your facts and decide which one wins. It's a great cheap date idea for a
  rainy afternoon, and you'll learn something about your own town.
about: >
  Some small museums are famous for being odd: the Museum of Bad Art in
  Massachusetts, the Vent Haven Museum of ventriloquist dummies in Kentucky,
  and the International Cryptozoology Museum in Portland, Maine. Your own
  town probably has one too, often run by volunteers and open only a few
  days a week.

  Search for "historical society" or "museum" plus your town's name, and
  check the hours before you go. The photo to get: you with the weirdest
  thing in the building.
