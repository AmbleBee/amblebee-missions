name: Lockpicking Night
mode: date
short: Learn to pick a lock together. Race to the first pop, then try to beat your own time.
description: >
  Pick up a beginner pick set with tension wrenches, a clear practice lock and
  one cheap padlock of your own. Start on the clear lock so you can watch the
  pins line up, try raking first, then slow down and set the pins one at a
  time. Move to the padlock and race each other to the first open, then time
  your repeats and see how far the clock drops. Locksport has one rule, and
  it's the whole hobby: only pick locks you own that aren't in use. Laws on
  carrying picks vary from place to place, so keep the kit at home. Get a photo of the face you
  make when the shackle pops.
steps:
  - The kit laid out on the table
  - Pins showing through the clear lock
  - Two pairs of hands, mid-pick
  - The shackle popping open
  - Your best time on the stopwatch
