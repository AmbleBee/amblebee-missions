number: 46
name: Draw That Memory
mode: date
short: Each spend 5 minutes drawing a memory of the two of you. Then guess what the other one drew.
description: >
  Grab two pieces of paper and something to draw with. Each of you secretly
  picks a memory from your relationship (your first date, a trip, an inside
  joke, a disaster you laugh about now) and gets five minutes to draw it. No
  words or letters allowed. Then swap and try to guess what the other person
  drew, and tell the story behind it once you've got it. Play one round or keep
  going as long as you're laughing. At the end, pick your favorite drawing of
  the night, and get a photo of the two of you holding it up. Keep it
  somewhere you'll see it.
duration: short
effort: easy
cost: free
setting: indoor
season: any
time_of_day: evening
travel: home
tags: [drawing, memories, game, at-home, romantic]
