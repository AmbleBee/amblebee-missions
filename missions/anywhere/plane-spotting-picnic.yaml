name: Plane Spotting Picnic
mode: both
who: [friends, family, kids]
short: Plane spotting picnic under an airport landing path. Guess where each plane came from.
description: >
  Find a public park, viewing area, or legal parking spot under the approach
  path of your nearest airport, where planes come in low. Spread out a
  picnic, open a flight-tracking app like Flightradar24, and guess where each
  plane is coming from before you look it up. Keep a logbook of airlines and
  cities, and give bonus points for the biggest plane and the farthest
  origin. Bring ear protection for little ones, stay outside any fences, and
  check the wind, since it decides which runway they land on. Get the shot
  of a plane right overhead with everyone pointing up.
about: >
  Planes land and take off into the wind, so the wind decides which
  direction they come in from and which spot is best that day. Flight
  tracking apps show each plane's route, airline and type.

  Plane spotting is a real hobby with fans all over the world. Some airports
  even have official viewing areas, and a few restaurants are famous for
  planes landing right overhead. Bring ear protection for little ones.
steps:
  - The picnic spread under the flight path
  - A plane right overhead
  - The logbook
  - The biggest plane of the day
  - Everyone pointing up
for_kids:
  short: Watch the big planes fly right over you!
  steps:
