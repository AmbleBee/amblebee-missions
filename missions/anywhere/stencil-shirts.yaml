number: 49
name: Stencil Shirts for Each Other
mode: date
short: Secretly design a shirt for each other, stencil it with freezer paper, then wear them out.
description: >
  Each of you secretly designs a shirt for the other: an inside joke, a doodle,
  or the name of a band that doesn't exist. Trace the design onto freezer
  paper, cut it out with a craft knife, and iron it shiny side down onto a
  plain shirt with cardboard slipped inside. Sponge on fabric paint, let it
  dry a bit, then peel the paper off together for the reveal. Once they're
  dry, put them on and go get a coffee in your new matching-but-not-matching
  look.
steps:
  - Cutting out the secret stencil
  - Sponging on the paint
  - The peel reveal
  - Both of you wearing your shirts
