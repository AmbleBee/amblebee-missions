name: Stencil Shirts for Each Other
mode: date
short: DIY stencil shirt date. Secretly design a shirt for each other, then wear them out.
description: >
  Each of you secretly designs a shirt for the other: an inside joke, a
  doodle, or the name of a band that doesn't exist. Trace the design onto
  freezer paper, cut it out, and iron it shiny side down onto a plain shirt
  with cardboard slipped inside. Sponge on fabric paint, then peel the paper
  off together for the reveal. The photo to get: the two of you wearing your
  new shirts out for coffee.
about: >
  Freezer paper has a thin plastic coating on one side that sticks to fabric
  when you iron it, then peels off cleanly, which makes it a perfect cheap
  stencil. You'll find it near the plastic wrap at the grocery store.

  Use a sharp craft knife on a cutting mat for the stencil, dab the paint
  instead of brushing so it doesn't creep under the edges, and follow the
  paint's directions for heat-setting so it survives the wash.
steps:
  - Cutting out the secret stencil
  - Sponging on the paint
  - The peel reveal
  - Both of you wearing your shirts
