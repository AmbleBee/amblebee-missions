number: 76
name: Sleep Out Under the Sky
mode: both
who: [solo, family, kids]
short: Sleep outside with no tent. Watch the sky all night and make coffee at sunrise.
description: >
  After dinner, head to a legal spot, like a campground walk-in site, a
  friend's land with permission, or your own backyard (the best pick with
  kids). Lay a sleeping bag on a pad with no tent so the sky is your ceiling,
  and bring a warm hat, a rain layer and more warm layers than you think you
  need. Check the forecast and skip it if storms are coming, tell someone
  where you'll be, and pack a headlamp, water and breakfast. Watch the stars
  come out, sleep when you can, and wake up for the sunrise. Get a photo of
  your bed laid out at dusk. Bring bug spray, keep food sealed or inside so you don’t draw visitors, 
  and do a tick check in the morning.
steps:
  - Your bed laid out at dusk
  - The sky after dark
  - Your face in the sleeping bag at dawn
  - Sunrise with a hot drink
for_kids:
  short: Sleep outside under the stars tonight!
  steps:
