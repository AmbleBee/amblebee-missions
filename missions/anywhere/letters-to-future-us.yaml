number: 38
name: Letters to Future Us
mode: date
short: Each write a letter to open together in one year. Seal it, date it, and hide it somewhere safe.
description: >
  Sit down somewhere cozy with paper, envelopes and something warm to drink.
  Each write a letter to the two of you one year from now: what life looks
  like today, what you're excited about, a prediction or two, and something
  you love about the other person right now. No peeking. Seal them, write
  "Open on" and the date a year from today on the front, and hide them
  together somewhere safe. Take a photo of the two of you holding the sealed
  envelopes, and set a reminder for next year.
duration: short
effort: easy
cost: free
setting: indoor
season: any
time_of_day: evening
travel: home
tags: [writing, keepsake, cozy, at-home, romantic]
