name: Letters to Future Us
mode: date
short: Letters to future us. Each write a letter to open together in one year, then hide them.
description: >
  Sit down somewhere cozy with paper, envelopes and something warm to drink.
  Each write a letter to the two of you one year from now: what life looks
  like today, what you're excited about, a prediction or two, and something
  you love about the other person right now. No peeking. Seal them, write
  "Open on" and the date a year from today on the front, and hide them
  together somewhere safe. Take a photo of the two of you holding the sealed
  envelopes, and set a reminder for next year.
about: >
  Ideas for what to put inside: your current favorite song, the prices of a
  few things you buy all the time, where you think you'll be in a year, and
  a question you want your future selves to answer. Tuck in a printed photo
  or a ticket stub too.

  Make it a tradition: each year on the date, open last year's letters and
  write new ones. After a few years, you'll have a stack that tells your
  story.
