name: Bob Ross Painting Night
mode: both
who: [solo, friends, family, kids]
short: Bob Ross paint-along night at home. Pick an episode and paint happy little trees side by side.
description: >
  Pick a Bob Ross episode and paint along together, with cheap acrylics,
  watercolors or even colored pencils if that's what you have. Pause and
  rewind as often as you need; nobody keeps up with Bob. When you're done,
  hold your paintings up side by side for a photo, then each give the
  other's painting a title. Bonus points for a happy little tree.
about: >
  The Joy of Painting ran on public TV from 1983 to 1994, more than 400
  episodes, each about half an hour. Many full episodes are free on the
  official Bob Ross YouTube channel.

  Bob painted "wet-on-wet" with oil paints, blending new colors into wet
  ones, which is how he finished a whole landscape in one episode. Acrylics
  dry faster and won't blend quite the same, so pick an episode with a
  simple scene. The first one ever, "A Walk in the Woods," is a good start.
  It's supposed to look different from his. That's half the fun.
for_kids:
  short: Painting night! Make each thing.
  steps:
    - A blue sky
    - A happy little tree
    - A mountain
    - A selfie with your painting!
