name: Flea Market Browse
mode: date
short: Flea market date. Each get a few dollars to buy the other the strangest gift you can find.
description: >
  Spend a morning or afternoon wandering a flea market or swap meet. Give
  each other a tiny budget, a few dollars each, then split up and buy the
  other the strangest or most perfect gift you can find. Meet back up and
  unwrap them. The photo to get: the two of you holding up your gifts.
about: >
  Flea market tips: go early for the best finds, or late in the day when
  sellers would rather haggle than pack up. A friendly "Would you take..."
  is usually welcome. Bring small bills.

  Some of the biggest flea markets in the country, like the Rose Bowl Flea
  Market in Pasadena and Brimfield in Massachusetts, draw thousands of
  sellers, but small local swap meets are often where the weirdest treasures
  hide.
