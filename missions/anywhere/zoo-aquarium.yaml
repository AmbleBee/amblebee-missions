name: Zoo or Aquarium Day
mode: both
who: [friends, family, kids]
short: Zoo or aquarium day. Wander, photograph your favorite animals, and each crown a winner.
description: >
  Visit a zoo or aquarium, whichever you're in the mood for, and take your
  time wandering. Whenever an animal catches your eye, take its picture.
  Each keep a list of your top three, then over a snack at the end, reveal
  them and crown the animal of the day. The photo to get: you with your
  winning animal behind you.
about: >
  Zoos and aquariums accredited by the Association of Zoos and Aquariums
  (AZA) meet high standards for animal care, and many help save endangered
  species. Check the daily schedule for feedings and keeper talks, which are
  often the best part of the day.

  Animals are usually most active in the morning and on cooler days.
for_kids:
  short: Animal hunt! Find each animal and take its picture.
  steps:
    - An animal with stripes
    - Something with feathers
    - The biggest animal you can find
    - An animal that is sleeping
    - Your very favorite animal!
