name: Thrift Teacup Candles
mode: both
who: [friends, family]
short: DIY teacup candles. Thrift a weird teacup for each other, then pour a candle and light it tonight.
description: >
  Start at a thrift store, where each of you hunts down a teacup or mug for
  the other. Pick up soy wax flakes and pre-tabbed wicks on the way home.
  Melt the wax, add a few drops of scent if you like, stand each wick in its
  cup with two chopsticks or a clothespin, and pour. Let them set for a few
  hours, trim the wicks short, and light them side by side with the lights
  down. The photo to get: both candles glowing together.
about: >
  Soy wax is the easiest for beginners: it melts at a low temperature and
  cleans up with warm soapy water. Melt it in a double boiler or in short
  microwave bursts, and save a little for a second pour, since wax shrinks
  as it cools and leaves a dip around the wick.

  Leave some space at the top of the cup, use cups without cracks, and
  never leave a burning candle alone.
steps:
  - The teacup you picked out
  - The big reveal at the register
  - Pouring the wax
  - Wicks propped up and setting
  - The candles lit with the lights down
