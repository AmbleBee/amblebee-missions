name: Blind Taste Test Night
mode: both
who: [friends, family, kids]
short: Blind taste test night at home. Blindfold each other, taste chips or sodas, and guess the brands.
description: >
  Pick a category, like potato chips, sodas, chocolate bars or salsas, and
  buy three to five brands, including at least one cheap store brand. Take
  turns blindfolding each other and serving small tastes in a random order.
  Guess which brand is which, rank your favorites, and keep score. Reveal the
  answers at the end and find out if the fancy one actually wins. The photo
  to get: the blindfolded taster mid-bite.
about: >
  The most famous blind taste test is the Pepsi Challenge, which started in
  the 1970s and had shoppers sip two unlabeled colas. You're running your
  own version.

  Tips: write a number on the bottom of each cup or plate so the server
  doesn't forget which is which, and keep water and plain crackers around
  to reset your taste between rounds. Sodas and chocolate work best with
  three brands. Chips and salsa can handle five.
for_kids:
  short: Taste test! Do each thing.
  steps:
    - Put on the blindfold
    - Taste three snacks
    - Guess your favorite
    - Check the answers
    - A silly blindfold selfie!
