name: Mini Golf
mode: date
short: Mini golf date. Play a round, invent trick shots, and loser buys the ice cream after.
description: >
  Find a mini golf course, an old outdoor one with windmills and dinosaurs or
  an indoor glow-in-the-dark one. Play a round, and on each hole the winner
  invents a trick shot the other has to try: off the wall, eyes closed, wrong
  hand. Keep the scorecard honest. Loser buys the ice cream after. The photo
  to get: the two of you at the silliest hole on the course.
about: >
  Mini golf has been around for about a century. In the late 1920s and
  early 1930s it became a craze, with tens of thousands of courses popping
  up across the country, many on rooftops and empty lots.

  Glow-in-the-dark indoor courses are great on rainy nights, and old
  roadside courses with giant dinosaurs and windmills are worth a drive.
