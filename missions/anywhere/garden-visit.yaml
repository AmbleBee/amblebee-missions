name: Garden Visit
mode: date
short: Botanical garden date. Wander a public garden and find your favorite quiet spot.
description: >
  Visit a public, botanical or Japanese garden and walk it slowly, like you
  have nowhere else to be. Each find the plant with the funniest name on its
  label and read it out loud in your best tour-guide voice. Then pick a bench
  or quiet corner you both like, bring out a snack if it's allowed, and sit
  long enough to notice the sounds. The photo to get: the two of you in your
  favorite spot.
about: >
  Gardens change with the seasons, so the same one is worth visiting more
  than once: blossoms in spring, roses in early summer, color in fall. Even
  winter has its moments in a Japanese garden or a greenhouse.

  Many public gardens are free, and paid ones often have a free day each
  month, so check the website.
