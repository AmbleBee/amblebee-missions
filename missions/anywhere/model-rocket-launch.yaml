name: Model Rocket Launch
mode: both
who: [solo, friends, family, kids]
short: Model rocket launch. Build a kit, count down together, and chase the parachute.
description: >
  Pick up a beginner model rocket launch set (Estes-style kits are sold at
  hobby and craft stores, big-box toy aisles, and online) plus a pack of
  engines, which usually come separately, and build it the night before.
  Choose a calm, dry day and a big open field you have permission to use, far
  from trees, power lines, buildings, and dry grass; bigger engines need
  bigger fields. Check local rules first, since some parks ban launches and
  many areas prohibit model rockets during fire restrictions. Stand at least
  15 feet back, count down out loud together, and take turns on the button.
  Chase the parachute after every flight and give each launch a name. The
  photo to get: the liftoff, in burst mode.
about: >
  Model rocketry took off in the late 1950s, when companies started selling
  safe, pre-made engines, so kids didn't have to mix their own fuel. Small
  rockets fly a few hundred feet, and bigger engines can send them much
  higher, which is why they need bigger fields.

  The National Association of Rocketry publishes a simple safety code worth
  reading before your first launch, and many areas have rocket clubs that hold
  launch days anyone can join.
