name: Portrait Night
mode: date
short: Draw or paint each other. 20 minutes, no erasing. Title and sign it.
description: >
  Sit across from each other with paper and whatever you have: pencils,
  markers, or paint. Set a 20-minute timer and draw each other, no erasing
  allowed. When time's up, give your portrait a title, sign and date it,
  and do a dramatic gallery reveal. Keep both.
