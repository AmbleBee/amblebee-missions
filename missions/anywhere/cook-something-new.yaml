name: Cook Something New
mode: both
who: [friends, family]
short: Cook something new at home. Pick a dish you've never made, shop together, cook it and rate it.
description: >
  Choose a meal neither of you would ever normally make: a cuisine you've never
  cooked, a recipe that looks a little too ambitious, or a dish from a place you
  want to visit. Shop for the ingredients together, put on a playlist you both
  love, and cook it side by side. Plate it like a restaurant, take a photo of
  the finished dish, then each rate it out of 10 and decide whether it earns a
  spot in your regular rotation.
about: >
  Tips for pulling off an ambitious dish: read the whole recipe before you
  shop, and chop and measure everything before you turn on the stove. Chefs
  call it mise en place, French for "everything in its place." Recipes with
  around ten ingredients or fewer are the sweet spot for a first try.

  Make it a theme: cook a dish from somewhere you want to travel, and pick
  music from that place to match. If it flops, order takeout and laugh
  about it; that counts as a memory too.
