name: Dress-Up Orchestra Night
mode: date
short: Dress up for a night at the symphony. Dinner first, then a live orchestra concert.
description: >
  Find a symphony, orchestra or chamber concert near you, anything from a big
  concert hall to a local community orchestra. Get properly dressed up, have
  dinner or a drink first, and take a photo of the two of you looking sharp
  before you go in. On the way home, each pick your favorite piece.
about: >
  You don't need to know classical music to enjoy it. Many orchestras offer
  cheap student or last-minute tickets, and community orchestras and
  college music departments often play for free or close to it.

  One old concert tradition: people usually wait to clap until a whole piece
  is over, not between its parts (called movements). If you're not sure,
  wait for the conductor to lower their arms and turn around.
