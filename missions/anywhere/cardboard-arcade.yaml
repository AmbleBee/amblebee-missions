number: 59
name: Cardboard Arcade
mode: adventure
who: [friends, family, kids]
short: Cardboard arcade at home. Build games from boxes, hand out tickets and open a prize counter.
description: >
  Save boxes for a few days, then have everyone build one or two arcade
  games: a ball toss into holes worth different points, a string-and-hook
  claw machine, a tiny basketball hoop, or a marble maze. Make paper tickets
  and set up a prize counter with stickers, candy, or chore-free passes. Hang
  a sign, open the doors, and invite neighbors or grandparents in as
  customers. Play every game, collect your tickets, and cash them in. The
  best photo is the first customer stepping up to play.
about: >
  The idea comes from Caine's Arcade, a 2012 short film about a 9-year-old
  in East Los Angeles who built a whole arcade out of boxes in his dad's
  auto parts shop. The film went viral, and it started the Global Cardboard
  Challenge, held every fall.

  Tips: cereal and shipping boxes work best, packing tape is stronger than
  glue, and a strip of paper "tickets" from a pad or receipt roll makes it
  feel real. Let the kids set the prices at the prize counter.
steps:
  - Builders mid-tape
  - The arcade sign
  - The first customer
  - A high score
  - The prize counter
