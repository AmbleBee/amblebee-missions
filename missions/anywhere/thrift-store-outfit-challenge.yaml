name: Thrift Store Outfit Challenge
mode: both
who: [friends]
short: $40 each to thrift a full outfit for the other. Then you both wear them out to dinner.
description: >
  Head to a thrift store with $40 each and split up. Put together a complete
  outfit for the other person, from shoes to accessories, without letting them
  see. Meet up, swap bags, change, and reveal. Then you both have to wear your
  new outfits out to dinner. Get a full-length photo of the two of you in your
  thrifted best. Donate back anything you won't wear again.
duration: short
