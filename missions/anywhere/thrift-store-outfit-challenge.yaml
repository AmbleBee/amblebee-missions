name: Blind Thrift Outfit Challenge
mode: both
who: [friends, family]
short: Thrift store outfit challenge. Pick each piece with your eyes closed, then wear it out.
description: >
  Head to a thrift store and take turns. One of you closes your eyes while the
  other walks you slowly down a rack of shirts and says "stop." Whatever your
  hand lands on, that's your shirt. Repeat for pants, then shoes, and add a hat
  or accessories as a bonus round. Then switch, so the other person picks
  blind too. Take a photo of every piece as it's chosen. Change into your new
  outfits and wear them out for a themed date, day or night. Get a
  full-length photo of you in your thrifted best, and donate back
  anything you won't wear again.
about: >
  Thrift stores restock all the time, so every visit is different. Many
  have sale days or colored-tag discounts, and some of the best finds hide
  in the back racks and costume sections.

  Wash everything before you wear it, set a small budget for the whole
  outfit, and donate back anything you won't wear again.
