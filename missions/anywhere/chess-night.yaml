name: Chess Night
mode: both
who: [friends, family, kids]
short: Chess night at home. Play a best-of-three match, and teach as you go if one of you is new.
description: >
  Set up a board, pour something good, and play a best-of-three chess match.
  If one of you is new to chess, play the first game as a lesson with the moves
  explained out loud, then play for real. Try a fast round with a timer to mix
  it up. Loser picks the snack for the rematch. Take a photo of you
  over the board right before checkmate. No board? Look for a café or park with
  chess tables.
about: >
  New to chess? A quick cheat sheet: the knight moves in an L and can jump
  over pieces, pawns capture diagonally, and the goal is to trap the other
  king so it can't escape. Lichess, a free website, has quick lessons and
  puzzles if you want to practice between games.

  Chess had a big comeback after The Queen's Gambit came out in 2020, so
  many cafés, parks and libraries have boards out. A fast round with a
  timer, like five minutes each, is a fun way to shake things up.
for_kids:
  short: Chess night! Do each thing.
  steps:
    - Set up the board
    - Move a horse (knight)
    - Take a piece
    - Say "check!"
    - A selfie with the board!
