name: Museum Visit
mode: date
short: Museum date. Wander an art or science museum and each find the piece you'd take home.
description: >
  Pick an art, science or any museum that sounds interesting and take your
  time wandering. Each of you keeps an eye out for the one piece you'd love
  to have at home, then lead the other to it and explain why. The photo to
  get: the two of you next to your picks. Trade stories over coffee after.
about: >
  Many museums have free days or evenings each month, and some are always
  free. Smithsonian magazine's Museum Day each fall offers free tickets to
  hundreds of museums, and the Blue Star Museums program offers free entry to
  military families in summer.

  Most museums allow photos without flash, but check the signs, since some
  special exhibits don't.
