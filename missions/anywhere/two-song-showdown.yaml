name: Two-Song Showdown
mode: both
who: [friends]
short: Pick one silly theme, write a song each in secret, then perform it for each other.
description: >
  Agree on one theme, like "the cat's secret life" or "our worst road trip,"
  then go to separate rooms for 30 to 45 minutes. Each of you writes a tiny
  song: two verses and a chorus is plenty. Play it on any instrument, a free
  piano app, a karaoke backing track, or just sing it with no music at all.
  Then build a stage out of a lamp and a blanket and take turns performing.
  The audience has to demand an encore of the best line.
steps:
  - Your lyric sheet, scribbles and all
  - The homemade stage
  - Your partner mid-chorus
  - The encore bow
