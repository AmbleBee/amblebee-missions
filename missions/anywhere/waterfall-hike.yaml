name: Waterfall Hike
mode: both
who: [solo, friends, family]
short: Waterfall hike. Find a waterfall trail you haven't done and have a snack at the falls.
description: >
  Pick a waterfall trail you haven't done, pack water and a snack, and take
  your time on the way up. At the falls, each guess how tall the waterfall
  is, then look it up. Have your snack where you can feel the mist. The photo
  to get: you with the whole waterfall behind you.
about: >
  Waterfalls usually run strongest in spring, during snowmelt and rainy
  season, and many shrink to a trickle by late summer. Check recent trip
  reports to see how it's flowing.

  Rocks near waterfalls are slippery even when they look dry, and the top of
  a waterfall is the most dangerous place on the trail. Stay behind fences
  and off the rocks above the falls.
