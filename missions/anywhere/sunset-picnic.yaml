name: Sunset Picnic
mode: date
short: Pack a simple picnic. Find a west-facing spot 30 min before sunset.
description: >
  Pack something easy: bread, cheese, fruit, a drink, and a blanket.
  Find a park, hill, or waterfront with a clear view west and get there
  about half an hour before sunset. Each of you brings one surprise
  snack the other doesn't know about. Stay until the first star.
duration: short
