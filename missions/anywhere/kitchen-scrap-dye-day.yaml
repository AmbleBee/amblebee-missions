name: Kitchen Scrap Dye Day
mode: both
who: [friends, family]
short: Save onion skins and avocado pits for a week, then turn them into dye and see what colors you get.
description: >
  For a week, save yellow and red onion skins, avocado pits and skins, and
  the outer leaves of a red cabbage. On dye day, simmer each scrap in its own
  pot of water (keep the avocado below a boil) and watch the colors come
  out. Pre-soak plain cotton bandanas, tea towels, or a pillowcase in hot
  water with a splash of vinegar, then fold, twist, or rubber-band them
  before they go in. Let them steep, pull them out, and guess which scrap
  made which color: onion goes golden, avocado goes peachy pink. Hang
  everything in a row to dry and pick a favorite.
steps:
  - The week's saved scraps
  - The dye pots on the stove
  - The first piece pulled out
  - Unwrapping a tied pattern
  - Everything drying in a row
