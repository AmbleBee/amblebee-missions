name: Kitchen Scrap Dye Day
mode: both
who: [friends, family]
short: Kitchen scrap dye day. Turn onion skins and avocado pits into natural dye for bandanas.
description: >
  For a week, save yellow and red onion skins, avocado pits and skins, and the
  outer leaves of a red cabbage. On dye day, simmer each scrap in its own pot
  of water (keep the avocado below a boil) and watch the colors come out. Pre-
  soak plain cotton bandanas, tea towels, or a pillowcase in hot water with a
  splash of vinegar, then fold, twist, or rubber-band them before they go in.
  Let them steep, pull them out, and guess which scrap made which color: onion
  goes golden, avocado goes peachy pink. Hang everything in a row to dry and
  pick a favorite. The photo to get: everything hanging in a row to dry, from
  palest to brightest.
about: >
  People dyed cloth with plants for thousands of years before chemical dyes
  came along. Avocado pits and skins give a surprising pink because of their
  tannins, and onion skins give gold and orange.

  Red cabbage is the science-experiment one: its color changes with acid and
  base, so a splash of vinegar turns it pinker and a pinch of baking soda
  turns it blue or green. For colors that last longer, soak the cloth in water
  with a little alum (from the spice aisle) before dyeing.
steps:
  - The week's saved scraps
  - The dye pots on the stove
  - The first piece pulled out
  - Unwrapping a tied pattern
  - Everything drying in a row
