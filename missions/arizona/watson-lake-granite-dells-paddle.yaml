short: Kayak between the granite islands, then scramble the dells on foot. Race to the best rock.
description: >
  Rent kayaks at the south boat ramp and weave through the rounded granite
  boulders and little islands of Watson Lake. Once you're back on shore, hike
  part of the Watson Lake Loop, which climbs over bare granite following white
  dots painted on the rock, with a few hands-on scrambles. Pick a high perch
  for a snack and a breather over the water. Get a group photo on top of the
  boulders with the lake behind you. Book the boats ahead, and bring plenty of
  water since there's little shade.
steps:
  - Your boats between two granite islands
  - The white dots leading up the rock
  - The whole crew on top of the boulders
