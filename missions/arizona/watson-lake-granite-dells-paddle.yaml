short: Watson Lake in Prescott. Kayak between the Granite Dells, then scramble the boulders.
description: >
  Rent kayaks and weave through the rounded granite boulders and little
  islands of Watson Lake. Back on shore, hike part of the loop that climbs
  over bare granite following white dots painted on the rock, and race to
  the best high perch for a snack. The photo to get: your crew on top of the
  boulders with the lake behind you.
about: >
  The Granite Dells are granite more than a billion years old, worn by wind
  and water into rounded knobs and stacks. Watson Lake is a reservoir,
  created when a dam went in during the early 1900s, which flooded the
  spaces between the boulders.

  The full Watson Lake Loop is a few miles with some hands-on scrambling;
  follow the painted dots. Book boats ahead, and bring plenty of water, since
  there's little shade.
steps:
  - Your boats between two granite islands
  - The white dots leading up the rock
  - The whole crew on top of the boulders
