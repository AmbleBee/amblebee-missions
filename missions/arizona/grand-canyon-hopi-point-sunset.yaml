short: Ride the shuttle to Hopi Point and watch the sun set over the Grand Canyon.
description: >
  Hopi Point sticks out into the canyon, so you can watch the light change on miles of
  cliffs and catch glimpses of the Colorado River far below. From March through November,
  ride the free Red Route shuttle from the Hermit Road Transfer Station (Hermit Road is
  closed to cars); in winter you can drive yourself. Get there early to claim a spot on
  the rim, and bring a jacket.
