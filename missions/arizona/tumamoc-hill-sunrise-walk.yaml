short: Tumamoc Hill in Tucson. Power-walk the paved climb with the locals for a view over the city.
description: >
  Join half of Tucson on the steady, paved climb up Tumamoc Hill before work.
  Set your own pace, say good morning to everyone passing, and try to beat
  your time on the way down. Up top, catch your breath at the overlook among
  the saguaros and pick out downtown, the university and the Santa Catalina
  Mountains. The photo to get: you with the city spread out below.
about: >
  Tumamoc Hill is home to the Desert Laboratory, founded in 1903, one of the
  oldest desert research stations in the world. People lived up here long
  before that: the hilltop has remains of a village and rock terraces built
  about 2,500 years ago.

  The walk is about a mile and a half up with a few steep stretches. Stay on
  the pavement and inside the overlook cables, park on Anklam Road (not the
  hospital lots), leave dogs and bikes at home, and go early in the warm
  months.
steps:
