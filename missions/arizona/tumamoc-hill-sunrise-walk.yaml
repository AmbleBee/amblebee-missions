short: Power-walk the paved road up Tumamoc Hill with the locals. Photo of Tucson from the top.
description: >
  Tumamoc Hill is a desert research preserve where all of Tucson seems to walk the steady,
  paved climb before work. It is about a mile and a half up with a few steep stretches, so
  set your own pace and say good morning to everyone passing. Up top, catch your breath
  at the overlook among the saguaros and look out over downtown, the university and the Santa Catalinas.
  Get a photo of the city spread out below you from the overlook. Stay on the pavement and inside the overlook cables,
  park on Anklam Rd (not the hospital lots), leave dogs and bikes at home, and go early in the warm months.
