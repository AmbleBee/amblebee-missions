short: Watch the boil master make the pot boil over in a burst of flame, then share the dinner.
description: >
  A Door County fish boil is dinner and a show: whitefish and potatoes boil in a big
  kettle over an open fire, and at the end the boil master throws on kerosene so the pot
  boils over in a whoosh of flame. Then everyone eats, with cherry pie after. The White
  Gull Inn holds them year-round; reserve ahead.
