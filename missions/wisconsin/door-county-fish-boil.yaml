short: Door County fish boil at the White Gull Inn in Fish Creek. Watch the flaming boil-over.
description: >
  A Door County fish boil is dinner and a show: whitefish and potatoes boil
  in a big kettle over an open fire. Each guess the exact moment of the
  boil-over, when the boil master throws on fuel and the pot erupts in a
  whoosh of flame. Then everyone eats, with cherry pie after. The photo to
  get: the two of you with the flames rising behind you.
about: >
  The fish boil came from the Scandinavian fishermen and lumberjacks who
  settled Door County: Lake Michigan whitefish and small red potatoes cooked
  in one big kettle over a wood fire, with salt as the only seasoning. The
  boil-over isn't just for show. It pushes the fishy oil and foam over the
  side, leaving the fish clean.

  The White Gull Inn in Fish Creek has held fish boils since 1959, one of the
  longest-running in Door County. Dinner comes with lemon, melted butter,
  coleslaw and homemade bread, and ends with cherry pie made from the tart
  cherries the peninsula is famous for.

  Boils run several nights a week in summer and fewer in winter, and summer
  reservations are almost always needed.
