short: Kayak up the Milwaukee River through downtown with your crew. Race to the next bridge!
description: >
  Rent kayaks from the Milwaukee Kayak Company dock in the Harbor District, across
  the river from the Historic Third Ward, where you can see the Hoan Bridge out
  toward Lake Michigan. Paddle past the confluence of the Milwaukee and Menomonee
  rivers and upriver under the downtown bridges, and keep going as long as your
  arms hold out: rentals run up to four hours, so just be back by your return time
  (save about 45 minutes for the paddle back). Make a
  game of it by racing to each bridge, with the last one in buying lunch after.
  Get a group photo from your kayaks with the city rising up on both banks. Every
  solo paddler has to be at least 12, and booking ahead is the best way to be sure
  there are enough boats for your whole group.
