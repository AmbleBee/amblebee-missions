about: >
  Looking for date ideas in Wisconsin? It's lakes, supper clubs, cheese and the Door County peninsula, plus
  Milwaukee, Madison and Janesville to explore. A fish boil in Fish Creek, with its big flare-up at the end, is
  a show and a dinner in one.
