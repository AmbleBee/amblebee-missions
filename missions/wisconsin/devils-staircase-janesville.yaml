short: Devil's Staircase in Janesville. Climb the rock steps above the Rock River on the Ice Age Trail.
description: >
  Walk the Devil's Staircase, a short and surprisingly rugged piece of the
  Ice Age National Scenic Trail on the north edge of Janesville. From the
  lot on County Road E, the path drops down a steep switchback into a rocky
  gully lined with boulders that look like giant steps, then follows a ledge
  along the limestone bluffs above the Rock River before easing out at
  Riverside Park. Turn around there for about three and a half miles round
  trip. Get a photo looking up the rock steps with the bluff beside you. The
  steps get slick and muddy in spring thaw and after rain, and parts of the
  trail run close to the edge, so check trail conditions before you go. Dogs
  are allowed only from mid-September to mid-May.
about: >
  The Ice Age National Scenic Trail follows the edge of the last glacier
  across Wisconsin for about 1,200 miles. It was named a national scenic
  trail in 1980 and is still being finished, segment by segment. Janesville
  sits at its southernmost point.

  The Devil's Staircase segment is just 1.8 miles long but one of the most
  rugged. It gets its name from a gully of big rocks that look like they were
  set as steps on purpose. The bluffs along the Rock River were shaped as the
  ice melted back, and spring brings wildflowers along the trail.
steps:
