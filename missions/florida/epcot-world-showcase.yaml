short: EPCOT's World Showcase at Disney World. Try one snack in every country, then the fireworks.
description: >
  Walk the loop of World Showcase, eleven pavilions built to look like
  countries around the world. Share one small snack or drink in every
  country, like a pretzel in Germany, a crêpe in France and a churro in
  Mexico, and rate each one out of ten. Then grab a spot by the lagoon for
  the nighttime fireworks. The photo to get: you in front of the country
  whose snack won.
about: >
  EPCOT opened in 1982. Walt Disney first imagined it as a real city of the
  future, and World Showcase became a permanent world's fair instead. Many
  of the people working in each pavilion actually come from that country, so
  ask them for their favorite snack.

  The giant silver ball at the front is Spaceship Earth. Park tickets are
  expensive; buy ahead and check park hours. The loop is about a mile and a
  quarter around.
