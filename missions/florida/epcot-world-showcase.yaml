short: Walk around EPCOT's World Showcase and try one snack in every country. Stay for the fireworks.
description: >
  Walk the loop of World Showcase at EPCOT, eleven pavilions built to look
  like countries around the world. Make it a mission: share one small snack
  or drink in every country, like a pretzel in Germany, a crêpe in France and
  a churro in Mexico, and rate each one. Then grab a spot by the lagoon for
  the nighttime fireworks show. Get a photo of the two of you in front of your
  favorite country. Park tickets are expensive; buy ahead and check park hours.
for_kids:
