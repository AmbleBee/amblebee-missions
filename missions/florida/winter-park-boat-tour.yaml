short: Winter Park Scenic Boat Tour. Cruise the lakes and narrow canals, then stroll Park Avenue.
description: >
  Take an hour-long pontoon tour through three lakes connected by narrow,
  overgrown canals, past grand old lakefront mansions and Rollins College.
  Each pick the house you'd live in, and watch for herons, turtles and maybe
  an alligator. The photo to get: you on the boat in one of the narrow
  canals. Afterward, walk Park Avenue's shops and cafés.
about: >
  The Scenic Boat Tour has run since January 1, 1938, back when Winter Park
  billed itself as the Venice of America. The pontoon boats carry about 25
  people through Lakes Osceola, Virginia and Maitland, past Kraft Azalea
  Gardens and the Isle of Sicily, and some of the canals between the lakes are
  barely wider than the boat.

  Rollins College, which you'll see from the water, was founded in 1885 and is
  the oldest recognized college in Florida. The captains narrate the history
  of the houses, so sit near the front.
