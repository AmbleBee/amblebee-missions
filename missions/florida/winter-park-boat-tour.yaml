short: Winter Park Scenic Boat Tour. Cruise the lakes and narrow canals, then stroll Park Avenue.
description: >
  Take an hour-long pontoon tour through three lakes connected by narrow,
  overgrown canals, past grand old lakefront mansions and Rollins College.
  Each pick the house you'd live in, and watch for herons, turtles and maybe
  an alligator. The photo to get: you on the boat in one of the narrow
  canals. Afterward, walk Park Avenue's shops and cafés.
about: >
  The boat tour has run since the 1930s. The canals between the lakes were
  dug in the 1800s to float logs, and some are barely wider than the boat.

  Rollins College, which you'll see from the water, was founded in 1885 and
  is the oldest recognized college in Florida. The captains narrate the
  history of the houses, so sit near the front.
