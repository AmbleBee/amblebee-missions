short: Cruise the lakes and narrow canals of Winter Park, then stroll Park Avenue.
description: >
  Take an hour-long pontoon boat tour through three lakes in Winter Park,
  connected by narrow, overgrown canals, past grand old lakefront mansions,
  Rollins College and huge cypress trees. Watch for herons, turtles and maybe
  an alligator. Afterward, walk Park Avenue's shops and cafés, and get a photo
  of you on the boat in one of the canals. The tour has run for
  over 80 years.
