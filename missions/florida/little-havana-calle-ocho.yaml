short: Calle Ocho in Little Havana, Miami. Sip a cafecito, watch the domino games, find the roosters.
description: >
  Walk Calle Ocho, the heart of Miami's Cuban community. Order a tiny, sweet
  cafecito from a walk-up coffee window, then watch the regulars slap down
  tiles at Domino Park. Try a guava pastelito, watch cigars being rolled by
  hand, and each count the painted rooster statues along the street. The
  photo to get: you under the most colorful rooster you find.
about: >
  Domino Park's official name is Máximo Gómez Park, after a hero of Cuba's
  fight for independence. Most of the players are longtime regulars, so
  watch from the edge and enjoy the trash talk.

  The rooster statues are a public art project, each painted by a different
  artist. Look down too: the sidewalk Walk of Fame has stars for Latin music
  legends like Celia Cruz and Gloria Estefan. In the evening, live music
  spills out of the bars, and every March the street turns into one of the
  biggest block parties in the country, the Calle Ocho Festival.
