short: See Florida's tallest waterfall drop 73 feet into a mysterious sinkhole at Falling Waters.
description: >
  Walk the boardwalk through a forest of sinkholes to Florida's tallest
  waterfall, a 73-foot ribbon of water plunging into a deep cylindrical
  sinkhole, where it disappears into a cave and nobody knows exactly where it
  goes. Look down into the other sinkholes along the trail, too. Each guess
  where the water goes. Get a photo of the two of you on the overlook. The
  falls are strongest after rain; in dry spells they can slow to a trickle.
