short: Ginnie Springs in High Springs. Swim in impossibly blue springs, then tube the Santa Fe River.
description: >
  Swim in a series of shockingly blue, crystal-clear springs in the woods,
  then float an inner tube down the Santa Fe River between them. Swim over
  the Devil's Eye spring vent and see who can spot a cave diver disappearing
  below first. Bring snorkel masks to see the fish. The photo to get: you on
  the dock over the blue water.
about: >
  Ginnie Springs is famous among cave divers around the world. In 1974,
  Jacques Cousteau said its water had "visibility forever," and it still runs
  about 200 feet clear at around 72 degrees all year, pouring some 35 million
  gallons a day into the Santa Fe River.

  Along the river, the Devil's Spring system (Little Devil, Devil's Eye and
  Devil's Ear) leads into more than 30,000 feet of mapped underwater cave.
  Snorkelers can look down into the Devil's Eye from the surface, but the
  caves are for trained cave divers only. It's privately owned, with an entry
  fee, so go on a weekday to skip the weekend party crowds.
