short: Ginnie Springs in High Springs. Swim in impossibly blue springs, then tube the Santa Fe River.
description: >
  Swim in a series of shockingly blue, crystal-clear springs in the woods,
  then float an inner tube down the Santa Fe River between them. Swim over
  the Devil's Eye spring vent and see who can spot a cave diver disappearing
  below first. Bring snorkel masks to see the fish. The photo to get: you on
  the dock over the blue water.
about: >
  Ginnie Springs is famous among divers around the world for its underwater
  caves and clear water. Jacques Cousteau is often quoted praising its
  visibility. The springs stay about 72 degrees all year.

  It's privately owned, with an entry fee. Go on a weekday to avoid the big
  weekend party crowds.
