short: Swim in the impossibly blue springs at Ginnie Springs, then float the Santa Fe River.
description: >
  Spend the day swimming in a series of shockingly blue, crystal-clear
  springs in the woods, staying about 72 degrees all year. Swim over the
  Devil's Eye spring vent, watch cave divers disappear below, and float in an
  inner tube down the Santa Fe River between springs. Bring snorkel masks to
  see the fish. Get a photo of the two of you on the dock over the blue water.
  It's privately owned, with an entry fee; go on a weekday to avoid the big
  weekend party crowds.
