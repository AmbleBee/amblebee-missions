short: The Ringling in Sarasota. Circus king John Ringling's art museum, mansion and circus museum.
description: >
  Spend a day at the estate of circus king John Ringling on Sarasota Bay.
  See his huge art museum full of giant Baroque paintings around a courtyard of
  statues, tour Ca' d'Zan, his Venetian Gothic mansion on the water, and visit
  the Circus Museum with a giant miniature model of an entire circus. Walk the
  rose garden and the banyan trees. Pick your favorite part of the tiny
  circus. On Mondays, the art museum and gardens are free. Get a photo of you
  on the mansion's waterfront terrace.
about: >
  John Ringling, one of the Ringling brothers of circus fame, made Sarasota
  his circus's winter home and built his 56-room mansion, Ca' d'Zan ("House
  of John" in Venetian dialect), between 1924 and 1926. He left the whole
  estate and his art collection to the people of Florida when he died.

  The Circus Museum has the Howard Bros. Circus model, billed as the world's
  largest miniature circus, with more than 44,000 pieces built by one man,
  Howard Tibbals, over 50 years. The art museum is known for its giant
  paintings by Peter Paul Rubens.
