short: Explore circus king John Ringling's art museum, his Venetian mansion and the circus museum.
description: >
  Spend a day at the estate of circus king John Ringling on Sarasota Bay.
  See his huge art museum full of giant Baroque paintings around a courtyard of
  statues, tour Ca' d'Zan, his Venetian Gothic mansion on the water, and visit
  the Circus Museum with a giant miniature model of an entire circus. Walk the
  rose garden and the banyan trees. Each pick your favorite part of the circus.
  Get a photo of the two of you on the mansion's waterfront terrace.
