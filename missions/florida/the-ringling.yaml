short: The Ringling in Sarasota. Circus king John Ringling's art museum, mansion and circus museum.
description: >
  Spend a day at the estate of circus king John Ringling on Sarasota Bay.
  See his huge art museum full of giant Baroque paintings around a courtyard of
  statues, tour Ca' d'Zan, his Venetian Gothic mansion on the water, and visit
  the Circus Museum with a giant miniature model of an entire circus. Walk the
  rose garden and the banyan trees. Each pick your favorite part of the circus.
  Get a photo of you on the mansion's waterfront terrace.
about: >
  John Ringling, one of the five Ringling brothers of circus fame, built his
  mansion, Ca' d'Zan ("House of John" in Venetian dialect), in the 1920s.
  He left the whole estate and his art collection to the state of Florida
  when he died.

  The Circus Museum has the Howard Bros. Circus model, one of the largest
  miniature circuses in the world, with tens of thousands of tiny pieces.
  The art museum is known for its giant paintings by Peter Paul Rubens.
