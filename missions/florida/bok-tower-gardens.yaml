short: Hear the bells ring from Bok Tower, a pink marble tower on one of Florida's highest hills.
description: >
  Walk through shady gardens up to a pink-and-gray marble tower that rises
  205 feet above one of the highest points in the Florida peninsula. Find a
  spot on the lawn by the reflecting pool with the swans, and listen to the
  live carillon concert, when bells in the tower play music across the
  gardens. Each find your favorite carving on the tower. Get a photo of the
  two of you with the tower reflected in the pool behind you.
