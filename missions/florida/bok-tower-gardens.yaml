short: Bok Tower Gardens in Lake Wales. Hear the carillon bells ring from a pink marble tower.
description: >
  Walk through shady gardens up to a pink-and-gray marble tower rising over
  the treetops. Find a spot on the lawn by the reflecting pool with the
  swans and listen to the live carillon concert, when the tower's bells play
  music across the gardens. Each try to name the tune before it ends. The
  photo to get: you with the tower reflected in the pool behind you.
about: >
  Edward Bok, a Dutch-born magazine editor, built the tower and gardens as a
  gift to the American people, and President Coolidge dedicated it in 1929.
  The gardens were designed by Frederick Law Olmsted Jr., son of the designer
  of New York's Central Park. Bok is buried at the foot of the tower.

  The tower sits on Iron Mountain, one of the highest points on the Florida
  peninsula, and its carillon has 60 bells. Check the website for concert
  times.
for_kids:
