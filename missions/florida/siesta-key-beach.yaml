short: Walk barefoot on Siesta Key's powder-white quartz sand, which stays cool even in the sun.
description: >
  Spend a day at Siesta Beach, famous for sand made of almost pure quartz, so
  soft and white it squeaks under your feet and stays cool even on hot days.
  Wade into the calm, shallow Gulf water, build a sandcastle together, and
  walk the shore looking for shells and dolphins offshore. On Sunday evenings,
  look for the drum circle near the beach. Get a photo of you on
  the white sand. Arrive early, since parking fills up.
