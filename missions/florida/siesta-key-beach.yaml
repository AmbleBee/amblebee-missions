  coords: [27.26600, -82.55300]  # APPROX: set at the main beach parking before publishing
short: Siesta Key Beach in Sarasota. Walk on powder-white quartz sand that stays cool in the sun.
description: >
  Spend a day on sand so soft and white it squeaks under your feet. Wade
  into the calm, shallow Gulf water, build the best sandcastle you can
  together, and walk the shore looking for shells and dolphins offshore. The
  photo to get: you on the white sand with the blue water behind you.
about: >
  Siesta Beach's sand is almost pure quartz, ground fine over thousands of
  years, so it reflects the sun and stays cool even on hot days. It has been
  named the best beach in America more than once on a well-known yearly
  list.

  On Sunday evenings, look for the drum circle near the beach, a local
  tradition for decades. Arrive early, since parking fills up.
