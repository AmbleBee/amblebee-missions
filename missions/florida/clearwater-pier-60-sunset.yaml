short: Sunsets at Pier 60 in Clearwater Beach. Watch the sun set over the Gulf at the nightly festival.
description: >
  Spend the evening on Clearwater Beach's soft white sand, then walk to Pier
  60 for the nightly sunset festival, with street performers, artists and
  food vendors. Each pick a performer to tip, and see whose pick draws the
  bigger crowd. As the sun drops into the Gulf, walk out on the pier with
  everyone. The photo to get: you on the pier with the sunset behind you.
about: >
  Clearwater Beach has been named one of the best beaches in the country
  many times, known for its soft, sugar-white sand. Sunsets at Pier 60 has
  run for decades and happens nearly every night, weather permitting.

  Bring a blanket and some small bills for the performers, and stay after
  the sun goes down for the sky to turn pink.
