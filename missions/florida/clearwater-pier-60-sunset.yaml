short: Watch the sun set over the Gulf from Clearwater Beach during the nightly Pier 60 festival.
description: >
  Spend the evening at Clearwater Beach, with its soft white sand, then walk
  to Pier 60 for Sunsets at Pier 60, a nightly festival with street
  performers, artists and food vendors. As the sun drops into the Gulf, walk
  out on the pier with everyone, or find a spot on the sand. Bring a blanket,
  and stay for the sky to turn pink. Get a photo of the two of you on the pier
  with the sunset behind you.
