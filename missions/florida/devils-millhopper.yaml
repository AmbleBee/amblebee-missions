short: Walk down 132 steps into Devil's Millhopper, a giant sinkhole full of a hidden rainforest.
description: >
  Walk down a wooden staircase 120 feet into a giant bowl-shaped sinkhole,
  where little waterfalls trickle down the walls and the air turns cool and
  damp. The bottom feels like a miniature rainforest, with ferns and plants
  you'd expect in the mountains, and fossil shark teeth have been found in the
  walls. Count the steps together on the way down. Get a photo of the two of
  you at the bottom looking up. It's a short visit, perfect with a day in
  Gainesville.
for_kids:
  short: Sinkhole hunt! Find each thing.
  steps:
    - Count the stairs
    - A little waterfall
    - A big fern
    - A frog or lizard
    - A selfie at the bottom!
