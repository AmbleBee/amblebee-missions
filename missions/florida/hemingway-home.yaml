short: Hemingway Home in Key West. Tour the writer's house and meet the six-toed cats.
description: >
  Tour the house where Ernest Hemingway lived and wrote in the 1930s, with
  his writing studio, his big pool and treasures from his travels. Meet the
  dozens of cats that roam the house and gardens, many with six toes. Each
  count the toes on as many cats as you can, and see who finds the most.
  The photo to get: you with a cat on the porch.
about: >
  Hemingway lived here from 1931 to 1939 and wrote some of his best-known
  work in the studio out back. The pool was the first in Key West. The
  story goes that it cost so much that Hemingway pressed a penny into the
  wet concrete, saying they'd taken his last one. Look for it near the pool.

  About 60 cats live on the grounds, and many are polydactyl, with extra
  toes. They're said to descend from a six-toed cat named Snow White, given
  to Hemingway by a ship's captain. The museum has been cash only at times,
  so bring some just in case.
