short: Wekiwa Springs near Apopka. Paddle the clear spring river through wild Florida, then swim.
description: >
  Rent a canoe or kayak at the spring and paddle down the clear, spring-fed
  Wekiwa River, winding through cypress swamps and palm hammocks. Keep a
  count of turtles stacked on logs, and see who spots the first alligator
  sunning on the bank. Then swim in the cool spring basin. The photo to get:
  you in the boat on the clear water.
about: >
  "Wekiwa" comes from a Creek word for a spring. The spring pumps about 42
  million gallons of water a day into the Wekiva River, a National Wild and
  Scenic River, and stays around 72 degrees all year.

  The park covers about 7,000 acres just north of Orlando, home to black
  bears, deer, otters, bobcats and two tiny snails found nowhere else on
  Earth. It often fills up on weekends, so arrive right when it opens.
