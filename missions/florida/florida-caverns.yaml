short: Tour Florida's only public dry cave at Florida Caverns, full of stalactites and flowstone.
description: >
  Take a guided ranger tour through Florida's only cave open to the public for
  walking tours, under the Panhandle hills. Duck through narrow passages
  into rooms full of stalactites, stalagmites, soda straws and flowstone
  formations. Each find a formation that looks like something and name it.
  Get a photo of you in one of the big rooms. Tours run daily but
  sell out on weekends, so arrive early or reserve online. It's cool and
  damp inside, so bring a light jacket.
for_kids:
