short: Florida Caverns State Park in Marianna. Tour Florida's only walk-through cave.
description: >
  Take a guided ranger tour through Florida's only cave open to the public for
  walking tours, under the Panhandle hills. Duck through narrow passages
  into rooms full of stalactites, stalagmites, soda straws and flowstone
  formations. Each find a formation that looks like something and name it.
  Get a photo of you in one of the big rooms. Tours run daily but
  sell out on weekends, so arrive early or reserve online. It's cool and
  damp inside, so bring a light jacket.
about: >
  In the 1930s, workers from the Civilian Conservation Corps dug out some of
  the cave's passages by hand to make room for tours, and the park opened in
  1942. The formations formed over thousands of years as rainwater dripped
  through the limestone.

  It's cool and damp inside year-round, so bring a light jacket. Tours sell
  out on weekends, so arrive early or reserve online. The Chipola River
  runs through the park, with a spring-fed swimming area.
for_kids:
