short: Paddle the clear, shallow water of Biscayne National Park through the mangroves in the morning.
description: >
  Ninety-five percent of Biscayne National Park is water, so paddle it. Rent
  a canoe or kayak at Convoy Point in the calm morning and paddle the
  shoreline along the mangroves, looking down into the clear, shallow water
  for fish, sea stars and maybe a manatee. Watch the pelicans dive, and stop
  for a snack on the water with the Miami skyline far in the distance. Get a
  photo of the two of you in the boat. Check the wind before going, and ask
  about the park's island boat trips too.
