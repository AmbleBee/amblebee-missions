short: Biscayne National Park near Homestead. Paddle the clear, shallow water along the mangroves.
description: >
  Rent a canoe or kayak at Convoy Point in the calm morning and paddle
  along the mangroves, looking down into the clear, shallow water for fish,
  sea stars and maybe a manatee. Keep a count of every diving pelican you
  see. Stop for a snack on the water with the Miami skyline far in the
  distance. The photo to get: you in the boat among the mangroves.
about: >
  About 95 percent of Biscayne National Park is underwater, which makes it
  one of the few national parks you really need a boat to see. It protects
  part of the only living coral reef in the continental U.S., along with
  mangrove shorelines and dozens of little islands.

  Ask at the visitor center about the park's island boat trips, to places
  like Boca Chita Key and its little lighthouse. Check the wind before you
  paddle.
