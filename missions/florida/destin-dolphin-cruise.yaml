short: Destin sunset dolphin cruise. Head out from the harbor and count dolphins in the wake.
description: >
  Board a sunset cruise from the Destin Harbor Boardwalk and head out past
  Crab Island into the emerald water, where wild bottlenose dolphins often
  play in the boat's wake. Each keep a dolphin count and see who spots more.
  Then watch the sun go down over the water. The photo to get: you at the
  rail at sunset.
about: >
  Destin calls itself "the World's Luckiest Fishing Village," and its harbor
  is full of fishing boats and seafood spots. Crab Island, which you'll pass,
  is a shallow sandbar where boats anchor on summer days and people wade in
  the water.

  Feeding or swimming with wild dolphins is against federal law, so enjoy
  them from the boat. Several companies run cruises; book ahead in summer.
