short: Take a sunset dolphin cruise out of Destin Harbor and count the dolphins around the boat.
description: >
  Board a sunset cruise from the Destin Harbor Boardwalk and head out past
  Crab Island into the emerald water of Choctawhatchee Bay and the Gulf,
  where wild bottlenose dolphins often play in the boat's wake. Count the
  dolphins together, then watch the sun go down over the water. Walk the
  boardwalk for seafood when you get back. Get a photo of the two of you at the
  rail at sunset. Several companies run cruises; book ahead in summer.
