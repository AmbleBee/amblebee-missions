short: Bike the path along 30A through pastel beach towns, and grab lunch at Seaside's Airstream row.
description: >
  Rent beach cruisers and ride the paved path along Scenic Highway 30A, past
  pastel beach towns, coastal dune lakes and pine forests. Stop in Seaside,
  the little town where The Truman Show was filmed, for lunch from the row of
  vintage Airstream food trailers. Ride on to Grayton Beach, swim in the
  emerald Gulf, and look for the rare coastal dune lakes. Get a photo of the
  two of you on your bikes in Seaside's town square.
