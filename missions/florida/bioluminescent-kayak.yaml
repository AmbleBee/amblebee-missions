short: Bioluminescent kayak tour on the Indian River Lagoon. Every paddle stroke glows blue.
description: >
  Join a guided night kayak tour on the Indian River Lagoon in summer, when
  tiny glowing plankton light up the water. Every paddle stroke swirls bright
  blue-green, fish streak by like glowing comets, and if you're lucky a
  manatee glides past leaving a glowing trail. Splash your hand in the water
  and watch it sparkle. It's hard to photograph, so just take it in together.
  Go on a dark, new-moon night. The glow is strongest roughly June through
  September; book ahead.
about: >
  In summer, the glow comes from tiny plankton called dinoflagellates that
  flash blue-green when the water is disturbed. In cooler months, tours
  sometimes find comb jellies, which glow too and don't sting.

  The Indian River Lagoon is one of the most diverse estuaries in North
  America, and manatees and dolphins live here year-round. The darker the
  night, the brighter the glow, so pick a new-moon night. Photos rarely
  capture it, so take it in together.
