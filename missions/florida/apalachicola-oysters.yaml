short: Apalachicola oysters on the Forgotten Coast. Slurp Gulf oysters, then a sunset waterfront walk.
description: >
  Walk the historic downtown of an old cotton and oyster port, with its
  brick buildings and shrimp boats, then order a dozen oysters, raw and
  baked, at a waterfront oyster bar. Each try one topping you've never had
  and rate them. Walk the riverfront at sunset. The photo to get: the two of
  you with the shrimp boats behind you.
about: >
  Apalachicola Bay once produced most of Florida's oysters. The wild harvest
  was closed for five years to let the beds recover, and it came back in 2026
  with only a short, limited season (roughly October to February), so ask
  whether your oysters are wild or farmed.

  The town has a surprising claim to fame: in the 1840s, local doctor John
  Gorrie invented a machine to make ice and cool rooms for fever patients, an
  early step toward air conditioning. A small museum tells his story.
