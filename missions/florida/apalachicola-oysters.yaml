short: Slurp Gulf oysters in old Apalachicola, then walk the waterfront at sunset.
description: >
  Spend an afternoon and evening in Apalachicola, a sleepy old cotton and
  oyster port on Florida's Forgotten Coast. Walk the historic downtown with
  its brick buildings and shrimp boats, then order a dozen Gulf oysters,
  raw and baked, at a waterfront oyster bar. Each try one topping you've never
  had, and rate them. The bay's famous wild oysters came back in 2026 after a
  five-year closure, but only in a short, limited season (roughly October to
  February), so ask whether they're wild or farmed. Walk the riverfront at
  sunset and get a photo of the two of you with the shrimp boats.
