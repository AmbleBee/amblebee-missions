short: Corkscrew Swamp Sanctuary near Naples. Walk the boardwalk through ancient bald cypress forest.
description: >
  Walk the long boardwalk through an ancient bald cypress forest early in
  the morning, when the birds are most active. Look for alligators in the
  lettuce lakes, and keep a list of every bird you spot. Stop and stay quiet
  for one full minute to hear the swamp. The photo to get: you under the
  giant cypress trees.
about: >
  Corkscrew protects the largest old-growth bald cypress forest left in
  North America, with trees about 500 years old. The National Audubon
  Society has protected it since the 1950s, and it's long been home to one of
  the country's biggest nesting colonies of wood storks.

  Bring binoculars: in some summers, a rare ghost orchid blooms high in a
  cypress here. The boardwalk is about two and a quarter miles.
for_kids:
