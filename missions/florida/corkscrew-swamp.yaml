short: Walk the boardwalk through Corkscrew Swamp's ancient bald cypress forest early in the morning.
description: >
  Walk a 2.25-mile boardwalk through the largest old-growth bald cypress forest
  left in North America, with trees 500 years old rising out of the swamp. Go
  early, when the birds are most active: herons, owls, woodpeckers and maybe
  a painted bunting. Look for alligators in the lettuce lakes, and bring
  binoculars to find the ghost orchid if it's blooming. Stop and stay quiet
  for a minute to hear the swamp. Get a photo of you under the
  giant cypress trees.
