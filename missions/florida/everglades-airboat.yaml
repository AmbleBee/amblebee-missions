short: Everglades airboat ride west of Miami. Skim across the sawgrass and look for alligators.
description: >
  Climb aboard an airboat and skim across the shallow sawgrass marsh of the
  Everglades, the giant fan roaring behind you. The captain slows down in
  the quiet spots to point out alligators, turtles and birds. Each keep a
  gator count and see who spots more. The photo to get: you on the airboat
  with the grass stretching to the horizon.
about: >
  The Everglades is often called the "River of Grass," after the 1947 book
  by Marjory Stoneman Douglas. It's really a very wide, very slow river,
  flowing south toward Florida Bay. It's also one of the only places in the
  world where alligators and crocodiles live side by side.

  Airboats aren't allowed in most of Everglades National Park, so rides run
  from family-owned operators along the Tamiami Trail. Pick one with good
  reviews and smaller boats if you can. Ear protection is provided.
