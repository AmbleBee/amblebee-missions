name: Amble Florida
region: Florida
description: Real places all over Florida, from Miami and the Keys to the Everglades, the springs, the Space Coast and the Panhandle.
icon: orange
# A longer description for this pack's own page on the website (not sent to the Hive).
about: >
  Florida has plenty of date ideas and things to do beyond the theme parks, from Miami and Key West to Orlando
  and the quiet Nature Coast. Grab Cuban coffee in Little Havana, toast the sunset at Mallory Square, wander
  Japanese gardens in Delray Beach or join a sea turtle walk at Juno Beach. Summer brings heat and afternoon
  storms, so plan outdoor missions for the morning or evening.
