short: Silver Springs in Ocala. Ride the famous glass-bottom boats over giant spring vents.
description: >
  Take a ride on the glass-bottom boats at Silver Springs, offered here since
  the 1870s, and look straight down through the floor into the deep, clear
  springs: giant fish, turtles, ancient fossils and the bubbling spring vents.
  Watch for wild rhesus monkeys along the riverbanks, descendants of monkeys
  released here in the 1930s. Each spot something at the bottom to show the
  other. Get a photo of you on the boat. Check the boat schedule
  when you arrive.
about: >
  Glass-bottom boats were invented right here in the 1870s, when someone put
  a glass window in the bottom of a rowboat. Silver Springs became one of
  Florida's first big tourist attractions, and several Tarzan movies were
  filmed along the river.

  The wild rhesus monkeys are descendants of a few monkeys that a tour boat
  operator let loose on an island in the 1930s. Watch them from the boat;
  they're wild and shouldn't be approached or fed.
