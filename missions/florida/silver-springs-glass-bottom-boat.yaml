short: Ride the famous glass-bottom boats over the giant springs at Silver Springs.
description: >
  Take a ride on the glass-bottom boats at Silver Springs, offered here since
  the 1870s, and look straight down through the floor into the deep, clear
  springs: giant fish, turtles, ancient fossils and the bubbling spring vents.
  Watch for wild rhesus monkeys along the riverbanks, descendants of monkeys
  released here in the 1930s. Each spot something at the bottom to show the
  other. Get a photo of you on the boat. Check the boat schedule
  when you arrive.
