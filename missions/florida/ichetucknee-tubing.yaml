short: Tubing the Ichetucknee in Fort White. Float a crystal-clear spring river through the forest.
description: >
  Rent tubes and float the Ichetucknee River, fed by springs so clear you
  can watch fish and swaying eelgrass below you. Drift under cypress trees,
  link up and float together, and each keep a count of turtles. Then ride
  the tram back. The photo to get: you floating with the clear water all
  around.
about: >
  The Ichetucknee is fed by a chain of springs and stays about 72 degrees
  all year. It's a National Natural Landmark, and the park limits how many
  people can float each day to protect the eelgrass.

  No food, disposable bottles or alcohol on the river. Tubing season mostly
  runs in late spring and summer, and the park fills early on hot weekends.
