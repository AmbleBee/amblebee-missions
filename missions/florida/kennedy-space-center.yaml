short: Kennedy Space Center on the Space Coast. Stand under Space Shuttle Atlantis and a Saturn V.
description: >
  See the real Space Shuttle Atlantis, tilted as if it's in orbit, walk under
  a giant Saturn V moon rocket, and take the bus tour out past the launch
  pads. Try the shuttle launch simulator together and each pick the mission
  you'd sign up for. The photo to get: you in front of Atlantis.
about: >
  Atlantis flew the last space shuttle mission in 2011 and is displayed with
  its payload bay doors open, as if it just left the space station. The
  Vehicle Assembly Building, which you pass on the bus tour, is one of the
  biggest buildings in the world by volume, and its painted American flag
  is huge.

  Check the launch schedule before you go; you might catch a real launch.
  Buy tickets ahead.
for_kids:
