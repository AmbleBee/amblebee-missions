short: Stand under the real Space Shuttle Atlantis and a Saturn V rocket at Kennedy Space Center.
description: >
  Spend the day where America launches into space. See the real Space Shuttle
  Atlantis, tilted as if it's in orbit, walk under a giant Saturn V moon
  rocket, and take the bus tour out past the launch pads and the huge Vehicle
  Assembly Building. Try the shuttle launch simulator together and each pick
  the mission you'd sign up for. Get a photo of the two of you in front of
  Atlantis. Buy tickets ahead, and check the launch schedule; you might catch
  a real one.
