short: Tour Thomas Edison's and Henry Ford's side-by-side winter homes and Edison's lab in Fort Myers.
description: >
  Explore the riverfront winter homes of Thomas Edison and his friend Henry
  Ford, side by side in Fort Myers. Walk through Edison's lab, still full
  of his bottles and equipment, the museum of his inventions, and the
  gardens with a giant banyan tree that Edison planted. Each pick the
  invention you couldn't live without. Get a photo of the two of you under
  the enormous banyan tree. Buy tickets ahead in winter.
for_kids:
