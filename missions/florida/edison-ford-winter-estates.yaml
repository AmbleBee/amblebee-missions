short: Edison and Ford Winter Estates in Fort Myers. Tour the inventors' homes and Edison's lab.
description: >
  Explore the riverfront winter homes of Thomas Edison and his friend Henry
  Ford, side by side. Walk through Edison's lab, still full of his bottles
  and equipment, then the museum of his inventions. Each pick the invention
  you couldn't live without and defend it. The photo to get: you under the
  enormous banyan tree.
about: >
  Edison bought land here in 1885 and wintered in Fort Myers for decades.
  Ford bought the house next door in 1916. In the late 1920s, Edison, Ford
  and tire maker Harvey Firestone teamed up in this lab to search for a
  plant that could make rubber in America. Edison tested thousands of
  plants and settled on goldenrod.

  The banyan tree, a gift from Firestone, was planted in the 1920s and is
  now one of the largest in the continental U.S. Buy tickets ahead in
  winter.
