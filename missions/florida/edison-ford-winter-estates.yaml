short: Edison and Ford Winter Estates in Fort Myers. Tour the inventors' homes and Edison's lab.
description: >
  Explore the riverfront winter homes of Thomas Edison and his friend Henry
  Ford, side by side. Walk through Edison's lab, still full of his bottles
  and equipment, then the museum of his inventions. Pick the invention you
  couldn't live without, and if you're with others, defend it. The photo to
  get: you under the enormous banyan tree.
about: >
  Edison bought land here in 1885 and wintered in Fort Myers for decades.
  Ford bought the house next door in 1916. In the late 1920s, Edison, Ford
  and tire maker Harvey Firestone teamed up in this lab to search for a
  plant that could make rubber in America. Edison tested thousands of
  plants and settled on goldenrod, and the lab is now a National Historic
  Chemical Landmark.

  The banyan tree, a gift from Firestone in 1925, spreads about 400 feet
  around and is one of the largest in the continental U.S. A regular ticket
  covers the gardens, museum and lab, and you see the homes from outside;
  going inside them takes a separate guided tour for ages 7 and up. Buy
  tickets ahead in winter.
