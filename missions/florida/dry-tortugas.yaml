short: Take the early ferry 70 miles out to Fort Jefferson in Dry Tortugas National Park.
description: >
  Catch the early-morning ferry from Key West, 70 miles out across open water
  to the Dry Tortugas, a cluster of tiny islands and one of the most remote
  national parks in the country. Explore Fort Jefferson, a giant brick fort
  from the 1800s rising out of the turquoise water, then snorkel right off
  the beach along the moat wall to see coral, fish and maybe a nurse shark.
  Get a photo of the two of you on top of the fort walls. The ferry includes
  breakfast, lunch and snorkel gear; book weeks ahead.
