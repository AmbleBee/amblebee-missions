short: Dry Tortugas National Park. Ferry 70 miles from Key West to Fort Jefferson and snorkel the moat.
description: >
  Catch the early-morning ferry from Key West across open water to the Dry
  Tortugas. Explore Fort Jefferson, a giant brick fort rising out of the
  turquoise water, then snorkel off the beach along the moat wall to see
  coral, fish and maybe a nurse shark. Each keep a list of the fish you can
  name. The photo to get: you on top of the fort walls with the sea all
  around.
about: >
  Ponce de León named the islands in 1513: "tortugas" for the sea turtles he
  found, and "dry" because there's no fresh water. Fort Jefferson was built
  from the 1840s to the 1870s with about 16 million bricks and was never
  finished. It's the largest brick masonry structure in the Americas. Dr.
  Samuel Mudd, convicted after Lincoln's assassination, was imprisoned here.

  The ferry includes breakfast, lunch and snorkel gear. Book weeks ahead.
