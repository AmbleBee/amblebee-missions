short: Wander Miami's Wynwood Walls and the blocks of giant murals around it. Find your favorite wall.
description: >
  Explore Wynwood, a neighborhood of old warehouses covered from top to bottom
  in huge, colorful murals by artists from around the world. Start at the
  Wynwood Walls, an outdoor gallery with a ticketed entry, then wander the
  surrounding streets for free, where new murals go up all the time. Each
  pick your favorite wall, and get a photo of you in front of it.
  Grab Cuban coffee or ice cream along the way. Go in the morning to beat the
  heat and the crowds.
