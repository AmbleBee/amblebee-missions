short: Wynwood Walls in Miami. Wander blocks of giant murals and each find your favorite wall.
description: >
  Explore Wynwood, a neighborhood of old warehouses covered from top to bottom
  in huge, colorful murals by artists from around the world. Start at the
  Wynwood Walls, an outdoor gallery with a ticketed entry, then wander the
  surrounding streets for free, where new murals go up all the time. Each
  pick your favorite wall, and get a photo of you in front of it.
  Grab Cuban coffee or ice cream along the way. Go in the morning to beat the
  heat and the crowds.
about: >
  Wynwood was a quiet neighborhood of warehouses until 2009, when developer
  Tony Goldman invited artists to paint the walls. Today it's one of the
  biggest outdoor street-art districts in the world.

  New murals go up all the time, especially during Art Basel Miami Beach
  every December. The Wynwood Walls itself has a ticketed entry, but the
  streets around it are free to explore. Go in the morning to beat the heat
  and crowds.
