short: Float quietly next to wild manatees on a winter morning swim in Crystal River.
description: >
  Crystal River is the only place in the U.S. where you can legally swim with
  wild manatees. On a winter morning, take a guided tour, slip into the water
  in a wetsuit, and float quietly as the gentle giants drift by in the clear
  springs. Follow the "passive observation" rules: no chasing, touching or
  diving down. Get a photo of you in your wetsuits on the boat.
  Rules are strict and may tighten, so book with a licensed operator. The
  best manatee season runs roughly November through March.
