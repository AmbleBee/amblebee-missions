short: Swim with manatees in Crystal River on a winter morning tour. Float quietly as they drift by.
description: >
  On a winter morning, take a guided tour, slip into the clear springs in a
  wetsuit, and float quietly as gentle manatees drift by. Follow the
  "passive observation" rules: no chasing, touching or diving down. Back on
  the boat, each describe your closest encounter. The photo to get: you in
  your wetsuits on the boat, still dripping.
about: >
  Crystal River is the only place in the U.S. where you can legally swim
  with wild manatees. A national wildlife refuge was created here in 1983 to
  protect them, and the manatee population has recovered enough to be moved
  from endangered to threatened.

  Manatees' closest living relatives are elephants. They gather in the
  warm springs from roughly November through March. Rules are strict and may
  tighten, so book with a licensed operator.
