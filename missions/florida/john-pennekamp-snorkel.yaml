short: John Pennekamp in Key Largo. Snorkel a living coral reef in America's first undersea park.
description: >
  Take a morning snorkel boat out to the coral reef off Key Largo and float
  over brain coral and sea fans while parrotfish, angelfish and maybe a sea
  turtle swim below. Each keep a count of the different fish you see, and
  compare on the boat ride back. The photo to get: you on the boat in your
  snorkel gear, salty and grinning. Look, don't touch: the coral is alive
  and breaks easily.
about: >
  John Pennekamp opened in 1963 as the first undersea park in the United
  States. It's named for a Miami newspaper editor who fought to protect the
  reef.

  Some trips stop at Christ of the Abyss, a bronze statue standing just
  under the surface on the reef, a copy of a famous one in Italy. Ask when
  you book if you want to see it. Book the boat ahead; trips depend on wind
  and waves.
for_kids:
  short: Reef hunt! Find each thing.
  steps:
    - A bright blue fish
    - Brain coral (it looks like a brain!)
    - A sea fan
    - A turtle or ray
    - A selfie in snorkel gear!
