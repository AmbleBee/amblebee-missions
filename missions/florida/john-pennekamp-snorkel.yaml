short: Snorkel the living coral reef off Key Largo at John Pennekamp, the first undersea park in the U.S.
description: >
  Take a morning snorkel boat from John Pennekamp, the first undersea park in
  the country, out to the coral reef off Key Largo. Float over brain coral
  and sea fans while parrotfish, angelfish and maybe a sea turtle swim
  below. Each of you keep a count of the different fish you see. Some trips
  stop at the bronze Christ of the Abyss statue, just under the surface, so
  ask when you book if you want to see it. Look, don't touch: the coral is
  alive and breaks easily. Get a photo of you on the boat in your snorkel
  gear. Book the boat ahead; trips depend on wind and waves.
for_kids:
  short: Reef hunt! Find each thing.
  steps:
    - A bright blue fish
    - Brain coral (it looks like a brain!)
    - A sea fan
    - A turtle or ray
    - A selfie in snorkel gear!
