short: Snorkel the living coral reef off Key Largo at John Pennekamp, the first undersea park in the U.S.
description: >
  Take a morning snorkel boat from John Pennekamp, the first undersea park in
  the country, out to the coral reef off Key Largo. Float over brain coral
  and sea fans while parrotfish, angelfish and maybe a sea turtle swim
  below. Each keep a count of the different fish you see. On a deeper trip,
  you can see the bronze Christ of the Abyss statue underwater. Get a photo
  of you on the boat in your snorkel gear. Book the boat ahead;
  trips depend on wind and waves.
for_kids:
