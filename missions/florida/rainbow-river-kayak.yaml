short: Rainbow River in Dunnellon. Kayak a spring river so clear your boat seems to float on air.
description: >
  Paddle the Rainbow River, so clear it looks like your kayak is floating on
  air. Look down at the eelgrass, turtles, schools of fish and bubbling
  springs on the bottom, and keep a turtle count; whoever spots the most
  picks lunch. Paddle up to the headspring. The photo to get: you in the boat
  over the clear water.
about: >
  Rainbow Springs is one of Florida's biggest springs, pouring out hundreds
  of millions of gallons of water a day at about 72 degrees. In the 1930s it
  was a roadside attraction, with glass-bottom boats and man-made waterfalls
  that you can still visit in the park today.

  Go early on weekends, since it gets busy. No disposable food or drink
  containers are allowed on the river.
