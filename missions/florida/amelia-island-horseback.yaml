short: Horseback riding on the beach at Amelia Island, one of the few Florida beaches that allow it.
description: >
  Follow a guide on a gentle trail ride through maritime forest and out
  onto the sand, then walk the horses along the edge of the surf. No
  experience needed. See who spots the first dolphin in the inlet. The photo
  to get: you on horseback with the ocean behind you.
about: >
  Amelia Island is called the "Isle of Eight Flags," because eight different
  flags, including French, Spanish and British, have flown over it. Fort
  Clinch, a Civil War-era brick fort, sits at the island's north end and is
  worth a stop.

  Rides go out from Amelia Island State Park at the south end of the island.
  Book ahead, and check the age and weight limits.
