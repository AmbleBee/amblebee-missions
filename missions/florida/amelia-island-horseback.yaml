short: Ride horses along the beach at Amelia Island, one of the few places in Florida you can.
description: >
  Ride horseback on the beach at Amelia Island State Park, one of the few
  places in Florida where you can. Follow a guide on a gentle trail ride
  through maritime forest and out onto the sand, then walk the horses along
  the edge of the surf. No experience needed. Watch for dolphins in the inlet
  and shorebirds on the sand. Get a photo of you on horseback with
  the ocean behind you. Book ahead, and check age and weight limits.
