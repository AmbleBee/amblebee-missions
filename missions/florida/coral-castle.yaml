short: Puzzle over Coral Castle, carved alone by one man from tons of coral rock. How did he do it?
description: >
  Visit a mysterious garden of giant stone sculptures, a moon fountain, a
  heart-shaped table and a nine-ton swinging gate, all carved out of coral
  rock by one small man working alone and mostly at night in the early 1900s.
  Nobody is sure exactly how he moved such huge stones. Listen to the
  story, and each come up with your own theory. Get a photo of the two of you
  at the giant heart-shaped table, which he made for the girl who left him.
