short: The Dalí Museum in St. Pete. Find the melting clocks and hidden images in Dalí's paintings.
description: >
  Look for melting clocks, long-legged elephants and hidden images in the
  huge masterworks, and each find a painting with something hidden in it to
  show the other. Climb the spiral staircase and walk the garden. The photo
  to get: you with the giant Dalí mustache sculpture.
about: >
  The collection began in 1942, when Ohio couple Reynolds and Eleanor Morse
  bought their first Dalí painting. They became friends with the artist and
  built one of the largest Dalí collections in the world. The museum's
  building opened in 2011, with a giant bubble of glass triangles bursting
  out of its concrete walls.

  In The Hallucinogenic Toreador, look for the hidden faces of the Venus de
  Milo. Buy timed tickets ahead.
