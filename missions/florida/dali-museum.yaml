short: Find the melting clocks and hidden images in Salvador Dalí's paintings in St. Pete.
description: >
  Explore one of the largest collections of Salvador Dalí's surreal art, in a
  building with a giant glass bubble bursting out of its concrete walls. Look
  for melting clocks, long-legged elephants and hidden images in the huge
  masterworks, and each find a painting with something hidden in it to show
  the other. Climb the spiral staircase, try the virtual-reality Dalí
  experience, and walk the garden. Get a photo of the two of you with the
  giant Dalí mustache sculpture. Buy timed tickets ahead.
