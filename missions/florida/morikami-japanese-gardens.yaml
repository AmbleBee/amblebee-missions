short: Morikami Japanese Gardens in Delray Beach. Walk the quiet paths and feed the giant koi.
description: >
  Walk the winding paths through six styles of Japanese garden around a big
  lake, with stone lanterns, waterfalls, bamboo groves and a bonsai
  collection. Stop at the rock garden and sit quietly for a few minutes,
  then feed the giant koi and see who can get the biggest one to come over.
  The photo to get: you on one of the bridges with the lake behind.
about: >
  In the early 1900s, a group of young Japanese farmers started a farming
  colony here called Yamato. Most of them eventually left, but George
  Morikami stayed, farmed his whole life, and donated his land so it could
  become a park. The museum tells the colony's story.

  The gardens are called Roji-en, "Garden of the Drops of Dew," and each
  section is inspired by a different period of Japanese garden design. The
  café overlooks the lake and is a nice spot for lunch. Check the website
  for hours, since it's closed some days.
