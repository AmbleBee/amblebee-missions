short: Walk the quiet paths of the Morikami Japanese Gardens in Delray Beach. Feed the koi.
description: >
  Walk a mile of winding paths through six Japanese garden styles around a
  big lake, with stone lanterns, waterfalls, bamboo groves and a bonsai
  collection. Stop at the rock garden and sit quietly for a few minutes
  together. Feed the giant koi, then visit the museum about the Japanese
  farming colony that once lived here. Have lunch at the café overlooking the
  lake. Get a photo of you on one of the bridges. Closed Mondays.
