  name: Casino Beach, Pensacola Beach
  area: Santa Rosa Island
  coords: [30.33300, -87.14200]  # APPROX: set at the Casino Beach parking before publishing
short: Pensacola Beach. Swim in emerald water on sugar-white sand and find the beach ball water tower.
description: >
  Spend a day on sugar-white sand with clear emerald water on the Gulf side.
  Swim, build a sandcastle, and find the giant painted beach ball water
  tower. Walk the long fishing pier and see who spots the first dolphin or
  ray. The photo to get: you on the white sand with the green water behind
  you.
about: >
  The sand is almost pure quartz, washed down from the Appalachian Mountains
  over thousands of years, which is why it's so white and squeaks under your
  feet. The fishing pier is one of the longest on the Gulf.

  For an emptier stretch, drive out into the protected dunes of Gulf Islands
  National Seashore. Watch the beach warning flags; rip currents here can be
  dangerous.
