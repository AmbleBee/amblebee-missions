short: Swim in the emerald water and sugar-white sand of Pensacola Beach. Find the giant beach ball tower.
description: >
  Spend a day on Pensacola Beach's sugar-white quartz sand, with clear emerald
  water on the Gulf side. Swim, build a sandcastle, and find the giant painted
  beach ball water tower. Walk the long fishing pier to see dolphins and
  rays, then drive out into the protected dunes of Gulf Islands National
  Seashore for an emptier stretch. Get a photo of the two of you on the white
  sand. Watch the beach warning flags.
