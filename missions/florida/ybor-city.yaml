short: Ybor City in Tampa. Watch cigars rolled by hand, then dinner and flamenco at the Columbia.
description: >
  Spend an evening in Ybor City, Tampa's historic Cuban, Spanish and Italian
  neighborhood. Watch cigars being rolled by hand on 7th Avenue, and see who
  spots the first wild chicken strutting down the sidewalk. Then have dinner
  at the Columbia Restaurant, with its tiled courtyards and a flamenco show
  on many nights. Order the 1905 Salad, tossed at the table, and share it.
  The photo to get: the two of you in the tiled dining room.
about: >
  Vicente Martinez Ybor moved his cigar factories here in the 1880s, and
  Ybor City became the cigar capital of the world, with tens of thousands of
  workers from Cuba, Spain and Italy. Cuban patriot José Martí gave speeches
  here to raise support for Cuba's independence.

  The Columbia opened in 1905 and is the oldest restaurant in Florida, still
  run by the same family. The wild chickens are protected and have roamed
  Ybor for generations. Reserve ahead.
