short: Blue Spring State Park in Orange City. Watch hundreds of manatees on a cold winter morning.
description: >
  On a cold winter morning, walk the boardwalk along the spring run and look
  down into the clear water, where hundreds of manatees float, nap and
  surface to breathe, sometimes with calves. Each count as many as you can,
  then compare with the park's official count of the day. The photo to get:
  you at the boardwalk rail with manatees in the water below.
about: >
  The spring stays around 72 degrees all year, so when the river turns cold,
  West Indian manatees crowd in to stay warm. Blue Spring is a protected
  manatee refuge. Jacques Cousteau filmed the manatees here in the 1970s,
  which helped spark efforts to protect them.

  Manatee season runs roughly mid-November to March, when swimming is
  closed. Day-use reservations are needed, so book ahead.
