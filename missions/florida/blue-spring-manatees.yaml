short: Watch hundreds of manatees in the clear water of Blue Spring on a cold winter morning.
description: >
  On a cold winter morning, hundreds of West Indian manatees crowd into the
  72-degree water of Blue Spring to stay warm. Walk the boardwalk along the
  spring run and look down into the clear water to watch them float, nap and
  surface to breathe, sometimes with calves. Each count as many as you can,
  and compare with the park's daily count. Get a photo of the two of you
  on the boardwalk. Manatee season runs mid-November to March, when swimming
  is closed. Day-use reservations are now needed, so book ahead.
