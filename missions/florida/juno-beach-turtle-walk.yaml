short: Join a night turtle walk on Juno Beach and watch a giant loggerhead lay her eggs.
description: >
  On a summer night, join a guided turtle walk from the Loggerhead Marinelife
  Center, on one of the busiest sea turtle nesting beaches in the world.
  Learn about sea turtles inside, then wait for scouts to find a nesting
  mother on the dark beach. Walk out quietly with your group and watch a
  giant loggerhead dig her nest and lay her eggs by red light. No flashlights
  or flash photos are allowed, so just take it in together. Walks run in June
  and July; registration opens May 1 and fills fast.
