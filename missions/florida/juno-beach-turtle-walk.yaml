short: Night turtle walk on Juno Beach. Watch a giant loggerhead lay her eggs under the stars.
description: >
  On a summer night, join a guided turtle walk from the Loggerhead
  Marinelife Center. Wait while scouts search the dark beach for a nesting
  mother, then walk out quietly and watch a giant loggerhead dig her nest
  and lay her eggs. No photos or lights on the beach, so just take it in
  together. The next morning, go back for your photo: you beside her
  flipper tracks in the sand.
about: >
  The beaches around Juno and Jupiter are some of the busiest loggerhead
  nesting beaches in the world. Mother turtles crawl ashore at night from
  spring through fall, and the hatchlings find the ocean by the light of
  the sky over the water. That's why lights and flash photos are off-limits.

  The Loggerhead Marinelife Center also cares for injured sea turtles, and
  you can see some of its patients during the day. Turtle walks run in June
  and July, and registration fills fast, so sign up early.
