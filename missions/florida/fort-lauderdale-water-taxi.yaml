short: Ride the Fort Lauderdale water taxi through the canals at sunset, past giant yachts and mansions.
description: >
  Buy a day pass for the water taxi and ride it through the canals of the
  "Venice of America," past giant yachts and waterfront mansions, while the
  captain tells stories about who lives where. Hop off at Las Olas for
  dinner, then catch a ride back as the sun sets and the waterfront lights
  come on. Each pick the house you'd buy. Get a photo of the two of you on the
  top deck at sunset.
for_kids:
