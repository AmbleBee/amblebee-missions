short: Fort Lauderdale water taxi at sunset. Cruise the canals past giant yachts and mansions.
description: >
  Buy a day pass for the water taxi and ride it through the canals of the
  "Venice of America," past giant yachts and waterfront mansions, while the
  captain tells stories about who lives where. Hop off at Las Olas for
  dinner, then catch a ride back as the sun sets and the waterfront lights
  come on. Each pick the house you'd buy. Get a photo of you on the
  top deck at sunset.
about: >
  Fort Lauderdale calls itself the "Venice of America," with well over a
  hundred miles of canals and waterways. It's one of the yachting capitals of
  the world, and each fall it hosts one of the biggest boat shows on Earth.

  The captains are known for their stories about who lives in the giant
  houses, so sit near the front. A day pass lets you hop on and off, so you
  can stop for dinner on Las Olas and ride back after dark.
