short: Mallory Square in Key West. Join the nightly Sunset Celebration with street performers.
description: >
  Join the nightly Sunset Celebration at Mallory Square, where the whole
  waterfront gathers to watch the sun drop into the Gulf. Come an hour early
  for the fire jugglers, tightrope walkers and trained-cat shows, and grab
  conch fritters or key lime pie on a stick. Find a spot at the edge of the
  dock, and when the sun touches the water, cheer with everyone. The photo
  to get: you with the sun right on the horizon behind you.
about: >
  The Sunset Celebration started in the 1960s, when travelers and hippies
  began gathering on the dock each evening to cheer the sunset. It grew into
  a nightly festival of street performers, artists and food carts, and it's
  still free.

  Key West sits at the southern end of the Overseas Highway, closer to Cuba
  than to Miami. Performers work for tips, so bring some small bills.
