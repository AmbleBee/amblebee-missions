short: Watch street performers and the sunset at Key West's nightly Mallory Square celebration.
description: >
  Join the nightly Sunset Celebration at Mallory Square in Key West, where the
  whole waterfront gathers to watch the sun drop into the Gulf. Street
  performers juggle fire, tightrope walkers and trained cats put on shows,
  and food carts sell conch fritters and key lime pie on a stick. Find a spot
  at the edge of the dock, and when the sun touches the water, cheer with
  everyone. Get a photo of the two of you with the sunset behind you. Come an
  hour early to see the performers.
