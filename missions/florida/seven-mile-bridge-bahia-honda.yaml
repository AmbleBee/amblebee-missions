short: Drive the Seven Mile Bridge in the Keys, then swim at Bahia Honda State Park.
description: >
  Drive the Seven Mile Bridge, which seems to float over miles of open
  turquoise water, with the old bridge running alongside. Then stop at Bahia
  Honda State Park and walk out to the overlook on the old railroad bridge.
  Each guess how far you can see, then swim in the calm, clear water. The
  photo to get: you on the beach with the old bridge behind you.
about: >
  The old bridges were part of Henry Flagler's Overseas Railroad, finished in
  1912, which ran all the way to Key West. A huge hurricane in 1935 wrecked
  the railroad, and the bridges were turned into a highway. The new Seven
  Mile Bridge opened in 1982, and the old one shows up in movies like True
  Lies.

  Bahia Honda has some of the best natural beaches in the Keys. Check what's
  open, since some areas have been rebuilt after storms.
