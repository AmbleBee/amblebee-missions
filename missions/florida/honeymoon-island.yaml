short: Honeymoon Island near Dunedin. Walk the beach and the Osprey Trail, and spot nesting ospreys.
description: >
  Spend a morning on a barrier island with miles of undeveloped Gulf beach.
  Walk the Osprey Trail through slash pines where ospreys and bald eagles
  nest, and see who spots the first nest. Then hunt for shells on the quiet
  north beach and each find the best one. The photo to get: you on the
  beach with the Gulf behind you.
about: >
  The island was once called Hog Island. A hurricane in 1921 split it in two,
  creating Honeymoon Island and Caladesi Island. In the late 1930s, a
  developer built cottages and ran a contest offering free honeymoons here,
  and the new name stuck.

  A ferry runs to Caladesi Island, often ranked among the best beaches in
  America. Check for nesting-season trail closures.
for_kids:
  short: Island hunt! Find each thing.
  steps:
    - An osprey nest
    - A seashell
    - A tall pine tree
    - A crab
    - A selfie on the beach!
