short: Lake Eola swan boats in downtown Orlando. Pedal around as the big fountain lights up at night.
description: >
  Rent a swan-shaped pedal boat and pedal around Lake Eola, past real swans
  and the city skyline. Stay into the evening, when the big fountain in the
  middle lights up in changing colors, and each guess the next color before
  it changes. The photo to get: you in the swan boat with the fountain
  glowing behind you.
about: >
  The Lake Eola fountain went up in 1957 and became the symbol of Orlando;
  it's even on the city's logo. The lake itself is a sinkhole lake, like many
  in Florida.

  Real swans of several kinds live on the lake. Walk the loop around it
  afterward, and grab dinner in the Thornton Park neighborhood nearby. On
  Sundays, a farmers market sets up along the shore.
for_kids:
