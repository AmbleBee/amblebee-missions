short: Pedal a swan boat around Lake Eola in downtown Orlando as the fountain lights up at night.
description: >
  Rent a swan-shaped pedal boat on Lake Eola in downtown Orlando and pedal
  around the lake, past real swans and the city skyline. Stay into the
  evening, when the big Linton E. Allen Memorial Fountain in the middle of the
  lake lights up in changing colors. Walk the loop around the lake afterward,
  and grab dinner in the Thornton Park neighborhood nearby. Get a photo of
  the two of you in the swan boat with the fountain glowing behind you.
for_kids:
