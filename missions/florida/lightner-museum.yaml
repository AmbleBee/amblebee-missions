short: Explore the Lightner Museum, a Gilded Age hotel with an old indoor pool turned café.
description: >
  Wander the old Alcazar Hotel, a grand 1888 Gilded Age resort built by Henry
  Flagler, now a museum full of glittering cut glass, music machines,
  Victorian treasures and oddities. Look down from the balcony into what was
  once the world's largest indoor swimming pool, now a café, and imagine the
  parties. Check the schedule for a music-machine demonstration. Each pick the
  strangest object. Get a photo of the two of you in the courtyard. Then walk
  across the street to the Flagler College building.
