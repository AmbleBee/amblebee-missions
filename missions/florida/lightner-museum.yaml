short: Lightner Museum in St. Augustine. A Gilded Age hotel whose giant indoor pool is now a café.
description: >
  Wander the old Alcazar Hotel, now a museum full of glittering cut glass,
  music machines and Victorian oddities. Look down from the balcony into what
  was once a giant indoor swimming pool, now a café, and imagine the parties.
  Each pick the strangest object in the building. The photo to get: you in
  the hotel's courtyard.
about: >
  Railroad tycoon Henry Flagler opened the Alcazar Hotel in 1888 for rich
  winter visitors. Its indoor pool was the largest in the world at the time.
  In 1946, Chicago publisher Otto Lightner bought the empty hotel to hold his
  huge collection of everything from cut glass to shrunken heads.

  Check the schedule for a demonstration of the old music machines. Across
  the street, Flagler College is in his other hotel, the Ponce de Leon, with
  famous Tiffany windows.
