short: Cedar Key on Florida's Nature Coast. Wander the old fishing village on stilts and eat clams.
description: >
  Wander Cedar Key, a tiny island fishing village that still feels like old
  Florida, with weathered buildings on stilts over the water and golf carts
  everywhere. Walk Dock Street, eat clam chowder overlooking the Gulf, and
  each count the pelicans on the pilings, then stay to watch the sky change
  over the little islands at sunset. The photo to get: you on the dock with
  the stilt buildings behind you.
about: >
  Cedar Key was once a busy port. In the 1860s it was the end of Florida's
  first railroad across the state, and later its cedar trees were cut for
  pencils until a hurricane wrecked the mills in 1896. Naturalist John Muir
  ended his famous thousand-mile walk here in 1867.

  When net fishing was banned in the 1990s, local fishermen learned to farm
  clams instead, and Cedar Key is now one of the biggest clam producers in
  the country. That's why the chowder is so good.
