short: The Florida Aquarium in Tampa. Sharks, sea turtles and otters, then the Tampa Riverwalk.
description: >
  Walk from freshwater springs and mangroves to a coral reef tank full of
  sharks, rays and sea turtles. Watch the river otters play and touch a
  stingray in the touch pool. Each pick the animal you'd want to be and do
  your best impression. The photo to get: you in front of the giant coral
  reef window. Afterward, walk the Tampa Riverwalk.
about: >
  The Florida Aquarium opened on the Tampa waterfront in 1995, under a tall
  glass atrium, and it's home to more than 7,000 plants and animals. Its
  500,000-gallon Coral Reef exhibit is the big one, with sand tiger sharks
  gliding past the window.

  Behind the scenes, its scientists work to save Florida's coral reefs, and
  they were the first to get Atlantic coral to spawn in a lab, in 2019. It's a
  great rainy-day plan. Check the daily schedule for feedings and dive shows.
