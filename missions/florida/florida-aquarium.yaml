short: See sharks, sea turtles and otters at the Florida Aquarium, then walk the Tampa Riverwalk.
description: >
  Explore an aquarium under a giant glass shell on the Tampa waterfront,
  walking from freshwater springs and mangroves to a coral reef tank full of
  sharks, rays and sea turtles. Watch the river otters play and touch a
  stingray in the touch pool. Each pick the animal you'd want to be. Get a
  photo of the two of you in front of the giant coral reef window. It's a
  great rainy-day plan.
for_kids:
  short: Aquarium hunt! Find each thing.
  steps:
    - A shark
    - A sea turtle
    - An otter
    - A stingray
    - A selfie by the big tank!
