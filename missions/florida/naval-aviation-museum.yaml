short: Walk among 150-plus historic Navy planes, including Blue Angels jets, at the Naval Aviation Museum.
description: >
  Visit one of the largest air and space museums in the world, free, on a
  working Navy base. Walk among more than 150 restored aircraft, from wooden
  biplanes to fighter jets, see four Blue Angels jets hanging in formation in
  the atrium, and climb into a cockpit. Each pick the plane you'd fly. Get a
  photo of the two of you under the Blue Angels. Without a military ID, the
  public can only get onto the base on weekends, 9 to 3, after screening at
  the visitor center with a REAL ID or passport. Arrive early.
for_kids:
