short: National Naval Aviation Museum in Pensacola. Walk among 150-plus Navy planes and Blue Angels.
description: >
  Walk among more than 150 restored aircraft at the National Naval Aviation
  Museum in Pensacola, from wooden biplanes to fighter jets, and see four Blue
  Angels jets hanging in formation in the atrium. Climb into a cockpit, and
  each pick the plane you'd fly and where you'd take it first. In season,
  check whether the Blue Angels are practicing over the base that day. The
  photo to get: you under the Blue Angels.
about: >
  Pensacola is called the "Cradle of Naval Aviation." The Navy's first air
  station opened here in 1914, and the Blue Angels have been based here since
  the 1950s. In season, you can sometimes watch them practice over the base.

  The museum is free and on a working Navy base. Without a military ID,
  visitors have had to come on set days and hours and go through screening at
  the visitor center with a REAL ID or passport, so check the museum's
  website and arrive early.
