short: Devil's Den in Williston. Snorkel inside a cave where sunbeams pour into a blue spring.
description: >
  Climb down a wooden staircase into a dry cave and into a crystal-clear blue
  spring, with sunlight pouring in through a hole in the ceiling. Snorkel in
  the warm water and look down at rock ledges where Ice Age fossils were
  found. Each try to float right in the middle of the sunbeam. The photo to
  get: you in the light beam.
about: >
  Devil's Den is a karst window: the roof of an underground cave collapsed,
  opening a hole to the sky above a spring that stays about 72 degrees all
  year. On cold mornings, the warm water sends up a plume of vapor that early
  settlers said looked like a chimney from Hell, which is how it got its name.

  The water is more than 60 feet deep. In 1960, scientists diving here found
  fossils of Ice Age animals, including mastodons, ground sloths, saber-
  toothed cats and dire wolves. Reservations are required, and snorkel gear
  rents on-site.
