short: Fort Matanzas near St. Augustine. Take the free little ferry to a tiny Spanish watchtower fort.
description: >
  Ride a small, free park ferry across the Matanzas River to a tiny Spanish
  fort that guarded the back door to St. Augustine. A ranger gives a short
  talk about the soldiers who lived here, then climb up for the view of the
  inlet and marshes. Each keep watch for dolphins and pelicans on the ride.
  The photo to get: you at the top of the fort.
about: >
  The Spanish built Fort Matanzas from coquina, a stone made of shells,
  around 1740 to 1742. "Matanzas" means "slaughters" in Spanish, after a
  grim event nearby in 1565, when Spanish soldiers killed hundreds of French
  soldiers who had surrendered.

  The ferry is first come, first served and doesn't run every day, so check
  the schedule before you go.
