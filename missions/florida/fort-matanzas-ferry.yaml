short: Fort Matanzas near St. Augustine. Take the free little ferry to a tiny Spanish watchtower fort.
description: >
  Ride a small, free park ferry across the Matanzas River to a tiny Spanish
  fort that guarded the back door to St. Augustine. A ranger gives a short
  talk about the soldiers who lived here, then climb up for the view of the
  inlet and marshes. Each keep watch for dolphins and pelicans on the ride.
  The photo to get: you at the top of the fort.
about: >
  The Spanish built Fort Matanzas from coquina, a stone made of shells,
  between 1740 and 1742, after British troops from Georgia used Matanzas Inlet
  to lay siege to St. Augustine. Its usual garrison was just one officer and
  six soldiers, and it fired on an enemy only once, driving off British boats
  in 1742.

  "Matanzas" means "slaughters" in Spanish, after 1565, when Spanish soldiers
  executed hundreds of French Huguenots who had surrendered nearby. The fort
  became a national monument in 1924. The ferry is free and first come, first
  served, and it doesn't run every day, so check the schedule before you go.
