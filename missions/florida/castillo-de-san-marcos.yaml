short: Castillo de San Marcos in St. Augustine. Explore the 1600s Spanish fort and see a cannon firing.
description: >
  Walk into a Spanish stone fort from the 1600s and explore its dark rooms,
  then climb up to the gun deck overlooking Matanzas Bay. Watch a
  cannon-firing demonstration if one is scheduled. Each find the spot you'd
  guard and explain your strategy. The photo to get: you by a cannon on the
  wall.
about: >
  The Spanish built the Castillo between 1672 and 1695, and it's the oldest
  masonry fort in the continental U.S. It's made of coquina, a soft stone
  made of tiny shells that absorbed cannonballs instead of shattering. It was
  attacked several times but never taken by force.

  St. Augustine, founded in 1565, is the oldest continuously inhabited city
  founded by Europeans in the United States. The narrow streets of the old
  town are a short walk away.
