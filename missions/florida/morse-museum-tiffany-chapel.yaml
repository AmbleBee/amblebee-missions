short: Wander a small museum full of glowing Tiffany glass and sit in his jeweled chapel.
description: >
  The Morse holds the world's biggest collection of Louis Comfort Tiffany's work: leaded-glass
  windows and lamps, jewelry, pottery and the whole glittering chapel interior he built for the
  1893 Chicago World's Fair. Take it slow, sit in the chapel for a few quiet minutes, and pick
  the one window you would take home if you could. Then step outside and stroll Park Avenue for a
  coffee in the shade of Central Park. Galleries may not allow photos, so
  get your shot out front with the museum sign before you go in. Admission is cheap, and
  Friday evenings from November through April are free.
