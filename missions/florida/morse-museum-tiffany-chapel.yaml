short: Morse Museum in Winter Park. Glowing Tiffany glass and a jeweled chapel from 1893.
description: >
  Wander rooms of glowing leaded-glass windows, lamps and jewelry, then sit
  in the jeweled Tiffany chapel for a few quiet minutes. Pick the one window
  you'd take home if you could. The photo to get: you out front with the
  museum sign. Inside, check the signs before snapping, and never use flash.
  Then stroll Park Avenue for coffee.
about: >
  The Morse holds the world's most complete collection of work by Louis
  Comfort Tiffany. Its chapel was built for the 1893 World's Fair in Chicago.
  Many pieces were saved from Tiffany's Long Island estate after a fire in
  1957 by the museum's founders, Jeannette and Hugh McKean, and the chapel
  was put back together here in 1999.

  Admission is cheap, and it's free on Friday evenings from November through
  April. Each December, the museum lights up Tiffany windows in Winter Park's
  Central Park for the free Christmas in the Park concert. Check the schedule
  before you go.
