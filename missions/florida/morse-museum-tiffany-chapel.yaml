short: Morse Museum in Winter Park. Glowing Tiffany glass and a jeweled chapel from 1893.
description: >
  Wander rooms of glowing leaded-glass windows, lamps and jewelry, then sit
  in the jeweled Tiffany chapel for a few quiet minutes. Each pick the one
  window you'd take home if you could. The photo to get: you out front with
  the museum sign, since photos aren't allowed in some galleries. Then
  stroll Park Avenue for coffee.
about: >
  The Morse holds the world's biggest collection of work by Louis Comfort
  Tiffany. Its chapel was built for the 1893 World's Fair in Chicago. Many
  pieces were saved from Tiffany's Long Island estate after a fire in 1957 by
  the museum's founders, Jeannette and Hugh McKean, and the chapel was put
  back together here in 1999.

  Admission is cheap, and the museum has had free evenings in the cooler
  months, so check the schedule.
