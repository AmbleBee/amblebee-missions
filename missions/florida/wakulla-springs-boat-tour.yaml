short: Wakulla Springs near Tallahassee. Ride the river boat past alligators in the morning mist.
description: >
  Take the ranger-led river boat tour down the Wakulla River under
  moss-draped cypress trees, and each keep a count of alligators, manatees,
  turtles and birds; whoever's count is highest picks lunch. Then eat in the
  old Spanish-style lodge, and swim in the spring in summer. The photo to
  get: you on the boat with the cypress trees behind.
about: >
  Wakulla is one of the largest and deepest freshwater springs in the world,
  well over 100 feet deep, and divers have found mastodon bones at the
  bottom. Old Tarzan movies and Creature from the Black Lagoon were filmed
  here.

  The lodge was built in 1937 by financier Edward Ball and still has its
  original painted ceilings. Boat tours run by reservation and depend on
  water clarity and weather.
