short: Tampa Theatre, a 1926 movie palace. Catch a film and get there early for the Wurlitzer.
description: >
  Grab tickets for whatever's on at the Tampa Theatre, a 1926 movie palace
  downtown with a ceiling made to look like a starry night sky over a
  Mediterranean courtyard. Pick an evening show and come early: a live
  organist usually plays the theater's Mighty Wurlitzer as it rises from the
  stage before the film. Pick up popcorn and drinks, then let the group vote
  on who gets to choose the next movie night. Get a photo of your crew under
  the stars before the lights go down.
about: >
  Architect John Eberson designed the Tampa Theatre as an "atmospheric"
  movie palace, with twinkling stars in a ceiling made to look like a night
  sky over a Mediterranean courtyard. He called it his favorite, and it's
  considered the best-preserved theater of its kind in the world. In the
  1970s it was about to be torn down until the community rallied and the
  city saved it, and it reopened in 2026 after a major restoration for its
  100th birthday.

  Its 1,400-pipe Mighty Wurlitzer played silent films here in 1926, spent
  decades in a church after talkies took over, and was brought home by
  volunteers in the 1980s. There's a ghost story too: a longtime
  projectionist named Fink Finley is said to still be keeping an eye on the
  place. Check the calendar, since the lineup mixes classics, indies and
  special events.
steps:
