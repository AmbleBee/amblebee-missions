short: Catch a film in Tampa's 1926 movie palace. Get there early for the Wurlitzer!
description: >
  Grab tickets for whatever's on at the Tampa Theatre, a 1926 movie palace
  downtown with a ceiling made to look like a starry night sky over a
  Mediterranean courtyard. Pick an evening show and come early: a live
  organist usually plays the original 1926 Mighty Wurlitzer before the film.
  Pick up popcorn and drinks, then let the group vote on who gets to choose
  the next movie night. Get a photo of your crew under the stars before the
  lights go down. The lineup mixes classics, indies and special events, so
  check the calendar first.
