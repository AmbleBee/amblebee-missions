short: Walk over a swamp full of thousands of alligators at Gatorland, the original Orlando attraction.
description: >
  Walk through the giant gator's-mouth entrance into Gatorland, a classic
  Florida attraction since 1949. Cross the boardwalk over a breeding marsh
  filled with hundreds of alligators, watch the Gator Jumparoo show where
  gators leap for food, and see rare white alligators. Brave souls can hold a
  baby gator or ride the zip line over the swamp. Each pick your favorite
  gator and give it a name. Get a photo of the two of you in the giant gator
  mouth at the entrance.
