short: Gatorland in Orlando. Walk over a swamp of alligators and watch them leap for dinner.
description: >
  Walk through the giant gator's-mouth entrance, then cross the boardwalk
  over a marsh crowded with alligators and watch the Gator Jumparoo show,
  where gators leap out of the water for food. Find the rare white
  alligators. Each pick your favorite gator and give it a name. The photo to
  get: you standing in the giant gator mouth at the entrance.
about: >
  Gatorland opened in 1949, long before the big theme parks, which makes it
  one of Orlando's original attractions. It calls itself "the Alligator
  Capital of the World," and the gator-mouth entrance has been a favorite
  photo spot for generations.

  The white alligators aren't albinos; they're leucistic, with blue eyes,
  and very rare. Brave visitors can hold a baby gator or ride a zip line
  over the swamp for an extra fee.
