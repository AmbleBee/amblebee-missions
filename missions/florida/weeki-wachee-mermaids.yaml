short: Weeki Wachee mermaid show in Spring Hill. Watch live mermaids perform underwater since 1947.
description: >
  Sit in an underwater theater set into a deep, clear spring and watch the
  famous mermaids swim, dance and even drink soda underwater, breathing from
  hidden air hoses. Each guess how long a mermaid can stay down between
  breaths. Afterward, take the riverboat cruise to look for manatees. The
  photo to get: you in front of the mermaid theater.
about: >
  Newton Perry, a former Navy diver, started the mermaid show in 1947 and
  invented the trick of breathing from a hose so performers could stay
  underwater. In the 1950s and 60s it was one of the most famous roadside
  attractions in the country.

  Weeki Wachee is so small it's known as the "City of Live Mermaids," with
  only a handful of residents. In summer you can swim at the spring's beach.
  Check the show times when you arrive.
