short: Crystal Bridges in Bentonville. Walk the wooded trails, then each pick a favorite painting.
description: >
  Start on the wooded trails around Crystal Bridges, then head into the
  galleries built over the ponds. Split up for ten minutes and each find the
  one painting you'd take home, then bring the other one to it and explain
  why. The photo to get: the two of you on a footbridge with the curved
  galleries reflected in the water behind you.
about: >
  Crystal Bridges opened in 2011, founded by Alice Walton, and general
  admission to the permanent collection is free. Architect Moshe Safdie set
  the buildings in a wooded ravine, with spring-fed ponds running beneath
  the galleries.

  The collection covers five centuries of American art, including Norman
  Rockwell's Rosie the Riveter and Asher Durand's Kindred Spirits. Out on
  the grounds, a Frank Lloyd Wright house was taken apart in New Jersey and
  rebuilt here piece by piece. Free tours of it need a timed ticket.

  There are miles of trails on the museum's grounds, with sculptures along
  the way, and paths connect to downtown Bentonville.
