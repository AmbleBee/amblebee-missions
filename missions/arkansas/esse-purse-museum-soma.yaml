short: ESSE Purse Museum in Little Rock. A century of women's lives told through their handbags.
description: >
  Spend an unhurried hour at a small museum in Little Rock's SoMa district that
  tells the story of American women decade by decade through their handbags
  and what they kept inside them. Read the little stories next to each case,
  from beaded flapper bags to 80s statement pieces, and see what's in the rotating exhibit. Choose the one bag you'd have carried in each era. Get a
  photo of your favorite purse and its contents. Afterward, browse the shop or
  wander South Main for coffee.
about: >
  ESSE tells the story of American women decade by decade through the bags
  they carried and what they kept inside them, from lipsticks and dance cards
  to cigarette cases and pagers. It's one of only a handful of purse museums
  in the world.

  The museum is on South Main Street in the SoMa neighborhood, which has
  cafés and shops within an easy walk. The photo to get: your favorite purse
  and what's inside it.
