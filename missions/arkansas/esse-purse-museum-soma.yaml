short: Walk a hundred years of women's lives through their purses. Pick the bag you'd have carried.
description: >
  Spend an unhurried hour at a small museum in Little Rock's SoMa district that
  tells the story of American women decade by decade through their handbags
  and what they kept inside them. Read the little stories next to each case,
  from beaded flapper bags to 80s statement pieces, and see what's in the rotating exhibit. Choose the one bag you'd have carried in each era. Get a
  photo of your favorite purse and its contents. Afterward, browse the shop or
  wander South Main for coffee.
