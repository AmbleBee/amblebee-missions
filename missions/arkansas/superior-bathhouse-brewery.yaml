short: Split a flight in an old bathhouse turned brewery. Toast with the hot spring water!
description: >
  Superior Bathhouse Brewery sits inside a century-old bathhouse on Bathhouse Row, right in
  Hot Springs National Park, and brews its beer with the town's thermal spring water. Grab a
  table with your crew, order a flight to share, and have everyone vote for a favorite and a
  least favorite. Then walk down the row to one of the public thermal-water fountains and
  taste the spring water straight, still warm. Get a group photo raising your glasses in
  front of the old bathhouse windows. Drinkers need to be 21 with ID.
