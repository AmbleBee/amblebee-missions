short: Ben & Jerry's Factory in Waterbury, VT. Take the tour, taste a sample, visit the Flavor Graveyard.
description: >
  Take the short factory tour, which ends with a sample of whatever's being
  made that day. Then walk up the hill to the Flavor Graveyard, where retired
  flavors get real headstones. Each pick the dead flavor you'd bring back
  and make your case. The photo to get: the two of you posing by your
  favorite headstone.
about: >
  Ben Cohen and Jerry Greenfield opened their first scoop shop in 1978 in an
  old gas station in Burlington, after taking a $5 ice cream-making course
  by mail. The Waterbury factory has been giving tours since the 1980s.

  The Flavor Graveyard has headstones with funny epitaphs for flavors that
  didn't make it. Read a few and see if you remember any. Tours can fill up
  on summer and fall weekends, so go early.
