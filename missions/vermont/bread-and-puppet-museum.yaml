short: Bread and Puppet Museum in Glover. Climb into a barn packed with giant puppets that stare back.
description: >
  Drive up to Glover in the Northeast Kingdom and wander the Bread and Puppet
  Museum, a creaky old dairy barn crammed floor to rafters with puppets, masks
  and paintings from sixty years of the theater's shows. Take your time: giant
  figures fill both floors and hang from the rafters, and there's more out in
  the woodshed, the Cheap Art bus and the Paper Mache Cathedral. Get a photo of
  you dwarfed by the tallest puppet you can find. Some of the puppets are
  spooky, so it's best for brave kids. The barn is unheated, so dress for the
  weather in the cold months, and leave a donation at the door.
about: >
  Peter and Elka Schumann founded the Bread and Puppet Theater on New York
  City's Lower East Side in 1963, and moved it to a farm in Glover in 1974.
  The name comes from the fresh bread the troupe bakes and hands out to
  audiences, served with garlic aioli.

  For almost thirty years the farm hosted Our Domestic Resurrection Circus, a
  huge outdoor pageant whose last year, 1998, drew around 30,000 people.
  Smaller shows still run on summer weekends in the outdoor amphitheater, and
  the 150-year-old hay barn has been a museum for "retired" puppets since the
  1970s.
