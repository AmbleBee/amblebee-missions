short: Climb into an old barn packed with giant puppets. Find the one staring right back at you.
description: >
  Drive up to Glover in the Northeast Kingdom and wander the Bread and Puppet
  Museum, a creaky old dairy barn crammed floor to rafters with puppets, masks
  and paintings from sixty years of the theater's shows. Take your time on
  your own: the biggest figures loom on the second floor, and there's more
  out in the woodshed and the Cheap Art bus across the road. Get a photo of
  yourself dwarfed by the tallest puppet you can find. The barn is unheated,
  so dress for the weather in the cold months, and leave the suggested
  donation at the door.
steps:
  - The barn from the road
  - The tallest puppet upstairs
  - A face that seems to watch you
  - Yourself next to a giant
