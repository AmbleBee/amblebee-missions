short: Grab a cabaret table with your crew and catch a standup show downtown. Loudest laugher buys snacks.
description: >
  Round up your friends for a show at the Vermont Comedy Club, the locally owned
  standup, improv and sketch club at the corner of Main and Pine. Get there early to hang
  out in the lounge, then grab a cabaret table in the 140-seat showroom with food and
  drinks from the bar. Pick a touring headliner or a local improv night, and agree that whoever laughs loudest buys the next round of snacks. Snap a
  group photo in the lounge before the show. Book tickets on the club's own site,
  arrive on time (more than 30 minutes late and you won't be let in), and check
  each show's age note: most are all ages but 18+ recommended.
about: >
  The Vermont Comedy Club opened in downtown Burlington in November 2015,
  started by the married couple Nathan Hartswick and Natalie Miller. More than
  1,000 people have taken its standup, improv and sketch classes, and some
  alumni now teach at Second City.

  In 2025 the founders started a nonprofit, Vermont Comedy Arts, which now
  runs the classes and the yearly Vermont's Funniest Comedian contest. Church
  Street Marketplace is a block away for dinner before or a walk after.
