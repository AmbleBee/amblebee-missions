short: Shuttle up to Rochford and pedal about 22 miles back to Hill City, through old railroad tunnels.
description: >
  Rent bikes in Hill City, book a shuttle drop-off at the Rochford trailhead, and
  spend the day pedaling the George S. Mickelson Trail back to town. This old rail
  line is crushed limestone through pine forest and over railroad bridges, and the
  ride passes three of the trail's four rock tunnels, one between Rochford and
  Mystic and two south of Mystic. It's a gentle grade but still about 22 miles of
  mixed uphill and downhill, so pack snacks and plenty of water: trail water is
  shut off in the off-season and cell coverage is spotty. Stop for a photo
  of the two of you with your bikes at the mouth of a tunnel. Book bikes and the
  shuttle ahead, and buy a daily trail pass at the trailhead.
