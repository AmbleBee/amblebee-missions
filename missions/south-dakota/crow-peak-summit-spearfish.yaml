short: Crow Peak near Spearfish. Climb 1,600 feet to the summit and earn a view into three states.
description: >
  Drive out Higgins Gulch Road from Spearfish and climb Crow Peak, a steep
  Black Hills summit that locals use as their go-to leg-burner. The lower half
  winds gently through pine forest; the upper half turns rocky and steep before
  you top out with views across the northern Black Hills and into Wyoming and
  Montana. Add the short Beaver Ridge spur if your legs still have something
  left; it fades out on an old road, so turn back there. Get a photo at the
  summit with the hills rolling out behind you, and sign the register if
  there's one. Start early: summer afternoons bring sudden thunderstorms, and
  there's no water on the trail.
about: >
  Crow Peak rises to about 5,760 feet and dominates the western skyline of
  Spearfish. Its Lakota name, Paha Karitukateyapi, means "the hill where the
  Crows were killed," from a battle the Lakota won against Crow warriors. On a
  clear day the summit looks out to Wyoming's Bearlodge Mountains, the plains
  of Montana, Terry Peak and Bear Butte.

  The trail is about 6.4 miles round trip with around 1,600 feet of climb, or
  about a mile more with the Beaver Ridge spur. Spearfish Canyon is close by
  if you still want a drive, and the town of Spearfish has good spots to eat
  after.
