short: Grind up 1,600 feet to the top of Crow Peak. Sign the summit register and earn that view.
description: >
  Drive out Higgins Gulch Road from Spearfish and climb Crow Peak, a steep
  Black Hills summit that locals use as their go-to leg-burner. The lower half
  winds gently through pine forest; the upper half turns rocky and steep before
  you top out with views across the northern Black Hills.
  Add the short Beaver Ridge spur if your legs still have something left. Sign
  the summit register and get a photo next to the wooden summit sign with the
  hills rolling out behind you. Start early: summer afternoons bring sudden
  thunderstorms, and there's no water on the trail.
steps:
  - The trailhead sign before you start
  - The first big view through the pines
  - The wooden sign at the summit
  - Your name in the summit register
