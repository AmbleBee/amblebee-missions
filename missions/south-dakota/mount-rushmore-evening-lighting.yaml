short: Mount Rushmore near Keystone. Watch the faces light up at dusk at the evening ceremony.
description: >
  Walk the Avenue of Flags at Mount Rushmore before the evening program, find
  your home state's flag, and grab seats together in the amphitheater. Rangers
  lead a short program, then the four faces light up against the dark Black
  Hills sky. Bring a jacket, since evenings get cool, and remember the
  ceremony only runs late May through September. The photo to get: the two of
  you with the lit-up carving behind you.
about: >
  Sculptor Gutzon Borglum and about 400 workers carved Mount Rushmore from
  1927 to 1941, mostly with dynamite. Each face is about 60 feet tall, and
  no workers died during the carving.

  The memorial is lit every night, but the evening ceremony runs from late
  May through September. There's no entrance fee, but there is a parking
  fee, and national park passes don't cover it.
