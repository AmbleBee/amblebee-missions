short: Watch Mount Rushmore light up at dusk at the evening ceremony in the amphitheater.
description: >
  On summer evenings, rangers hold a short program in the amphitheater below the carving,
  then the faces are lit up against the dark sky. Walk the Avenue of Flags before it
  starts and find a seat together. The memorial is lit every night, but the ceremony runs
  late May through September.
