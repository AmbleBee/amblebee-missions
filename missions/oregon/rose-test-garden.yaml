short: Wander the rose garden. Each pick the rose you'd name after the other.
description: >
  Stroll the terraces of Portland's rose garden in Washington Park, more than
  10,000 rose bushes with the city and, on a clear day, Mount Hood behind
  them. Read the name tags as you go: every rose has one, and some are
  ridiculous. Each find the rose you'd name after the other and explain why.
  Then find a quiet bench or walk up the hill toward the Japanese Garden. Best
  from late spring through summer, with the peak in June. The photo to get:
  the two of you with your namesake roses.
about: >
  Founded in 1917, this is the oldest public rose test garden in the United
  States still running. New varieties are planted here and judged before
  they go on sale, which is how Portland earned the name the City of Roses.

  It holds more than 10,000 rose bushes in hundreds of varieties. Bloom
  peaks in June, around the Rose Festival, and keeps going through summer.
  The garden is free, and the Japanese Garden is just up the hill.
