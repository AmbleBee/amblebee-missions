short: Wander the Portland Japanese Garden slowly, find the quietest spot, and sit there together.
description: >
  Take your time through the Portland Japanese Garden's ponds, moss and
  stone paths, and don't rush past the koi under Heavenly Falls. Together,
  find the spot you both agree is the most peaceful and sit there for a few
  minutes without talking. Then climb to the pavilion for the view over
  Portland toward Mount Hood, and finish with tea and something sweet at the
  Umami Café. The photo to get: the two of you on a stone path or bridge
  with the maples overhead.
about: >
  The Portland Japanese Garden opened in 1967 in the hills of Washington
  Park, designed by Professor Takuma Tono of Tokyo. In 1988 Japan's
  ambassador to the US called it "the most beautiful and authentic Japanese
  garden in the world outside of Japan." Its 12.5 acres hold five
  traditional garden styles: a flat garden, a strolling pond garden, a sand
  and stone garden, a natural garden and a tea garden. Heavenly Falls, a
  35-foot waterfall, spills into the koi pond.

  In 2017 the garden more than doubled in size with a Cultural Village
  designed by the Japanese architect Kengo Kuma, home to the Umami Café,
  where you can have green tea and Japanese sweets overlooking the hillside.
  On a clear day you can see Mount Hood from the pavilion. Fall is the most
  famous season, when a Japanese maple known simply as "The Tree" turns red,
  but quiet rainy days make the moss glow too.

  Make a day of Washington Park: the [[rose-test-garden]] is right next
  door, and [[pittock-mansion]] is just up the hill.
