short: Walk the Japanese Garden slowly. Find the quietest spot and sit there.
description: >
  Take your time through the ponds, moss and stone paths. Find the spot you both
  think is the most peaceful and sit for a few minutes without talking. Then have
  tea at the café.
about: >
  The garden opened in 1967 and is widely called one of the most authentic
  Japanese gardens outside Japan. Its several garden styles include a sand
  and stone garden, a strolling pond garden and a tea garden.

  In 2017 it added a Cultural Village by the Japanese architect Kengo Kuma,
  with the tea café and gift shop. It's beautiful in any season, and quiet
  rainy days make the moss glow.
