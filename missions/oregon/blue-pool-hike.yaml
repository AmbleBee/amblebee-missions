short: Hike 4.2 miles round trip on the McKenzie River Trail to the impossibly blue Tamolitch Pool.
description: >
  Follow the McKenzie River Trail about two miles through old lava flows and
  mossy forest to the rim of Tamolitch Blue Pool. Before you look anything up,
  each guess how deep the water is, since it looks shallow enough to wade. Then
  find a spot on the rim, eat a snack, and take a photo straight down into the
  blue. Look for the dry falls above the pool on your way back.
about: >
  About 1,600 years ago, lava from Belknap Crater filled this valley. Today the
  McKenzie River runs underneath the lava and comes back up in Tamolitch Blue
  Pool, which is why the water is so clear and so blue. It looks shallow, but
  it's about 30 feet deep, and the falls above it only run in heavy snowmelt.

  The hike is 4.2 miles round trip with a little climbing. Parking is free but
  fills up fast, so go early or late in the day, and never park along Highway
  126.
