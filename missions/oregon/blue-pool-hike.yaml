short: Hike 4.2 miles round trip on the McKenzie River Trail to the impossibly blue Tamolitch Pool.
description: >
  About 1,600 years ago, lava from Belknap Crater filled this valley, and
  today the McKenzie River runs underneath it and comes up in Tamolitch Blue
  Pool. Follow the McKenzie River Trail about two miles through old lava flows
  and mossy forest to the rim, where the water is so clear and blue it looks
  shallow, but it's about 30 feet deep. Find a spot on the rim, eat a snack and
  take in the color, and look for the dry falls above it that only run in
  heavy snowmelt. Parking is free but fills up fast, so go early or late in the
  day, and never park along Highway 126.
