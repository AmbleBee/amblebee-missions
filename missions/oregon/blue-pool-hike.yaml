short: Hike the McKenzie River Trail to the impossibly blue pool. Photo from the rim.
description: >
  Follow the McKenzie River Trail through old lava flows and mossy forest to
  Tamolitch Blue Pool, where the river comes up from underground. Find a spot on
  the rim, eat a snack and take in the color. The water is ice cold, so enjoy it
  from above.
