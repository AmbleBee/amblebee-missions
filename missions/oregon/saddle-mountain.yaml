place:
  name: Saddle Mountain State Natural Area trailhead
  area: Northern Coast Range, near Seaside
  coords: [45.96250, -123.68900]  # APPROX: set at the trailhead before publishing
short: Climb Saddle Mountain to the summit. On a clear day you can see the ocean.
description: >
  A steep climb through forest and up open rocky slopes to one of the best views
  in northwest Oregon: the Pacific on one side and Cascade volcanoes on the
  other. Spring brings wildflowers. Wear good boots; the top section is steep
  and slick when wet. The park has had closures for repairs, so check first.
