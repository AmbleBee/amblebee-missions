short: Climb Saddle Mountain near Seaside to the summit. On a clear day you can see the ocean.
description: >
  Climb through forest and up open rocky slopes to the summit of Saddle
  Mountain. At the top, find where the Columbia River meets the Pacific, then
  see who can name the most Cascade volcanoes on the other horizon. Get a
  summit photo with the ocean behind you. Wear good boots; the top section is
  steep and slick when wet.
about: >
  Saddle Mountain's summit is 3,288 feet up in the northern Oregon Coast Range.
  The trail is about 2.4 miles with more than
  1,600 feet of climbing, and it's steep in places, with wire mesh on some
  sections for grip. On a clear day you can see miles of Pacific shoreline,
  the mouth of the Columbia River and the Cascade peaks of Oregon and
  Washington.

  In spring the slopes bloom with rare wildflowers, like Saddle Mountain
  bittercress and rosy lewisia. It's day use only, with no drinking water, and
  the park sometimes closes for snow, wind or fallen trees. Dogs must be
  leashed, and the wire mesh can hurt their paws.
