short: Tour the Pittock Mansion. Pick the room you'd live in. Then the view from the lawn.
description: >
  Tour the 1914 mansion high above Portland and each pick the room you'd claim if
  it were yours. Afterward, sit on the lawn for one of the best views of the city
  and the mountains.
about: >
  Henry Pittock, who built The Oregonian into a major newspaper, finished
  the mansion in 1914 and lived there with his wife Georgiana until they
  died a few years later. It sits about 1,000 feet above the city.

  After a 1962 storm damaged the empty house, Portlanders raised money to
  save it, and the city bought it in 1964. On clear days you can see five
  Cascade peaks from the lawn. The grounds are free; the house tour isn't.
