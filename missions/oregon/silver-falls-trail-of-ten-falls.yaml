short: Hike the Trail of Ten Falls at Silver Falls. Walk right behind the curtain of South Falls.
description: >
  Hike Oregon's most famous waterfall loop, about seven miles through a mossy
  canyon past ten waterfalls, and walk behind four of them on trails tucked
  under the rock. Start at South Falls and stand right behind its 177-foot
  curtain for a photo of the two of you in the mist. Each pick your favorite
  of the ten. For a shorter outing, just do the South Falls loop. Spring has
  the biggest falls, and October has the fall colors. There's a day-use
  parking fee, and dogs aren't allowed on the canyon trail.
for_kids:
  short: Waterfall hunt! Count all ten.
  steps:
    - The tallest waterfall
    - A path behind the water
    - A banana slug
    - A mossy log
    - A selfie in the mist!
