short: Hike the Trail of Ten Falls at Silver Falls and walk right behind the curtain of South Falls.
description: >
  Hike Oregon's most famous waterfall loop, the Trail of Ten Falls, about
  seven miles through a mossy canyon past ten waterfalls. Four of them have
  trails that run right behind the water. Start at South Falls and stand
  behind its 177-foot curtain, then work your way past the rest and pick
  your favorite of the ten. For a shorter outing, just do the South Falls
  loop. The photo to get: you behind South Falls with the water pouring down
  in front of you. Spring has the biggest falls and October has the fall
  color. There's a day-use parking fee, and dogs aren't allowed on the
  canyon trail.
about: >
  Silver Falls is Oregon's largest state park, covering more than 9,000
  acres east of Salem. The Trail of Ten Falls runs 7.2 miles along Silver
  Creek, and you can walk behind four of its waterfalls: South Falls, Lower
  South Falls, Middle North Falls and North Falls. The hollows behind them
  formed as the creek wore away a softer layer of rock beneath hard basalt
  ledges.

  Before it was a park, this was Silver Falls City, a logging town founded
  in 1888, and a local businessman charged admission to see the falls. In
  1928 the daredevil Al Faussett went over South Falls in a padded canvas
  boat for a paying crowd. It landed on its side, and he was carried off
  with a broken hand and serious injuries. The Civilian Conservation Corps
  built the stone South Falls Lodge and much of the trail system in the
  1930s.

  Weekends fill up fast in summer, so go early. Trails behind the falls can
  be wet and slick, so wear shoes with good grip.
for_kids:
