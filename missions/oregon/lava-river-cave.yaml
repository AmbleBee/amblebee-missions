place:
  name: Lava River Cave, Newberry National Volcanic Monument
  area: South of Bend
  coords: [43.89600, -121.36900]  # APPROX: set at the cave parking before publishing
short: Walk a mile into a lava tube in the dark. Turn off your lights for ten seconds.
description: >
  Bring warm layers and two good lights each, then walk into a lava tube that runs
  almost a mile underground. Partway in, switch your lights off together and stand
  in total darkness for ten seconds. It stays cold inside even in summer.
about: >
  The lava tube formed about 80,000 years ago, when lava from Newberry
  Volcano crusted over on top while the molten rock inside kept flowing and
  drained away. It's about 5,200 feet long, the longest continuous lava tube
  in Oregon, and stays around 42 degrees all year.

  It's only open in the warmer months, closed in winter to protect the bats,
  and you need a timed reservation. Lantern rentals are sometimes offered,
  but bring your own lights.
