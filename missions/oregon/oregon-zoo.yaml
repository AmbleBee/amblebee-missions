short: Visit the Oregon Zoo in Portland's Washington Park. Each find the animal most like you.
description: >
  Spend a day at the Oregon Zoo in Portland's Washington Park and take your
  time at each exhibit instead of racing the map. Each secretly pick the
  animal that's most like you and one that's most like someone else in your
  group. Don't miss the elephants at Elephant Lands or the Great Northwest.
  Over a snack, reveal your picks and make your case for each one. The photo
  to get: everyone copying their animal twin's pose.
about: >
  The Oregon Zoo started in 1888 with two bears given to the city, making it
  the oldest zoo west of the Mississippi. Today it covers 64 acres in
  Washington Park, about two miles from downtown Portland, with more than 1,800
  animals from over 230 species.

  It's famous for its Asian elephants: Packy, born here in 1962, was the first
  elephant born in the Western Hemisphere in 44 years, and the zoo has had
  dozens of elephant births since. Don't miss Elephant Lands, the Great
  Northwest and the Africa exhibits. You can skip the parking by taking the MAX
  light rail to the underground Washington Park station.
