short: Ride the Wallowa Lake Tramway up Mount Howard. Lunch at the top, lake far below.
description: >
  Ride one of the steepest gondolas in North America nearly 3,700 feet up from
  Wallowa Lake to the top of Mount Howard, over 8,000 feet high. Walk the two
  miles of summit trails to the overlooks, where the Wallowa peaks, Hells
  Canyon country and the lake all spread out below. Get a photo of the two of
  you with the lake behind you, then eat lunch at the Summit Grill, Oregon's
  highest restaurant. It runs roughly May through early October; bring a
  jacket, since it's much colder at the top.
