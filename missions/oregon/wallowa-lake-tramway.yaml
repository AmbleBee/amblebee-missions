short: Ride the Wallowa Lake Tramway up Mount Howard. Lunch at the top, lake far below.
description: >
  Ride the gondola from Wallowa Lake to the top of Mount Howard, then walk the
  summit trails to the overlooks. Up top, see who can spot the most distant
  peak, and try to pick out the hills of Washington and Idaho on the horizon.
  Get a photo with the lake far below you, then eat lunch at the Summit Grill.
  Bring a jacket; it's much colder at the top.
about: >
  The Wallowa Lake Tramway opened in 1970 and climbs about 3,700 feet in
  roughly 15 minutes, in little four-person gondolas, to an 8,150-foot summit.
  It's billed as the steepest four-person gondola in North America. At the top
  are more than two miles of trails to overlooks like Royal Purple Overlook,
  with views over the Wallowa Valley, the lake and the Wallowa Mountains, and
  on clear days, into Washington and Idaho.

  The Summit Grill at the upper terminal calls itself the Northwest's highest
  restaurant. The tram runs in the warmer months, with the last ride down in
  the late afternoon, so check the season and hours before you go. Afterward,
  head about five miles down the road to [[joseph-bronze-town]].
