short: Visit the Oregon Vortex near Gold Hill. Swap places on the board and see who "shrinks."
description: >
  Take the guided tour of this classic roadside mystery spot, where the guides
  show you how people seem to grow and shrink and things seem to roll the wrong
  way. Swap places on the level board and take a photo of each of you at both
  ends. Then decide on the drive home whether you believe it.
about: >
  The Oregon Vortex has drawn curious visitors to Sardine Creek near Gold Hill
  since 1930. The tilted House of Mystery started out in 1904 as a mining
  company's assay office, and the story goes that it slid off its foundation
  in the 1910s and came to rest at its strange angle. Scientists put the
  effects down to optical illusions and forced perspective; the owners leave
  room for something stranger, and you can make up your own mind. It even got
  a mention on The X-Files in 1999.
