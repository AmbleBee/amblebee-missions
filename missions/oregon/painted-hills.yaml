  coords: [44.66150, -120.26550]  # APPROX: set at the overlook parking before publishing
short: Walk the Painted Hills overlook. Photograph the stripes in the late light.
description: >
  Drive out to the Painted Hills and walk the short overlook trail above the red,
  gold and black striped hills. The colors change with the light, so late
  afternoon is best. Stay on the trails; the hills scar for decades.
about: >
  The stripes are old soils, laid down over millions of years as the climate
  changed and volcanoes dusted the land with ash. Red layers formed in warm,
  wet times, yellow and tan in drier ones, and the black bands are mostly
  plant matter.

  The Painted Hills are one of the three units of John Day Fossil Beds
  National Monument and one of the Seven Wonders of Oregon. Colors look
  richest after a rain, when the clay is damp.
