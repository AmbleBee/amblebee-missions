short: See the red, gold and black stripes of Oregon's Painted Hills glow in the late light.
description: >
  Drive out to the Painted Hills near Mitchell and start with the short
  Overlook Trail for the classic view of the striped red and gold hills.
  Then walk the boardwalk through Painted Cove, where you can see the
  colored clay up close, and if you have energy left, climb the Carroll Rim
  Trail for the big view over the whole valley. The colors shift with the
  light, so late afternoon is best, and they're richest after a rain. The
  photo to get: you on the overlook with the stripes rolling out behind you.
  Stay on the trails, because footprints in the clay last for decades.
about: >
  The Painted Hills started forming about 35 million years ago, as ancient
  floodplains, volcanic ash and a changing climate built up layer after
  layer of soil. The red bands come from iron-rich soils formed in warm, wet
  times, the yellow and tan bands from cooler, drier periods, and the black
  streaks are lignite, fossilized plant matter from old riverbanks. Rain
  soaks into the clay and darkens it, which is why the colors pop after a
  storm.

  The hills are one of three units of John Day Fossil Beds National Monument
  and one of the Seven Wonders of Oregon. They sit about nine miles
  northwest of the small town of Mitchell. Fossilized leaves of redwood, fig
  and alder have been found in the old lake beds here, and the wider area
  has turned up early horses, camels and rhinos.

  There are no services at the hills, so bring water and fill the gas tank
  before you leave the main highway. For more of the fossil story, the
  Thomas Condon Paleontology Center at the monument's Sheep Rock Unit is
  about an hour away.
