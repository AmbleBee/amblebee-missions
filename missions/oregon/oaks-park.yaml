short: Ride something at Portland's Oaks Park, then skate the old roller rink. Loser buys the treats.
description: >
  Spend an afternoon at one of the oldest amusement parks in the country. Ride
  a few rides, and take a photo on the one you were most nervous about. Then
  lace up at the historic roller rink while the pipe organ plays. Whoever falls
  first buys the fair treats.
about: >
  Oaks Park opened on May 30, 1905, about three and a half miles south of
  downtown Portland, and it's one of the oldest amusement parks in the country
  that has never closed. It's been run by a nonprofit since 1985.

  The wooden roller rink is open year-round and has had a Wurlitzer pipe organ
  since 1955. Its floor sits on airtight barrels so it can float, and it rode
  out the floods of 1964 and 1996. Look for the 1912 Noah's Ark carousel, and
  if you want a real scare, the Adrenaline Peak roller coaster opened in 2018.
  The rides are seasonal, so check what's open before you go.
