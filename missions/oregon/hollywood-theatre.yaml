short: See a film at the 1926 Hollywood Theatre. Pick something you'd never stream.
description: >
  Catch a movie at Portland's 1926 movie palace. Pick something neither of you
  would ever choose at home: a kung fu classic, a cult favorite or something
  shown on real film. Take a photo under the marquee before you go in. Over a
  drink or dessert afterward, each sum up the movie in one word.
about: >
  The Hollywood Theatre opened in July 1926 with nearly 1,500 seats for
  vaudeville and silent films, and the whole Hollywood District is named after
  it. Its Spanish Colonial Revival front is on the National Register of
  Historic Places, and a nonprofit has restored it with new seats, sound and a
  new marquee.

  It still shows movies on 16mm, 35mm and 70mm film as well as digital, and it's
  known for series like Kung Fu Theater and B-Movie Bingo.
