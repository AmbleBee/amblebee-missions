short: Walk under the sharks at the Oregon Coast Aquarium. Each pick a favorite creature.
description: >
  Spend a coast day at the aquarium: walk the glass tunnels where sharks and
  rays swim over your head, then head outside for the sea otters and the
  seabird aviary. Each pick your favorite creature and get a photo with it,
  then make the case for why yours wins. Afterward, walk Newport's bayfront and
  listen for the sea lions barking under the docks.
about: >
  The Oregon Coast Aquarium opened in 1992 on 23 acres along Yaquina Bay in
  Newport, and it's run as a nonprofit. Keiko, the orca from the movie Free
  Willy, lived here from 1996 to 1998 before moving to Iceland.

  His old pool became Passages of the Deep, the aquarium's biggest exhibit,
  where you walk through clear tunnels past a rocky reef full of rockfish, a
  sandy flat with halibut and a sunken ship, and the open sea with sevengill
  sharks and rays. Outside are sea otters, harbor seals and sea lions, and a
  seabird aviary the aquarium calls the largest outdoor one in North America. A few miles north, the ocean churns inside [[devils-punchbowl]] at Otter Rock.
