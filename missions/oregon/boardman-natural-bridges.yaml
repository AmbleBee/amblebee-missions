short: See the seven Natural Bridges sea arches near Brookings, then explore one more Boardman viewpoint.
description: >
  From the parking area, take the short walk to the viewing platform above
  Natural Bridges, where the surf runs under seven stone arches. Wait for a big
  wave and photograph it blasting through. Then each pick one more stop along
  the corridor, like Arch Rock, Whaleshead Beach or Cape Ferrelo, take one photo
  there, and decide whose pick won. Bring a jacket; the wind on this stretch of
  coast is no joke.
about: >
  Samuel H. Boardman State Scenic Corridor runs 12 miles along Highway 101
  between Brookings and Gold Beach, and Natural Bridges is its most famous stop.
  The seven arch rocks were once sea caves; when their roofs fell in, bridges of
  stone were left behind with the ocean running underneath.

  The corridor is named for Samuel Boardman, the first superintendent of Oregon
  State Parks, and about 18 miles of the Oregon Coast Trail run through it,
  linking the viewpoints.
