short: Stand near the middle of Oregon in tiny Post, east of Prineville. Split a milkshake at the store.
description: >
  Drive out to Post, a tiny ranch town that claims to be the center of Oregon,
  and celebrate at the Post General Store, which is also the café and the post
  office. Each pick a milkshake flavor the other would never order, swap a sip,
  and get a photo by the "Center of Oregon" sign. Grab a souvenir and make a
  loop of it through the Ochoco country around Prineville.
about: >
  Post sits on Oregon Route 380 southeast of Prineville, about an hour from
  Bend. It's named for Walter Post, who became its first postmaster in 1889,
  and the general store still holds the post office, with just 48 mailboxes,
  along with a small eatery that makes more than a dozen milkshake flavors.

  The actual center point is on Bonnieview Ranch, private land just north of
  town, marked by a small metal survey marker from 1903. To see it, you need
  the landowner's permission ahead of time; the Geographic Center link has the
  contact details.
