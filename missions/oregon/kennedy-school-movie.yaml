short: Catch a movie in the old school auditorium. Pizza and a drink from your couch.
description: >
  Before the movie, each pick a bar to start in: the Detention Bar or the
  Honors Bar, and defend your choice. Wander the old school hallways, covered
  in art, and take a photo together at a classroom chalkboard. Then see a movie
  in the school's old auditorium, where you sink into couches and armchairs and
  order pizza and drinks to your seat.
about: >
  Kennedy School was built in 1915 as an elementary school in Northeast Portland
  and closed in 1975. McMenamins restored it and reopened it in 1997, and it's
  now on the National Register of Historic Places. Classrooms became 57 hotel
  rooms, many still with their original chalkboards, and there's a brewery,
  several bars and a soaking pool for overnight guests.

  Nearly every wall, ceiling and doorway is covered in art and old photos, and
  there's a hidden art room to find if the small bars are open. Some theater
  events are 21 and over, so check before you bring anyone younger. Come early
  for the [[kennedy-school-soaking-pool]] in the courtyard.
