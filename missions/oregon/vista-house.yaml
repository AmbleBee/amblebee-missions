short: Stop at Vista House high above the Gorge. Hold onto your hat in the wind.
description: >
  Drive the Historic Columbia River Highway to the stone Vista House perched on
  Crown Point, with a view straight up the Columbia River Gorge. Look inside the
  building if it's open, then lean into the famous wind for a photo with the
  river behind you. Pairs well with the waterfalls further east.
