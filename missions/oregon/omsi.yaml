short: Spend the day at OMSI. Each find the experiment that blows your mind.
description: >
  Explore OMSI's hands-on science halls, and add the submarine tour,
  planetarium or big-screen theater if you like. Each find the one exhibit
  that surprised you most, drag everyone else over to see it, and get a photo
  of yourself with your pick. Vote at the end on whose was best.
about: >
  The Oregon Museum of Science and Industry started in 1944 and moved to its
  current home on the east bank of the Willamette River in 1992. It has five
  exhibit halls, the Kendall Planetarium with astronomy shows every day, and
  the Empirical Theater, with a screen about four stories tall.

  Docked right beside the museum is the USS Blueback, a real Navy submarine
  that played a part in the movie The Hunt for Red October. You can tour it
  with a guide, so check times when you arrive.
