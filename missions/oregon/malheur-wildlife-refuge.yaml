short: Spot birds at Malheur Refuge. Each keep a count and see who finds more species.
description: >
  Visit one of the great bird stops of the West, where marshes in the middle
  of the high desert draw huge flocks of cranes, swans, pelicans and
  songbirds. Start at the headquarters, look at the bird museum to learn what
  to watch for, and check the board of recent sightings. Then drive part of
  the gravel auto tour route. Each keep your own count and see who spots more
  kinds of birds. Spring migration is the best time. The visitor center is
  closed October through February, but the museum and grounds stay open. The
  photo to get: the biggest flock you can fit in one frame.
about: >
  President Theodore Roosevelt set the refuge aside in 1908 to protect birds
  being hunted for hat feathers. It now covers more than 187,000 acres, and
  more than 300 bird species have been seen here.

  Spring brings sandhill cranes, swans and snow geese by the thousands, with
  the Harney County Migratory Bird Festival in April. Bring water and a full
  tank, since services are few and far between.
