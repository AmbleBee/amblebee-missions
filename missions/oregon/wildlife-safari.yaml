short: Drive through Wildlife Safari as giraffes and rhinos wander past. Each keep an animal count.
description: >
  Drive your own car slowly through 600 acres of open land where giraffes,
  rhinos, bears, lions and herds of grazers roam right up to your windows.
  It takes about an hour and a half. Each keep count of the animals you spot
  and see who wins, then visit the free Safari Village for the cheetahs, a
  big part of the park's work. Windows and tops stay up, so no convertibles,
  motorcycles or pets in the drive.
