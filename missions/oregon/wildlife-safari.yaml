short: Wildlife Safari in Winston. Drive past giraffes and rhinos and race to spot the most animals.
description: >
  Drive your own car slowly through Wildlife Safari while giraffes, rhinos,
  bears and big herds wander right up to your windows. Each keep a count of
  every animal you spot, and the loser buys lunch in Safari Village. The
  photo to get: an animal framed in your side mirror. Then walk the village
  to see the cheetahs up close.
about: >
  Wildlife Safari opened in 1972 and covers about 600 acres of rolling hills
  in Southern Oregon. The drive-through loop takes about an hour and a half
  at a slow crawl, and you can go around more than once.

  The park is best known for its cheetahs: its breeding program is one of
  the most successful in the country, with well over 200 cubs born here.
  You'll find them in Safari Village, along with a restaurant and smaller
  animal exhibits.

  Windows stay up in the drive-through, so convertibles, soft-top vehicles,
  motorcycles and pets can't go through. Check the website for vehicle
  rules and options before you go.
