short: Climb Mount Hood's flank through wildflower meadows to an old stone shelter. Lunch with a view.
description: >
  Start at Top Spur and join the Timberline Trail around Bald Mountain for your
  first big look at Mount Hood, then keep climbing through steep wildflower
  meadows and past the little McNeil Ponds. The last stretch crosses open scree
  to a broad ridge where a historic stone shelter sits right under the mountain's
  glaciers, with the Cascades spread out below. It's about 10 miles out and back
  with roughly 2,200 feet of climbing, so pack lunch, layers and plenty of water,
  and take the longer trail around rather than the steep shortcut up the point.
  Get a photo framed by the shelter's stone doorway with Hood behind it. Bring a
  Northwest Forest Pass (not sold at the trailhead), fill out the free wilderness
  permit at the trailhead, and expect snow on the upper trail until July.
steps:
  - Mount Hood from the Bald Mountain viewpoint
  - Wildflowers in the meadows
  - The McNeil Ponds
  - The stone shelter with Hood behind it
