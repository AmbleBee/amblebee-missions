short: Visit the Alvar Aalto library at Mount Angel Abbey. Then the hilltop view.
description: >
  Visit the abbey's library, a quiet, light-filled building by the architect
  Alvar Aalto. Speak softly; it's a working monastery. Afterward, walk the hilltop
  grounds and look out over the valley.
about: >
  Benedictine monks from Engelberg, Switzerland, founded Mount Angel Abbey
  in 1882, and monks still live, pray and work on the hilltop today.

  The library, finished in 1970, is one of only two buildings in the United
  States by the Finnish architect Alvar Aalto. Its fan-shaped reading room
  is built to fill with soft daylight. The abbey also has a small museum and
  a brewery that's open on some days.
