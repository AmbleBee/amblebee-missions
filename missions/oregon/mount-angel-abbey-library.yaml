short: Visit the Alvar Aalto library at Mount Angel Abbey. Then the hilltop view.
description: >
  Drive up the hill to Mount Angel Abbey and step into its library, one of
  only two buildings in the US by the Finnish architect Alvar Aalto. Curving
  wood, soft natural light and a fan-shaped reading room built into the hill
  make it feel like a secret. Speak softly; it's a working monastery. Then
  wander the hilltop grounds and find a bench looking out over the
  Willamette Valley. The photo to get: the two of you on the library's
  curved stairs, or at the edge of the hill with the farmland behind you.
about: >
  Benedictine monks from Engelberg, Switzerland founded Mount Angel Abbey in
  1882 on top of a 485-foot butte above the town of Mt. Angel. The library
  opened in 1970 and is one of only two buildings Alvar Aalto designed in
  the United States. He even designed the furniture, built in his own
  factories in Finland. Its wave-like shapes and fan-shaped plan open out
  toward the countryside to the north, and it holds one of the largest
  theology collections in the Northwest, including manuscripts going back to
  the 1100s.

  The grounds are free to walk, and the views over the valley are some of
  the best around Salem. Don't skip the small abbey museum, also free:
  alongside Civil War relics and old vestments, it has what's billed as the
  world's largest pig hairball. Check library and museum hours before you
  go, since they can change around services and holidays.

  Down the hill, the town of Mt. Angel has Bavarian-style buildings and is
  famous for its Oktoberfest every September.
