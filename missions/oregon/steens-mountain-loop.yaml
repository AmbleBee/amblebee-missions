short: Drive Oregon's highest road over Steens Mountain and look a mile down onto the Alvord Desert.
description: >
  Drive the Steens Mountain Loop, a gravel road that climbs higher than any
  other road in Oregon, nearly to the top of Steens Mountain. Stop at the
  Kiger Gorge overlook to see a canyon carved by glaciers, then walk out to
  the East Rim, where the mountain drops away about a mile straight down to
  the Alvord Desert. On the way, everyone keeps a count of wild horses,
  pronghorn and bighorn sheep. The photo to get: you at the East Rim with
  the desert spread out far below.
about: >
  Steens Mountain rises to about 9,700 feet in Oregon's high desert. It's a
  giant block of the Earth's crust tilted up along a fault, so the west side
  climbs gently for miles while the east side ends in a sheer wall above the
  Alvord Desert. Ice Age glaciers carved the huge U-shaped gorges along the
  top, including Kiger Gorge, Little Blitzen and Big Indian.

  The loop is a 52-mile backcountry byway starting near Frenchglen, and the
  upper road only opens in summer and early fall, once the snow melts. Watch
  for Kiger mustangs, wild horses known for their Spanish-style markings.
  Fish Lake and Page Springs campgrounds make good stops or overnights along
  the way.

  Services are few and far between: fill up in Burns or Frenchglen, bring
  plenty of water, and carry a paper map. A high-clearance vehicle with good
  tires is the safest bet on the rough upper road. Down below, the Alvord is
  its own mission: [[alvord-desert]].
