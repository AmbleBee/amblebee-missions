short: Steens Mountain Loop near Frenchglen. Drive to the summit and look a mile down onto the Alvord.
description: >
  Drive the highest road in Oregon, a gravel loop climbing nearly to the
  top of Steens Mountain. Stop at Kiger Gorge, then walk out to the East Rim
  overlook, where the mountain drops away about a mile straight down to the
  Alvord Desert. The photo to get: you at the rim with the desert far below.
  On the way, everyone keeps a count of wild horses, pronghorn and bighorn
  sheep.
about: >
  Steens Mountain rises to about 9,700 feet. It's a giant block of the
  Earth's crust tilted up along a fault, so the west side climbs slowly
  while the east side is a sheer wall. Ice Age glaciers carved the huge
  U-shaped gorges like Kiger Gorge.

  Watch for Kiger mustangs, wild horses known for their Spanish-style
  markings. The loop is about 52 miles, and the upper road only opens in
  summer and early fall, after the snow melts. Fill up in Burns or
  Frenchglen, bring plenty of water, and carry a paper map. Down below, the
  Alvord itself is its own mission: [[alvord-desert]].
for_kids:
  short: Mountain drive! Find each thing.
  steps:
    - A wild horse or pronghorn
    - A giant canyon
    - Snow on the mountain
    - The desert way down below
    - A selfie on the edge!
