short: Drive the Steens Mountain Loop to the summit. Look a mile straight down onto the Alvord.
description: >
  Drive the highest road in Oregon, a 52-mile gravel loop climbing nearly to
  the top of Steens Mountain. Stop at Kiger Gorge and the East Rim overlook,
  where the mountain drops away a mile down to the Alvord Desert, and get a
  photo of the two of you on the edge. Watch for wild horses, pronghorn and
  bighorn sheep. The upper road only opens in summer and early fall, after the
  snow melts. Fill up the tank in Burns or Frenchglen, bring plenty of water,
  expect no cell service, and carry a paper map.
for_kids:
  short: Mountain drive! Find each thing.
  steps:
