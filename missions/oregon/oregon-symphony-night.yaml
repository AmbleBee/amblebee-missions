description: >
  Pick a concert, get dressed up properly, and make a night of it: dinner or a
  drink downtown first, then the Oregon Symphony at the Schnitz. Take a photo of
  the two of you under the big Portland marquee, and each pick your favorite
  piece on the way home.
about: >
  The Oregon Symphony was founded in 1896, one of the oldest orchestras in
  the country. It plays at the Arlene Schnitzer Concert Hall, a 1928 movie
  palace that was restored and reopened as a concert hall in 1984.

  The tall Portland sign out front is a city landmark. Rush and student
  tickets are sometimes offered, and the season's pops and film concerts are
  an easy way in if classical isn't your usual thing.
