description: >
  Pick a concert and make a real night of it. Dress up properly, get dinner
  or a drink downtown first, then take your seats for the Oregon Symphony at
  the Arlene Schnitzer Concert Hall. Look up during the break: the gold
  ceilings and chandeliers are half the show. On the way out, each pick your
  favorite piece and say why. The photo to get: the two of you all dressed
  up under the glowing PORTLAND sign on Broadway.
about: >
  The Oregon Symphony started in 1896 as the Portland Symphony Society,
  which makes it the oldest orchestra in the western United States and the
  sixth oldest in the country. It plays most of its season at the Arlene
  Schnitzer Concert Hall, which everyone in Portland just calls the Schnitz.

  The Schnitz opened in 1928 as the Portland Publix Theatre, a grand
  vaudeville and movie palace that later became the Paramount. It was
  restored and reopened as a concert hall in 1984, with about 2,700 seats
  under its ornate gold ceilings. The 65-foot PORTLAND sign over Broadway is
  a replica of the original, with five-foot neon letters, and it's one of
  the most photographed signs in the city.

  New to classical? The season's pops and movie-score concerts, where the
  orchestra plays a film's music live, are an easy and fun first night.
  Check the symphony's site for the schedule and ticket deals.
