short: Stroll the gold-rush streets of Jacksonville. In summer, picnic at a Britt concert on the hill.
description: >
  Walk the brick-and-wood main street of an 1850s gold-rush town. Pop into the
  shops and galleries, read the old building plaques, and each pick the
  building you'd live in. Take a photo of yourself in front of your pick and
  share the best fact you learned about it. In summer, pack a picnic blanket
  for a Britt Festival concert on the hillside lawn; tickets sell out, so book
  ahead.
about: >
  Jacksonville sprang up about 5 miles west of what's now Medford after gold
  was found in Jackson Creek in 1851 and 1852. It had Oregon's first Chinatown,
  and the town is so well kept that more than 100 of its buildings make up a
  National Historic Landmark district, named in 1966.

  The Britt Festival's outdoor amphitheater sits on the hill where pioneer
  photographer Peter Britt once lived, picked in 1963 for its sound. For more
  history, Historic Jacksonville runs tours of the 1870s Beekman House and the
  Beekman Bank, walking and pioneer cemetery tours, and Haunted History tours
  in October.
