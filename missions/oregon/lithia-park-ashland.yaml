short: Wander Lithia Park along Ashland Creek. Dare each other to sip the Lithia water.
description: >
  Walk the creekside paths of Ashland's big 93-acre park, winding up a forested
  canyon from the downtown Plaza past two duck ponds and a Japanese garden.
  Find a bench by Ashland Creek and just listen for a while, and get a photo
  of you on one of the little bridges. On your way back through the
  Plaza, dare each other to sip the famously funky-tasting mineral water from
  the Lithia fountains. It's free, and fall colors here are lovely.
about: >
  Lithia Park was laid out in the 1910s with help from John McLaren, who
  also designed San Francisco's Golden Gate Park. It's on the National
  Register of Historic Places and runs about 93 acres up Ashland Creek.

  The Lithia water comes from a spring outside town and is full of minerals
  and lithium salts, which is why it tastes so strange. The Oregon
  Shakespeare Festival theaters sit right next to the park.
