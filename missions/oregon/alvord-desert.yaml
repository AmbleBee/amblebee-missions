short: Walk out onto the empty Alvord playa under Steens Mountain. Stay for the stars.
description: >
  Walk (or carefully drive) out onto the Alvord Desert, a dry lakebed so flat
  and empty it feels like another planet, with Steens Mountain towering over
  it. Spell something out together in footprints, take the classic photo of you tiny on the cracked white ground, and stay after sunset for
  some of the darkest skies in Oregon. Use the free Frog Springs access; it's
  best July through November, when the playa is dry. If there's any water or
  mud on it, stay off, since getting stuck out there is very expensive. Grab a
  milkshake at Fields Station on the way.
for_kids:
