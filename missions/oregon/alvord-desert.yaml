short: Walk onto the Alvord Desert, a dry lakebed under Steens Mountain, and stay for the Milky Way.
description: >
  Walk (or carefully drive) out onto the cracked white floor of the Alvord
  Desert, with Steens Mountain towering over it. Spell something out together in
  footprints and take the classic photo of you tiny in the middle of it. Stay
  after sunset, when the Milky Way shows up over some of the darkest skies in
  Oregon. If there's any water or mud on the playa, stay off. Getting stuck out
  there is very expensive.
about: >
  The Alvord Desert is a dry lakebed in southeast Oregon, so flat and empty it
  feels like another planet. Steens Mountain rises more than a mile above its
  western edge, and the playa gets less than 4 inches of rain a year. In 1976
  Kitty O'Neil drove a jet car across it at 512 miles an hour.

  Use the free Frog Springs access. The playa is usually dry from July through
  November. Grab a milkshake at Fields Station on the way.
