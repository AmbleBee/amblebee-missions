short: Walk around Trillium Lake near Government Camp. Catch Mount Hood reflected in the water.
description: >
  Walk the easy loop around Trillium Lake. Each scout your own spot for the
  best shot of Mount Hood reflected in the water, take your photo, and compare
  at the end to pick a winner. Calm mornings give the clearest reflection. In
  winter, the road closes and it turns into a snowshoe trip.
about: >
  Trillium Lake isn't natural: a dam across Mud Creek in 1960 flooded a boggy
  meadow and made this 63-acre lake below Mount Hood. The view from the dam is
  the classic postcard shot. The loop trail is about 2 miles and nearly flat,
  with boardwalks through wetlands where wildflowers bloom in summer. People
  swim, paddle non-motorized boats and fish for trout off the pier.

  The day use area is open from May to December, with a per-car fee; check
  which passes count before you go. In winter, park at the Trillium Sno-Park on
  Highway 26 (you'll need a Sno-Park permit) and snowshoe or ski about 4.4
  miles round trip to the lake.
