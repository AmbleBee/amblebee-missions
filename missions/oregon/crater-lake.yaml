short: Stand at the rim of Crater Lake, the deepest lake in the U.S., and agree on one word for that blue.
description: >
  Drive up to Rim Village for your first look at Crater Lake, then walk part of
  the rim and find a viewpoint you like. Spot Wizard Island, a little volcano
  inside the volcano, and the Phantom Ship rock near the south shore. Each pick
  one word for the color, write it on your hand, and photograph it held up
  against the lake. Then agree on a winner.
about: >
  About 7,700 years ago a volcano called Mount Mazama erupted and collapsed, and
  the bowl it left slowly filled with rain and snow. Crater Lake is 1,949 feet
  deep, the deepest lake in the United States, and no rivers flow in, which is
  why the water is so clear and so blue.

  The full 33-mile Rim Drive is only open in summer, since the park gets around
  40 feet of snow a year; in winter you can still reach the rim at Rim Village.
  The trail down to the water at Cleetwood Cove is closed for a multi-year
  rebuild.
