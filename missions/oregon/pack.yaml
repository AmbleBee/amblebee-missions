# A longer description for this pack's own page on the website (not sent to the Hive).
about: >
  Looking for things to do in Oregon? Discover unique adventures,
  memorable date ideas, and hidden gems across the state.
  From scenic drives through the Columbia River Gorge to coastal adventures,
  mountain hikes, quirky attractions, and rainy-day activities in Portland, 
  Amblebee helps you find something worth getting out of the house for.

  Explore the missions below, choose an experience that fits your budget and schedule, 
  and make your next outing a little more memorable.
