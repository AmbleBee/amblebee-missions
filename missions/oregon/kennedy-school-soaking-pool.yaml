short: Book an hour in the Kennedy School soaking pool. Then wander the old school halls.
description: >
  Reserve an hour in the warm outdoor soaking pool tucked into the courtyard of
  this old elementary school, and bring your own towels and swimsuits. While
  you soak, each describe your perfect day off, no limits. Get a photo of the
  tiled pool and the garden around it, then dry off and wander the halls, the
  murals and the little bars tucked into old classrooms.
about: >
  The pool sits in a private garden courtyard at McMenamins Kennedy School, a
  1915 elementary school that reopened as a hotel in 1997. It's heated, open
  year-round and built as a ceramic work of art, and it uses a salt system,
  though it isn't chlorine-free.

  The public can book a one-hour soak for a small per-person fee;
  reservations are required, and adults need a photo ID. Neighbors who live
  close by can soak free with an ID showing their address. Towels aren't
  provided, swimsuits are required, and anyone under 18 needs a parent along.
  You can order drinks from the Courtyard Restaurant and the Honors Bar. Make a
  day of it with a [[kennedy-school-movie]] in the old auditorium.
