short: Walk Peacock Lane's Christmas lights. Pick your favorite house and get hot cocoa.
description: >
  In the second half of December, a whole block of Southeast Portland goes all
  out with Christmas lights and the street fills with people walking it. Bundle
  up, grab something warm, and each pick your favorite house. For your photo,
  stand right under the brightest display; the camera needs the light.
about: >
  Neighbors on Peacock Lane have lit up their houses every December since
  the 1920s, making it one of Portland's longest-running holiday traditions.
  The street's houses are mostly 1920s Tudor-style homes.

  On some nights the street is closed to cars so everyone can walk it. Park
  a few blocks away and walk in, since parking right nearby fills up fast,
  and expect hot cider and cocoa stands on busy nights.
