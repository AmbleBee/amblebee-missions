short: Raft the Lower Deschutes out of Maupin, Oregon's whitewater capital. Survive Boxcar and Oak Springs.
description: >
  Take a guided full-day raft trip out of Maupin through a desert canyon of
  basalt and sagebrush. Before each big rapid, everyone in the raft guesses
  who'll get soaked first. Paddle hard when the guide calls it, hang on through
  the big ones, and get a photo of your whole crew soaked and grinning on the
  beach after the last rapid.
about: >
  Maupin, a couple of hours from Portland, calls itself Oregon's whitewater
  capital, and more than a dozen outfitters run the Lower Deschutes from here.
  The day stretch has class III rapids like Wapinitia, Boxcar (named for a 1950s
  train wreck) and Oak Springs, and full-day trips usually include a riverside
  barbecue lunch.

  The sun is strong in the canyon, so wear quick-dry clothes, river shoes, a hat
  and sunglasses with a strap. Book ahead in summer, and check the minimum age
  if you're bringing kids. Just up the road, the White River tumbles over [[white-river-falls]] on its way into the Deschutes.
