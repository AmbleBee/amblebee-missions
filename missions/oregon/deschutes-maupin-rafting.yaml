short: Paddle a full day of Deschutes whitewater out of Maupin. Survive the big rapids together.
description: >
  Book a guided full-day raft trip out of Maupin and spend the day paddling
  about thirteen miles of the Lower Deschutes through a desert canyon of basalt
  and sagebrush, with class II to IV rapids and a riverside barbecue lunch.
  Paddle hard when the guide calls it and hang on through the big ones. The
  sun is strong in the canyon, so wear quick-dry clothes, river shoes, a hat
  and sunglasses with a strap. Get a soaked-and-grinning photo of the two of
  you on the beach after the last rapid. Book ahead in summer; kids need to be
  at least 6 to come along.
