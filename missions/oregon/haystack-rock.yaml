  coords: [45.88479, -123.96337]
short: Explore the tide pools at Haystack Rock in Cannon Beach at low tide. Find a starfish and a puffin.
description: >
  Time your visit for low tide and walk out to the tide pools around Haystack
  Rock. Each count how many colors of sea star you can find, and photograph the
  best one. Look, but don't touch or collect anything. Then get a photo of the
  rock reflected in the wet sand, walk the beach and grab something warm in
  town.
about: >
  Haystack Rock is a 235-foot block of basalt left by lava flows about 15
  million years ago, standing right on the beach in Cannon Beach, about 80 miles
  from Portland. You might know it from The Goonies.

  It's part of a national wildlife refuge, and the tide pools around its base
  are a protected marine garden, so don't climb above the barnacle line. From
  March to September, look up for tufted puffins nesting on the north side; in
  summer, volunteers in red are on the beach to help you spot them.
for_kids:
  short: Tide pool hunt! Find each sea creature.
  steps:
    - The giant rock
    - A starfish
    - A green anemone
    - A bird on the rock
    - A selfie on the beach!
