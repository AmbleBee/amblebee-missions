short: Taste pinot noir at Stoller in the Dundee Hills. Buy a bottle to open on your anniversary.
description: >
  Start at Stoller Family Estate and taste your way through the Dundee Hills,
  two or three wineries with views over the valley. Each pick your favorite
  pour, then buy one bottle together and write today's date on the label to
  open on a special day. The photo to get: one of you on Stoller's tire swing
  with the vineyard behind. Pick a designated driver or book a tour.
about: >
  The Dundee Hills are the heart of Oregon pinot noir. The grapes grow in
  red volcanic soil called Jory, and the hills are dotted with tasting rooms
  a few minutes apart, so it's easy to visit two or three in an afternoon.

  Stoller sits on land the Stoller family farmed for decades before it
  became a vineyard. Its winery was built to be unusually green, and the
  big lawn and the tire swing on the oak tree make it a relaxed first stop.

  Tastings often need a reservation, especially on weekends, so check each
  winery's website before you go.
