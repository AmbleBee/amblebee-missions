short: Hunt the bronze statues on Main Street in Joseph. Tour the foundry that casts them.
description: >
  Walk Main Street in the little mountain town of Joseph, with the snowy
  Wallowas right behind it and life-size bronze sculptures on nearly every
  corner. Each pick a favorite statue and pose like it for a photo. To see how
  they're made, take the Valley Bronze foundry tour; it has run Monday through
  Thursday at 11 a.m., so call ahead. Finish with coffee or a slice of pie in
  one of the galleries and cafés downtown.
for_kids:
  short: Statue hunt! Find each thing.
  steps:
    - A bronze animal
    - A bronze person
    - A snowy mountain
    - Your favorite statue
    - Copy a statue's pose!
