short: Hunt the bronze statues on Main Street in Joseph. Tour the foundry that casts them.
description: >
  Walk Main Street in the little mountain town of Joseph, with the snowy
  Wallowas right behind it and bronze sculptures on nearly every corner. Each
  pick a favorite statue and pose like it for a photo. To see how they're made,
  take a tour of the Valley Bronze foundry; tours run on weekday mornings, so
  call ahead. Finish with coffee or a slice of pie at one of the cafés
  downtown.
about: >
  Joseph is a town of about 1,200 people in the Wallowa Valley, named in 1879
  for the Nez Perce leader Chief Joseph, whose larger-than-life bronze stands
  on Main Street. Valley Bronze has been casting sculptures here since 1982,
  and the town now has three foundries and more than a dozen bronzes along its
  main street. The foundry tour shows how an artist's original is molded and
  cast in metal; it costs a little, and kids 12 and under are free.

  Wallowa Lake sits just south of town, where the [[wallowa-lake-tramway]] climbs
  to the top of 8,150-foot Mount Howard. The peaks of the Eagle Cap Wilderness
  behind town have earned the area the nickname Little Switzerland.
for_kids:
  short: Statue hunt! Find each thing.
  steps:
    - A bronze animal
    - A bronze person
    - A snowy mountain
    - Your favorite statue
    - Copy a statue's pose!
