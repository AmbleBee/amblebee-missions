short: Voodoo Doughnut in Old Town Portland. Pick the weirdest doughnut and rate it out of ten.
description: >
  Get in line at the original Voodoo Doughnut (the wait is part of it) and
  each pick the strangest doughnut on the menu, no talking each other out of
  it. Take a photo of both side by side in the pink box before the first
  bite, then rate them out of ten. Bonus photo: the two of you under the
  "Keep Portland Weird" sign around the corner.
about: >
  Voodoo Doughnut opened in this Old Town spot in 2003 and became one of
  Portland's best-known stops, famous for its bright pink boxes and odd
  creations. The two most famous are the Voodoo Doll, a raspberry-filled
  doughnut shaped like a little person with a pretzel stake, and the Bacon
  Maple Bar.

  There are Voodoo shops in other cities now, but this one is the original.
  The line is usually shortest on weekday mornings and longest on weekend
  evenings.
