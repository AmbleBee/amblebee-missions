short: Hunt for the oddest treasure in Aurora's antique shops, a historic colony town south of Portland.
description: >
  Spend a slow morning or afternoon wandering the antique shops in Aurora's old
  colony buildings. Each hunt for the strangest or most charming thing you can
  find, take a photo of yourself holding it, then show it off. Buy something
  small only if you love it. Stop by the Old Aurora Colony Museum for the
  backstory, then sit down for lunch at one of the bakeries or cafés in town.
about: >
  Aurora sits about 22 miles south of Portland on Highway 99E, halfway to Salem.
  It began in 1856 as the Aurora Colony, a communal settlement known for its
  food, crafts and traveling band, and in 1974 it became Oregon's first historic
  district of its kind.

  Today the colony buildings are full of antique and vintage shops, including an
  architectural salvage shop in the town's 1890 seed mill. In spring, pair it with the tulip fields at [[wooden-shoe-tulips]], about ten minutes away.
