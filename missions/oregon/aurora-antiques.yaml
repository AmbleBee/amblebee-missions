short: Hunt for the oddest treasure in the antique shops of historic Aurora, then grab lunch in town.
description: >
  Aurora began in 1856 as the Aurora Colony, a communal settlement known for
  its food, crafts and traveling band, and in 1974 it became Oregon's first
  historic district of its kind. Today its old colony buildings are full of
  antique shops. Spend a slow morning or afternoon wandering them, and each of
  you hunt for the strangest or most charming thing you can find, then show
  it off. Buy something small only if you love it. If you want the backstory,
  stop by the Old Aurora Colony Museum, then sit down for a bite to eat in town.
