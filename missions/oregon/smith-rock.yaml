short: Walk the Crooked River below Smith Rock's 600-foot cliffs near Terrebonne. Spot a climber up top.
description: >
  Walk down from the rim into the canyon and follow the Crooked River below
  Smith Rock's orange cliffs. Each try to spot the first climber and get a photo
  of them, tiny on the wall, and keep an eye out for golden eagles and river
  otters. Feeling strong? Take the steep switchbacks up Misery Ridge for a close
  look at Monkey Face. Bring plenty of water; there's very little shade.
about: >
  Smith Rock's cliffs rise about 600 feet above the Crooked River near
  Terrebonne, and it's often called the birthplace of American sport climbing,
  with thousands of routes on the walls. Monkey Face is a 350-foot spire of
  volcanic tuff, and the Misery Ridge Loop is about 4 miles with nearly 1,000
  feet of climbing.

  Summer is hot, so start early, and watch for rattlesnakes near the river.
  You'll need a day-use parking permit, sold on site. The park is open from dawn
  to dusk. Just outside Redmond, stop at the folk-art castles of [[petersen-rock-garden]].
