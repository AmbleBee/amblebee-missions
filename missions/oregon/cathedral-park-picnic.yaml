short: Picnic in Cathedral Park under the Gothic arches of Portland's St. Johns Bridge. Stay until dusk.
description: >
  Pack a picnic and spread out on the lawn under the Gothic arches of the St.
  Johns Bridge, right by the Willamette. Each bring one snack the other doesn't
  know about. Lie back on the grass and take a photo looking straight up through
  the arches. Stay until dusk, when the arches turn into silhouettes against the
  sky.
about: >
  Cathedral Park sits at the east end of the St. Johns Bridge in North Portland,
  and it's named for the soaring Gothic arches that hold the bridge up. The
  bridge opened in 1931, its green towers rise 400 feet, and it's the only major
  highway suspension bridge in the Willamette Valley.

  Long before the bridge, this riverbank was a fishing and camping spot for
  Native tribes, and William Clark and eight of his men camped here in 1806.
