short: Soak in the big hot pond at Crystal Crane under a huge high-desert sky.
description: >
  Soak in a big natural hot spring pond, around 101 degrees, out in the open
  high desert with nothing but sagebrush and sky around you. Go at sunset or
  on a cold night, when the steam rises and the stars come out. For more
  privacy, book one of the private indoor tubs fed by the same water. Bring
  towels and water, and book ahead on weekends.
