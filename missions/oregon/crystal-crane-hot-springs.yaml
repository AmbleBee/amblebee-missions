short: Soak in the big hot spring pond at Crane Hot Springs near Burns under a huge high-desert sky.
description: >
  Soak in the big hot spring pond out in the open high desert, with nothing but
  sagebrush and sky around you. Go at sunset or on a cold night, when the steam
  rises and the stars come out. Get a photo of the steam drifting off the pond
  against the sunset, then lie back and each try to spot the first star or
  satellite. Bring towels and water.
about: >
  Crane Hot Springs, called Crystal Crane Hot Springs until 2026, sits on
  Highway 78 about 25 miles southeast of Burns. The spring comes out of the
  ground at about 165 degrees and is cooled to around 100 for the soaking pond,
  which is nearly 7 feet deep in the middle.

  Day passes are sold for the pond, private tubs rent by the hour, and there are
  cabins, teepees and an RV park if you want to stay the night. Book ahead on
  weekends.
