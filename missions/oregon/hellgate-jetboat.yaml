short: Blast down the Rogue River on a Hellgate jet boat. Hold on for the 360-degree spins.
description: >
  Climb aboard a jet boat in Grants Pass and roar down the Rogue River into
  Hellgate Canyon, with whitewater, spins and splashes along the way. Watch
  the banks for eagles, osprey and deer, and get a photo of you
  with the canyon walls behind you (if your hair isn't soaked). For a longer
  trip, pick a dinner or brunch run to the OK Corral, a ranch you can only
  reach by boat. Trips run in the warm months; book ahead and expect to get
  wet.
