short: Blast down the Rogue River into Hellgate Canyon on a jet boat from Grants Pass. Hold on tight!
description: >
  Climb aboard a jet boat in Grants Pass and roar down the Rogue River into
  Hellgate Canyon, with spins and splashes along the way. Before you leave the
  dock, each pick an animal to spot first: an eagle, an osprey or a deer. Get a
  photo with the canyon walls behind you, soaked hair and all, and expect to
  get wet.
about: >
  Hellgate has run jet boats on the Rogue since 1959, making it one of the first
  jet boat companies in the country. Trips range from a one-hour river run to
  four-hour brunch and dinner trips with a stop at their riverside lodge.

  The Rogue was one of the first rivers protected under the national Wild and
  Scenic Rivers Act, and the canyon has been in the movies: Rooster Cogburn,
  with John Wayne and Katharine Hepburn, and The River Wild, with Meryl Streep
  and Kevin Bacon, were both filmed nearby. Watch for osprey, bald eagles,
  deer, herons and river otters. Trips are seasonal, so book ahead.
