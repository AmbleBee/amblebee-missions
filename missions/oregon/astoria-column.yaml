short: Climb all 164 steps of the Astoria Column and send a balsa plane flying off the top.
description: >
  The Astoria Column stands 125 feet tall on top of Coxcomb Hill, wrapped in a
  spiral mural of 14 scenes from the area's history. Walk around the base and
  pick your favorite scene, then climb the 164 spiral steps (there's no
  elevator) to the lookout. From the top you can see the Columbia River
  meeting the Pacific, the Astoria-Megler Bridge and the hills of the coast.
  Grab a $1 balsa plane from the gift shop on the way up, count down together
  and launch it off the top, then race down to find where it landed. Climbing
  is free; parking is a yearly pass per car. Check the gift shop hours before
  you go if you want a plane.
