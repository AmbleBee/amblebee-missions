short: Walk the catwalk on top of the old pipeline along the Hood River.
description: >
  Start at the old Powerdale powerhouse and follow the trail upriver until it
  turns into a narrow catwalk running on top of the old wooden pipeline. It ends
  where a 2006 flood tore the pipe away. Not for dogs or bikes.
