short: Walk in the pioneers' footsteps at Flagstaff Hill, down to real Oregon Trail wagon ruts.
description: >
  Start at the life-size wagon camp and work through the museum's story of
  the Oregon Trail: the wagons, the diaries and the hard choices families
  made on the way west. Then head out onto the hillside trails and follow
  them down to real wagon ruts still cut into the sagebrush. On the walk,
  decide what you'd have packed if everything you owned had to fit in one
  wagon. The photo to get: you standing in the ruts with the Blue Mountains
  behind you. Watch the calendar for living-history days and Oregon Trail
  Days.
about: >
  Hundreds of thousands of emigrants crossed the Oregon Trail between the
  1840s and 1860s, a trip of about 2,000 miles that took four to six months.
  From Flagstaff Hill they got their first look at the Blue Mountains, one
  of the last hard climbs before the Willamette Valley. The National
  Historic Oregon Trail Interpretive Center opened here in 1992, about six
  miles northeast of Baker City, and is run by the Bureau of Land
  Management.

  The 500-acre site has more than four miles of trails. Paved paths loop
  around the hilltop and climb to Panorama Point, and dirt trails lead down
  to the original wagon ruts. Along the way you'll pass what's left of the
  Flagstaff Gold Mine, including a lode mine and a stamp mill. Inside,
  exhibits cover pioneer life, the Native peoples of the region, and the
  mining boom that built Northeast Oregon.

  There's a small entry fee for most of the year, federal passes are
  accepted, and winter hours are shorter, so check before you go. Pair it
  with a walk through Baker City's historic downtown, a short drive away.
