short: Ride a dune buggy over the Oregon Dunes and down onto the beach. Try the sandrail to go faster.
description: >
  Ride across the Oregon Dunes, 40 miles of towering sand right beside the
  Pacific. The giant buggy tour climbs and drops through about eight miles of
  dunes, then rolls down onto the ocean beach. For more thrill, pick the
  smaller, faster sandrail instead. Get a photo of the two of you at the top
  of a dune with the ocean behind you, then race each other on the go-karts
  or play mini golf afterward. Tours run rain or shine, so wear a hooded coat,
  long pants and closed-toe shoes, and zip your phone away from the sand.
  Reserve ahead; it's closed January and February.
