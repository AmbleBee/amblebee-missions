short: Ride a dune buggy over the Oregon Dunes near Florence, then roll down onto the Pacific beach.
description: >
  Climb into a giant dune buggy and ride up and over the sand hills of the
  Oregon Dunes, then down onto the ocean beach. For more thrill, pick the
  smaller, faster sandrail instead. Each guess how tall the biggest dune you
  see is, then get a photo at the top of a dune with the ocean behind you.
  Afterward, race each other on the go-karts or settle it with mini golf.
about: >
  The Oregon Dunes are the largest stretch of coastal sand dunes in North
  America, running about 40 miles from Florence to North Bend, with some dunes
  near 500 feet tall. They've been a national recreation area since 1972, and
  they helped inspire Frank Herbert's novel Dune.

  Sandland Adventures, just south of Florence, runs one-hour giant buggy tours
  that include a run down the Pacific beach, plus faster sandrail rides. In
  season there are also go-karts, mini golf and bumper boats. It's closed in
  January and February, and tours run rain or shine, so wear a hooded coat,
  long pants and closed-toe shoes, and zip your phone away from the sand.
  Reserve ahead.
