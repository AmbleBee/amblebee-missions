name: Klamath Basin Bald Eagles
mode: both
who: [solo, friends, family, kids]
place:
  name: Bear Valley National Wildlife Refuge (fly-out viewing)
  area: Near Worden, south of Klamath Falls
  coords: [42.04000, -121.85000]  # APPROX: set at the fly-out viewing pullout before publishing
  website: https://www.fws.gov/refuge/bear-valley  # verify
short: Watch dozens of bald eagles fly out at dawn in the Klamath Basin. Bring binoculars.
description: >
  Every winter more than a thousand bald eagles come to the Klamath Basin, the
  biggest gathering in the lower 48. Get to Bear Valley before sunrise and
  watch as dozens of eagles lift off from their roost in the trees at once.
  Then drive the auto tour routes on the nearby refuges, where eagles sit on
  poles and in the fields, and see who spots the most. Stop at the refuge
  headquarters for free maps. It's below freezing at dawn, so bring hot
  drinks and dress warm.
for_kids:
  short: Eagle hunt! Find each thing.
  steps:
