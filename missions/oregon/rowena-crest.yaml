short: Drive the twisty Rowena Loops up to Rowena Crest. Hike out for the Gorge view.
description: >
  Take the old Columbia River Highway from Mosier up to Rowena Crest, then
  photograph the famous looping road from the viewpoint. From there, hike the
  trail up Tom McCall Point for wildflowers in spring and a huge view over the
  Gorge. The trail is closed November through February, there's no shade, and
  dogs aren't allowed on the trails.
