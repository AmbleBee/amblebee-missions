short: Walk through old-growth forest to Bagby Hot Springs near Estacada and soak in a wooden tub.
description: >
  Walk the easy trail through old-growth forest to Bagby's bathhouses and soak
  in a wooden tub of hot spring water. On the way in, each find the biggest tree
  you can and take a photo with it for scale. Bring cash for the fee at the
  trailhead, expect a wait on weekends, and pack out everything you bring.
about: >
  Bagby Hot Springs sits deep in the Mount Hood National Forest, about 67 miles
  southeast of Portland, at the end of a mile-and-a-half trail. The springs come
  out of the ground at around 138 degrees.

  It's named for Bob Bagby, a prospector who found it in 1880. The old bathhouse
  burned in 1979 and was rebuilt by volunteers, and the springs reopened in 2024
  after a long closure.

  The fee is per person and paid in cash at the trailhead; Northwest Forest
  Passes don't count. There are no reservations, so go early on a weekday to
  skip the wait. You can't camp at the springs, but Bagby Campground is right by
  the trailhead.
