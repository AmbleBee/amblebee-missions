short: Hike through old forest to Bagby's cedar soaking tubs. Bring cash for the fee.
description: >
  Walk about a mile and a half through old-growth forest to the historic
  bathhouse, where hot spring water runs into wooden soaking tubs. Bring cash
  for the small fee, expect a wait on weekends, and pack out everything you
  bring. There's no cell service. Closed in winter once the road is snowed in,
  and sometimes for wildfires, so check first.
