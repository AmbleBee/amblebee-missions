short: Hike through old-growth forest to Bagby's historic bathhouse and soak in hand-carved cedar tubs.
description: >
  Walk about a mile and a half through old-growth forest in the Mount Hood
  National Forest to Bagby's historic bathhouse, where hot spring water runs
  into wooden soaking tubs. Bring cash: the fee is per person at the
  trailhead, and Northwest Forest Passes don't count. There are no
  reservations, so expect a wait on weekends, or go early on a weekday. You
  can't camp at the springs, but Bagby Campground is right by the trailhead
  if you want to stay the night. Pack out everything you bring.
