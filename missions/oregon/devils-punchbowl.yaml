short: Watch waves explode into Devils Punchbowl at Otter Rock, a sea cave with its roof caved in.
description: >
  Watch from the viewpoint as the ocean rushes into Devils Punchbowl and churns
  around the bowl. Each guess which wave will be the biggest, then try to catch
  a photo the moment one explodes up inside. At low tide, explore the tide pools
  on the north side, then warm up with something hot in Otter Rock or Depoe Bay.
about: >
  Devils Punchbowl sits in the tiny town of Otter Rock, just north of Newport.
  It was probably two sea caves until their roofs fell in, and now the ocean
  pours in through openings at the bottom. It's at its wildest at high tide and
  during winter storms.

  It's a popular spot for whale watching, and surfers ride the waves in the cove
  below. You'll need a day-use parking permit, sold on site, and parking is
  limited to the marked stalls. Newport is just down the coast, so add the [[oregon-coast-aquarium]] to the trip.
