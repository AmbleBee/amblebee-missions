short: Stand in the mist on Benson Bridge at Multnomah Falls, Oregon's tallest waterfall. Hike to the top.
description: >
  Walk up to Benson Bridge and stand in the spray of Oregon's tallest
  waterfall, then get a photo of yourself on the bridge with the upper falls
  pouring down behind you. If you're up for more, each guess how many
  switchbacks it takes to reach the top, count them on the way up to the
  viewing platform, and see who was closest. Go early on a weekday to beat the
  crowds.
about: >
  Multnomah Falls drops 620 feet in two tiers, 542 feet on top and 69 below,
  making it the tallest waterfall in Oregon, and more than two million people
  visit every year. Benson Bridge was built by Italian stonemasons and paid for
  by lumberman Simon Benson, and the stone Multnomah Falls Lodge below it was
  finished in 1925. The Multnomah people tell of a young woman who gave her life
  to save her village from sickness, after which the water began to fall.

  The trail to the top is 2.4 miles round trip with about 600 feet of climbing,
  about like 60 flights of stairs. From late May to early September, you need a
  timed-use permit to park at the I-84 lot during the day; book online at
  Recreation.gov for a small fee, or pick up a free one in Troutdale or Cascade
  Locks. The Columbia Gorge Express bus is a car-free way to get there.
