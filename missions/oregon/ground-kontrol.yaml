short: Retro arcade games and pinball at Ground Kontrol in Portland. Best of three on a game nobody knows.
description: >
  Load up at Portland's classic arcade, full of old cabinets and pinball
  machines. Each pick a game the other has never played, then go best of three
  on one that's new to everybody. Whoever wins puts their initials on the high
  score screen, and you photograph it as proof. Check the age rules if anyone
  under 21 is coming.
about: >
  Ground Kontrol opened in Portland in 1999 to keep Golden Age arcade games
  alive, and it has been in Old Town on NW 5th Avenue since 2004. It became a
  full bar in 2011 and expanded in 2017, adding more room for classic cabinets
  and long rows of pinball.

  In 2010 it won a $25,000 Save the Arcades contest and spent it on a remodel
  and more games. It hosts Portland Pinbrawl, an annual pinball tournament,
  plus DJs and live music, and Willamette Week readers voted it Portland's
  best game bar in 2020.

  It's all ages in the afternoon and 21 and over in the evening, so check the
  hours if anyone younger is coming.
