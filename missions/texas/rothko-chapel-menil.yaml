short: Sit quietly in the Rothko Chapel, then wander the free Menil Collection next door.
description: >
  Visit two of Houston's calmest places. Start at the Rothko Chapel, an
  eight-sided room with 14 huge, dark paintings by Mark Rothko, made for
  sitting in silence. Sit together for five minutes without talking, then
  share what you felt. Walk over to the Menil Collection, a free museum
  in a leafy neighborhood with everything from ancient art to surrealist
  paintings, and each pick the piece you'd take home. Get a photo of you under the big oak trees on the lawn. Both are free.
about: >
  John and Dominique de Menil asked Mark Rothko to paint the chapel's walls,
  and it opened in 1971, a year after he died. It's open to people of every
  faith and none.

  Outside stands Barnett Newman's sculpture Broken Obelisk, dedicated to
  Martin Luther King Jr. The Menil Collection building, designed by Renzo
  Piano, opened in 1987. Quiet is kept inside the chapel.
