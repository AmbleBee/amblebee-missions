  coords: [30.27160, -103.89300]  # APPROX: set at the viewing area before publishing
short: Pose at Prada Marfa in the desert, then watch for the mysterious Marfa Lights after dark.
description: >
  Start in the afternoon at Prada Marfa, a fake luxury store sitting alone on
  the side of the highway outside Valentine, an art installation in the middle
  of nowhere. Get the classic photo of the two of you in front of it. Then
  drive back toward Marfa for dinner and head to the Marfa Lights Viewing Area
  after dark. Look east across the desert for the mysterious glowing lights
  that people have reported for over a century. Each decide what you think
  they are. Bring layers and patience.
