  name: Marfa Lights Viewing Area, US 90
  area: East of Marfa
  coords: [30.27160, -103.89300]  # APPROX: set at the viewing area before publishing
short: Pose at Prada Marfa in the desert, then watch for the mysterious Marfa Lights after dark.
description: >
  Start in the afternoon at Prada Marfa, a fake luxury store sitting alone on
  the side of the highway outside Valentine, an art installation in the middle
  of nowhere. Get the classic photo of you in front of it. Then
  drive back toward Marfa for dinner and head to the Marfa Lights Viewing Area
  after dark. Look east across the desert for the mysterious glowing lights
  that people have reported for over a century. Each decide what you think
  they are. Bring layers and patience.
about: >
  Prada Marfa was built in 2005 by the artists Elmgreen and Dragset, and it
  was never meant to open. It's stocked with real Prada shoes and bags from
  2005, sealed inside. It was broken into days after it was built and has
  been repaired several times.

  The first written report of the Marfa Lights is often dated to 1883, from
  a cowboy driving cattle nearby. Marfa itself is an art town, thanks to
  Donald Judd and the Chinati Foundation.
for_kids:
  short: Mystery night! Find each thing.
  steps:
