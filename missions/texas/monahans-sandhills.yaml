short: Race each other down the white sand dunes on sand disks at Monahans Sandhills.
description: >
  Walk out into a sea of pale wind-sculpted sand dunes rising up to 70 feet in
  the middle of West Texas. Rent sand disks at the park headquarters, climb
  a big dune, and race each other to the bottom. Take turns for the best
  form, and keep score. Look for animal tracks in the sand in the morning, and
  get a photo of you on top of the highest dune you climb. Go in
  the cooler months or early in the day, since the sand gets very hot.
