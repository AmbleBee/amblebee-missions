short: Ride a vintage train through the Piney Woods on the Texas State Railroad.
description: >
  Ride a historic train through 25 miles of East Texas Piney Woods between
  Palestine and Rusk, on a line that's been running for over a century. Sit
  in a vintage coach or the open-air car, crossing creeks and trestles through
  the forest, and wave at the train coming the other way. Have lunch at the
  depot at the far end before riding back. Get a photo of the two of you in
  front of the engine. The schedule changes by season, with special holiday
  trains; book ahead.
