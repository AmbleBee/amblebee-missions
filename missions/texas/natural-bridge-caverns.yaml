short: Walk 180 feet underground through the giant rooms of Natural Bridge Caverns.
description: >
  Walk beneath a natural limestone bridge and down into the largest show cave
  in Texas, through huge rooms full of stalactites, stalagmites and formations
  that still drip and grow. On the guided tour, each find a formation that
  looks like something (an animal, a face, a castle) and name it. It's warm
  and humid underground, so dress light. Get a photo of the two of you in one
  of the big rooms. Book tour times ahead on weekends and holidays.
for_kids:
  short: Cave hunt! Find each thing.
  steps:
    - The rock bridge
    - A pointy rock on the ceiling
    - A dripping rock
    - A rock that looks like an animal
    - A selfie underground!
