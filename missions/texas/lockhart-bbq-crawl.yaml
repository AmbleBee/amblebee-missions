short: Eat your way through Lockhart, the barbecue capital of Texas. Crown the best brisket.
description: >
  Drive to Lockhart, the official barbecue capital of Texas, and visit two or
  three of its legendary smokehouses in one afternoon. Order a little brisket
  and sausage at each, eaten old-school on butcher paper, and score each one
  out of 10. Walk off the meat around the old courthouse square, then crown a
  brisket champion. Get a photo of you with your tray at the
  winner. Go hungry, go early, and expect lines and sellouts by afternoon.
about: >
  The Texas Legislature named Lockhart the Barbecue Capital of Texas in
  1999. Its oldest smokehouses date back to the early 1900s, when meat
  markets started smoking their leftover cuts.

  Kreuz Market famously served no sauce and no forks for decades. The town's
  1894 courthouse, in the middle of the square, has been restored and is
  worth a look on the way between stops.
