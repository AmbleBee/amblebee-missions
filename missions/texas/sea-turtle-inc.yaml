short: Meet rescued sea turtles at Sea Turtle Inc. on South Padre Island, then walk the beach.
description: >
  Visit a sea turtle rescue and rehab center on South Padre Island, where
  injured sea turtles are nursed back to health and released, and some
  permanent residents live in big tanks. Watch a feeding or a talk, learn each
  turtle's name and rescue story, and each pick your favorite. Then walk to
  the beach and look for shells. Get a photo of the two of you with the
  turtle tanks behind you. Admission supports the rescue work.
