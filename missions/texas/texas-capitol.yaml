short: Tour the Texas Capitol, taller than the U.S. Capitol. Look straight up into the dome.
description: >
  Walk into the pink granite Texas Capitol, built to be taller than the one
  in Washington. Stand in the center of the rotunda, look straight up at the
  star in the dome, and whisper across the rotunda to hear the echo. Take a
  free guided tour or wander on your own through the House and Senate
  chambers and the underground extension with its skylights. Get a photo of
  the two of you on the south steps with Congress Avenue behind you. It's
  free; bring ID for security.
