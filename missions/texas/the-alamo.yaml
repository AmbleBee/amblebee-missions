short: Step inside the Alamo church and learn the story of the 1836 battle.
description: >
  Visit the Alamo, the old Spanish mission where defenders held out for 13 days
  in 1836 during the Texas Revolution. Step inside the church, walk the Long
  Barrack and the gardens, and see real artifacts from the battle in the
  Collections Center exhibit. Each pick one person from the story you want to
  learn more about. Get a photo of you in front of the famous
  church front. Entry to the church is free, but you need a free timed
  ticket. The area is under big construction, so check what's open.
