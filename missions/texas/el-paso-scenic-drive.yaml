place:
  name: Murchison Rogers Park, Scenic Drive
  area: Franklin Mountains, El Paso
  coords: [31.77900, -106.48800]  # APPROX: set at the Murchison Park overlook before publishing
short: Watch two countries light up from El Paso's Scenic Drive. Find where Texas ends and Mexico begins.
description: >
  Drive up Scenic Drive on the side of the Franklin Mountains and stop at the
  overlook at Murchison Park after sunset. Below you, the lights of El Paso
  and Ciudad Juárez spread out together across the desert, two cities in two
  countries. Try to find the line of the Rio Grande and the border between
  them, and spot the big star on the mountain above. Get a photo of the two of
  you with the city lights behind you. It's free.
