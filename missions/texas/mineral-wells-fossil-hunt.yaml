short: Hunt for 300-million-year-old sea fossils in an old dirt pit, and keep what you find!
description: >
  Spend a morning crawling around an old city borrow pit outside Mineral Wells,
  where erosion has uncovered an ancient seafloor full of fossils. The most common
  finds are little crinoid stems (sea lilies), but sharp eyes also turn up shells,
  snails and, if you're lucky, a shark tooth or a trilobite, and you can keep what
  you find for personal use. It's surface collecting only, so bring zip bags, knee pads, small garden tools (no
  shovels), lots of water and some shade, since the site is primitive with only
  portable restrooms. Get a photo of the kids holding up their best find. Stay out
  of the steep, crumbly edges and enter only at the marked points, and in summer go
  early or in the evening.
