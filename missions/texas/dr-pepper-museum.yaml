short: Visit the birthplace of Dr Pepper in Waco, then share a float at the old soda fountain.
description: >
  Visit the 1906 bottling plant in Waco where Dr Pepper was invented, now a
  museum full of old bottles, vintage ads, soda machines and the story of how
  the drink began. Guess the 23 flavors together, then belly up to the
  old-fashioned soda fountain for a Dr Pepper float or a fountain drink made
  the old way. Get a photo of the two of you clinking glasses at the fountain.
  A fun, cheap rainy-day stop.
