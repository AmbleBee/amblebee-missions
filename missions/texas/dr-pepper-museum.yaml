short: Dr Pepper Museum in Waco. See where the soda was born, then share a float at the soda fountain.
description: >
  Explore the old bottling plant full of vintage bottles, ads and soda
  machines, and each try to guess as many of the "23 flavors" as you can.
  Then belly up to the old-fashioned soda fountain for a Dr Pepper float or
  a drink made the old way. The photo to get: you raising a glass at the
  fountain.
about: >
  Pharmacist Charles Alderton created Dr Pepper at a Waco drugstore in 1885,
  a year before Coca-Cola was invented, which makes it one of the oldest
  major sodas in the country. The museum is in a 1906 bottling plant.

  Look for the old "Drink a bite to eat at 10, 2 and 4" ads, from when the
  company told people the best times of day to have a Dr Pepper. It's a fun,
  inexpensive stop on a rainy day.
