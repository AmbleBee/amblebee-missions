  name: San Antonio River Walk (GO RIO boarding)
  area: Downtown San Antonio
  coords: [29.42400, -98.48900]  # APPROX: set at a downtown barge stop before publishing
short: Ride a river barge through San Antonio's River Walk at night, then eat dinner by the water.
description: >
  Take a narrated river barge ride through the San Antonio River Walk after
  dark, gliding under stone bridges and cypress trees past restaurants lit
  with strings of lights. Then get off and walk the stone paths below street
  level, find a riverside table for Tex-Mex and margaritas, and watch the boats
  drift by. Get a photo of the two of you on one of the arched bridges. Around
  the holidays the trees are covered in lights.
for_kids:
