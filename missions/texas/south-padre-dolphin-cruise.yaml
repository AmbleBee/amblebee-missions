short: Take a sunset dolphin-watching cruise on South Padre's calm Laguna Madre.
description: >
  Board a sunset cruise on the calm Laguna Madre, on the bay side of South
  Padre Island, where wild bottlenose dolphins often swim right up to the boat.
  Watch them surface and ride the wake, and count how many you see. As the sun
  goes down over the bay and the causeway lights come on, get a photo of you at the rail. Several companies run cruises from the bay-side docks;
  book ahead and bring a light jacket.
