short: See Columbian mammoth fossils right where they died at Waco Mammoth National Monument.
description: >
  Walk into a covered dig shelter where the fossils of a herd of Columbian
  mammoths still lie in the ground right where they were found, along with a
  camel and other Ice Age animals. On the guided tour, hear the mystery of
  how the herd died together, and each guess what happened before the guide
  explains. Get a photo of you by the giant bones. It's a small
  site with a modest entrance fee.
for_kids:
  short: Mammoth hunt! Find each thing.
  steps:
    - A giant bone
    - A mammoth tusk
    - A tooth
    - The dig pit
    - A selfie with the mammoths!
