short: Float the cool, clear Comal River on tubes in New Braunfels, and ride the Tube Chute.
description: >
  Rent tubes and float the Comal River, a short, spring-fed river that stays
  cool and clear even in the Texas summer. Link your tubes together, drift
  under the oak trees, and ride the Tube Chute, a fast concrete slide around
  the old dam. Get a photo of you floating. Wear water shoes and
  sunscreen, and keep in mind that New Braunfels doesn't allow disposable
  containers on its rivers. Outfitters run shuttles back to the start.
about: >
  The Comal starts at Comal Springs, the largest springs in Texas, and runs
  only about 2.5 miles before joining the Guadalupe, which is why it's
  called one of the shortest rivers in the country. The spring water stays
  around 72 degrees all year.

  New Braunfels was settled by German immigrants in 1845, and the town still
  holds Wurstfest every November. Summer weekends on the river are packed,
  so go early or on a weekday for a calmer float.
