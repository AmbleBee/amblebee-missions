short: Walk the brick streets of Nacogdoches, which claims to be the oldest town in Texas.
description: >
  Spend a day in Nacogdoches, which calls itself the oldest town in Texas, with
  brick streets, a historic downtown square full of shops and cafés, and old
  stories of nine flags flown over the town. Walk the brick streets, visit
  the reconstructed Old Stone Fort on the university campus, and stroll the
  big azalea gardens (at their best in early spring). Each pick the old
  building you'd move into. Get a photo of the two of you on the brick
  street downtown.
for_kids:
