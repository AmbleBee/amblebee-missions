  coords: [31.60400, -94.65500]  # APPROX: set at the downtown square before publishing
short: Walk the brick streets of Nacogdoches, which claims to be the oldest town in Texas.
description: >
  Spend a day in Nacogdoches, which calls itself the oldest town in Texas, with
  brick streets, a historic downtown square full of shops and cafés, and old
  stories of nine flags flown over the town. Walk the brick streets, visit
  the reconstructed Old Stone Fort on the university campus, and stroll the
  big azalea gardens (at their best in early spring). Each pick the old
  building you'd move into. Get a photo of you on the brick
  street downtown.
about: >
  Caddo people lived here long before the Spanish built a mission nearby in
  1716. Antonio Gil Ybarbo founded the town in 1779, and it's often called
  the oldest town in Texas. Texas's first newspaper was printed here in
  1813.

  The Old Stone Fort on the Stephen F. Austin State University campus is a
  1930s rebuild of Ybarbo's stone house. The Ruby Mize Azalea Garden, also
  on campus, is one of the largest in Texas.
for_kids:
