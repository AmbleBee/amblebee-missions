short: Say howdy to Big Tex at the State Fair of Texas, then split the weirdest fried food you can find.
description: >
  Go to the biggest state fair in the country, held every fall at Fair Park's
  art deco grounds. Say howdy to Big Tex, the 55-foot talking cowboy, ride the
  Texas Star Ferris wheel, and hunt down the strangest fried food of the year
  (they invent new ones every season) to split. Rate each one out of 10.
  Get a photo of you with Big Tex. The fair runs from late
  September through mid-October; buy tickets ahead.
about: >
  The State Fair of Texas began in 1886. Fair Park's buildings went up for
  the 1936 Texas Centennial Exposition and form one of the largest
  collections of Art Deco buildings in the country.

  Big Tex first appeared in 1952. He burned in 2012 and was rebuilt for the
  next year. The Texas Star Ferris wheel is over 200 feet tall, and the
  University of Texas plays Oklahoma in the Cotton Bowl here during the
  fair.
