short: Say howdy to Big Tex at the State Fair of Texas, then split the weirdest fried food you can find.
description: >
  Go to the biggest state fair in the country, held every fall at Fair Park's
  art deco grounds. Say howdy to Big Tex, the 55-foot talking cowboy, ride the
  Texas Star Ferris wheel, and hunt down the strangest fried food of the year
  (they invent new ones every season) to split. Rate each one out of 10.
  Get a photo of the two of you with Big Tex. The fair runs from late
  September through mid-October; buy tickets ahead.
