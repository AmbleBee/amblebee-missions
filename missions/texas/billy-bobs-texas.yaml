short: Two-step and watch live bull riding at Billy Bob's, the world's largest honky-tonk.
description: >
  Spend a night at Billy Bob's Texas, a giant honky-tonk in an old cattle
  barn with a big dance floor, dozens of bar stations and a live country
  concert stage. Watch live bull riding in the indoor arena on weekend nights,
  then take a two-step lesson if they're offering one and get out on the dance
  floor together. Get a photo of you in front of the giant stage.
  Check the concert calendar; ages and cover vary by night.
about: >
  Billy Bob's opened in 1981 in an old barn that once held cattle at the
  Stockyards, and it calls itself the world's largest honky-tonk, with room
  for thousands of people.

  Its Wall of Fame holds handprints of country stars who have played here.
  The bull riding happens in a real indoor arena, with professional riders.
  The rest of the Stockyards is a short walk away for food before the show.
