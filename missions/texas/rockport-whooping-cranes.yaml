short: Take a winter boat tour from Rockport to see endangered whooping cranes in the marsh.
description: >
  In winter, the last natural flock of endangered whooping cranes, the tallest
  bird in North America, spends the season in the marshes of the Aransas
  National Wildlife Refuge. Take a morning boat tour from Rockport-Fulton out
  into the bay to see the white cranes up close, along with roseate spoonbills,
  pelicans, herons and dolphins. Keep a list of every bird you spot together.
  Get a photo of the two of you on the boat with the marsh behind you. Tours
  run roughly November through March; book ahead and bring binoculars.
