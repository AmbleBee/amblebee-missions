place:
  name: Cadillac Ranch
  area: I-40, west of Amarillo
  coords: [35.18700, -101.98700]  # APPROX: set at the roadside gate before publishing
short: Spray-paint your mark on the half-buried Cadillacs at Cadillac Ranch outside Amarillo.
description: >
  Walk out into a cow pasture along old Route 66 to ten classic Cadillacs
  buried nose-down in the dirt, covered in thousands of layers of spray paint.
  Bring a few cans of spray paint (there are often leftover cans lying
  around), and each paint something on a car for the other. Get a photo of you with your artwork before someone paints over it. It's free
  and always open. Wear old shoes, since it's often muddy, and pack out your
  empty cans.
for_kids:
  short: Paint the cars! Do each thing.
  steps:
    - Find a buried car
    - Pick a paint color
    - Paint your name
    - Find the oldest paint
    - A selfie with your art!
