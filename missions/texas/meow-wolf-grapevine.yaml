short: Explore Meow Wolf's The Real Unreal in Grapevine. Open every door and find the secret rooms.
description: >
  Step into The Real Unreal, a giant, immersive art world where a normal-
  looking house opens into glowing rooms, hidden passages and surreal
  landscapes. Open every door, climb into the fridge, and follow the clues of
  a mystery story hidden around the rooms, or just wander and get lost
  together. Each find the strangest room and show it to the other. Get a
  photo of the two of you in the most colorful room. Buy timed tickets
  ahead; plan on two hours.
