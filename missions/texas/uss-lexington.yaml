short: Explore the WWII aircraft carrier USS Lexington, from the flight deck to the engine room.
description: >
  Climb aboard the USS Lexington, a World War II aircraft carrier nicknamed "the
  Blue Ghost," now a museum on Corpus Christi Bay. Walk the flight deck past
  dozens of real planes, climb up to the bridge, and squeeze through the
  narrow passages down to the engine room and crew bunks. Each pick the job
  you'd want on the ship. Get a photo of you on the flight deck with
  the bay behind you. Plan on half a day; there's a lot of ship.
about: >
  The Lexington was commissioned in 1943 and fought across the Pacific in
  World War II. Japan reported it sunk at least four times, but it kept
  coming back, so Tokyo Rose called it "the Blue Ghost."

  It served until 1991, mostly as a training carrier, and by then it was the
  oldest working carrier in the Navy. It became a museum in 1992. Some decks
  have steep ladders, so wear good shoes.
