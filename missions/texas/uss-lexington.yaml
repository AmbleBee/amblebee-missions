short: Explore the WWII aircraft carrier USS Lexington, from the flight deck to the engine room.
description: >
  Climb aboard the USS Lexington, a World War II aircraft carrier nicknamed "the
  Blue Ghost," now a museum on Corpus Christi Bay. Walk the flight deck past
  dozens of real planes, climb up to the bridge, and squeeze through the
  narrow passages down to the engine room and crew bunks. Each pick the job
  you'd want on the ship. Get a photo of the two of you on the flight deck with
  the bay behind you. Plan on half a day; there's a lot of ship.
for_kids:
