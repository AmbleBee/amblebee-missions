short: Ride the tram to NASA's Mission Control and stand under a giant Saturn V rocket.
description: >
  Visit the home of NASA's astronaut program. Take the tram tour onto the
  Johnson Space Center campus to see the historic Apollo Mission Control and
  walk the length of a real Saturn V moon rocket lying on its side, one of
  only three left. Back at the center, touch a moon rock, walk through the
  shuttle replica on top of its carrier jet, and each pick the mission you'd
  sign up for. Get a photo of the two of you under the rocket engines. Book
  tickets ahead; tram tour times fill up.
for_kids:
  short: Space hunt! Find each thing.
  steps:
