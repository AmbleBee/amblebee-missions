place:
  name: The Pearl
  area: North of downtown San Antonio, on the River Walk
  coords: [29.44200, -98.48000]  # APPROX: set at Pearl Park before publishing
short: Wander the weekend farmers market at the Pearl, an old brewery turned food hub.
description: >
  Spend a weekend morning at the Pearl, an old 1880s brewery complex on the
  San Antonio River turned into shops, restaurants and a big farmers market.
  Stroll the stalls, each buy one thing the other has never tried, and get
  coffee and pastries for a breakfast by the river. Walk a stretch of the
  quieter northern River Walk after. Get a photo of the two of you in front of
  the old brewhouse tower. The market runs Saturday and Sunday mornings.
for_kids:
