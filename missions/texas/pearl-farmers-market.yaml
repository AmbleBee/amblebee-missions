place:
  name: The Pearl
  area: North of downtown San Antonio, on the River Walk
  address: 303 Pearl Pkwy, San Antonio, TX 78215
  coords: [29.44222, -98.47936]
short: Pearl Farmers Market in San Antonio. Wander the stalls at an old brewery turned food hub.
description: >
  Spend a Saturday morning at the Pearl, an old 1880s brewery complex on the
  San Antonio River turned into shops, restaurants and a big farmers market.
  Stroll the stalls, catch the cooking demo or live music, and buy one thing
  you've never tried; if you came with others, swap bites. Get coffee and
  pastries for a breakfast by the river, then walk a stretch of the quieter
  northern River Walk. Get a photo of you in front of the old brewhouse
  tower.
about: >
  The Pearl Brewery made beer here from 1883 until 2001. The old brewhouse
  is now the Hotel Emma, named for Emma Koehler, who ran the brewery after
  her husband died in 1914. The Culinary Institute of America has a campus
  here too, so the food scene is serious.

  The Saturday farmers market is producer-only, with every vendor from
  within about 150 miles of the city, and it's been named one of the best in
  the country. Sunday brings a different makers market. The River Walk's
  Museum Reach runs from the Pearl south toward downtown, past public art and
  a lock and dam that boats go through.
for_kids:
  short: Market hunt! Can you find them all?
  steps:
    - A big pile of fruit
    - Something you never tried
    - Flowers for sale
    - The old brewery tower
    - A selfie at the market!
