short: Hike down to Hamilton Pool, a jade-green grotto under a waterfall and a collapsed limestone dome.
description: >
  Walk a short, steep trail down into a canyon to a jade-green pool under a
  huge collapsed limestone dome, with a waterfall spilling off the edge.
  Walk behind the falls under the overhang, and if swimming is open that day,
  take a dip from the little beach. Get a photo of the two of you under the
  overhang with the waterfall behind you. A reservation is required every
  day, in a morning or afternoon time slot, and swimming depends on water
  quality and falling-rock danger. Bring cash for the entry fee.
