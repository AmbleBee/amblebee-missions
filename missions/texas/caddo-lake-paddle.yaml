short: Paddle through the cypress swamp of Caddo Lake, draped in Spanish moss, in the misty morning.
description: >
  Rent a canoe and paddle out early into Caddo Lake, a maze of bayous and
  sloughs filled with giant cypress trees dripping with Spanish moss. Follow
  the marked paddling trails through the quiet water, watching for herons,
  turtles, and maybe an alligator sunning on a log (keep your distance). Turn
  off your voices for a minute and just float. Get a photo of you
  in the canoe under the moss. Bring a map, since it's easy to get turned
  around, or take a guided boat tour instead.
about: >
  Caddo is Texas's only large natural lake. It formed behind the Great Raft,
  a log jam on the Red River more than 100 miles long, and legend says the
  New Madrid earthquakes helped. A dam added in 1914 keeps the water level
  steady today.

  Caddo holds one of the largest flooded cypress forests in the world, with
  trees hundreds of years old, and it's a wetland of international
  importance. The park's cabins were built by the Civilian Conservation
  Corps in the 1930s.
for_kids:
