short: Hang out in tiny Luckenbach, where everybody's somebody. Catch a pickers' circle.
description: >
  Visit Luckenbach, a town so small it's basically a general store, a dance
  hall and a few shady oak trees, made famous by the country song. Grab a cold
  drink from the store (which is also the post office) and sit in on a
  pickers' circle, where local musicians play acoustic songs under the trees.
  Each pick your favorite song of the afternoon. Get a photo of the two of you
  at the old general store. Weekends usually have live music; check the
  schedule.
for_kids:
