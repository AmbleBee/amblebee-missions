short: Luckenbach, Texas, where everybody's somebody. Grab a cold drink and catch a pickers' circle.
description: >
  Visit Luckenbach, a town so small it's basically a general store, a dance
  hall and a few shady oak trees, made famous by the country song. Grab a cold
  drink from the store, which still wears its old post office sign, and sit in
  on a pickers' circle, where local musicians play acoustic songs under the
  trees most days, especially weekends. Pick your favorite song of the
  afternoon. Get a photo with the bronze bust of Hondo Crouch out front.
about: >
  German settlers founded Luckenbach in the 1840s, and its combination general
  store, post office and beer joint opened in 1886. By 1970 the town was nearly
  empty and listed in the paper as "town, pop. 3, for sale," so local
  character Hondo Crouch and two partners bought it for $30,000 and turned it
  into a party spot. The post office closed for good in 1971.

  Waylon Jennings' 1977 hit "Luckenbach, Texas" made it famous. The town's
  motto is "Everybody's Somebody in Luckenbach," and there are bigger
  concerts at the dance hall on some weekends, so check the schedule.
