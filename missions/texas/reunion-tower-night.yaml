short: Ride up Reunion Tower after dark and see the Dallas lights from 470 feet up.
description: >
  Ride the glass elevator up Reunion Tower, the glowing ball on the Dallas
  skyline, to the GeO-Deck about 470 feet up. Go after sunset, when the city
  lights spread out in every direction, and walk the whole way around the
  deck, inside and out. Use the touchscreens to zoom in on landmarks, and
  each try to find where you came from. Get a photo of you with
  the skyline behind you. Buy tickets ahead for sunset.
about: >
  Reunion Tower opened in 1978 and rises 561 feet. Its ball is covered in
  hundreds of LED lights that put on shows at night, often in team colors on
  game days.

  The GeO-Deck has indoor and outdoor viewing, with free telescopes and
  touchscreens. The restaurant above it slowly turns, so you can eat while
  the view goes around.
for_kids:
  short: Tower hunt! Find each thing.
  steps:
    - The glass elevator
    - The city lights
    - A highway full of cars
    - A tall building
    - A selfie at the top!
