short: Ride up Reunion Tower after dark and see the Dallas lights from 470 feet up.
description: >
  Ride the glass elevator up Reunion Tower, the glowing ball on the Dallas
  skyline, to the GeO-Deck about 470 feet up. Go after sunset, when the city
  lights spread out in every direction, and walk the whole way around the
  deck, inside and out. Use the touchscreens to zoom in on landmarks, and
  each try to find where you came from. Get a photo of the two of you with
  the skyline behind you. Buy tickets ahead for sunset.
for_kids:
