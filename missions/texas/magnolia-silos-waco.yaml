short: Wander Magnolia's Silos in Waco, grab a cupcake, and play on the big green lawn.
description: >
  Spend a morning at the Silos, a pair of old cotton-seed silos in downtown
  Waco turned into a market, bakery, garden and big green lawn. Split a
  cupcake from the bakery, browse the shops, grab lunch from the food trucks,
  and play a game of lawn games on the turf. Each pick one thing you'd put in
  your dream house. Get a photo of the two of you in front of the silos. Free
  to visit; go early to beat the weekend crowds.
