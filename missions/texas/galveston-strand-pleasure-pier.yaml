short: Galveston's Strand and Pleasure Pier. Watch taffy pulled, then ride a coaster over the Gulf.
description: >
  Start in the Strand district, rows of Victorian iron-front buildings full
  of candy shops and antiques, and watch saltwater taffy being pulled. Then
  head to the Seawall and walk out on the Pleasure Pier, an amusement park
  built over the Gulf. Ride the coaster that swoops out over the water, and
  everyone rates the scream factor. The photo to get: you on the pier with
  the waves below.
about: >
  In the 1800s, the Strand was called the "Wall Street of the Southwest."
  Then the Great Storm of 1900 struck, the deadliest natural disaster in
  U.S. history. Afterward, Galveston built the Seawall and raised the whole
  city.

  A pier has stood on this spot since the 1940s; today's Pleasure Pier
  opened in 2012. It runs fewer days in the off-season, so check before you
  go.
