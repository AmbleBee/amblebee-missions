short: Ride the little ferry to Port Aransas for a lazy beach day and a walk on the fishing pier.
description: >
  Take the short free ferry over to Port Aransas, a laid-back fishing town on
  Mustang Island. Spend the day on the wide sandy beach, walk out on the long
  fishing pier to watch the anglers and pelicans, and look for dolphins in the
  ship channel. Build the biggest sandcastle you can together, then grab
  seafood in town. Get a photo of you on the pier. You can drive on
  parts of the beach with a beach parking permit.
about: >
  Port Aransas started as a fishing village on Mustang Island and became
  famous for tarpon fishing. The Tarpon Inn, built in 1886, has a wall of
  tarpon scales signed by guests, including Franklin D. Roosevelt in 1937.

  Hurricane Harvey hit the town nearly head-on in 2017, and it has been
  rebuilt since. The free ferry from Aransas Pass is often the quickest way
  in, and dolphins follow the boats in the channel.
