short: Tour Houston's echoing underground Cistern, a forest of 221 columns under Buffalo Bayou Park.
description: >
  Walk down into Houston's old underground drinking-water reservoir from
  1926, a dark, echoing room bigger than a football field, held up by 221
  tall concrete columns that reflect in a thin layer of water. On the guided
  history tour, listen to the guide show off the echo, which hangs in the
  air for about 17 seconds, or book one of the art or sound experiences
  held inside. Then walk the Buffalo Bayou trails with the downtown skyline
  behind you. The photo to get: you on the walkway with the columns
  stretching away into the dark. Book tour tickets ahead.
about: >
  The Cistern was built in 1926 as one of Houston's first underground
  drinking-water reservoirs, holding 15 million gallons. After an
  irreparable leak was found in 2007, it was taken out of service, and the
  Buffalo Bayou Partnership turned it into a public space that opened in
  May 2016.

  Inside, 221 slender concrete columns, each 25 feet tall, stand in rows
  across 87,500 square feet. The room's echo lasts about 17 seconds, which
  makes it a favorite space for sound and light art. Along with the
  history tours, the Cistern hosts rotating art installations and sound
  meditation sessions.

  Up top, Buffalo Bayou Park's trails follow the water right into
  downtown, with skyline views, bike paths and a big lawn for picnics.
caution: Children under 9 aren't allowed inside the Cistern.
