short: Tour Houston's echoing underground Cistern, a forest of 221 columns under Buffalo Bayou Park.
description: >
  Walk down into an old underground drinking-water reservoir from 1926, a
  dark, echoing room the size of one and a half football fields, held up by
  221 tall concrete columns that reflect in a few inches of water. On the
  guided tour, listen to the guide demonstrate the echo, which lasts for
  seconds, and catch any art installation that's being shown inside. Then
  walk the Buffalo Bayou trails with the skyline behind you, and get a photo
  of you there. Book tour tickets ahead.
about: >
  The Cistern was built in 1926 to hold Houston's drinking water. It sprang
  a leak and was shut down in 2007, then forgotten until the city
  rediscovered it a few years later. Buffalo Bayou Partnership opened it to
  visitors in 2016.

  Its 221 concrete columns stand 25 feet tall, and the echo lasts about 17
  seconds. Some tours are guided and some feature light and sound art. The
  bayou trails outside run right into downtown.
