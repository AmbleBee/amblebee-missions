place:
  name: Fort Worth Stockyards National Historic District
  area: Exchange Ave, Fort Worth
  coords: [32.78900, -97.34900]  # APPROX: set on Exchange Ave before publishing
  website: https://www.fortworthstockyards.org
short: Watch real longhorns drive down the street at the Fort Worth Stockyards. Buy a cowboy hat.
description: >
  Walk the brick streets and old cattle pens of the Fort Worth Stockyards,
  where cowboys still drive a herd of Texas longhorns right down Exchange
  Avenue twice a day. Find a spot along the street for the cattle drive,
  then explore the Western shops, try on cowboy hats, and get lost in the
  Cowtown cattle pen maze. Get a photo of you with a longhorn
  behind you. The cattle drive is free; check the times.
about: >
  From the 1860s to the 1880s, millions of cattle were driven up the
  Chisholm Trail through Fort Worth, which earned it the name Cowtown. The
  Stockyards opened in the 1880s, and the Livestock Exchange Building
  followed in 1903.

  The Fort Worth Herd has driven longhorns down Exchange Avenue since 1999.
  The district is on the National Register of Historic Places, and the
  Stockyards Championship Rodeo runs on weekend nights.
