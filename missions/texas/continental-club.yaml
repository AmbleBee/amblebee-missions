short: Dance to live honky-tonk, rockabilly or soul at Austin's legendary Continental Club.
description: >
  Spend a night in the Live Music Capital of the World at the Continental
  Club, a tiny, red-lit South Congress bar that's been booking live bands since
  1955. Check the calendar for a band you like, from honky-tonk and rockabilly
  to soul and swing, get there early, and get out on the little dance floor.
  Before the show, walk South Congress for dinner and the "I love you so much"
  mural, and get a photo of the two of you in front of it. Cover is usually
  cheap; it's 21 and up most nights.
