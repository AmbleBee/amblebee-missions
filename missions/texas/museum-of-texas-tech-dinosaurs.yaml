short: Hunt for dinosaurs at the free Texas Tech museum. Find the biggest skeleton in the building.
description: >
  Spend an easy, free afternoon at the Museum of Texas Tech University on the
  edge of campus in Lubbock. Start with the T. rex and Triceratops skeleton casts
  that have greeted visitors near the entrance, find the mammoth in the Ice
  Age room, wander the West Texas history halls, and let the kids pick which
  skeleton is the scariest. If the Moody Planetarium has a show on while you're there,
  it's worth checking the schedule. Get a photo of the whole family standing
  in front of the biggest dinosaur you can find. The museum is closed Mondays
  and over university breaks, so check before you go.
