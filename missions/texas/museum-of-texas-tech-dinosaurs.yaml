short: Museum of Texas Tech in Lubbock. Go on a free dinosaur hunt and find the biggest skeleton.
description: >
  Start with the dinosaur skeleton casts near the entrance, find the
  mammoth in the Ice Age room, and wander the West Texas history halls.
  Let the kids lead the hunt and vote on which skeleton is the scariest.
  The photo to get: the whole family standing in front of the biggest
  dinosaur you can find.
about: >
  The museum is free and sits on the edge of the Texas Tech campus. Its
  collection reaches far beyond dinosaurs, with art, natural history and
  the story of the people who lived on the Southern Plains.

  If the Moody Planetarium has a show while you're there, it's worth
  adding. The museum is closed some days and over university breaks, so
  check the hours before you go.
