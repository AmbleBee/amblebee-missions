  coords: [32.34300, -95.32200]  # APPROX: set at the rose garden entrance before publishing
short: Wander 14 acres of roses at the Tyler Rose Garden. Each pick a favorite and find its name.
description: >
  Walk through the biggest public rose garden in the country, in Tyler, the
  Rose Capital of America, with tens of thousands of rosebushes in hundreds
  of varieties. Each find your favorite rose and look up its name on the
  little sign, then smell as many as you can. Find the gazebo and the
  reflection pond, and get a photo of the two of you surrounded by roses. It's
  free; blooms peak in late spring and again in fall, and the Texas Rose
  Festival is each October.
