short: Two-step at Gruene Hall, Texas's oldest dance hall, under the wooden rafters.
description: >
  Go dancing at Gruene Hall, a wooden dance hall built in 1878 that's still
  open every day, with live country music under the old rafters and screen
  windows. Don't know how to two-step? Watch the regulars for a song, then
  get out there and figure it out together. Grab a cold drink, walk the little
  town of Gruene before the show, and get a photo of the two of you on the
  dance floor. Check the calendar for the band, and buy tickets ahead for big
  names.
