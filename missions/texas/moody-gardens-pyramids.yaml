short: Walk through the rainforest and aquarium inside Moody Gardens' giant glass pyramids.
description: >
  Explore three giant glass pyramids on Galveston Island. Inside the
  Rainforest Pyramid, walk through a steamy jungle with free-flying birds,
  monkeys, sloths and giant fish. In the blue Aquarium Pyramid, walk through
  tunnels with sharks and rays swimming overhead and watch the penguins. Each
  pick the animal you'd adopt. Get a photo of the two of you in the shark
  tunnel. It's a good rainy-day plan; buy a combo ticket for the pyramids you
  want.
for_kids:
  short: Pyramid hunt! Find each thing.
