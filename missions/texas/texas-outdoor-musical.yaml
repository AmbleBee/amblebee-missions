short: Watch the TEXAS musical under the stars, with the canyon wall lit up as the backdrop.
description: >
  Watch TEXAS, an outdoor musical about Panhandle pioneers, performed in an
  amphitheater right inside Palo Duro Canyon, with a 600-foot canyon wall as
  the backdrop. There's singing, dancing, horses galloping across the stage,
  a thunderstorm, and fireworks lighting up the cliffs. Come early for the
  barbecue dinner before the show. Get a photo of you with the lit
  canyon wall behind you. It runs only in summer; buy tickets ahead.
