short: Learn about President Kennedy's life and the 1963 assassination at the Sixth Floor Museum.
description: >
  Visit the old Texas School Book Depository, where the Sixth Floor Museum
  tells the story of President John F. Kennedy's life, his 1963 assassination
  in Dallas, and the investigation that followed. The audio guide walks you
  past the corner window overlooking Dealey Plaza. Afterward, walk the plaza
  and the grassy knoll, and talk about what you each learned that surprised
  you. Buy timed tickets ahead. It's a serious, moving visit.
