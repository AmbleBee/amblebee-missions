short: Climb the giant pink granite dome of Enchanted Rock for sunrise over the Hill Country.
description: >
  Get to the park as it opens and climb the Summit Trail up a huge pink
  granite dome rising over the Hill Country. It's a steep climb but short, about
  a mile. At the top, watch the sun come up over the hills and find the
  little pools on the rock. On cool nights the rock is said to make creaking
  "groaning" sounds as it changes temperature. Get a photo of the two of you
  on the summit. Reservations are required on weekends and holidays, and the
  park fills up most days, so book ahead.
for_kids:
