short: Eat at The Big Texan in Amarillo and watch (or try!) the famous 72-ounce steak challenge.
description: >
  Have dinner at The Big Texan, a giant yellow cowboy-themed steakhouse on
  Route 66, famous for its challenge: finish a 72-ounce steak dinner in an
  hour and it's free. Watch the challengers eat on a stage in the middle of the
  dining room (it's also streamed online), and decide together whether either of
  you would try it. Order a normal steak and split dessert, then get a photo of
  the two of you with the giant cowboy statue out front.
