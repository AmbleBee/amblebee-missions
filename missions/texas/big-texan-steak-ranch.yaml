short: Eat at The Big Texan in Amarillo and watch (or try!) the famous 72-ounce steak challenge.
description: >
  Have dinner at The Big Texan, a giant yellow cowboy-themed steakhouse on
  Route 66, famous for its challenge: finish a 72-ounce steak dinner in an
  hour and it's free. Watch the challengers eat on a stage in the middle of the
  dining room (it's also streamed online), and decide together whether either of
  you would try it. Order a normal steak and split dessert, then get a photo of you with the giant cowboy statue out front.
about: >
  The Big Texan opened on Route 66 in 1960 and moved out to the new
  interstate in 1970. The free 72-ounce steak dinner has been on offer from
  the start, and only a small share of challengers ever finish it.

  Competitive eaters have finished in under ten minutes, and the record
  holders are on the wall. The ranch also has a motel with a Western false
  front, a brewery, and limos with horns on the hood that will pick you up
  from your hotel.
