short: Bike the river trail between San Antonio's old Spanish missions in the cool morning.
description: >
  Rent bikes and ride the Mission Reach trail along the San Antonio River,
  linking four Spanish missions from the 1700s that are still active
  churches: Concepción, San José, San Juan and Espada. Start early to beat
  the heat, and stop at Mission San José, the "Queen of the Missions," to
  explore its stone walls and the carved Rose Window. Ride on to Espada to
  see an aqueduct that has carried water for nearly 300 years. Pick your
  favorite mission of the day. The photo to get: you at the Rose Window. The
  missions and the trail are free.
about: >
  San Antonio's four southern missions, Concepción, San José, San Juan and
  Espada, were moved to the river here in the 1720s and 1730s, and they
  still hold services as active Catholic parishes. They became a national
  historical park in 1983, and in 2015 they and the Alamo were named a
  UNESCO World Heritage Site, the only one in Texas.

  The Mission Reach project, finished in 2013, restored this stretch of the
  San Antonio River and added about 15 miles of trails for biking, walking
  and paddling, so you can ride from mission to mission along the water. At
  Mission Espada, a stone aqueduct from the 1730s, now a National Historic
  Landmark, still carries water over a creek to nearby fields.

  Mission San José is the largest of the four, with a visitor center and
  rangers to answer questions. Bike-share stations sit along the trail if
  you don't want to rent, and summer mornings are by far the most
  comfortable time to ride.
