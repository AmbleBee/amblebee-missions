short: Bike the river trail between San Antonio's old Spanish missions in the cool morning.
description: >
  Rent bikes and ride the Mission Reach trail along the San Antonio River,
  linking four old Spanish missions from the 1700s that are still active
  churches. Start early to beat the heat, and stop at Mission San José, the
  "Queen of the Missions," to explore the stone walls and the carved rose
  window. Each pick your favorite mission. Get a photo of you at
  the rose window. The missions and trail are free.
about: >
  Four Spanish missions were built along the river in the 1700s, and their
  churches still hold services. In 2015 they and the Alamo became a UNESCO
  World Heritage Site, the only one in Texas.

  At Mission Espada, a stone aqueduct from the 1730s still carries water
  over a creek to nearby fields. San Antonio bike share stations sit along
  the trail if you don't want to rent.
for_kids:
  short: Mission ride! Find each thing.
  steps:
    - An old stone church
    - A bell tower
    - The river
    - A carved window
    - A selfie on your bike!
