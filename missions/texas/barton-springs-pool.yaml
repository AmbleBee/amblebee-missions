short: Take a morning swim in Barton Springs, a spring-fed pool that stays about 68 degrees all year.
description: >
  ump into a three-acre natural pool fed by underground springs, where the
  water stays around 68 to 70 degrees all year. Go in the morning when the
  water is calm and the crowds are smaller, and challenge each other to
  brave the chilly water. Look for signs about the tiny endangered Barton
  Springs salamander, then dry off on the grassy hillside. Get a photo
  together by the water. Admission is inexpensive during the paid season,
  but the pool sometimes closes for cleaning or flooding, so check the hours
  and conditions before you go.
about: >
  Barton Springs is fed by the Edwards Aquifer, and people have swum here
  for well over a century. The pool is about 900 feet long and holds a
  steady temperature around 68 to 70 degrees, which feels freezing in August
  and warm in January.

  The Barton Springs salamander lives only here and in a few nearby springs,
  and it was listed as endangered in 1997. The pool sits in Zilker Park, so
  pair a swim with a walk on the Butler Trail along Lady Bird Lake.
