short: Take a morning swim in Barton Springs, a spring-fed pool that stays about 68 degrees all year.
description: >
  Jump into a three-acre natural pool fed by underground springs, where the
  water stays around 68 degrees all year, crystal clear over a rocky bottom.
  Go first thing in the morning, when it's calm and the locals are doing laps,
  and dare each other to jump in without wading. Watch for the tiny Barton
  Springs salamander signs, then dry off on the grassy hill. Get a photo of the
  two of you by the water. It's cheap, but it closes now and then for cleaning
  or floods, so check before you go.
