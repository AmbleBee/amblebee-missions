short: Japanese Tea Garden in San Antonio. Wander koi ponds and stone bridges in an old quarry.
description: >
  Explore a lush garden built inside an old limestone quarry, with stone
  bridges, a 60-foot waterfall, shady paths and ponds full of giant koi. Walk
  down into the sunken garden, cross the bridges, and pick your favorite
  quiet spot. Look up at the old quarry walls and the pagoda pavilion. Get a
  photo of you on one of the stone bridges. It's free, and the café makes a
  nice stop for lunch.
about: >
  The city turned an old limestone quarry into the garden around 1918, using
  prison labor. In 1919 the Japanese-American artist Kimi Eizo Jingu moved
  in, and his family lived on the grounds for more than 20 years, opening a
  tea house in their stone home in 1926. That house turned 100 in 2026.

  In 1942, during World War II, the family was evicted and the garden
  renamed the Chinese Tea Garden. The concrete "wood" entrance gate by faux
  bois artist Dionicio Rodriguez went up that same year and carried the
  Chinese name for decades. The city restored the original name in 1984.
  The upper garden and café are reachable by ramp, but the lower garden is
  stairs only.
for_kids:
  short: Garden hunt! Can you find them all?
  steps:
    - A big koi fish
    - The waterfall
    - A stone bridge
    - A turtle
    - A selfie on the bridge!
