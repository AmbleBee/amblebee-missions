short: Swim with little fish in Balmorhea's giant spring-fed desert pool.
description: >
  Swim in a huge, crystal-clear pool fed by a desert spring, deep in the
  middle with a bottom of rocks and swaying plants. Put on goggles and swim
  with the little native fish and turtles, and watch the springs bubble up
  from the bottom. It's a surprising oasis in the West Texas desert, cool even
  on hot days. Get a photo of you by the blue water. Day passes
  sell out in summer and on weekends, so buy them ahead.
about: >
  The pool is fed by San Solomon Springs, which push out millions of gallons
  of water a day. The Civilian Conservation Corps built it in the 1930s
  around the spring, and at about 25 feet deep in places it's popular with
  scuba divers too.

  Two endangered desert fish live here, the Comanche Springs pupfish and the
  Pecos gambusia, which is why there's no soap or sunscreen spray in the
  water. Weekends and summer days fill up, so reserve ahead.
