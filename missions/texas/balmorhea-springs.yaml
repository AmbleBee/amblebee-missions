short: Swim with little fish in Balmorhea's giant spring-fed desert pool.
description: >
  Swim in a huge, crystal-clear pool fed by a desert spring, deep in the
  middle with a bottom of rocks and swaying plants. Put on goggles and swim
  with the little native fish and turtles, and watch the springs bubble up
  from the bottom. It's a surprising oasis in the West Texas desert, cool even
  on hot days. Get a photo of the two of you by the blue water. Day passes
  sell out in summer and on weekends, so buy them ahead.
