short: Taste your way through Fredericksburg's Hill Country wineries, then stroll Main Street.
description: >
  Spend a day in the German-settled town of Fredericksburg, the center of Texas
  Hill Country wine. Visit two or three wineries along Highway 290, and at
  each one pick a glass for the other person to try. Then walk Main Street's
  old limestone buildings, grab a peach treat in summer, and finish with
  dinner at a German beer garden. Get a photo of the two of you in the
  vineyard rows. Book tastings ahead on weekends, and plan a driver or book a
  wine shuttle.
