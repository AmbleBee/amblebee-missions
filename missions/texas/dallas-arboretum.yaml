short: Wander the Dallas Arboretum on White Rock Lake. Find the giant pumpkin village in fall.
description: >
  Spend a day in 66 acres of gardens on the shore of White Rock Lake, with
  fountains, terraces and seasonal displays. Spring brings huge fields of
  tulips, and fall brings Autumn at the Arboretum, with a village of
  pumpkin houses built from thousands of pumpkins and gourds. Each pick
  your favorite garden, find a bench overlooking the lake, and get a photo of you in the flowers. Buy tickets ahead on busy weekends.
