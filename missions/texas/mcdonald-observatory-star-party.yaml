short: Look through big telescopes under some of the darkest skies in America at a McDonald star party.
description: >
  Drive up into the Davis Mountains for a star party at McDonald Observatory,
  under some of the darkest skies in the country. Sit in the outdoor amphitheater
  while a guide points out constellations with a laser, then line up at the
  big telescopes to see planets, star clusters and galaxies. Each pick the most
  amazing thing you saw. It gets cold up here at night, even in summer, so
  bring warm layers. Star parties run on set nights; buy tickets ahead, since
  they sell out.
