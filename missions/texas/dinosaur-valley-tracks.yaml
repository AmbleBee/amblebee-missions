name: Dinosaur Tracks at Dinosaur Valley
mode: both
who: [solo, friends, family, kids]
place:
  name: Dinosaur Valley State Park
  area: Glen Rose
  coords: [32.24700, -97.81300]  # APPROX: set at the main track site before publishing
