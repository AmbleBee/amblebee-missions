short: Ride the Ferris wheel over Galveston Bay at Kemah Boardwalk, then eat seafood by the water.
description: >
  Spend an evening on the Kemah Boardwalk, a waterfront strip of rides,
  games and seafood restaurants on Galveston Bay. Ride the Ferris wheel at
  sunset for the view over the bay and the boats coming in, try a ride or two,
  and win each other a prize. Have seafood for dinner looking out at the
  water, and get a photo of you with the boardwalk lit up behind
  you. Walking the boardwalk is free; rides and games cost extra.
about: >
  The Kemah Boardwalk grew up in the late 1990s and early 2000s on the old
  fishing village waterfront, where the Clear Lake channel meets Galveston
  Bay. Hurricane Ike damaged it badly in 2008, and it was rebuilt.

  Its wooden roller coaster, the Boardwalk Bullet, opened in 2007. From the
  waterfront you can watch sailboats and shrimp boats heading out to the
  bay.
