short: Hike to the top of Guadalupe Peak, the highest point in Texas. Start at dawn.
description: >
  Start at dawn and hike about 8.5 miles round trip, climbing 3,000 feet up
  switchbacks to the summit of Guadalupe Peak, the highest point in Texas at
  8,751 feet. Near the top, cross a little bridge and climb the last rocky
  stretch to the shiny steel pyramid marking the summit. Sign the summit
  register together, and get a photo of you next to the pyramid
  with the desert far below. It's strenuous: bring plenty of water, start
  early, and turn back if strong winds or storms roll in.
about: >
  The Guadalupe Mountains are an ancient fossil reef, built by sea life
  about 260 million years ago and later pushed up out of the desert. El
  Capitan, the sheer cliff next to the peak, is the reef's front wall.

  The steel pyramid was placed on the summit in 1958 by American Airlines,
  marking 100 years since the Butterfield Overland Mail stage route passed
  below. Winds up here can top 50 miles per hour.
