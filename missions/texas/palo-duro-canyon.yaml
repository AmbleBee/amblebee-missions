short: Hike to the Lighthouse rock in Palo Duro, the second-largest canyon in the country.
description: >
  Drive down into Palo Duro Canyon, a huge red-and-orange canyon cut into the
  flat Panhandle plains, the second largest in the country. Hike the
  Lighthouse Trail, about six miles round trip and mostly flat, to the
  Lighthouse, a giant tower of red rock. Climb up to its base and get a photo
  of you with the canyon walls behind you. Start early and carry
  plenty of water, since summer afternoons get dangerously hot. Watch for
  wild turkeys and mule deer.
about: >
  Palo Duro Canyon is about 120 miles long and up to 800 feet deep, the
  second largest canyon in the country. The Civilian Conservation Corps
  built the park's road, cabins and visitor center in the 1930s.

  Georgia O'Keeffe painted the canyon while she taught in the nearby town of
  Canyon in the 1910s. The Lighthouse rock is a hoodoo, a tall column left
  standing as the softer rock around it wore away.
