short: Pana'ewa Rainforest Zoo in Hilo. Meet tigers and tortoises at a small zoo in a real rainforest.
description: >
  Hilo's small county zoo sits right in a rainforest, with paved paths under
  giant trees, palms and orchids and around 80 kinds of animals, from Bengal
  tigers and giant tortoises to native Hawaiian birds. Take it slow, let the
  kids pick which path to try next, and finish with a break at the playground
  and picnic pavilions. Come on a Saturday afternoon to catch the petting zoo.
  Get a photo of the whole family under the biggest tree you can find. Bring
  a rain jacket: it's a rainforest for a reason.
about: >
  Pana'ewa is the only zoo in the United States set in a natural tropical
  rainforest. Hawai'i County has run it since 1978 on 12 acres just south of
  Hilo, and the grounds are planted with orchids, bamboo and more than a
  hundred kinds of palms, so it feels like a botanical garden as much as a zoo.

  The stars are two Bengal tigers, Tzatziki and Sriracha, but look for native
  Hawaiian birds too, like the nēnē, the state bird, a goose that nearly went
  extinct. Hawai'i County residents get in for a few dollars, with kids and
  seniors free, while visitors pay a modest admission. The small petting zoo
  opens on Saturday afternoons.
