short: Pana'ewa Rainforest Zoo in Hilo. Wander a small, free zoo in a real rainforest.
description: >
  Hilo's small county zoo sits right in a rainforest, with paved paths under
  giant trees, palms and orchids and around 80 kinds of animals, from giant
  tortoises to native Hawaiian birds. Take it slow, let the kids
  pick which path to try next, and finish with a break at the playground and
  picnic pavilions. If you come on a Saturday afternoon, plan around the
  petting zoo hour. Get a photo of the whole family under the biggest tree
  you can find. Bring a rain jacket: it's a rainforest for a reason.
about: >
  Pana'ewa says it's the only zoo in the United States set inside a natural
  tropical rainforest. Hawai'i County runs it on 12 acres just south of Hilo,
  and admission is free.

  The paths wind under giant trees, palms and orchids, so it feels like a
  botanical garden as much as a zoo. Look for native Hawaiian birds like the
  nēnē, the state bird, a goose that nearly went extinct. Bring a rain jacket;
  it's a rainforest for a reason.
for_kids:
