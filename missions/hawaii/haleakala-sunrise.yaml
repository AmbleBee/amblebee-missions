short: Watch the sun come up over the clouds from the top of Haleakalā. Bring a blanket.
description: >
  Drive up the volcano in the dark and watch the sun rise over a sea of clouds from 10,000
  feet. It is freezing at the top, even in summer, so bring a blanket to share and
  something hot in a thermos. Sunrise needs a vehicle reservation booked ahead on
  Recreation.gov.
