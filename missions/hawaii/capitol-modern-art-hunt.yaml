short: Capitol Modern in Honolulu. A free art hunt through Hawaiʻi's state art collection.
description: >
  Climb to the second-floor galleries of the downtown building that houses
  Hawaiʻi's state art collection, mostly work by artists of the islands. Turn
  it into a hunt: everyone picks a favorite painting, a favorite sculpture,
  and the weirdest thing in the building. Finish outside in the sculpture
  garden, where the kids can walk among the big pieces. Get a family photo in
  front of the piece the kids voted best. Admission is free.
about: >
  In 1967, Hawaiʻi became the first state to set aside one percent of the
  cost of new state buildings to buy art, and that's how this collection was
  built. Thousands of the works hang in schools, libraries and offices around
  the islands, and Capitol Modern, once called the Hawaiʻi State Art Museum,
  is where the public can see the best of it.

  The museum is in a 1928 Spanish Mission-style building that stands where
  the first Royal Hawaiian Hotel opened in 1872 and that later housed a
  YMCA for servicemen. Admission is always free, but it's only open a few
  days a week and the main galleries sometimes close between exhibits, so
  check the schedule. Look on the events calendar for Super Saturday, a free
  family art-making day, and First Friday, an evening of live music in the
  sculpture garden.
for_kids:
  short: Find art made in Hawaiʻi!
  steps:
    - Art with the ocean in it
    - A sculpture taller than you
    - Your favorite color in a painting
    - The silliest art you can find
    - A selfie with your grown-up in the garden!
