short: Hike 10 miles up to McAfee Knob's famous rock ledge. Strike your best pose out on the edge.
description: >
  Start at the Catawba Sustainability Center and climb the Catawba Greenway to meet
  the McAfee Knob Trail, then follow it and the white-blazed Appalachian Trail to
  McAfee Knob, the rock ledge with near 270-degree views over the Catawba and
  Roanoke valleys. Starting here instead of the main Route 311 lot makes it about a
  10-mile round trip with more than 1,600 feet of climbing, past AT shelters and up
  lots of rock and wooden steps. Pack lunch and plenty of water, and eat it on the
  outcrops near the top. Get a photo of yourself standing out on the knob with the
  valley behind you, keeping well back from the edge.
about: >
  McAfee Knob sits at 3,197 feet on Catawba Mountain, a flat ledge of rock
  that juts out over the Catawba Valley about 1,600 feet below. It's often
  called the most photographed spot on the whole Appalachian Trail, and it's
  named for James McAfee, a Scots-Irish settler who came to the valley in
  the late 1730s. Along with Dragon's Tooth and Tinker Cliffs, which you can
  see to the north from the ledge, it makes up Virginia's "Triple Crown" of
  hikes.

  The long way starts on the Catawba Greenway, which volunteers built by
  hand and opened in 2021. It crosses the Catawba Sustainability Center, a
  377-acre farm that supplied the old Catawba Sanatorium in the early 1900s
  and has belonged to Virginia Tech since 1988, then follows the old Route
  311 roadbed up to the Appalachian Trail. You skip the crowded main lot and
  never cross the busy highway.

  The center's lot has about 25 spaces and is day-use only. Camping and
  fires aren't allowed on the knob itself, and dogs need a leash. On busy
  weekends from spring through fall, a shuttle also runs from the I-81 exit
  140 park-and-ride to the main trailhead.
