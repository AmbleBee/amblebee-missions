short: Share one canoe for 12 miles down the Shenandoah. Lunch on a gravel bar, photo mid-river.
description: >
  Book a canoe for the longer day trips on the South Fork of the Shenandoah
  with Downriver Canoe Company in Bentonville. They shuttle you upriver with
  a map, and you paddle your way back to your car through quiet riffles
  between the Massanutten ridge and the Blue Ridge, with no guide and no
  schedule but your own. Pack a cooler lunch and pull out on a gravel bar
  halfway. Get a photo of the two of you from the canoe with the mountains
  behind you. It's a long day of steady paddling, so bring sunscreen, water
  and a dry bag, and reserve ahead on summer weekends.
steps:
