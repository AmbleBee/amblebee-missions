short: Art Institute of Chicago. Say hi to the lions, then each find a painting the other must see.
description: >
  Say hi to the two bronze lions on Michigan Avenue, then head inside to
  find Seurat's dotted Sunday afternoon, Hopper's Nighthawks and American
  Gothic. Split up for twenty minutes, each find one piece the other has to
  see, then trade tours. The photo to get: you between the lions out front.
about: >
  The museum was founded in 1879, and its lions have guarded the entrance
  since 1894. They wear wreaths at Christmas and sometimes giant helmets when
  a Chicago team makes the playoffs.

  Don't miss the Thorne Miniature Rooms, tiny, detailed model rooms from
  different eras, and A Sunday on La Grande Jatte, famous from Ferris
  Bueller's Day Off. Illinois residents get free days, so check the
  museum's site.
