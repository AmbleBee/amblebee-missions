short: Say hi to the lions out front, then each find a painting the other has to see.
description: >
  One of the great art museums of the world, guarded by two bronze lions on
  Michigan Avenue. Inside are Seurat's dotted Sunday afternoon, Hopper's
  Nighthawks, American Gothic and the tiny Thorne Miniature Rooms. Split up for
  twenty minutes, each find one piece the other has to see, then trade tours.
  Illinois residents get free days; check the museum's site.
