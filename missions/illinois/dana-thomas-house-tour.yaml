short: Tour Frank Lloyd Wright's prairie house and count the art-glass windows. Find your favorite.
description: >
  Book a guided tour of the Dana-Thomas House, a prairie-style home Frank Lloyd
  Wright designed for a Springfield socialite, still holding more than 100 pieces
  of his custom furniture and over 250 works of original art glass. The guide walks you
  through the hidden entry, the two-story dining room and the old party gallery
  in about an hour. Pick one window you'd steal if you could and take a photo of
  it from the sidewalk afterward, since photos are allowed only outside the
  house. The tour is free with donations welcome; reserve a spot ahead, and
  expect lots of stairs and narrow halls.
steps:
