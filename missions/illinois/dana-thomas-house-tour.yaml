short: Dana-Thomas House in Springfield. Tour Frank Lloyd Wright's prairie house and its art glass.
description: >
  Book a guided tour of the Dana-Thomas House, a prairie-style home Frank Lloyd
  Wright designed for a Springfield socialite, still holding more than 100 pieces
  of his custom furniture and over 250 works of original art glass. The guide
  walks you through the hidden entry, the two-story dining room and the old
  party gallery in about an hour. Pick one window you'd steal if you could and
  take a photo of it from the sidewalk afterward, since photos are allowed
  only outside the house.
about: >
  Frank Lloyd Wright finished the house in 1904 for Susan Lawrence Dana, a
  wealthy Springfield woman known for her parties. With 35 rooms, it was the
  biggest and most lavish home he'd designed up to then, and today it holds
  the largest collection of his original furniture and art glass still in the
  house it was made for. After Dana moved out, a publishing company bought it
  in 1944 and changed almost nothing, which is why so much survived.

  The State of Illinois bought it in 1981 and restored it. Tours are free,
  with donations welcome. Reserve ahead when you can, though walk-ups may get
  a spot, and expect lots of stairs and narrow halls. Wright fans should ask
  about the longer in-depth tour, which visits rooms the regular tour skips.
steps:
  - The front of the house from across the street
  - Your favorite art-glass window, from outside
  - A Wright detail on the outside you'd put on your own home
