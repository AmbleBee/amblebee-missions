short: Step out into a glass box 103 floors up. Look straight down if you dare.
description: >
  Ride to the 103rd floor of Willis Tower and step into The Ledge, glass boxes
  that stick out from the side of the building with nothing under your feet but
  air. On a clear day you can see across the lake to other states. Go near
  sunset to watch the city lights come on. Buy timed tickets ahead.
