short: Skydeck Chicago at Willis Tower. Step out into a glass box 103 floors up.
description: >
  Ride to the 103rd floor of Willis Tower and step into The Ledge, glass
  boxes that stick out from the side of the building with nothing under your
  feet but air. Dare each other to lie down on the glass. On a clear day,
  each try to spot a different state across the lake. The photo to get: you
  standing on the glass with the city straight below.
about: >
  Willis Tower, first called the Sears Tower, opened in 1973 and was the
  tallest building in the world for about 25 years. The Ledge, added in
  2009, sits about 1,350 feet up, and its glass is thick enough to hold
  several tons.

  On a clear day you can see four states: Illinois, Indiana, Michigan and
  Wisconsin. Go near sunset to watch the city lights come on, and buy timed
  tickets ahead.
for_kids:
