short: Shedd Aquarium in Chicago. Meet the belugas, and each find the fish that looks most like the other.
description: >
  Circle the round coral reef tank full of sharks and sea turtles, walk
  through the Amazon rainforest, then sit in the Oceanarium with beluga
  whales and sea otters in front of a wall of windows over Lake Michigan.
  Each find the fish that looks most like the other one. The photo to get:
  you in front of the belugas with the lake behind.
about: >
  Shedd opened in 1930 as the largest indoor aquarium in the world. Before
  it opened, its seawater was brought in by railroad tank cars all the way
  from Key West. The Oceanarium, built in 1991, was designed so its pools seem
  to flow right into Lake Michigan behind them.

  Book ahead, since it's one of the busiest museums in Chicago. Illinois
  residents get free days.
