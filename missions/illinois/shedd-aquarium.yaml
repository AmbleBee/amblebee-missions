short: Shedd Aquarium in Chicago. Meet the belugas and find the fish that looks most like you.
description: >
  Start in the grand rotunda at Wonder of Water, two curving habitats with
  live coral on one side and freshwater fish on the other. Walk through the
  Amazon rainforest and past the sharks of Wild Reef, then sit in the
  Oceanarium with beluga whales and sea otters in front of a wall of windows
  over Lake Michigan. Find the fish that looks most like you (or like each
  other). Parts of Shedd are being renovated through 2027, so check what's
  open. The photo to get: you in front of the belugas with the lake behind.
about: >
  Shedd opened in 1930 as the largest indoor aquarium in the world. Before
  it opened, its seawater came by train: 20 railroad tank cars made eight
  round trips from Key West to bring a million gallons. The Oceanarium, added
  in 1991, is the largest indoor marine mammal home in the world, designed so
  its pools seem to flow right into Lake Michigan behind them.

  The aquarium is in the middle of a big renovation ahead of its 100th
  birthday: the old round Caribbean reef tank became Wonder of Water, and a
  walk-through Caribbean reef tunnel is coming for Nickel, the rescued green
  sea turtle named for the coin found in her throat. Book ahead, since it's one
  of the busiest museums in Chicago. Illinois residents get free days.
