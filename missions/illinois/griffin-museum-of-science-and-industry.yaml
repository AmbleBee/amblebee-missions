short: Griffin Museum of Science and Industry in Chicago. Walk through a real U-boat and a coal mine.
description: >
  Spend a day at Chicago's Griffin Museum of Science and Industry in Hyde
  Park, in one of the few big buildings left from the 1893 World's Fair. Climb
  into a captured World War II U-boat, ride down into a coal mine, step into a
  Boeing 727, and stand next to an indoor tornado. Each pick the one exhibit
  you'd take home if you could, and make your case over lunch. The photo to
  get: you beside the giant U-505 submarine.
about: >
  The museum is in the Palace of Fine Arts, one of the only big buildings
  left from Chicago's 1893 World's Fair. It opened as a museum in 1933, and
  the coal mine exhibit has been here since the start.

  The U-505 was captured at sea by the U.S. Navy in 1944. It's the only
  German submarine of its kind in the United States. Some exhibits need an
  extra timed ticket, and Illinois residents get free days.
