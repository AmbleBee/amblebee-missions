short: Walk through a real WWII submarine and a working coal mine under one roof.
description: >
  A giant museum full of things you can climb into: a captured World War II
  U-boat, a coal mine you ride down into, a Boeing 727, a model railroad that
  fills a room, and a tornado you can stand next to. Each pick the one exhibit
  you'd want to take home. Some exhibits need an extra timed ticket, and
  Illinois residents get free days.
