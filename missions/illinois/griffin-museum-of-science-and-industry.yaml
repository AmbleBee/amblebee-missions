short: Griffin Museum of Science and Industry in Chicago. Walk through a real U-boat and a coal mine.
description: >
  Spend a day at Chicago's Griffin Museum of Science and Industry in Hyde
  Park, in one of the few big buildings left from the 1893 World's Fair. Climb
  into a captured World War II U-boat, ride down into a coal mine, step into a
  Boeing 727, and stand next to an indoor tornado. Pick the one exhibit you'd
  take home if you could, and if you're not alone, make your case over lunch.
  The photo to get: you beside the giant U-505 submarine.
about: >
  The museum, called the Museum of Science and Industry until 2024, is in the
  Palace of Fine Arts, one of the only big buildings left from Chicago's 1893
  World's Fair. It opened as a museum in 1933, and the coal mine exhibit has
  been here since the start. You'll also find a giant model railroad and the
  Apollo 8 command module.

  The U-505 was captured off West Africa in 1944, the first enemy warship the
  U.S. Navy had boarded and captured at sea since the early 1800s. It reached
  Chicago in 1954 through the Great Lakes, and it's the only German submarine
  on display in the United States. Some exhibits need an extra timed ticket,
  and Illinois residents get free days.
