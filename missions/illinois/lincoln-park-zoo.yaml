short: Lincoln Park Zoo in Chicago. A free zoo in the city, open every day of the year.
description: >
  Wander a free zoo in the middle of the city, with the skyline peeking over
  the trees. Visit the gorillas, lions and penguins, then walk the boardwalk
  around the nature pond next door. Each pick your favorite animal and take
  a photo of the other next to it, copying its pose.
about: >
  The zoo opened in 1868, when Central Park in New York sent Chicago a pair
  of swans, and it's one of the oldest zoos in the country. It's also one of
  the few big zoos that has always been free.

  In winter it lights up for ZooLights, a holiday light show. Parking is
  paid, so take the bus or bike if you can.
