description: >
  Wander Chicago's free Lincoln Park Zoo, with the skyline peeking over the
  trees. Visit the gorillas, lions and penguins, then walk the Nature
  Boardwalk around the pond next door. Each pick a favorite animal and copy
  its pose while the other takes the shot. In winter, come back after dark for
  ZooLights. The photo to get: you next to your favorite animal, matching its
  pose.
about: >
  Lincoln Park Zoo began in 1868, when New York's Central Park sent Chicago
  two pairs of mute swans. Ten years later the city decided it should always
  be free, and it still is: one of the oldest zoos in the country and the
  longest-running free one, open 365 days a year.

  Today it covers 49 acres in Lincoln Park, a short walk from the lakefront,
  with nearly 200 species, including gorillas and chimpanzees at the
  Regenstein Center for African Apes. Next door, the Nature Boardwalk loops
  around a restored pond with skyline views.

  In winter, ZooLights fills the grounds with holiday lights. Parking is paid,
  so the bus or a bike is the easy way in.
