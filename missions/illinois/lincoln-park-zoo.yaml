short: Wander one of the oldest zoos in the country. It's free, every day of the year.
description: >
  A free zoo in the middle of the city, open every day since 1868, with the
  skyline peeking over the trees. Visit the gorillas, lions, polar bears and
  penguins, then walk the boardwalk around the nature pond next door. Each pick
  your favorite animal and get a photo of the other next to it. Parking is
  paid, so take the bus or bike if you can. In winter it lights up for ZooLights.
