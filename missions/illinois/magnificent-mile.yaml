short: Walk the Magnificent Mile in Chicago, from the river to Oak Street Beach.
description: >
  Start on the DuSable Bridge over the Chicago River and walk north along
  Michigan Avenue, past the Wrigley Building and Tribune Tower, the castle-like
  Water Tower, and window after window of shops. At Tribune Tower, see how
  many famous stones you can find set into the walls. Pick one stop along the
  way that's all yours, or each pick one for the other. Keep going to Oak
  Street Beach, where the city meets the lake. The photo to get: you in front
  of the old Water Tower.
about: >
  The Water Tower was built in 1869 and was one of the few buildings to
  survive the Great Chicago Fire of 1871. Tribune Tower has close to 150
  stones and bricks from famous places set into its walls, all labeled and
  low enough to touch, including pieces of the Great Wall of China, the
  Parthenon, the Taj Mahal and the World Trade Center.

  A real estate developer, Arthur Rubloff, gave the street its "Magnificent
  Mile" nickname in 1947. Each November the Lights Festival kicks off the
  holidays, and more than a million lights stay up in the trees through the
  new year.
steps:
  - The river from the bridge
  - The old Water Tower
  - Your stop
  - A famous stone at Tribune Tower
  - The lake at the end
