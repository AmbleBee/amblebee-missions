short: Walk the Magnificent Mile in Chicago, from the river to Oak Street Beach.
description: >
  Start on the DuSable Bridge over the Chicago River and walk north along
  Michigan Avenue, past the Wrigley Building and Tribune Tower, the castle-like
  Water Tower, and window after window of shops. At Tribune Tower, see how
  many famous stones you can find set into the walls. Keep going to Oak
  Street Beach, where the city meets the lake. The photo to get: you in front
  of the old Water Tower.
about: >
  The Water Tower was built in 1869 and was one of the few buildings to
  survive the Great Chicago Fire of 1871. Tribune Tower has more than a
  hundred stones and bricks from famous places set into its walls, including
  pieces of the Great Wall of China and the Parthenon.

  A real estate developer gave the street its "Magnificent Mile" nickname in
  the 1940s. Each holiday season it lights up with millions of lights.
