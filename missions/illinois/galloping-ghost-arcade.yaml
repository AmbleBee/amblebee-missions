short: Galloping Ghost Arcade near Chicago. Pay once and play hundreds of arcade games on free play.
description: >
  Out in suburban Brookfield, one door fee unlocks a huge, dim, packed arcade
  with more than a thousand cabinets all set to free play, from 80s classics
  to fighting games and rare Japanese machines you won't see anywhere else.
  Split up, each find the strangest game in the building, then bring the
  others back to play it. Finish with a head-to-head tournament on whatever
  game you argued about most. Get a photo of the group lit up by the screens.
about: >
  Galloping Ghost opened on Friday the 13th in August 2010 with 130 games
  rescued from the scrap heap. Today it has more than 1,000 arcade games,
  which makes it the largest video arcade in the United States, and a new
  "Monday Mystery Game" joins the floor every week.

  The owners even make their own arcade games, like Dark Presence, which you
  can play here. Look for the rare Japanese machines and the oddities, like a
  spinning Sega R360 cabinet, one of only about 100 ever made. The sister
  pinball hall, Galloping Ghost Pinball, is a short walk down Ogden Ave and
  has its own separate fee.
