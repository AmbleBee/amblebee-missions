short: Galloping Ghost Arcade near Chicago. Pay once and play hundreds of arcade games on free play.
description: >
  Out in suburban Brookfield, one door fee unlocks a huge, dim, packed arcade
  with hundreds and hundreds of cabinets all set to free play, from 80s classics to
  fighting games and rare Japanese machines you won't see anywhere else. Split
  up, each find the strangest game in the building, then bring the others
  back to play it. Finish with a head-to-head tournament on whatever game you
  argued about most. Get a photo of the group lit up by the screens. The
  sister pinball hall, Galloping Ghost Pinball, a short walk down Ogden Ave,
  has its own separate fee.
about: >
  Galloping Ghost opened in 2010 and has grown into one of the biggest
  arcades in the country, with hundreds of cabinets. The owners even make
  their own arcade games, which you can play here.

  Look for the rare Japanese machines and the games you've never heard of;
  that's where the weirdest finds are. The sister pinball hall down the
  street has its own separate fee.
