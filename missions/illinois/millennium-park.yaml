short: Millennium Park in Chicago. Find your reflection in the Bean and get splashed at Crown Fountain.
description: >
  Start at Cloud Gate, the giant mirrored "Bean," and take a photo of you
  warped in its reflection with the skyline behind. Then walk to Crown
  Fountain, where huge faces on glass towers spit water in summer, and dare
  yourself to stand under the spout. Finish with a slow wander through the
  Lurie Garden and pick out the wildest flower you can find.
about: >
  Millennium Park opened in 2004 on top of old rail yards and parking garages,
  which makes it what's considered the world's largest rooftop garden. Cloud
  Gate, by artist Anish Kapoor, is 168 stainless steel plates welded together
  and polished so smooth you can't see the seams. When the park opened, the
  seams still showed, so the Bean was covered back up until it was finished.

  The faces on Crown Fountain belong to about a thousand real Chicagoans. The
  curvy Pritzker Pavilion bandshell by architect Frank Gehry hosts free summer
  concerts on the lawn, and in winter the park has a free ice skating rink,
  though you'll need to reserve a time online. It's free to visit and open
  early until late, and the Bean is just as fun at night.
for_kids:
  short: Shiny park hunt! Can you find them all?
  steps:
    - Your face in the big silver Bean
    - A giant face on a tower
    - A flower
    - A selfie in the park!
