short: Millennium Park in Chicago. Find your reflection in the Bean and get splashed at Crown Fountain.
description: >
  Start at Cloud Gate, the giant mirrored "Bean," and take a photo of you
  warped in its reflection with the skyline behind. Then walk to Crown
  Fountain, where huge faces on glass towers spit water in summer, and see
  who can stand under the spout longest. Wander over to the Lurie Garden and
  the bandshell lawn.
about: >
  Millennium Park opened in 2004, built on top of an old rail yard and
  parking garages, which makes it one of the largest rooftop gardens in the
  world. Cloud Gate, by artist Anish Kapoor, is made of welded steel plates
  polished so smooth you can't see the seams.

  The faces on Crown Fountain belong to about a thousand real Chicagoans. The
  curvy bandshell by architect Frank Gehry hosts free summer concerts, and in
  winter there's ice skating.
