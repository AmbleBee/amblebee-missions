short: Find your reflection in the Bean, then get splashed by the giant faces at Crown Fountain.
description: >
  Start at Cloud Gate, the giant mirrored "Bean", and take a photo of you warped in its reflection with the skyline behind. Then walk to Crown
  Fountain, where huge faces on glass towers spit water in summer, and over to
  the Lurie Garden and the bandshell lawn. In winter there's ice skating. Free,
  and lovely at night.
for_kids:
