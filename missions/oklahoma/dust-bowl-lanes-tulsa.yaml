short: Rent a lane at a 70s-style bowling lounge in Tulsa. Worst score picks the next round's song.
description: >
  Grab your crew and book a lane at Dust Bowl, a retro bowling lounge in the Blue
  Dome District with eight lanes, 70s-style decor and a full bar. Lanes rent by
  the hour, so split one between the group, order some bar food and play a couple
  of games, with the lowest scorer on the hook for picking the next song or buying
  the fries. Get a group photo mid-celebration after somebody's strike. Book a lane
  ahead on weekend nights, and check the age policy if anyone in the group is under 21.
