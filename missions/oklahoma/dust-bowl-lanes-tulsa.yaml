short: Dust Bowl Lanes in Tulsa. Bowl at a 70s-style lounge; the worst score picks the next round's song.
description: >
  Grab your crew and book a lane at Dust Bowl, a retro bowling lounge in the Blue
  Dome District with eight lanes, green plaid carpet, orange booths and a full
  bar. Lanes rent by the hour, so split one between the group, order some bar
  food and play a couple of games, with the lowest scorer on the hook for picking
  the next song or buying the fries. Get a group photo mid-celebration after
  somebody's strike. Book a lane ahead on weekend nights, and check the age
  policy if anyone in the group is under 21.
about: >
  Dust Bowl sits in Tulsa's Blue Dome District, named for a 1925 Route 66 gas
  station at Second and Elgin. The White Star Service Station was built to look
  like the Hagia Sophia in Istanbul, and the attendant lived inside its bright
  blue dome. The area is now packed with bars, restaurants and music venues.

  The lanes are a tribute to 1970s bowling alleys, with a lounge, patio, a
  small arcade and a private two-lane VIP room. Weekend nights are busiest, and
  the neighborhood is easy to walk for food or drinks after.
