name: Amble Oklahoma
region: Oklahoma
description: Real places all over Oklahoma, starting on the canal in Oklahoma City's Bricktown.
icon: boot
# A longer description for this pack's own page on the website (not sent to the Hive).
about: >
  Oklahoma is red dirt, prairie, lakes and cowboy culture, with Oklahoma City, Tulsa and Norman that keep
  surprising people. For a date in Oklahoma City, ride a water taxi along the canal through the brick warehouses
  of Bricktown.
