short: Sam Noble Museum in Norman, OK. Wander at your own pace and find the world's biggest Apatosaurus.
description: >
  Take your time through the Sam Noble Museum on the OU campus, where the
  dinosaur hall towers over you with giant mounted skeletons, including the
  world's largest Apatosaurus locked in battle with a meat-eating
  Saurophaganax. Keep going through the galleries on Oklahoma's ancient seas,
  ice-age animals and the people who lived here first, and pick one thing
  you'd never heard of to read about later. Get a photo looking straight up
  at the tallest skeleton.
about: >
  The Sam Noble Museum is the University of Oklahoma's natural history
  museum, founded in 1899 before Oklahoma was even a state, with collections
  of more than 10 million objects, from fossils and minerals to Native
  American art and cultures. Its dinosaur hall holds the Guinness World
  Record for the largest skull of any land animal ever found, from a
  Pentaceratops, and Saurophaganax is Oklahoma's state fossil.

  Don't miss the Cooper Bison Skull, painted with a red zigzag about 12,000
  years ago and considered the oldest painted object in North America. The
  current building opened in 2000, parking is free right out front, and the
  campus is easy to walk after.
