short: Wander Norman's natural history museum at your own pace. Find the biggest skeleton.
description: >
  A good one to do alone: take your time through the Sam Noble Museum on the
  OU campus, where the dinosaur hall towers over you with giant mounted
  skeletons, including a huge Apatosaurus. Keep
  going through the galleries on Oklahoma's ancient seas, ice-age animals and
  the people who lived here first, and pick one thing you'd never heard of to
  read about later. Get a photo looking straight up at the tallest skeleton.
  Parking is free right out front.
