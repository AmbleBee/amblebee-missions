short: Roam a giant collection of hot rods, race cars and wild engines in Lincoln. Each pick a dream car.
description: >
  Wander a huge collection of American speed: hundreds of racing engines,
  hot rods, customs, Indy cars, dirt-track racers and land speed machines,
  plus walls of vintage parts, pedal cars and toys. Split up, then meet back
  and each show the crew the one car you'd drive home. Get a photo of the
  group lined up in front of the wildest engine you can find. Days are limited
  in the off-season, so check the schedule first, and ask whether a guided
  tour is running that day.
