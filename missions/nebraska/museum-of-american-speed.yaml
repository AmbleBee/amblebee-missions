short: Museum of American Speed in Lincoln, NE. Roam hot rods, race cars and wild engines.
description: >
  Wander a huge collection of American speed: hundreds of racing engines,
  hot rods, customs, Indy cars, dirt-track racers and land speed machines,
  plus walls of vintage parts, pedal cars and toys. Take your time on all
  three floors and pick the one car you'd drive home, and if you came with
  friends, make your case for it over lunch. Get a photo in front of the
  wildest engine you can find.
about: >
  The museum grew from the collection of "Speedy" Bill Smith and his wife
  Joyce, who started the hot rod parts company Speedway Motors in Lincoln in
  1952 with a $300 loan from Joyce. Today it fills more than 250,000 square
  feet over three floors, with more than 300 cars and about 800 historic
  engines, and Newsweek readers voted it the best motor racing museum in
  2025.

  Don't skip the top floor, home to what's called the largest collection of
  vintage pedal cars, plus toy cars and racing memorabilia. Plan on three
  hours or more. Days are limited in the off-season, so check the schedule,
  and ask whether a guided tour is running that day.
