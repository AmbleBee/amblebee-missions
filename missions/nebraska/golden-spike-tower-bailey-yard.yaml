short: Golden Spike Tower in North Platte. Look over the world's largest rail yard and count trains.
description: >
  Head up the Golden Spike Tower outside North Platte and look down on Union
  Pacific's Bailey Yard, the biggest train yard in the world, where cars get
  pushed over a hump and roll onto dozens of sorting tracks. The top floor is
  enclosed, with 360-degree views and retired railroaders often on hand to
  explain what you're seeing; step down to the open-air deck below to hear the engines
  rumble. Pick a train and follow it with your eyes as long as you can, and count
  how many come and go while you're there. Get a photo of the yard stretching to
  the horizon. Bring binoculars if you have them.
about: >
  Union Pacific's Bailey Yard is listed as the largest rail yard in the
  world, handling thousands of railcars a day. The tower opened in 2008 to
  give visitors a view from eight stories up.

  North Platte has more train history: during World War II, local volunteers
  ran the North Platte Canteen at the depot and met every troop train with
  food, serving millions of soldiers. Buffalo Bill Cody's ranch home is also
  in town.
steps:
