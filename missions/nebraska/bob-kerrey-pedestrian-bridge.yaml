  name: Bob Kerrey Pedestrian Bridge
  area: Riverfront, Omaha
  address: 705 Riverfront Dr, Omaha, NE 68102
  coords: [41.26605, -95.92433]
  website: https://www.nps.gov/places/bob-kerrey-pedestrian-bridge.htm
short: Bob Kerrey Pedestrian Bridge in Omaha. Kiss with one foot in Nebraska and one in Iowa.
description: >
  Walk out over the Missouri River from Omaha toward Council Bluffs, Iowa,
  until you reach the state line marked across the middle of the bridge.
  Stand with each of you in a different state and kiss across the line. The
  photo to get: your feet on either side of the marker, with "Nebraska" and
  "Iowa" showing.
about: >
  The bridge opened in 2008 and stretches about 3,000 feet across the river
  in a long S-shaped curve held up by cables. It's named for Bob Kerrey, a
  former Nebraska governor and U.S. senator.

  It's open around the clock and lit with colored lights at night, which
  makes it a pretty after-dinner walk. There are trails and parks on both
  ends.
