description: >
  The Bob Kerrey Pedestrian Bridge crosses the Missouri River from Omaha to Council
  Bluffs, and the state line runs across the middle. Walk out, find the line, and take a
  photo with each of you in a different state. It's open around the clock and pretty after
  dark.
