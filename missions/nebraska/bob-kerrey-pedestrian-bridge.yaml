short: Bob Kerrey Pedestrian Bridge in Omaha. Kiss with one foot in Nebraska and one in Iowa.
description: >
  Walk out over the Missouri River from Omaha toward Council Bluffs, Iowa,
  until you reach the state line marked across the middle of the bridge.
  Stand with each of you in a different state and kiss across the line. The
  photo to get: your feet on either side of the marker, with "Nebraska" and
  "Iowa" showing.
about: >
  The Bob Kerrey Pedestrian Bridge opened in September 2008 and runs 3,000
  feet across the Missouri River between Omaha and Council Bluffs, Iowa. It's
  billed as the longest pedestrian bridge connecting two states, and Omaha
  even gave it a nickname: Bob the Bridge.

  It's a cable-stayed bridge hung from two 200-foot towers, with the deck 52
  feet above the water. It's named for Bob Kerrey, a former Nebraska governor
  and U.S. senator who helped get it funded.

  It's open around the clock and lit with colored lights at night, and it
  links to about 150 miles of trails on both sides of the river. A smaller
  companion bridge, Baby Bob, opened in 2025.
